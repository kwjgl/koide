<style>
/* 시안(prototype/index.html)의 색과 글꼴을 그대로 쓴다. 실제 앱은 핵심 흐름만: 로그인 → 연결 → 이번 달 / 내 기도 / 더보기 */
:root {
  --page: #F3F5F2; --surface: #FFFFFF; --surface-2: #EEF2EF;
  --ink: #1B2523; --ink-2: #5B6965; --line: #DDE4E0; --line-strong: #B9C4BF;
  --accent: #2B6A62; --accent-mid: #8DBDB5; --accent-soft: #DCEBE7; --on-accent: #FFFFFF;
  --leader: #62519E; --leader-soft: #ECE7F7; --private: #E8ECEA;
  --warn: #9A5A14; --warn-soft: #F5E8D6; --shadow: rgba(20, 35, 32, .14);
  --base: 16px;
  --f-display: 'Gowun Batang', 'AppleMyungjo', 'Batang', serif;
  --f-body: 'IBM Plex Sans KR', 'Apple SD Gothic Neo', 'Malgun Gothic', sans-serif;
}
@media (prefers-color-scheme: dark) { :root {
  --page: #141B19; --surface: #1C2522; --surface-2: #232D2A;
  --ink: #E5ECE9; --ink-2: #9CAAA5; --line: #2D3935; --line-strong: #4A5853;
  --accent: #7CC2B7; --accent-mid: #3F7C73; --accent-soft: #1E3934; --on-accent: #0F1A18;
  --leader: #B6A8EA; --leader-soft: #2A2442; --private: #252E2B;
  --warn: #E2A563; --warn-soft: #3A2C1B; --shadow: rgba(0, 0, 0, .5); color-scheme: dark; } }
/* 글씨: 휴대폰·태블릿 16px, PC 15px */
@media (min-width: 1000px) { :root { --base: 15px; } }
* { box-sizing: border-box; }
html, body { margin: 0; }
body { background: var(--page); color: var(--ink); font-family: var(--f-body); font-size: var(--base); line-height: 1.55; -webkit-tap-highlight-color: transparent; }
button, input, textarea, select { font: inherit; color: inherit; }
/* 틀(시안과 같게): 휴대폰·태블릿은 상단 바(배지·설정) + 하단 바(아이콘만), PC(1000px 이상)는 메뉴가 상단 바로 올라가고 2단 */
.ic { width: 1em; height: 1em; fill: none; stroke: currentColor; stroke-width: 1.5; stroke-linecap: round; stroke-linejoin: round; flex: none; }
.wrap { width: 100%; max-width: 1160px; margin: 0 auto; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
.topbar { position: sticky; top: 0; z-index: 20; background: var(--surface); border-bottom: 1px solid var(--line); padding-top: env(safe-area-inset-top, 0px); transition: transform .25s ease; }
.topbar .wrap { display: flex; align-items: center; gap: .6em; min-height: 3.4em; position: relative; }
.brand { display: inline-flex; align-items: center; gap: .45em; background: none; border: 0; padding: .3em 0; color: var(--ink); cursor: pointer; min-height: 44px; }
.brand-mark { width: 1.6em; height: 1.6em; border-radius: 50%; background: var(--accent); color: var(--on-accent); display: grid; place-items: center; }
.brand-mark .ic { width: .95em; height: .95em; }
.brand-name { font-family: var(--f-display); font-size: 1.05em; font-weight: 700; white-space: nowrap; }
.topnav { display: none; gap: .2em; margin-left: 1.2em; }
.topnav button { font-size: .92em; background: none; border: 0; color: var(--ink-2); padding: .5em .9em; border-radius: 10px; cursor: pointer; min-height: 40px; }
.topnav button.on { background: var(--accent-soft); color: var(--accent); font-weight: 600; }
.spacer { flex: 1; }
.badge-btn { display: inline-flex; align-items: center; gap: .4em; font-size: .8em; font-weight: 600; color: var(--ink); background: var(--surface-2); border: 1px solid var(--line); border-radius: 999px; padding: .35em .5em .35em .85em; min-height: 38px; cursor: pointer; white-space: nowrap; }
.role-tag { font-size: .86em; padding: .15em .6em; border-radius: 999px; background: var(--surface); color: var(--ink-2); border: 1px solid var(--line); }
.role-tag.leader { color: var(--leader); border-color: var(--leader); background: var(--leader-soft); }
.role-tag.admin { color: var(--on-accent); background: var(--accent); border-color: var(--accent); }
.icon-btn { width: 44px; height: 44px; display: grid; place-items: center; background: none; border: 0; border-radius: 12px; color: var(--ink); cursor: pointer; flex: none; }

.icon-btn[aria-expanded="true"] { background: var(--surface-2); }
.menu { position: absolute; top: calc(100% + 6px); right: max(16px, env(safe-area-inset-right, 0px)); width: min(300px, calc(100vw - 32px)); background: var(--surface); border: 1px solid var(--line); border-radius: 16px; box-shadow: 0 16px 40px -12px var(--shadow); padding: .5em; display: flex; flex-direction: column; gap: .1em; z-index: 25; }
.mlabel { font-size: .72em; font-weight: 600; color: var(--ink-2); margin: .6em .7em .3em; }
.mitem { display: flex; justify-content: space-between; align-items: center; gap: .6em; width: 100%; text-align: left; font-size: .9em; color: var(--ink); background: none; border: 0; border-radius: 10px; padding: .55em .7em; min-height: 44px; cursor: pointer; text-decoration: none; }
.mitem:hover { background: var(--surface-2); }
.mitem.static { cursor: default; flex-direction: column; align-items: flex-start; gap: .1em; }
.mitem.static:hover { background: none; }
.mitem small { font-size: .82em; color: var(--ink-2); }
.mdiv { height: 1px; background: var(--line); margin: .35em .3em; }
@media (max-width: 420px) { .brand-name { display: none; } }
/* 스크롤을 내리면 상단 바와 하단 바가 함께 숨고, 조금이라도 올리면 다시 보인다 */
body.hide-bars .topbar { transform: translateY(-100%); }
body.hide-bars .tabs { transform: translateY(100%); }
@media (prefers-reduced-motion: reduce) { .topbar, .tabs { transition: none; } }
main.wrap { padding-top: 14px; padding-bottom: calc(110px + env(safe-area-inset-bottom)); }
/* 화면 제목 줄: 왼쪽 사랑방·제목, 오른쪽 날짜와 버튼 */
.page-top { display: flex; justify-content: space-between; align-items: flex-end; gap: 12px; }
.who-sep { display: inline-block; width: 1px; height: .9em; background: currentColor; opacity: .45; margin: 0 .6em; vertical-align: -.1em; }
  .eyebrow { margin-top: 0; }
.page-top-r { display: flex; flex-direction: column; align-items: flex-end; gap: 6px; }
.date { font-size: .76em; color: var(--ink-2); margin: 0; white-space: nowrap; }
/* 기기별 배치: 휴대폰 한 줄, 태블릿 가정 카드 2열, PC 2단(본문 + 오른쪽 고정 칸) */
.home-grid, .two-col { display: grid; gap: 14px; align-items: start; margin-top: 12px; }
.col { display: flex; flex-direction: column; gap: 12px; min-width: 0; }
.col > .card, .fam-grid > .card { margin: 0; }
.fam-grid { display: grid; gap: 12px; align-items: start; grid-template-columns: minmax(0, 1fr); }
.section-title { font-size: .9em !important; font-weight: 600; color: var(--ink-2); margin: 8px 2px 0 !important; }
@media (max-width: 999px) {
  /* 이번 달: '지금 함께 기도할 가정'과 아래 기도 카드들 사이를 선으로 나눈다 */
  .home-grid { gap: 0; }
  .home-grid .side { padding-bottom: 22px; margin-bottom: 22px; border-bottom: 1px solid var(--line-strong); }
}
@media (min-width: 640px) {
  .fam-grid { grid-template-columns: repeat(2, minmax(0, 1fr)); }
}
@media (min-width: 1000px) {
  .topnav { display: flex; }
  .tabs { display: none !important; }
  main.wrap { padding-top: 28px; padding-bottom: 56px; }
  h1 { font-size: 2em; }
  .home-grid { grid-template-columns: minmax(0, 1fr) 340px; gap: 24px; }
  /* 오른쪽 고정 칸이 화면보다 길면 그 칸 안에서 따로 스크롤한다(끝까지 내려야만 아래가 보이지 않게) */
  .home-grid .side, .two-col .side { max-height: calc(100vh - 5.4em - env(safe-area-inset-top, 0px)); overflow-y: auto; overscroll-behavior: contain; scrollbar-width: thin; border-radius: 16px; }
  .home-grid .side { grid-column: 2; grid-row: 1; position: sticky; top: calc(4.4em + env(safe-area-inset-top, 0px)); }
  .home-grid .main { grid-column: 1; grid-row: 1; }
  .two-col { grid-template-columns: minmax(0, 1fr) 380px; gap: 24px; }
  .two-col .side { position: sticky; top: calc(4.4em + env(safe-area-inset-top, 0px)); }
  .fam-grid.wide { grid-template-columns: repeat(3, minmax(0, 1fr)); }
  .card { padding: 1.15em 1.25em; }
}
html { scroll-padding-bottom: calc(80px + env(safe-area-inset-bottom)); }
fieldset { border: 0; padding: 0; margin: 0; min-width: 0; }
h1 { font-family: var(--f-display); font-size: 1.65em; line-height: 1.3; margin: .3em 0 .2em; }

.eyebrow { font-size: .8em; color: var(--ink-2); margin: 1em 0 0; }
.hint { font-size: .82em; color: var(--ink-2); margin: .4em 0 0; }

.row { display: flex; justify-content: space-between; align-items: center; gap: .6em; }
.btn { display: inline-flex; align-items: center; justify-content: center; gap: .4em; min-height: 44px; padding: 0 1.1em; border-radius: 12px; border: 1px solid var(--accent); background: var(--accent); color: var(--on-accent); font-weight: 600; cursor: pointer; }

.link.danger { color: var(--warn); }
.kakao { display: flex; align-items: center; justify-content: center; gap: .5em; width: 100%; min-height: 52px; border: 0; border-radius: 12px; background: #FEE500; color: rgba(0,0,0,.85); font-weight: 600; cursor: pointer; }
.choices { display: flex; flex-direction: column; gap: 8px; margin: 12px 0; }

.consent b { color: var(--accent); font-size: .9em; }
label.f { display: block; font-size: .85em; font-weight: 600; margin: 12px 0 4px; }
.field { width: 100%; min-height: 44px; padding: .5em .75em; border-radius: 10px; border: 1px solid var(--line-strong); background: var(--surface); }
textarea.field { resize: vertical; line-height: 1.55; overflow-y: hidden; }
.check { display: flex; gap: .5em; align-items: center; margin: 12px 0; font-size: .92em; }
.items { list-style: none; padding: 0; margin: 8px 0 0; display: flex; flex-direction: column; gap: 8px; }
.items li { display: grid; grid-template-columns: auto 1fr; gap: .6em; align-items: start; }

.pray-btn { min-height: 36px; border-radius: 999px; border: 0; background: var(--accent-soft); color: var(--accent); font-weight: 600; padding: 0 .9em; cursor: pointer; font-size: .88em; }
.pray-btn.on { background: var(--accent); color: var(--on-accent); }

.scope.s-family { background: var(--private); }
.edit-foot { display: flex; justify-content: space-between; align-items: center; margin-top: .4em; font-size: .78em; color: var(--ink-2); }
.wait { display: flex; align-items: center; gap: .6em; background: var(--accent-soft); border-radius: 12px; padding: .9em 1em; font-weight: 600; margin: 12px 0; }
.tabs { position: fixed; left: 0; right: 0; bottom: 0; display: grid; grid-template-columns: repeat(5, 1fr); background: var(--surface); border-top: 1px solid var(--line); padding: 0 env(safe-area-inset-right, 0px) max(6px, env(safe-area-inset-bottom, 0px)) env(safe-area-inset-left, 0px); z-index: 10; transition: transform .25s ease; }
.tabs button { background: none; border: 0; color: var(--ink-2); display: grid; place-items: center; padding: .55em 0; min-height: 56px; cursor: pointer; position: relative; }
.tabs .ic { width: 28px; height: 28px; stroke-width: 1.4; }

.tabs button.pray-tab .ic { width: 44px; height: 44px; padding: 8px; border-radius: 50%; background: var(--accent-soft); color: var(--accent); }
.tabs button.pray-tab.on .ic { background: var(--accent); color: var(--on-accent); }
.tabs button.pray-tab.on::after { content: none; }
/* 기도하기 시작 화면 */
.seg { display: grid; grid-template-columns: repeat(var(--n, 3), 1fr); gap: 3px; padding: 3px; background: var(--surface-2); border-radius: 12px; margin-top: 6px; }

<script>
(function () {

  const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
  const TOKEN = DEMO_LINK ? 'koide-demo-token' : 'koide-token';
  const getToken = () => { try { return localStorage.getItem(TOKEN); } catch (e) { return null; } };
  // 로그인 표시가 바뀌면(로그인·로그아웃) 기억해 둔 화면도 지운다. 다른 사람의 기도제목이 남지 않게
  const setToken = t => { try { t ? localStorage.setItem(TOKEN, t) : localStorage.removeItem(TOKEN); localStorage.removeItem(CACHE); } catch (e) { /* 무시 */ } };
  // 지난번 이번 달 화면: 앱을 열 때 서버를 기다리지 않고 먼저 보여 준다
  const CACHE = DEMO_LINK ? 'koide-demo-cache' : 'koide-cache';
  const readCache = () => { try { return JSON.parse(localStorage.getItem(CACHE)); } catch (e) { return null; } };
  const writeCache = () => { try { localStorage.setItem(CACHE, JSON.stringify({ me: S.me, month: S.month })); } catch (e) { /* 무시 */ } };

  // 화면 상태
  const S = { openItems: new Set(), openFams: new Set(), view: 'loading', me: null, depts: null, rooms: null, pick: {}, month: null, tab: 'home', pending: null, busy: false };

  // ── 서버 부르기: 데모는 브라우저 안의 서버 코드, 실제는 Apps Script 웹 앱 ──
  async function api(action, data) {
    const body = Object.assign({ action, token: getToken() }, data || {});
    let res;
    if (DEMO) res = await window.koideDemo.call(body);
    else {
      // 본문을 글자로 보내면 브라우저가 미리 묻는 요청(CORS preflight) 없이 바로 보낸다. Apps Script는 그 요청을 받지 못한다
      // 한동안 안 쓰면 서버가 깨어나는 데 10~20초 걸린다. 4초가 넘으면 기다리는 이유를 알려 주고, 60초가 넘으면 그만 기다린다
      const slow = setTimeout(() => { const l = $('.loading'); if (l) l.textContent = '서버를 깨우는 중이에요. 처음에는 20초쯤 걸릴 수 있어요…'; }, 4000);
      const ctl = new AbortController(), stop = setTimeout(() => ctl.abort(), 60000);
      try {
        const r = await fetch(CFG.API_URL, { method: 'POST', body: JSON.stringify(body), signal: ctl.signal });
        res = await r.json();
      } catch (e) { throw { code: 'net', message: '서버가 답하지 않아요. 잠시 뒤 다시 해 주세요.' }; }
      finally { clearTimeout(slow); clearTimeout(stop); }
    }
    if (!res.ok) {
      if (res.code === 'login') { setToken(null); S.view = 'login'; render(); }
      throw res;
    }
    return res.data;
  }
  function toast(msg) { const t = $('#toast'); t.textContent = msg; t.hidden = false; clearTimeout(toast.t); toast.t = setTimeout(() => { t.hidden = true; }, 2600); }
  const oops = e => toast((e && e.message) || '잠시 문제가 생겼어요. 다시 해 주세요.');

  // ── 시작: 카카오에서 돌아왔으면(code) 로그인부터, 아니면 내 상태를 확인 ──
  async function boot() {
    if (DEMO) { await loadDemo(); $('#demo').hidden = false; $('#demo').innerHTML = '데모 모드 · 지어낸 예시 데이터예요 <button data-act="demoreset">데모 데이터 지우기</button>' + (DEMO_LINK ? ' · <a href="./">실제 앱으로</a>' : ''); }
    const q = new URLSearchParams(location.search);
    if (q.get('code')) {
      try { const r = await api('login', { code: q.get('code'), redirectUri: CFG.REDIRECT_URI || '' }); setToken(r.token); }
      catch (e) { oops(e); }
      history.replaceState(null, '', location.pathname);
    }
    if (q.get('error')) { toast('카카오 로그인을 취소했어요.'); history.replaceState(null, '', location.pathname); }
    if (!getToken()) { S.view = 'login'; return render(); }
    // 지난번 화면이 기억돼 있으면 먼저 보여 주고, 서버에서 새로 받아 조용히 바꾼다
    const c = readCache();
    if (c && c.me && c.month) { S.me = c.me; S.month = c.month; S.view = 'app'; render(); return refreshMe(true); }
    await refreshMe();
  }
  function loadDemo() {
    return new Promise((ok, bad) => {
      const a = document.createElement('script'); a.src = 'demo/gas-shim.js';
      a.onload = () => { const b = document.createElement('script'); b.src = CFG.DEMO_CODE || '../apps-script/Code.js'; b.onload = ok; b.onerror = bad; document.head.appendChild(b); };
      a.onerror = bad; document.head.appendChild(a);
    });
  }
  // quiet: 기억해 둔 화면을 보여 주는 중이라 "불러오는 중"이나 오류 화면으로 바꾸지 않는다
  async function refreshMe(quiet) {
    try {
      let r;
      // start가 없는 예전 서버 코드여도 열리게 예전 방식(me → month)으로 이어 간다
      try { r = await api('start'); } catch (e) { if (e.code !== 'bad') throw e; r = { me: await api('me') }; }
      S.me = r.me;
      if (!S.me.link) {
        // 부서를 모르는 예전 서버면 사랑방 목록을 부서 하나로 본다
        S.depts = r.depts || [Object.assign({ id: '', name: '' }, DEPT0, { rooms: r.rooms || await api('rooms') })];
        S.pick = {};
        if (S.depts.length === 1) pickDept(S.depts[0].id); else S.view = 'dept';
      }
      else if (S.me.link.status === '요청') S.view = 'wait';
      else { const m = r.month || await api('month'); if (!waiting) S.month = m; S.view = 'app'; }
    } catch (e) {
      if (e.code === 'login') return;
      if (quiet) return oops(e);
      S.view = 'error'; S.err = e;
    }
    quiet ? paint() : render();
  }
  async function loadMonth() { S.month = await api('month'); }

  async function kakaoLogin(who) {

    location.href = 'https://kauth.kakao.com/oauth/authorize?response_type=code&client_id=' + encodeURIComponent(CFG.KAKAO_REST_KEY) + '&redirect_uri=' + encodeURIComponent(CFG.REDIRECT_URI);

  // ── 부서마다 다른 말 ──
  // 부서 탭의 소그룹 이름(사랑방, 순)과 단위(가정, 개인)로 화면의 말을 바꾼다. 개인 단위는 청년부처럼 한 사람이 한 줄

    login: () => `<p class="eyebrow">코이데 · 함께 기도하는 공동체</p><h1>서로의 기도를 나누고<br>함께 기도해요</h1>

          <button class="choice" data-act="login" data-v="윤하람">데모: 윤하람으로 들어가기 (청년부 1순 리더)</button></div>
          <p class="hint">데모 모드에서는 카카오 대신 이 버튼으로 사람을 골라 들어가요.</p>`
        : `<button class="kakao" data-act="login">${ICON.bubble}카카오로 시작하기</button>`}`,
    dept: () => `${steps(1)}<p class="eyebrow">처음 한 번만 확인할게요</p><h1>어느 부서인가요?</h1>
      <div class="choices">${(S.depts || []).map(d => `<button class="choice" data-act="pickdept" data-v="${esc(d.id)}">${esc(d.name)}</button>`).join('')}</div>`,

        <button class="btn wide" type="submit" style="margin-top:12px">다음</button></form>
      <button class="link" data-act="back" data-v="family">뒤로</button>`,

      <p>${S.me.familyName && S.me.familyName !== S.me.link.person ? `${esc(S.me.link.person)} 님의 카카오 계정을 <b>${esc(S.me.familyName)}</b>에 연결해 달라고` : `${esc(S.me.link.person)} 님의 카카오 계정을 연결해 달라고`} 리더에게 보냈어요. 승인되면 바로 열려요.</p>
      <div class="wait">리더가 확인하고 있어요</div>
      <button class="btn wide" data-act="retry">승인됐는지 다시 확인</button>
      <p class="hint">${DEMO ? '데모: 로그아웃하고 그 부서의 리더(청장년부는 김도윤, 청년부는 윤하람)로 들어가 더보기에서 승인해 보세요.' : '보통 하루 안에 끝나요.'}</p>
      <button class="link" data-act="logout">로그아웃</button>`,
    app: () => ({ home: homeView, mine: mineView, pray: prayView, history: historyView, more: moreView, status: statusView, admin: adminView, import: importView })[S.tab]()
  };

    const top = `<div class="pss-top"><button class="pss-x" data-act="psend">끝내기</button><span class="pss-step">${ring}<span>${ps.i + 1} / ${ps.list.length}</span></span>${musicBtn()}</div>`;
    const li = (t, x) => `<li>${t ? `<span class="tgt">${esc(t)}</span>` : ''}<span>${esc(x)}</span></li>`;
    let body, pray;
    if (id.startsWith('f:')) {
      const f = famById(id.slice(2)) || { name: '', items: [], today: 0 }, capped = (f.today || 0) >= 3;
      body = `<h2>${esc(f.name)}</h2>${f.items.length ? `<ul>${f.items.map(i => li(i.target, i.text)).join('')}</ul>` : `<p class="hint">이번 달 기도제목이 아직 없어요. 이 ${words().one}을 떠올리며 기도해요.</p>`}`;
      pray = `<button class="pss-pray${ready ? ' ready' : ''}" data-act="pspray" ${capped ? 'disabled' : ''}>${capped ? ICON.check + ' 오늘은 여기까지' : ICON.hands.replace('<svg', '<svg width="20" height="20"') + ' 기도했어요'}</button>`;
    } else {
      if (id === 'me') { const m = S.month.families.find(f => f.own);
        body = `<p class="eyebrow">${words().mine}</p><h2>${esc(m.name)}</h2>${m.items.length ? `<ul>${m.items.map(i => li(i.target, i.text)).join('')}</ul>` : '<p class="hint">이번 달 기도제목이 아직 없어요.</p>'}`; }
      else { const t = topicOf(id);
        body = `<p class="pss-lp">${t.lines.map(n => LORDS_PRAYER[n]).join(' ')}</p><p class="eyebrow">하나님의 나라</p><h2>${t.name}</h2><ul>${t.items.map(x => li('', x)).join('')}</ul>`; }
      pray = `<button class="pss-pray${ready ? ' ready' : ''}" data-act="psextra">${ICON.hands.replace('<svg', '<svg width="20" height="20"')} 기도했어요</button>`;
    }
    return `${top}<div class="pss-body">${body}</div><div class="pss-nav"><button data-act="psnext">${last ? '마치기' : '다음'}</button>${pray}</div>`;
  }
  // 한 장에 머무는 시간: 줄어드는 고리와 숫자. 다 되면 '기도했어요'가 부드럽게 반짝이고, 저절로 넘어가지는 않는다
  let psTimer = null;
  function psTick() {
    clearInterval(psTimer);
    const ps = S.ps; if (!ps || ps.done || !ps.dur) return;
    psTimer = setInterval(() => {
      if (S.ps !== ps || ps.done) return clearInterval(psTimer);
      ps.left = Math.max(0, ps.left - 1);
      const t = document.getElementById('pss-time'), bar = document.querySelector('.pss-ring .bar');
      if (t) t.textContent = fmtTime(ps.left);
      if (bar) bar.setAttribute('stroke-dashoffset', (276.5 * (1 - ps.left / ps.dur)).toFixed(1));
      if (!ps.left) { clearInterval(psTimer); const b = document.querySelector('.pss-pray'); if (b) b.classList.add('ready'); }
    }, 1000);
  }
  function psGo(i) {
    const ps = S.ps;
    if (i >= ps.list.length) { ps.done = true; clearInterval(psTimer); }
    else { ps.i = i; ps.left = ps.dur; }
    render(); $('#pss').scrollTop = 0; psTick();
  }
  // 기도하는 동안 화면이 꺼지지 않게(되는 기기에서만)
  let wake = null;
  const wakeOn = () => { try { navigator.wakeLock.request('screen').then(w => { wake = w; }).catch(() => {}); } catch (e) { /* 안 되는 기기 */ } };
  const wakeOff = () => { try { if (wake) wake.release(); } catch (e) { /* 무시 */ } wake = null; };
  // '기도했어요': 화면은 먼저 늘리고 서버에는 뒤에서 적는다. 서버가 돌려준 이번 달·오늘 횟수로 맞춘다
  function prayFor(f) {
    f.today = (f.today || 0) + 1; f.prayed++; render();
    api('pray', { familyId: f.id }).then(r => {
      const g = famById(f.id) || f;
      if (r.today != null) { g.today = r.today; g.prayed = r.prayed; }
      if (r.capped && S.tab === 'home') toast('이 ' + words().one + '은 오늘 충분히 기도했어요. 내일 또 기도해 주세요.');
      paint();
    }).catch(err => { const g = famById(f.id) || f; g.today--; g.prayed--; paint(); oops(err); });
  }

  // 잔잔한 음악: 찬송가 1~8장(송영) 연주 파일. 운영자가 만든 파일을 app/music/hymn-01.mp3 ~ hymn-08.mp3에 둔다(config.js의 MUSIC으로 위치를 바꿀 수 있다)
  //  곡은 소리 장치(Web Audio)로 직접 이어서 튼다. "기도 시작"을 누를 때 한 번 열어 두면, 곡이 끝나 다음 곡으로 넘어갈 때 휴대폰이 막지 않는다
  //  아이폰 무음 스위치가 켜져 있어도 들리게 재생용 소리로 알리고, 받아 올 수 없으면 audio 요소로 튼다
  const HYMNS = Array.from({ length: 8 }, (_, i) => ({ label: (i + 1) + '장', file: (CFG.MUSIC || 'music/') + 'hymn-' + String(i + 1).padStart(2, '0') + '.mp3' }));
  const Music = (() => {
    let ctx = null, node = null, gain = null, token = 0;
    const cache = {}, player = new Audio(); player.preload = 'auto';
    function unlock() {
      try { if (navigator.audioSession) navigator.audioSession.type = 'playback'; } catch (e) { /* 무시 */ }
      try { if (!ctx) ctx = new (window.AudioContext || window.webkitAudioContext)(); if (ctx.state !== 'running') ctx.resume(); } catch (e) { ctx = null; }
    }
    const label = () => document.querySelectorAll('.pss-music .trk').forEach(e => { e.textContent = HYMNS[PSET.track].label; });
    const ended = () => { if (!PSET.music || !S.ps) return; play(PSET.auto ? (PSET.track + 1) % HYMNS.length : PSET.track); label(); };
    const load = i => cache[i] || (cache[i] = fetch(HYMNS[i].file).then(r => { if (!r.ok) throw new Error('no file'); return r.arrayBuffer(); })
      .then(buf => new Promise((ok, bad) => ctx.decodeAudioData(buf, ok, bad))).catch(e => { delete cache[i]; throw e; }));
    function stopNode() {
      if (!node || !ctx) return;
      const n = node, g = gain; node = null; gain = null; n.onended = null;
      g.gain.cancelScheduledValues(ctx.currentTime); g.gain.setValueAtTime(g.gain.value, ctx.currentTime); g.gain.linearRampToValueAtTime(0, ctx.currentTime + .6);
      try { n.stop(ctx.currentTime + .7); } catch (e) { /* 이미 멈춤 */ }
    }
    player.addEventListener('ended', () => { if (!node) ended(); });
    function play(i) {
      stopNode(); player.pause(); PSET.track = i; savePset();
      const my = ++token, file = () => { player.src = HYMNS[i].file; player.currentTime = 0; player.play().catch(() => {}); };
      if (!ctx) return file();
      load(i).then(buf => {
        if (my !== token) return;
        gain = ctx.createGain(); gain.gain.setValueAtTime(0, ctx.currentTime); gain.gain.linearRampToValueAtTime(.8, ctx.currentTime + 1);
        node = ctx.createBufferSource(); node.buffer = buf; node.connect(gain).connect(ctx.destination);
        node.onended = () => { if (my === token) { node = null; ended(); } };
        node.start();
        load((i + 1) % HYMNS.length).catch(() => {});
      }).catch(() => { if (my === token) file(); });
    }
    return { unlock, play, off() { token++; stopNode(); player.pause(); } };
  })();

  // ── 기존 시트 가져오기(관리자) ──────────────────────────
  // 구글 시트에서 복사한 글을 표로 바꾼다: 칸은 탭, 줄 바꿈이 든 칸은 "로 감싸고 안의 "는 ""로 쓴다
  function parseTSV(t) {
    const rows = [[]]; let cell = '', q = false;
    for (let i = 0; i < t.length; i++) {
      const ch = t[i];
      if (q) { if (ch === '"') { if (t[i + 1] === '"') { cell += '"'; i++; } else q = false; } else cell += ch; }
      else if (ch === '"' && cell === '') q = true;
      else if (ch === '\t') { rows[rows.length - 1].push(cell); cell = ''; }
      else if (ch === '\n' || ch === '\r') { if (ch === '\r' && t[i + 1] === '\n') i++; rows[rows.length - 1].push(cell); cell = ''; rows.push([]); }
      else cell += ch;
    }
    rows[rows.length - 1].push(cell);
    return rows;
  }
  // 사랑방 탭 하나 → { room, families: [{ a, b, kids, items: [{ target, text }] }] }
  //  맨 위 "○○ 사랑방" 칸이 사랑방 이름이고, [이름 칸][기도제목 칸]이 한 줄에 여러 쌍 있다. 이름은 "남편/아내"
  function readSheet(t) {
    const rows = parseTSV(t), cells = rows.flat().map(x => x.trim());
    const room = cells.find(x => /사랑방/.test(x) && x.length <= 20 && !/\n/.test(x)) || '';
    const families = [];
    rows.forEach(r => r.forEach((c, i) => {
      const name = c.trim(), text = (r[i + 1] || '').trim();
      if (!name || !text || /\n/.test(name) || name.length > 25 || /사랑방|기도제목/.test(name)) return;
      if (name.indexOf('/') < 0 && text.length < 10) return;
      const [a, b = ''] = name.split('/').map(x => x.trim());
      const fam = { a, b, kids: [] };
      fam.items = splitItems(text, fam);
      families.push(fam);
    }));
    return { room, families };
  }
  // 성을 뺀 이름(김도윤 → 도윤). 기도제목 안에서는 이름만 쓰는 분이 많다
  const given = n => /^[가-힣]{3,4}$/.test(n) ? n.slice(1) : n;
  const RELATION = /부모|어머|아버|시댁|친정|가족|동생|형님|누나|언니|오빠|할머|할아|조부|장인|장모|시아|사위|며느리/;
  // 이름표 → 대상. 형제·남편 이름은 남편, 자매·아내 이름은 아내, 가정·함께는 우리 가정, 그 밖의 이름은 그대로(자녀 등)
  function targetOf(label, fam) {
    const l = label.replace(/\s*\([^)]*\)\s*$/, '').trim();
    if (/^(형제|남편)$/.test(l)) return '남편';
    if (/^(자매|아내)$/.test(l)) return '아내';
    if (/^(가정|함께|우리\s*가정|가족)$/.test(l)) return '우리 가정';
    if (/^(양가\s*)?부모님$/.test(l)) return '부모님';
    const is = n => n && (l === n || l === given(n) || l.indexOf(n) === 0);
    if (is(fam.a)) return '남편';
    if (is(fam.b)) return '아내';
    return l;
  }
  const KNOWN = /^(형제|자매|남편|아내|가정|함께|우리\s*가정|가족|양가\s*부모님|부모님)$/;
  const LABEL = '([^\\s\\d:：ㅡ\\-–—.]{1,8}(?:\\s[^\\s\\d:：ㅡ\\-–—.]{1,4})?(?:\\s*\\([^)]{1,8}\\))?)';
  const INLINE = new RegExp('^' + LABEL + '\\s*(?:ㅡ|:|：|-|–|—)\\s*(.+)$'), HEAD = new RegExp('^' + LABEL + '\\s*(?:ㅡ|:|：|-|–|—)?$');
  // 이 줄이 이름표로 시작하는지: 아는 호칭·가정 사람 이름은 언제나, 모르는 이름은 "다엘(8세)"처럼 나이가 붙었거나
  //  "요엘- …"처럼 4자 이하 + 구분 기호가 있을 때만(문장 첫 낱말을 이름으로 잘못 보지 않게)
  function labelOf(s, fam) {
    const m = s.match(INLINE) || s.match(HEAD), head = !s.match(INLINE);
    if (!m) return null;
    const raw = m[1].trim(), age = /\(/.test(raw), bare = raw.replace(/\s*\([^)]*\)$/, '');
    const target = targetOf(raw, fam), known = KNOWN.test(bare) || target === '남편' || target === '아내';
    if (!known && !age && (head || /\s/.test(bare) || bare.length > 4)) return null;
    if (!known && !RELATION.test(bare) && fam.kids.indexOf(target) < 0) fam.kids.push(target);
    return { target, rest: head ? '' : m[2].trim(), head };
  }
  // 기도제목 칸 → 항목들. 번호(1.)·글머리(-)는 떼고, 이름표가 있으면 대상을 바꾼다.
  //  "형제ㅡ…" 바로 다음 줄이 이름표 없이 이어지면 앞 항목에 붙이고, 이름표만 있는 줄 아래 줄들은 하나씩 그 대상의 항목이 된다
  function splitItems(text, fam, guess) {
    const out = []; let cur = null, open = false;
    text.split('\n').forEach(line => {
      let s = line.trim();
      if (!s) { open = false; return; }
      const numbered = /^\d+\s*[.)]/.test(s); s = s.replace(/^\d+\s*[.)]\s*/, '');
      const bullet = /^[-•·*]\s*/.test(s); s = s.replace(/^[-•·*]\s*/, '');
      if (!s) return;
      const lab = labelOf(s, fam);
      if (lab && lab.head) { cur = lab.target; open = false; }
      else if (lab) { cur = lab.target; out.push({ target: cur, text: lab.rest }); open = true; }
      else if (open && !numbered && !bullet) out[out.length - 1].text += ' ' + s;
      else { out.push({ target: cur || (guess ? guess(s) : '우리 가정'), text: s }); open = false; }
    });
    return out.filter(i => i.text);
  }
  const famName = f => f.b ? f.a + ' · ' + f.b : f.a;
  function importView() {
    const I = S.imp;
    const head = `<button class="link back" data-act="tab" data-v="admin">${ICON.chevL}관리</button><p class="eyebrow">관리자</p><h1>기존 기도제목 가져오기</h1>`;
    if (I && I.done) return `${head}<section class="card"><h2>${esc(I.done.room)}을 가져왔어요</h2>
      <p>${I.done.families}가정 · 기도제목 ${I.done.items}개${I.done.made ? ` · 새로 만든 가정 ${I.done.made}` : ''}${I.done.replaced ? ` · 바꾼 가정 ${I.done.replaced}` : ''}</p>
      <p class="hint">모두 "사랑방 공개"로 들어갔어요. 가정마다 내 기도에서 공개 범위를 바꿀 수 있어요.</p>
      <button class="btn wide" data-act="impreset" style="margin-top:12px">다음 사랑방 붙여 넣기</button></section>`;
    if (!I) return `${head}<p class="hint">구글 시트에서 사랑방 탭 하나를 통째로 복사해(Ctrl+A → Ctrl+C) 아래에 붙여 넣어요. 한 번에 사랑방 하나씩 가져와요.</p>
      <textarea id="imp-t" class="field" rows="8" placeholder="여기에 붙여 넣기"></textarea>
      <button class="btn wide" data-act="impparse" style="margin-top:8px">나눠 보기</button>
      <p class="hint">붙여 넣은 내용은 이 화면과 교회 구글 시트에만 들어가요.</p>`;
    const n = I.families.reduce((a, f) => a + f.items.length, 0);
    return `${head}<label class="f" for="imp-room">사랑방 이름</label><input id="imp-room" class="field" value="${esc(I.room)}">
      <p class="hint">${I.families.length}가정 · 기도제목 ${n}개로 나눴어요. 대상이 틀리면 고르고, 빼야 할 줄은 빼기를 눌러요.</p>
      ${I.families.map((f, fi) => `<section class="card"><h2>${esc(famName(f))}</h2>${f.kids.length ? `<p class="hint">자녀: ${f.kids.map(esc).join(', ')}</p>` : ''}
        ${f.items.map((it, ii) => `<div class="edit"><div class="edit-top"><select data-imp="${fi}.${ii}" aria-label="대상">${[...new Set([it.target, '우리 가정', '남편', '아내', ...f.kids, '부모님', '기타'])].map(t => `<option${t === it.target ? ' selected' : ''}>${esc(t)}</option>`).join('')}</select>
          <button class="link danger" data-act="impdrop" data-v="${fi}.${ii}" style="margin-left:auto">빼기</button></div><p style="margin:0;font-size:.92em">${esc(it.text)}</p></div>`).join('')}</section>`).join('')}
      <button class="btn wide" data-act="impgo" ${S.busy ? 'disabled' : ''}>${S.busy ? '가져오는 중…' : '이번 달 기도제목으로 가져오기'}</button>
      <button class="link" data-act="impreset" style="margin-top:8px">다시 붙여 넣기</button>
      <p class="hint">코이데에 이미 있는 가정은 이번 달 기도제목이 가져온 것으로 바뀌어요. 공개 범위는 모두 "사랑방 공개"로 들어가요.</p>`;
  }

  // 더보기: (리더) 이번 달 현황·카톡방에 올릴 가정·연결 승인·해제, 로그아웃
  const isLeaderRole = () => S.month.me.role === '리더' || S.month.me.role === '코리더';
  // 가정 관리(연결 승인·해제): 리더는 우리 사랑방, 관리자는 우리 부서의 모든 사랑방
  function manageCard() {
    const P = S.pending, me = S.month.me;
    return `<section class="card"><h2>${esc(grp())} ${words().members} 관리</h2>
        ${!P ? '<p class="hint">불러오는 중…</p>' : `
        ${P.requests.length ? P.requests.map(q => `<div class="req"><b>${q.newFamily ? '새로 온 ' + words().one + ' · ' : ''}${esc(q.person)} 님${q.familyName !== q.person ? ' → ' + esc(q.familyName) : ''}</b>
            <small>${q.kids ? '자녀 ' + esc(q.kids) + ' · ' : ''}카카오 "${esc(q.nick)}" · ${esc(q.requestedAt)} 요청</small>
            <div class="actions" style="margin-top:8px"><button class="btn small" data-act="approve" data-v="${esc(q.kakaoId)}">승인</button><button class="btn small ghost" data-act="reject" data-v="${esc(q.kakaoId)}">거절</button></div></div>`).join('')
          : '<p class="hint">확인할 신청이 없어요.</p>'}
        <ul class="items">${P.families.map(f => `<li style="grid-template-columns:1fr auto"><span>${esc(f.name)}</span><span>${f.linked.length ? f.linked.map(l => `${esc(l.person)}${l.kakaoId !== '' && l.person !== me.person ? ` <button class="link danger" data-act="unlink" data-v="${esc(l.kakaoId)}">해제</button>` : ''}`).join(', ') : '<span class="hint">아직 연결 없음</span>'}</span></li>`).join('')}</ul>`}
        <p class="hint">휴대폰을 잃어버렸거나 ${solo() ? '이름' : '가정'}을 잘못 고른 사람만 해제해요.</p></section>`;
  }
  // 우리 가정 정보: 이름과 자녀(태어난 순서). 자녀 이름을 넣어 두면 기도제목의 대상이 이름으로 붙는다
  function famInfoCard() {
    const mine = mineFam(), [a, b = ''] = solo() ? [mine.name, ''] : mine.name.split(' · '), E = S.famEdit;
    if (!E) return `<section class="card"><div class="row"><p class="label">${solo() ? '내 정보' : '우리 가정 정보'}</p><button class="btn small ghost" data-act="famedit">고치기</button></div>
      <h3>${esc(mine.name)}</h3>

  function adminView() {

    const M = S.month, me = M.me, lead = me.role === '리더' || me.role === '코리더', on = tabOn();
    const role = lead ? me.role : me.admin ? '관리자' : '회원', rc = lead ? 'leader' : me.admin ? 'admin' : '';
    const menu = S.menu === 'badge' ? `<div class="menu" role="menu" aria-label="사랑방">
        <p class="mlabel">${esc(grp())}</p><div class="mitem static"><b>${esc(M.room.name)}</b><small>${M.dept && M.dept.name ? esc(M.dept.name) + ' · ' : ''}${M.month.slice(0, 4)}년 편성 · ${M.families.length}${words().count}</small></div>

    return `<div class="wrap">${brand}
      <nav class="topnav" aria-label="주 메뉴">${TABS.map(([k, l]) => `<button class="${on === k ? 'on' : ''}" data-act="tab" data-v="${k}" ${on === k ? 'aria-current="page"' : ''}>${l}</button>`).join('')}</nav>

  function render() {

    $('#tabs').hidden = !app;
    $('#topbar').innerHTML = topHtml();

    if (!document.activeElement || !document.activeElement.matches('textarea, input, select')) hideTypingSoon();

  const mineFam = () => S.month.families.find(f => f.own);
  const itemOf = id => mineFam().items.find(i => i.id === id);
  // 저장: 서버는 2~4초 걸리므로 화면은 먼저 바꿔 두고(부르는 쪽에서), 서버에는 하나씩 차례대로 보낸다.
  //  마지막 저장의 답이 오면 서버가 돌려준 이번 달로 맞추고, 실패하면 서버의 이번 달을 다시 받아 되돌린다
  let queue = Promise.resolve(), waiting = 0;

  // 글을 쓰는 중이면 다시 그리지 않는다(쓰던 칸이 사라지지 않게). 다음에 그릴 때 맞춰진다
  function paint() { const a = document.activeElement; if (a && $('#main').contains(a) && a.matches('textarea, input')) return; render(); }
  function save(call, done) {

        if (done) done(false); waiting--; setSaved(''); oops(e);

  document.addEventListener('click', async e => {

      case 'scope': {
        const i = itemOf(id); i.scope = NEXT_SCOPE[i.scope]; render();

      case 'tip': try { localStorage.setItem('koide-tip-' + b.dataset.v, '1'); } catch (err) { /* 무시 */ } return render();
      case 'sample': S.draft = solo() ? '나ㅡ졸업 논문 마감이 다가와요. 지치지 않고 끝까지 잘 마무리하도록\n\n가족ㅡ할머니가 다음 주에 수술을 받으세요. 수술이 잘 끝나고 회복이 빠르도록\n\n친구ㅡ교회에 처음 나온 친구가 공동체에 잘 적응하도록'
          : '형제ㅡ연말이라 회사 일이 몰려서 마음에 여유가 없어요. 지치지 않고 지혜롭게 마무리할 수 있도록 기도해 주세요.\n\n자매ㅡ다음 주에 복직 준비 교육을 마쳐요. 끝까지 건강하게 마치고, 복직 전까지 쉼이 있는 시간을 보낼 수 있도록\n\n' + (mineFam().kids[0] || '아이') + 'ㅡ감기가 2주째 이어지고 있어요. 빨리 낫고 다시 즐겁게 지내도록\n\n함께- 시댁 식구들이 하나님을 믿을 수 있도록';
        S.preview = null; { const at = $('#add-t'); if (at) at.value = S.draft; } return render();
      case 'split': { S.draft = $('#add-t').value; const parts = splitDraft(S.draft); if (!parts.length) return toast('내용을 적어 주세요.'); S.preview = parts; return render(); }
      case 'unsplit': S.preview = null; return render();
      case 'prevrm': S.preview.splice(Number(v), 1); if (!S.preview.length) S.preview = null; return render();
      case 'addparts': {
        // 목록에 바로 넣고(서버의 답이 오기 전까지는 잠가 둠), 서버에는 하나씩 차례대로 저장한다
        const parts = S.preview, f = mineFam(); S.preview = null; S.draft = ''; const at = $('#add-t'); if (at) at.value = '';
        parts.forEach((x, k) => { f.items.push({ id: 'new' + Date.now() + k, target: x.target, text: x.text, scope: 'room', isNew: true, editedBy: S.me.person, pending: true });
          save(() => api('saveItem', { target: x.target, text: x.text, scope: 'room' })); });
        render(); return toast(parts.length + '개를 더했어요.');
      }
      case 'homeview': S.homeView = v; if (v === 'table' && !S.hist) loadHist(); return render();
      case 'exopen': if (!S.ex) S.ex = {}; S.ex.open = !S.ex.open; return render();
      case 'experiod': S.ex.period = v; if (v !== 'this' && !S.hist) loadHist(); return render();
      case 'exmonth': S.ex.month = v; return render();
      case 'exlead': S.ex.lead = b.checked; return render();
      case 'exprint': return window.print();
      case 'exdo': S.busy = true; render(); try { await exportXlsx(); } catch (err) { oops(err); } S.busy = false; return render();
      case 'itemtoggle': S.openItems.has(id) ? S.openItems.delete(id) : S.openItems.add(id); return render();
      case 'famtoggle': S.openFams.has(id) ? S.openFams.delete(id) : S.openFams.add(id); return render();
      case 'histtab': S.histTab = v; return render();
      case 'histmonth': if (S.hist) S.hist.month = v; render(); return loadHist(v);
      case 'nexttoday': { const fams = roomFams(), i = fams.findIndex(f => f.id === S.todayId); pickToday(fams, i + 1, S.todayId); return render(); }
      case 'cordpick': S.todayId = v; render(); { const c = document.querySelector('.card.today'); if (c) c.scrollIntoView({ block: 'nearest', behavior: 'smooth' }); } return;
      case 'pskind': case 'pstopic': {
        const L = b.dataset.act === 'pskind' ? PSET.kinds : PSET.topics, i = L.indexOf(v);
        i >= 0 ? L.splice(i, 1) : L.push(v); savePset(); return render();
      }
      case 'psdur': PSET.dur = Number(v); savePset(); return render();
      case 'pstrack': PSET.track = Number(v); savePset(); if (S.ps && PSET.music) { Music.unlock(); Music.play(PSET.track); } return render();
      case 'psauto': PSET.auto = !PSET.auto; savePset(); return render();
      case 'psmusic': PSET.music = !PSET.music; savePset();
        if (PSET.music && S.ps) { Music.unlock(); Music.play(PSET.track); } else if (!PSET.music) Music.off();
        return render();
      case 'psnexttrack': Music.unlock(); Music.play((PSET.track + 1) % HYMNS.length); return render();
      case 'psstart': {
        const list = psList(); if (!list.length) return;
        S.ps = { list, i: 0, dur: PSET.dur, left: PSET.dur, prayed: [], extra: [], done: false };
        if (PSET.music) { Music.unlock(); Music.play(PSET.track); }
        wakeOn(); render(); return psTick();
      }
      case 'psnext': return psGo(S.ps.i + 1);
      case 'pspray': {
        const f = famById(S.ps.list[S.ps.i].slice(2)); if (!f || (f.today || 0) >= 3) return;
        if (S.ps.prayed.indexOf(f.id) < 0) S.ps.prayed.push(f.id);
        prayFor(f); return psGo(S.ps.i + 1);
      }
      case 'psextra': { const id = S.ps.list[S.ps.i]; if (S.ps.extra.indexOf(id) < 0) S.ps.extra.push(id); return psGo(S.ps.i + 1); }
      case 'psend': S.ps.done = true; clearInterval(psTimer); return render();
      case 'psclose': clearInterval(psTimer); S.ps = null; Music.off(); wakeOff(); return render();
      case 'impparse': {
        const r = readSheet($('#imp-t').value);
        if (!r.families.length) return toast('가정을 찾지 못했어요. 시트의 사랑방 탭을 통째로 복사해 주세요.');
        S.imp = r; render(); return window.scrollTo(0, 0);
      }
      case 'impdrop': { const [fi, ii] = v.split('.').map(Number); S.imp.families[fi].items.splice(ii, 1); return render(); }
      case 'impreset': S.imp = null; render(); return window.scrollTo(0, 0);
      case 'impgo': {
        const room = $('#imp-room').value.trim(); if (!room) return toast('사랑방 이름을 적어 주세요.');
        S.busy = true; render();
        try { S.imp = { done: await api('importRoom', { roomName: room, families: S.imp.families }) }; S.month = await api('month'); }
        catch (err) { oops(err); }
        S.busy = false; render(); return window.scrollTo(0, 0);
      }
      case 'copyremind': return copy('remind', remindText());
      case 'sharepick': S.shareId = id; S.copied = null; return render();
      // 카톡용 복사 = 오늘 올림. 화면은 먼저 바꾸고, 서버가 실패하면 되돌린다
      case 'copyshare': case 'unpost': {
        const P = S.pending, before = P.posts[id], on = b.dataset.act === 'copyshare';
        if (on) copy('share-' + id, shareText(S.month.families.find(x => x.id === id)));
        if (on) P.posts[id] = P.today; else { delete P.posts[id]; S.copied = null; }
        render();
        try { S.pending = await api(on ? 'post' : 'unpost', { familyId: id }); render(); }
        catch (err) { if (before) P.posts[id] = before; else delete P.posts[id]; render(); oops(err); }
        return;
      }
      case 'approve': case 'reject': case 'unlink':
        try { S.pending = await api(b.dataset.act, { kakaoId: v }); render(); toast(b.dataset.act === 'approve' ? '승인했어요.' : b.dataset.act === 'reject' ? '거절했어요.' : '연결을 해제했어요.'); } catch (err) { oops(err); }
        return;
    }
  });
  // 글을 쓰는 칸은 글 길이에 맞춰 높이가 늘어난다(길게 써도 칸 안에서 스크롤하지 않게)
  function autosize(t) { t.style.height = 'auto'; t.style.height = (t.scrollHeight + 2) + 'px'; }
  document.addEventListener('input', e => { if (e.target.matches('textarea.field')) autosize(e.target); });
  // 칸을 벗어나면(내용·대상) 저장
  document.addEventListener('change', e => {
    const t = e.target;
    if (t.dataset.imp) { const [fi, ii] = t.dataset.imp.split('.').map(Number); S.imp.families[fi].items[ii].target = t.value; return; }
    if (t.matches('textarea[data-id]')) {
      const id = t.dataset.id, i = itemOf(id), text = t.value.trim(), target = i.target;
      if (!text || text === i.text) return;
      // 칸에는 이미 고친 글이 보이니 다시 그리지 않고 기억만 바꾼다(칸을 벗어나며 바로 누른 탭이 그대로 눌리게)
      Object.assign(i, { text, target });
      const body = { id, target, text, scope: i.scope };
      save(() => api('saveItem', body));
    }
  });
  document.addEventListener('submit', async e => {
    e.preventDefault();
    const f = e.target;
    if (f.dataset.form === 'newfam') {
      const val = id => { const x = $(id); return x ? x.value.trim() : ''; };
      S.pick.newFamily = { a: val('#nf-a'), b: val('#nf-b'), kids: val('#nf-k') };
      S.view = 'consent'; return render();
    }
    if (f.dataset.form === 'famsave') {
      keepFam(); const E = S.famEdit; if (!E.a) return toast('이름을 적어 주세요.');
      S.busy = true; render();
      try { S.month = await api('saveFamily', { a: E.a, b: E.b, kids: E.kids }); S.famEdit = null; S.famMsg = '저장했어요.'; refreshMe(true); }
      catch (err) { oops(err); }
      S.busy = false; return render();
    }
    if (f.dataset.form === 'tgtcustom') { const v = f.querySelector('input').value.trim(); if (v) setTarget(f.dataset.id, v); return; }

  });

  // 스크롤: 아래로 내리면 상단 바와 하단 바가 함께 숨고, 조금이라도 올리면 다시 보인다(메뉴가 열렸거나 기도하는 중에는 그대로)
  let lastY = window.scrollY, ticking = false;
  window.addEventListener('scroll', () => {
    if (ticking) return; ticking = true;
    requestAnimationFrame(() => {
      ticking = false;
      const y = window.scrollY, dy = y - lastY;
      if (S.menu || S.ps) { lastY = y; return; }
      if (y < 40 || dy < -6) document.body.classList.remove('hide-bars');
      else if (dy > 6) document.body.classList.add('hide-bars');
      else return;
      lastY = y;
    });
  }, { passive: true });

  // 글을 쓰는 동안 숨긴 아래 메뉴는 조금 늦게 다시 보여 준다. 키보드가 내려가며 화면이 움직이는 사이에 누른 더하기가 메뉴에 가로채이지 않게
  let typingOff;
  function hideTypingSoon() { clearTimeout(typingOff); typingOff = setTimeout(() => document.body.classList.remove('typing'), 600); }
  document.addEventListener('focusin', e => { if (e.target.matches('textarea, input, select')) { clearTimeout(typingOff); document.body.classList.add('typing'); } });
  document.addEventListener('focusout', hideTypingSoon);

  // 시작하다 막히면 "불러오는 중"에 멈춰 있지 않고 다시 해 보기 버튼을 보여 준다
  boot().catch(e => { S.view = 'error'; S.err = e; render(); });
})();
</script>
</body>
</html>
