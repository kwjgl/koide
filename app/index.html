<div id="demo" class="demo" hidden></div>
<header class="topbar" id="topbar"></header>
<main id="main" class="wrap"><p class="loading">불러오는 중…</p></main>
<div id="pss" class="pss" role="dialog" aria-modal="true" hidden></div>
<div id="pop" class="pop" hidden></div>
<nav id="tabs" class="tabs" hidden></nav>
<div id="toast" class="toast" role="status" hidden></div>
<script src="config.js"></script>
<script>
(function () {
  const CFG = window.KOIDE_CONFIG || {};
  // 데모: 서버 주소가 없거나, 주소 뒤에 ?demo를 붙였을 때. 지어낸 예시 데이터로 리더·회원 화면을 눌러 본다
  //  ?demo로 연 데모는 실제 앱과 같은 주소라서, 로그인·화면 기억을 따로 둬서 실제 로그인을 건드리지 않는다
  const DEMO_LINK = !!CFG.API_URL && new URLSearchParams(location.search).has('demo'), DEMO = !CFG.API_URL || DEMO_LINK;
  const $ = s => document.querySelector(s);
  const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
  const TOKEN = DEMO_LINK ? 'koide-demo-token' : 'koide-token';
  const getToken = () => { try { return localStorage.getItem(TOKEN); } catch (e) { return null; } };
  // 로그인 표시가 바뀌면(로그인·로그아웃) 기억해 둔 화면도 지운다. 다른 사람의 기도제목이 남지 않게
  const setToken = t => { try { t ? localStorage.setItem(TOKEN, t) : localStorage.removeItem(TOKEN); localStorage.removeItem(CACHE); } catch (e) { /* 무시 */ } };
  // 지난번 이번 달 화면: 앱을 열 때 서버를 기다리지 않고 먼저 보여 준다
  const CACHE = DEMO_LINK ? 'koide-demo-cache' : 'koide-cache';
  const readCache = () => { try { return JSON.parse(localStorage.getItem(CACHE)); } catch (e) { return null; } };
  const writeCache = () => { try { localStorage.setItem(CACHE, JSON.stringify({ me: S.me, month: S.month })); } catch (e) { /* 무시 */ } };

  // 화면 상태
  const S = { openItems: new Set(), openFams: new Set(), view: 'loading', me: null, depts: null, rooms: null, pick: {}, month: null, tab: 'home', pending: null, busy: false };

  // ── 서버 부르기: 데모는 브라우저 안의 서버 코드, 실제는 Apps Script 웹 앱 ──
  async function api(action, data) {
    const body = Object.assign({ action, token: getToken() }, data || {});
    let res;
    if (DEMO) res = await window.koideDemo.call(body);
    else {
      // 본문을 글자로 보내면 브라우저가 미리 묻는 요청(CORS preflight) 없이 바로 보낸다. Apps Script는 그 요청을 받지 못한다
      // 한동안 안 쓰면 서버가 깨어나는 데 10~20초 걸린다. 4초가 넘으면 기다리는 이유를 알려 주고, 60초가 넘으면 그만 기다린다
      const slow = setTimeout(() => { const l = $('.loading'); if (l) l.textContent = '서버를 깨우는 중이에요. 처음에는 20초쯤 걸릴 수 있어요…'; }, 4000);
      const ctl = new AbortController(), stop = setTimeout(() => ctl.abort(), 60000);
      try {
        const r = await fetch(CFG.API_URL, { method: 'POST', body: JSON.stringify(body), signal: ctl.signal });
        res = await r.json();
      } catch (e) { throw { code: 'net', message: '서버가 답하지 않아요. 잠시 뒤 다시 해 주세요.' }; }
      finally { clearTimeout(slow); clearTimeout(stop); }
    }
    if (!res.ok) {
      if (res.code === 'login') { setToken(null); S.view = 'login'; render(); }
      throw res;
    }
    return res.data;
  }
  // ── 사용기록(설계서 10장): 행동과 숫자·선택지만 기기에 모아 두었다가, 앱을 열 때(start) 함께 보낸다 ──
  //  기기ID는 이 기기에서 무작위로 만든 값이고 가정·사람과 잇지 않는다. 이름, 기도제목, 쓴 글은 넣지 않는다
  const USAGE_Q = 'koide-usage', DEVICE = (() => {
    try {
      let d = localStorage.getItem('koide-device');
      if (!d) { d = (crypto.randomUUID ? crypto.randomUUID() : Math.random().toString(36).slice(2) + Date.now().toString(36)).replace(/[^a-z0-9]/gi, '').toLowerCase().slice(0, 24); localStorage.setItem('koide-device', d); }
      return d;
    } catch (e) { return ''; }
  })();
  const usageQ = () => { try { return JSON.parse(localStorage.getItem(USAGE_Q) || '[]'); } catch (e) { return []; } };
  function track(e, d) {
    try { const q = usageQ(); q.push({ at: new Date().toISOString(), e, d: d || {} }); localStorage.setItem(USAGE_Q, JSON.stringify(q.slice(-200))); } catch (err) { /* 기록 못 해도 앱은 그대로 */ }
    if (usageQ().length >= 30) sendUsage();
  }
  // 보낼 것: start에 붙이거나(usagePart) 많이 쌓이면 따로(sendUsage). 서버가 받았다고 하면(kept) 보낸 만큼만 지운다
  const usagePart = () => { const q = usageQ(); return q.length && DEVICE ? { device: DEVICE, events: q } : {}; };
  function usageSent(part, r) { if (!part.events || !r || !r.kept) return; try { localStorage.setItem(USAGE_Q, JSON.stringify(usageQ().slice(part.events.length))); } catch (e) { /* 다음에 다시 */ } }
  async function sendUsage() {
    if (sendUsage.busy || !getToken()) return; const part = usagePart(); if (!part.events) return;
    sendUsage.busy = true; try { usageSent(part, await api('usage', part)); } catch (e) { /* 다음에 다시 보낸다 */ } sendUsage.busy = false;
  }
  const widthKind = () => innerWidth < 640 ? 'phone' : innerWidth < 1024 ? 'tablet' : 'pc';
  // 앱을 연 기록은 하루 한 번
  function trackOpen() {
    try { if (localStorage.getItem('koide-usage-day') === new Date().toDateString()) return; localStorage.setItem('koide-usage-day', new Date().toDateString()); } catch (e) { return; }
    const me = S.month && S.month.me || {};
    track('열기', { role: me.admin ? '관리자' : me.role || '회원', width: widthKind(), style: (STYLES.find(s => s[0] === (PREF.style || 'flat')) || STYLES[0])[1], group: grp(), big: !!PREF.big, mode: PREF.mode || 'auto', app: STANDALONE });
  }
  function toast(msg) { const t = $('#toast'); t.textContent = msg; t.hidden = false; clearTimeout(toast.t); toast.t = setTimeout(() => { t.hidden = true; }, 2600); }
  const oops = e => toast((e && e.message) || '잠시 문제가 생겼어요. 다시 해 주세요.');

  // ── 시작: 카카오에서 돌아왔으면(code) 로그인부터, 아니면 내 상태를 확인 ──
  async function boot() {
    if (DEMO) { await loadDemo(); $('#demo').hidden = false; $('#demo').innerHTML = '데모 모드 · 지어낸 예시 데이터예요 <button data-act="demoreset">데모 데이터 지우기</button>' + (DEMO_LINK ? ' · <a href="./">실제 앱으로</a>' : ''); }
    const q = new URLSearchParams(location.search);
    if (q.get('code')) {
      try { const r = await api('login', { code: q.get('code'), redirectUri: CFG.REDIRECT_URI || '' }); setToken(r.token); }
      catch (e) { oops(e); }
      history.replaceState(null, '', location.pathname);
    }
    if (q.get('error')) { toast('카카오 로그인을 취소했어요.'); history.replaceState(null, '', location.pathname); }
    if (!getToken()) { S.view = 'login'; return render(); }
    // 지난번 화면이 기억돼 있으면 먼저 보여 주고, 서버에서 새로 받아 조용히 바꾼다
    const c = readCache();
    if (c && c.me && c.month) { S.me = c.me; S.month = c.month; S.view = 'app'; render(); return refreshMe(true); }
    await refreshMe();
  }
  function loadDemo() {
    return new Promise((ok, bad) => {
      const a = document.createElement('script'); a.src = 'demo/gas-shim.js';
      // 서버 코드는 app 폴더 밖이라 홈 화면 앱 도우미(sw.js)가 다루지 않는다. 브라우저에 남은 10분 사본 대신 늘 새로 받는다
      a.onload = () => { const b = document.createElement('script'); b.src = (CFG.DEMO_CODE || '../apps-script/Code.js') + '?t=' + Date.now(); b.onload = ok; b.onerror = bad; document.head.appendChild(b); };
      a.onerror = bad; document.head.appendChild(a);
    });
  }
  // quiet: 기억해 둔 화면을 보여 주는 중이라 "불러오는 중"이나 오류 화면으로 바꾸지 않는다
  async function refreshMe(quiet) {
    try {
      let r;
      // start가 없는 예전 서버 코드여도 열리게 예전 방식(me → month)으로 이어 간다
      const part = usagePart();
      try { r = await api('start', part); usageSent(part, r.usage); } catch (e) { if (e.code !== 'bad') throw e; r = { me: await api('me') }; }
      S.me = r.me;
      if (!S.me.link) {
        // 부서를 모르는 예전 서버면 사랑방 목록을 부서 하나로 본다
        S.depts = r.depts || [Object.assign({ id: '', name: '' }, DEPT0, { rooms: r.rooms || await api('rooms') })];
        S.pick = {};
        if (S.depts.length === 1) pickDept(S.depts[0].id); else S.view = 'dept';
      }
      else if (S.me.link.status === '요청') S.view = 'wait';
      else { const m = r.month || await api('month'); if (!waiting) S.month = m; S.view = 'app'; trackOpen(); }
    } catch (e) {
      if (e.code === 'login') return;
      if (quiet) return oops(e);
      S.view = 'error'; S.err = e;
    }
    quiet ? paint() : render();
  }
  async function loadMonth() { S.month = await api('month'); }

  async function kakaoLogin(who) {
    // 데모: 카카오 화면 대신 고른 사람으로 바로 로그인(실제로는 카카오에서 돌아올 때 주소에 code가 붙는다)
    if (DEMO) {
      try { const r = await api('login', { code: 'demo:' + who, redirectUri: '' }); setToken(r.token); } catch (e) { return oops(e); }
      S.view = 'loading'; render(); return refreshMe();
    }
    location.href = 'https://kauth.kakao.com/oauth/authorize?response_type=code&client_id=' + encodeURIComponent(CFG.KAKAO_REST_KEY) + '&redirect_uri=' + encodeURIComponent(CFG.REDIRECT_URI);
  }

  // ── 부서마다 다른 말 ──
  // 부서 탭의 소그룹 이름(사랑방, 순)과 단위(가정, 개인)로 화면의 말을 바꾼다. 개인 단위는 청년부처럼 한 사람이 한 줄
  const DEPT0 = { group: '사랑방', unit: '가정' };
  const UNIT = {
    가정: { one: '가정', mine: '우리 가정', only: '우리 가정만', count: '가정', members: '가정', self: '우리 가정',
      targets: kids => ['우리 가정', '남편', '아내', ...kids, '부모님', '기타'] },
    개인: { one: '사람', mine: '나', only: '나만', count: '명', members: '식구', self: '나',
      targets: () => ['나', '가족', '친구', '학교·직장', '기타'] }
  };
  const dept = () => (S.view === 'app' && S.month && S.month.dept) || (S.depts && S.depts.find(d => d.id === S.pick.deptId)) || DEPT0;
  const words = () => UNIT[dept().unit] || UNIT.가정;
  const solo = () => dept().unit === '개인';
  const grp = () => dept().group || '사랑방';
  function pickDept(id) { S.pick = { deptId: id }; S.rooms = S.depts.find(d => d.id === id).rooms; S.view = 'room'; }

  // ── 화면 ──
  const scopeName = k => ({ room: grp() + ' 공개', dept: (dept().name || '부서') + ' 공개', leader: '리더·목사님', family: words().only })[k];
  // 공개 범위는 누를 때마다 바뀐다. 교역자는 부서 공개 ↔ 우리 가정만
  const nextScope = s => S.month && S.month.me && S.month.me.staff ? (s === 'dept' ? 'family' : 'dept') : ({ room: 'leader', leader: 'family', family: 'room' })[s] || 'room';
  // 기도 대상 칩: 교역자는 함께·직분·배우자·자녀·부모님·사역(설계서 섬기는 분들)
  const targetsFor = kids => {
    const me = S.month && S.month.me;
    if (!me || !me.staff) return words().targets(kids);
    const two = (mineFam().name || '').indexOf(' · ') > 0;
    return ['함께', me.role || '목사님', ...(two ? [me.role === '장로님' ? '배우자' : '사모님'] : []), ...kids, '부모님', '사역', '기타'];
  };
  const callName = n => { const g = String(n).slice(1), c = g.charCodeAt(g.length - 1) - 0xAC00; return g + (c >= 0 && c % 28 ? '이' : '가'); };
  const whoDid = by => !by || (S.me && by === S.me.person) ? '내가' : callName(by);
  // 기도제목 아래 한 줄: 누가 새로 썼는지·고쳤는지. 기존 시트에서 가져온 것은 사람 대신 '기존 시트에서 가져옴'
  const itemState = i => i.pending ? '저장 중…' : i.editedBy === '가져옴' ? (i.same ? '지난달과 같음 · ' : '') + '기존 시트에서 가져옴'
    : i.isNew ? whoDid(i.editedBy) + ' 새로 씀' : i.same ? '지난달과 같음 · ' + whoDid(i.editedBy) + ' 씀' : whoDid(i.editedBy) + ' 고침' + (i.editedAt ? ' · ' + i.editedAt : '');
  const steps = n => `<div class="steps" aria-hidden="true">${[1, 2, 3, 4].map(k => `<span class="${k <= n ? 'on' : ''}"></span>`).join('')}</div>`;
  const svg = d => `<svg class="ic" viewBox="0 0 16 16" aria-hidden="true">${d}</svg>`;
  const ICON = {
    bubble: '<svg viewBox="0 0 18 18" width="18" height="18" aria-hidden="true"><path fill="currentColor" d="M9 2.2c-4.1 0-7.4 2.6-7.4 5.8 0 2.1 1.4 3.9 3.5 4.9l-.8 2.9c-.1.3.2.5.4.3l3.4-2.3h.9c4.1 0 7.4-2.6 7.4-5.8S13.1 2.2 9 2.2z"/></svg>',
    home: svg('<path d="M2.5 7.5L8 3l5.5 4.5V13a1 1 0 0 1-1 1h-9a1 1 0 0 1-1-1z"/><path d="M6.5 14V10h3v4"/>'),
    pen: svg('<path d="M3 13l.8-3.2 6.7-6.7 2.4 2.4-6.7 6.7z"/><path d="M9.3 4.3l2.4 2.4"/>'),
    hands: svg('<path d="M8 2.5v10.5"/><path d="M8 2.5C6.7 3.8 6 5.6 6 7.6L3.4 10.4 5 13.5h3"/><path d="M8 2.5c1.3 1.3 2 3.1 2 5.1l2.6 2.8-1.6 3.1H8"/>'),
    book: svg('<rect x="3" y="2.5" width="10" height="11" rx="1.5"/><path d="M5.8 5.5h4.4M5.8 8h4.4M5.8 10.5h2.5"/>'),
    more: svg('<circle cx="3.5" cy="8" r=".9"/><circle cx="8" cy="8" r=".9"/><circle cx="12.5" cy="8" r=".9"/>'),
    room: svg('<circle cx="8" cy="8" r="5.5"/><path d="M2.5 8h11M8 2.5c1.6 1.6 2.3 3.4 2.3 5.5S9.6 11.9 8 13.5M8 2.5C6.4 4.1 5.7 5.9 5.7 8s.7 3.9 2.3 5.5"/>'),
    chev: svg('<path d="M4.5 6.5L8 10l3.5-3.5"/>'),
    chevR: svg('<path d="M6 3.5L10.5 8 6 12.5"/>'),
    chevL: svg('<path d="M10 3.5L5.5 8 10 12.5"/>'),
    up: svg('<path d="M4 9.5L8 5.5l4 4"/>'),
    x: svg('<path d="M4 4l8 8M12 4l-8 8"/>'),
    lock: svg('<rect x="3" y="7" width="10" height="7" rx="1.5"/><path d="M5.5 7V5a2.5 2.5 0 0 1 5 0v2"/>'),
    people: svg('<circle cx="6" cy="5.5" r="2"/><path d="M2.5 13c0-2 1.6-3.5 3.5-3.5s3.5 1.5 3.5 3.5"/><circle cx="11.2" cy="6" r="1.6"/><path d="M10.5 9.6c1.8 0 3 1.3 3 3.1"/>'),
    gear: svg('<circle cx="8" cy="8" r="2"/><path d="M8 1.8v1.6M8 12.6v1.6M3.6 3.6l1.1 1.1M11.3 11.3l1.1 1.1M1.8 8h1.6M12.6 8h1.6M3.6 12.4l1.1-1.1M11.3 4.7l1.1-1.1"/>'),
    screen: svg('<rect x="2" y="3" width="12" height="8" rx="1.2"/><path d="M6 14h4M8 11v3"/>'),
    knot: svg('<path d="M.5 8.5h3.8c1.2 0 1.7-1.5 1.7-2.8C6 3.7 7.3 2.5 9 2.5s3 1.2 3 3.1-1.8 3.1-4 3.3"/><path d="M5.6 10.1C7.6 9 9.6 8.5 15.5 8.5"/>'),
    check: '<svg viewBox="0 0 16 16" width="14" height="14" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3.5 8.5l3 3 6-7"/></svg>'
  };

  // 아이폰 Safari 등 카톡 밖 브라우저: 카카오 로그인이 카톡 앱을 오가는데, 비공개 릴레이가 켜져 있으면 IP가 달라져 카카오가 막는다
  const iosSafari = () => (/iP(hone|ad|od)/.test(navigator.userAgent) || (/Macintosh/.test(navigator.userAgent) && navigator.maxTouchPoints > 1)) && !/KAKAOTALK/i.test(navigator.userAgent);

  const VIEWS = {
    loading: () => '<p class="loading">불러오는 중…</p>',
    error: () => `<h1>잠시 문제가 생겼어요</h1><p class="hint">${esc(S.err && S.err.message)}</p><button class="btn" data-act="retry">다시 해 보기</button>`,
    login: () => `<p class="eyebrow">코이데 · 함께 기도하는 공동체</p><h1>서로의 기도를 나누고<br>함께 기도해요</h1>
      <p>처음 한 번만 로그인하면 돼요.</p>
      ${DEMO ? `<div class="choices">
          <button class="kakao" data-act="login" data-v="새 사람${Date.now() % 1000}">${ICON.bubble}카카오로 시작하기 (처음 오는 사람)</button>
          <button class="choice" data-act="login" data-v="김도윤">데모: 김도윤으로 들어가기 (2-20 리더)</button>
          <button class="choice" data-act="login" data-v="박민재">데모: 박민재로 들어가기 (회원)</button>
          <button class="choice" data-act="login" data-v="윤하람">데모: 윤하람으로 들어가기 (청년부 1순 리더)</button>
          <button class="choice" data-act="login" data-v="한기쁨">데모: 한기쁨으로 들어가기 (청장년부 목사님)</button></div>
          <p class="hint">데모 모드에서는 카카오 대신 이 버튼으로 사람을 골라 들어가요.</p>`
        : `<button class="kakao" data-act="login">${ICON.bubble}카카오로 시작하기</button>${iosSafari() ? '<p class="hint">아이폰에서 \'접속 정보를 확인해 주세요\'가 나오면, 카톡 채팅방에서 이 링크를 눌러 열거나 설정 → iCloud → 비공개 릴레이를 끄고 다시 해 주세요.</p>' : ''}`}
      <p class="hint name-note">코이데는 '교제'를 뜻하는 코이노니아와 '간구'를 뜻하는 데에시스에서 영감을 얻은 이름이에요. 서로의 기도를 나누고, 함께 기도하는 공동체를 뜻해요. 우리를 잇는 끈은 성령의 교통하심(코이노니아)이에요.</p>`,
    dept: () => `${steps(1)}<p class="eyebrow">처음 한 번만 확인할게요</p><h1>어느 부서인가요?</h1>
      <div class="choices">${(S.depts || []).map(d => `<button class="choice" data-act="pickdept" data-v="${esc(d.id)}">${esc(d.name)}</button>`).join('')}</div>`,
    room: () => `${steps(1)}<p class="eyebrow">${dept().name ? esc(dept().name) : '처음 한 번만 확인할게요'}</p><h1>어느 ${esc(grp())}인가요?</h1>
      <div class="choices">${(S.rooms || []).map(r => `<button class="choice" data-act="pickroom" data-v="${esc(r.id)}">${esc(r.name)}</button>`).join('')}</div>
      ${(dept().staff || []).length ? '<button class="choice new" data-act="staffstart">목사님·장로님으로 들어가기</button>' : ''}
      ${S.depts && S.depts.length > 1 ? '<button class="link" data-act="back" data-v="dept">뒤로</button>' : ''}`,
    staffpick: () => `${steps(2)}<p class="eyebrow">${esc(dept().name || '')}</p><h1>어느 분이세요?</h1>
      <div class="choices">${(dept().staff || []).map(s => `<button class="choice" data-act="pickstaff" data-v="${esc(s.id)}">${esc(s.label)}<small class="choice-sub">${esc(s.name)}</small></button>`).join('')}</div>
      <p class="hint">목록에 없으면 부서 관리자에게 교역자 목록에 더해 달라고 해 주세요. 연결은 관리자가 승인해요.</p>
      <button class="link" data-act="back" data-v="room">뒤로</button>`,
    family: () => { const r = S.rooms.find(x => x.id === S.pick.roomId);
      return `${steps(2)}<p class="eyebrow">${esc(r.name)}</p><h1>${solo() ? '내 이름을 골라 주세요' : '우리 가정을 골라 주세요'}</h1>
      <div class="choices">${r.families.map(f => `<button class="choice" data-act="pickfam" data-v="${esc(f.id)}">${esc(f.name)}</button>`).join('')}
        <button class="choice new" data-act="newfam">${solo() ? '목록에 내 이름이 없어요 · 새로 왔어요' : '목록에 우리 가정이 없어요 · 새로 왔어요'}</button></div>
      <button class="link" data-act="back" data-v="room">뒤로</button>`; },
    who: () => { const f = famPicked();
      return `${steps(3)}<p class="eyebrow">${esc(f.name)} 가정</p><h1>누구세요?</h1>
      <div class="choices">${f.name.split(' · ').map(n => `<button class="choice" data-act="pickwho" data-v="${esc(n)}">${esc(n)}</button>`).join('')}</div>
      <p class="hint">우리 가정 안에서 누가 고쳤는지 보여 줄 때 써요.</p>
      <button class="link" data-act="back" data-v="${S.pick.staff ? 'staffpick' : 'family'}">뒤로</button>`; },
    consent: () => `${steps(4)}<p class="eyebrow">${S.pick.newFamily ? (solo() ? '새로 왔어요' : '새 가정 신청') : solo() ? esc(S.pick.person) : famWho(famPicked().name, S.pick.person)}</p><h1>기도제목은 이렇게 지켜요</h1>
      ${consentList()}
      <button class="btn wide" data-act="request" ${S.busy ? 'disabled' : ''}>동의하고 연결 요청</button>
      <p class="hint">동의하지 않으면 앱을 쓸 수 없어요. 궁금한 점은 리더나 목사님께 물어봐 주세요.</p>
      <button class="link" data-act="back" data-v="${S.pick.newFamily ? 'newfam' : 'who'}">뒤로</button>`,
    newfam: () => solo() ? `${steps(2)}<p class="eyebrow">새로 왔어요</p><h1>이름을 알려 주세요</h1>
      <form data-form="newfam">
        <label class="f" for="nf-a">이름</label><input id="nf-a" class="field" required maxlength="10" value="${esc((S.pick.newFamily || {}).a || '')}">
        <p class="hint">신청하면 리더가 확인한 뒤 승인해요.</p>
        <button class="btn wide" type="submit" style="margin-top:12px">다음</button></form>
      <button class="link" data-act="back" data-v="family">뒤로</button>`
      : `${steps(2)}<p class="eyebrow">새 가정 신청</p><h1>우리 가정을 알려 주세요</h1>
      <form data-form="newfam">
        <label class="f" for="nf-a">남편 또는 본인 이름</label><input id="nf-a" class="field" required maxlength="10" value="${esc((S.pick.newFamily || {}).a || '')}">
        <label class="f" for="nf-b">아내 이름 · 1인 가정이면 비워 두세요</label><input id="nf-b" class="field" maxlength="10" value="${esc((S.pick.newFamily || {}).b || '')}">
        <label class="f" for="nf-k">자녀 이름 · 선택, 쉼표로 구분</label><input id="nf-k" class="field" maxlength="40" value="${esc((S.pick.newFamily || {}).kids || '')}">
        <p class="hint">신청하면 리더가 확인한 뒤 승인해요. 배우자는 나중에 각자 카카오로 연결하면 돼요.</p>
        <button class="btn wide" type="submit" style="margin-top:12px">다음</button></form>
      <button class="link" data-act="back" data-v="family">뒤로</button>`,
    wait: () => `${steps(4)}<p class="eyebrow">${esc(S.me.familyName || '')}</p><h1>연결을 요청했어요</h1>
      <p>${S.me.familyName && S.me.familyName !== S.me.link.person ? `${esc(S.me.link.person)} 님의 카카오 계정을 <b>${esc(S.me.familyName)}</b>에 연결해 달라고` : `${esc(S.me.link.person)} 님의 카카오 계정을 연결해 달라고`} ${S.me.staff ? '부서 관리자' : '리더'}에게 보냈어요. 승인되면 바로 열려요.</p>
      <div class="wait">${S.me.staff ? '관리자' : '리더'}가 확인하고 있어요</div>
      <button class="btn wide" data-act="retry">승인됐는지 다시 확인</button>
      <p class="hint">${DEMO ? '데모: 로그아웃하고 그 부서의 리더(청장년부는 김도윤, 청년부는 윤하람)로 들어가 더보기에서 승인해 보세요.' : '보통 하루 안에 끝나요.'}</p>
      <button class="link" data-act="logout">로그아웃</button>`,
    app: () => ({ home: homeView, mine: mineView, pray: prayView, history: historyView, more: moreView, status: statusView, admin: adminView, import: importView, reorg: reorgView })[S.tab]()
  };
  // 고른 가정: 사랑방 가정, 또는 '목사님·장로님으로 들어가기'에서 고른 교역자 가정
  const famPicked = () => S.pick.staff ? (dept().staff || []).find(f => f.id === S.pick.familyId) : S.rooms.find(x => x.id === S.pick.roomId).families.find(f => f.id === S.pick.familyId);
  const consentList = () => `<ul class="consent">
      <li><b>무엇을</b><span>${solo() ? '이름, 내가 쓴 기도제목' : '가정 이름, 자녀 이름, 우리 가정이 쓴 기도제목'}, 카카오 회원번호와 닉네임</span></li>
      <li><b>어디에</b><span>교회가 관리하는 비공개 구글 시트 한 곳</span></li>
      <li><b>누가 보나</b><span>기도제목마다 고른 공개 범위대로만 보여요. 시트를 관리하는 관리자는 모두 볼 수 있어요</span></li>
      <li><b>얼마나</b><span>교회를 떠나면 1년 뒤 내용을 지우고 개수만 남겨요. 언제든 ${solo() ? '내' : '우리 가정'} 기록을 지워 달라고 할 수 있어요</span></li>
      <li><b>사용 기록</b><span>앱을 좋게 만들기 위해 이름 없는 사용 기록을 남겨요. "기도하기를 열었다"처럼 누른 것과 숫자만이고, 이름과 기도제목은 넣지 않아요</span></li></ul>`;

  // 이번 달: 우리 가정 + 사랑방 가정마다 기도제목과 "기도했어요"
  const todayLabel = () => { const d = new Date(); return (d.getMonth() + 1) + '월 ' + d.getDate() + '일 ' + '일월화수목금토'[d.getDay()]; };
  // 기도제목 줄(시안과 같게): 같은 대상은 칩 하나 아래로 묶고, 휴대폰에서는 3줄까지 보이고 '더 보기'로 펼친다.
  //  새 기도제목은 글 앞 작은 점, 공개 범위는 리더·목사님(보라 띠)·우리 가정만(회색 바탕 + 자물쇠)
  const SCOPE_ICON = { room: ICON.room, dept: ICON.room, leader: ICON.people, family: ICON.lock };
  //  famId가 있으면(사랑방 가정 카드) 글의 '더 보기'가 그 가정 카드 전체를 펼친다: 4개 넘는 항목과 접힌 글까지 한 번에
  function itemBody(i, clamp, famId) {
    const open = !famId && S.openItems.has(i.id);
    const dot = i.isNew ? '<i class="new-dot" title="이번 달 새 기도제목"></i><span class="sr">새 기도제목: </span>' : '';
    const tog = !clamp ? '' : famId ? `<button class="more-txt" data-act="famtoggle" data-id="${esc(famId)}" aria-expanded="false">더 보기</button>`
      : `<button class="more-txt" data-act="itemtoggle" data-id="${esc(i.id)}" aria-expanded="${open}">${open ? '접기' : '더 보기'}</button>`;
    // 기본 공개(사랑방 공개, 교역자의 부서 공개)는 표시하지 않는다
    const scope = i.scope === 'leader' || i.scope === 'family' ? `<span class="b-scope ${i.scope}">${SCOPE_ICON[i.scope]}${scopeName(i.scope)}</span>` : '';
    return `<div class="item-body"><p class="txt${clamp && !open ? ' clamp' : ''}">${dot}${esc(i.text)}${i.ended ? '<span class="end-tag">마침</span>' : ''}</p>${tog || scope ? `<div class="item-foot">${scope}${tog}</div>` : ''}</div>`;
  }
  function itemList(items, clamp, famId) {
    const groups = [];
    items.filter(i => !i.pending).forEach(i => { const g = groups.find(x => x.target === i.target); g ? g.items.push(i) : groups.push({ target: i.target, items: [i] }); });
    return `<ul class="items">${groups.map(g => g.items.length === 1 ? `<li class="item s-${g.items[0].scope}"><span class="tgt">${esc(g.target)}</span>${itemBody(g.items[0], clamp, famId)}</li>`
      : `<li class="item grp"><span class="tgt">${esc(g.target)}</span><ul class="sub">${g.items.map(i => `<li class="s-${i.scope}">${itemBody(i, clamp, famId)}</li>`).join('')}</ul></li>`).join('')}</ul>`;
  }
  // 기도했어요: 오늘 횟수(N/3)를 함께. 하루 3번이 되면 '오늘은 여기까지'
  function prayBtn(f, small, hero) {
    const t = f.today || 0, on = t > 0;
    if (t >= 3) return `<button class="pray on${small ? ' small' : ''}${hero ? ' hero' : ''}" disabled aria-label="오늘은 이 ${words().one}을 위해 3번 기도했어요. 내일 또 누를 수 있어요">${ICON.check}오늘은 여기까지<span class="pray-n" aria-hidden="true">3/3</span></button>`;
    return `<button class="pray${small ? ' small' : ''}${hero ? ' hero' : ''}${on ? ' on' : ''}" data-act="pray" data-v="${esc(f.id)}" aria-label="기도했어요${on ? ` (오늘 ${t}번 기도함, 하루 3번까지)` : ''}">${on ? ICON.check : ICON.hands}기도했어요${on ? `<span class="pray-n" aria-hidden="true">${t}/3</span>` : ''}</button>`;
  }
  const STATUS_LABEL = { same: '지난달 그대로', edited: '이번 달 손봄', confirmed: '그대로 확인' };
  // 우리 가정 카드의 한 줄: 이번 달 몇 가정이 우리 가정을 위해 기도했는지에 따라(누가 했는지는 보이지 않는다)
  function receivedLine() {
    const R = S.month.received || { n: 0, of: 0 };
    // 가정 단위는 '사랑방 가족이 우리 가정을', 개인 단위는 '순 식구가 나를'
    const g = grp() + (solo() ? ' 식구' : ' 가족'), me = solo() ? '나를' : '우리 가정을';
    // 아무도 누르지 않은 달에도 기도받지 못하는 가정은 없다(롬 8:34)
    const [k, t] = !R.n ? ['plain', '그리스도께서 ' + me + ' 위해 간구하고 계세요.'] : R.n * 2 >= R.of ? ['deep', g + '들이 함께 ' + me + ' 위해 기도하고 있어요'] : ['soft', g + (solo() ? '가 ' : '이 ') + me + ' 위해 기도했어요'];
    return `<p class="received r-${k}">${ICON.hands}<span>${t}</span></p>`;
  }
  function famCard(f) {
    // 펼치면 모든 항목을 접지 않고 다 보여 주고, 맨 아래 '접기' 하나로 다시 접는다
    const its = f.items.filter(i => !i.pending), open = S.openFams.has(f.id), more = its.length - 4;
    return `<article class="card"><div class="fam-head"><h3>${esc(f.name)}</h3>${prayBtn(f, true)}</div>
      ${its.length ? (open ? itemList(its, false) : itemList(its.slice(0, 4), true, f.id)) : '<p class="hint">아직 올린 기도제목이 없어요.</p>'}
      ${open ? `<button class="link" data-act="famtoggle" data-id="${esc(f.id)}" aria-expanded="true">접기</button>`
        : more > 0 ? `<button class="link" data-act="famtoggle" data-id="${esc(f.id)}" aria-expanded="false">더 보기 · ${more}개</button>` : ''}</article>`;
  }
  // ── 홈 화면에 두기(13장 홈 화면 앱) ──
  // 홈 화면 앱으로 열었으면 나오지 않는다. "알겠어요"를 누르면 이 기기에서는 다시 나오지 않고, 더보기에서 다시 볼 수 있다
  const STANDALONE = (window.matchMedia && matchMedia('(display-mode: standalone)').matches) || navigator.standalone === true;
  const A2HS_OFF = 'koide-a2hs-off';
  //  PC에서는 처음부터 띄우지 않는다(더보기에서는 볼 수 있다)
  S.a2hs = !STANDALONE && !!(window.matchMedia && matchMedia('(pointer: coarse)').matches) && (() => { try { return !localStorage.getItem(A2HS_OFF); } catch (e) { return true; } })();
  S.a2hsOs = /android/i.test(navigator.userAgent) ? 'android' : 'ios';
  // 안드로이드 크롬은 설치 창을 직접 띄울 수 있다. 그 기회를 받아 두었다가 "바로 설치"로 쓴다
  let installAsk = null;
  window.addEventListener('beforeinstallprompt', e => { e.preventDefault(); installAsk = e; if (S.view === 'app') paint(); });
  window.addEventListener('appinstalled', () => { installAsk = null; S.a2hs = false; if (S.view === 'app') paint(); });
  function a2hsCard() {
    if (!S.a2hs) return '';
    const os = S.a2hsOs;
    const how = os === 'ios' ? ['사파리에서 이 화면을 열어요', '아래쪽 공유 버튼(네모에 위 화살표)을 눌러요', '"홈 화면에 추가"를 눌러요']
      : ['크롬에서 이 화면을 열어요', '오른쪽 위 점 세 개를 눌러요', '"홈 화면에 추가" 또는 "앱 설치"를 눌러요'];
    // 화면 위에 뜨는 창(휴대폰은 아래에서 올라옴). 바깥이나 ×를 누르면 이번만 닫고, '알겠어요'는 다시 띄우지 않는다
    return `<div class="pop-scrim" data-act="a2hshide"></div>
      <section class="card a2hs pop-sheet" role="dialog" aria-modal="true" aria-labelledby="a2hs-t">
      <div class="row"><p class="label" id="a2hs-t">휴대폰 홈 화면에 코이데를 두세요</p><button class="icon-btn sm" data-act="a2hshide" aria-label="닫기">${ICON.x}</button></div>
      <p>앱처럼 아이콘을 눌러 바로 열 수 있어요. 링크를 찾지 않아도 돼요.</p>
      ${installAsk ? '<button class="btn" data-act="a2hsinstall">바로 설치하기</button>' : ''}
      <div class="seg2" role="tablist" aria-label="휴대폰 종류">${[['ios', '아이폰'], ['android', '안드로이드']].map(([k, l]) => `<button class="${os === k ? 'on' : ''}" role="tab" aria-selected="${os === k}" data-act="a2hsos" data-v="${k}">${l}</button>`).join('')}</div>
      <ol class="a2hs-steps">${how.map(x => `<li>${x}</li>`).join('')}</ol>
      <button class="btn ghost" data-act="a2hsclose">알겠어요</button>
    </section>`;
  }

  function homeView() {
    if (staffMe()) return staffHomeView();
    const M = S.month, others = M.families.filter(f => !f.own), t = todayFam();
    return `<div class="page-top"><div><p class="eyebrow">${esc(M.room.name)}</p><h1>${Number(M.month.slice(5))}월 기도제목 <span aria-hidden="true">🙏</span></h1></div><p class="date">${todayLabel()}</p></div>
      ${shiftCard()}<div class="home-grid"><div class="col side">${t ? `<section class="card today" aria-label="지금 함께 기도할 ${words().one}"><p class="today-tag">${ICON.hands}지금 함께 기도할 ${words().one}</p><h2>${esc(t.name)}</h2>
          <div class="today-body" data-id="${esc(t.id)}" tabindex="0" aria-label="${esc(t.name)} 기도제목">${t.items.length ? itemList(t.items, false) : `<p class="hint">아직 올린 기도제목이 없어요. 이 ${words().one}을 떠올리며 기도해요.</p>`}</div>
          <div class="pray-hero"><div class="pray-row">${prayBtn(t, false, true)}<button class="btn next${t.today ? '' : ' ghost'}" data-act="nexttoday">다음 ${words().one}</button></div>
            ${t.prayed ? `<p class="pray-done">이번 달 ${esc(t.name)}${solo() ? ' 님' : ' 가정'}을 위해 ${t.prayed}번 기도했어요</p>` : ''}</div>
          <p class="hint">앱을 열 때마다 이번 달 아직 기도하지 않은 ${words().one}부터 돌아가며 나와요.</p>
          ${cordHtml(t.id)}</section>` : ''}</div>
      <div class="col main">
        ${mineCard()}
        <div class="section-row"><div class="sr-title"><h2 class="section-title">${esc(grp())} ${words().members} ${others.length}</h2><span class="sr-legend"><i class="new-dot"></i>이번 달 새 기도제목</span></div>
          <div class="sr-tools"><button class="btn small ghost meet-btn" data-act="meet" title="모임 때 한 ${words().one}씩 크게 보기">${ICON.screen}모임 모드</button>
          <div class="seg2" role="tablist" aria-label="보기 방식">${[['card', '카드'], ['table', '표']].map(([k, l]) => `<button class="${(S.homeView || 'card') === k ? 'on' : ''}" role="tab" aria-selected="${(S.homeView || 'card') === k}" data-act="homeview" data-v="${k}">${l}</button>`).join('')}</div></div></div>
        ${S.homeView === 'table' ? tableCard() : `<div class="fam-grid">${others.map(famCard).join('')}</div>`}
        ${serveCard()}
      </div></div>`;
  }
  // 개편 안내: 새 리더에게는 맡을 가정 명단, 회원에게는 "12월부터 ○○ 사랑방이에요", 바뀐 달에는 한 번 "올해는 ○○ 사랑방이에요"
  function shiftCard() {
    const X = S.month.shift; if (!X) return '';
    const g = esc(grp()), key = 'koide-shift-' + (X.started || '');
    if (X.started) {
      try { if (localStorage.getItem(key)) return ''; } catch (e) { /* 늘 보여 준다 */ }
      return `<section class="notice" style="margin-bottom:12px"><b>${X.started}년 편성이 시작됐어요.</b> 올해는 <b>${esc(X.room)}</b>이에요. 아래가 새 ${g} ${words().members}이에요. <button class="link" data-act="shiftok" data-v="${key}">알겠어요</button></section>`;
    }
    const when = Number(X.start.slice(5)) + '월부터';
    return `<section class="notice" style="margin-bottom:12px"><b>${when} ${esc(X.room)}이에요.</b>${X.lead ? ` ${X.year}년에 ${esc(X.lead)}로 섬기게 돼요. 맡을 ${words().members}: ${X.families.map(esc).join(', ')}.` : ''}
      <span class="hint">그때까지는 지금 ${g}이 그대로예요. 새 ${g}의 기도제목은 ${when} 보여요.</span></section>`;
  }
  // 우리 가정 카드(회원과 목사님·장로님 홈에 같이 나온다)
  function mineCard() {
    const mine = S.month.families.find(f => f.own);
    return `<section class="card" aria-label="${words().mine}"><div class="fam-head"><div><p class="label">${words().mine}</p><h3>${esc(mine.name)}</h3></div><span class="chip-status st-${mine.status}">${STATUS_LABEL[mine.status]}</span></div>
      ${staffMe() ? '' : receivedLine()}
      ${mine.items.length ? itemList(mine.items, true) : '<p class="hint">아직 올린 기도제목이 없어요.</p>'}
      <div class="actions"><button class="btn" data-act="tab" data-v="mine">고치기</button>${mine.status === 'same' ? '<button class="btn ghost" data-act="confirm">이번 달도 그대로예요</button>' : ''}</div>
      ${mine.status === 'confirmed' ? `<p class="hint">이번 달도 그대로라고 ${staffMe() ? '표시했어요' : '리더에게 알렸어요'}.</p>` : ''}</section>`;
  }
  // S5 목사님 홈: 부서 전체를 훑어보고(사랑방마다 손봄·확인), 사랑방을 눌러 그 사랑방 가정을 보며 기도한다
  function staffHomeView() {
    if (S.openRoom) return staffRoomView();
    const M = S.month, rooms = M.rooms || [], sum = k => rooms.reduce((a, r) => a + r[k], 0);
    const stat = (n, l) => `<div class="stat"><b>${n}</b><span>${l}</span></div>`;
    return `<div class="page-top"><div><p class="eyebrow">${esc(M.dept.name)} 전체 · ${esc(M.me.label || M.me.person)}</p><h1>${Number(M.month.slice(5))}월 기도제목 <span aria-hidden="true">🙏</span></h1></div><p class="date">${todayLabel()}</p></div>
      <div class="home-grid"><div class="col side">
        <section class="card"><div class="stats">${stat(rooms.length, grp())}${stat(sum('n'), words().count)}${stat(sum('edited') + sum('confirmed'), '이번 달 손봄·확인')}</div></section>
        ${rooms.length ? `<section class="card">${roomCordHtml()}<p class="hint">매듭을 누르면 그 ${esc(grp())}을 위해 기도하러 가요.</p></section>` : ''}
        ${mineCard()}
      </div><div class="col main">
        <h2 class="section-title">${esc(grp())}별 이번 달 현황</h2>
        ${rooms.length ? `<div class="room-board">${rooms.map(r => { const same = r.n - r.edited - r.confirmed;
          return `<button class="card room-sum" data-act="openroom" data-v="${esc(r.id)}"><span class="row"><b>${esc(r.name)}</b>${ICON.chevR}</span>
            <span class="hint">리더 ${r.leaders.length ? r.leaders.map(esc).join(', ') : '미지정'} · ${r.n}${words().count}</span>
            <span class="bar" role="img" aria-label="이번 달 손봄 ${r.edited}, 그대로 확인 ${r.confirmed}, 지난달 그대로 ${same}"><span class="bseg edited" style="flex:${r.edited}"></span><span class="bseg confirmed" style="flex:${r.confirmed}"></span><span class="bseg same" style="flex:${same}"></span></span>
            <span class="hint">손봄 ${r.edited} · 그대로 확인 ${r.confirmed} · 지난달 그대로 ${same}${r.fresh ? ` · 새 기도제목 ${r.fresh}` : ''}</span></button>`; }).join('')}</div>
          <ul class="legend"><li><i class="sw edited"></i>이번 달 손봄</li><li><i class="sw confirmed"></i>그대로 확인</li><li><i class="sw same"></i>지난달 그대로</li></ul>`
        : `<p class="hint">아직 ${esc(grp())}이 없어요.</p>`}
        ${signalCard(M.signals, true)}
        ${serveCard()}
      </div></div>`;
  }
  // 돌봄 신호: 오래 그대로인 가정과 오래 이어진 기도제목. 종류(목사님은 사랑방도)로 거르고 오래된 순 5건만 먼저 보여 준다
  function signalCard(all, multi) {
    if (!all) return '';
    const type = S.sigType || 'same', of = all.filter(x => x.type === type);
    const rooms = multi ? (S.month.rooms || []).filter(r => of.some(x => x.roomId === r.id)) : [];
    const room = rooms.some(r => r.id === S.sigRoom) ? S.sigRoom : 'all';
    const list = of.filter(x => room === 'all' || x.roomId === room), shown = S.sigMore ? list : list.slice(0, 5);
    const tag = x => x.type === 'same' ? `${x.n}달째 지난달 그대로` : `${x.n}개월째 이어짐`;
    return `<section class="card"><div class="row"><p class="label" style="margin:0">돌봄 신호${multi ? ' · 전체' : ''}</p><span class="hint">${all.length}건</span></div>
      <div class="seg2" role="tablist" aria-label="돌봄 신호 종류">${[['same', '오래 그대로'], ['long', '오래 이어진 기도제목']].map(([k, l]) => `<button class="${type === k ? 'on' : ''}" role="tab" aria-selected="${type === k}" data-act="sigtype" data-v="${k}">${l} ${all.filter(x => x.type === k).length}</button>`).join('')}</div>
      ${rooms.length > 1 ? `<div class="mchips" style="margin-top:10px">${[{ id: 'all', name: '전체', n: of.length }, ...rooms.map(r => ({ id: r.id, name: r.name, n: of.filter(x => x.roomId === r.id).length }))].map(x => `<button class="mchip${room === x.id ? ' on' : ''}" data-act="sigroom" data-v="${esc(x.id)}" aria-pressed="${room === x.id}">${esc(x.name)} ${x.n}</button>`).join('')}</div>` : ''}
      ${list.length ? `<ul class="signals">${shown.map(x => `<li><span class="sig-tag">${tag(x)}</span>${multi ? `<button class="link sig-go" data-act="sigfam" data-room="${esc(x.roomId)}" data-v="${esc(x.familyId)}">${esc(x.name)}</button>` : `<b>${esc(x.name)}</b>`}${multi || x.note ? `<small>${[multi ? x.room : '', x.note].filter(Boolean).map(esc).join(' · ')}</small>` : ''}</li>`).join('')}</ul>`
        : `<p class="hint">${type === 'same' ? '3달 넘게 지난달 그대로인 ' + words().one + '이 없어요.' : '3개월 넘게 이어진 기도제목이 없어요.'}</p>`}
      ${list.length > 5 ? `<button class="link" data-act="sigmore">${S.sigMore ? '접기' : `나머지 ${list.length - 5}건 더 보기`}</button>` : ''}
      <p class="hint">오래된 순이에요. 심방과 연락 참고용이고, ${words().count}끼리 비교하는 숫자는 보여 주지 않아요.</p></section>`;
  }
  // 목사님 홈에서 고른 사랑방: 리더·목사님 항목까지 보고, 가정마다 기도했어요를 누른다
  function staffRoomView() {
    const r = (S.month.rooms || []).find(x => x.id === S.openRoom) || {}, R = loadRoom(S.openRoom);
    return `<button class="link back" data-act="roomclose">${ICON.chevL}${esc(S.month.dept.name)} 전체로</button>
      <div class="page-top"><div><p class="eyebrow">${esc(S.month.dept.name)}</p><h1>${esc(r.name || '')}</h1></div><p class="date">${todayLabel()}</p></div>
      ${!R ? '<p class="loading">불러오는 중…</p>' : `<section class="card">${cordHtml()}<div class="actions"><button class="btn" data-act="roomknot" data-v="${esc(r.id)}">${ICON.hands}이 ${esc(grp())}을 위해 기도하기</button></div>
        <p class="hint">리더·목사님 항목까지 보여요. "${esc(words().only)}" 항목은 보이지 않아요.</p></section>
        ${R.families.length ? `<div class="fam-grid">${R.families.map(famCard).join('')}</div>${famTlCard(R.families)}` : `<p class="hint">이 ${esc(grp())}에는 아직 ${words().members}이 없어요.</p>`}`}`;
  }
  // 목사님·장로님: 사랑방 가정 하나를 골라 기도 타임라인(설계서 S5). 돌봄 신호의 이름을 눌러도 여기로 온다
  function famTlCard(fams) {
    const id = fams.some(f => f.id === S.famTlId) ? S.famTlId : null, T = id && S.famTl && S.famTl.id === id ? S.famTl : null;
    return `<section id="famtl" style="margin-top:20px"><h2 class="section-title">${words().one}별 기도 타임라인</h2>
      <div class="mchips" style="margin-top:8px" role="radiogroup" aria-label="${words().one}">${fams.map(f => `<button class="mchip${f.id === id ? ' on' : ''}" role="radio" aria-checked="${f.id === id}" data-act="famtl" data-v="${esc(f.id)}">${esc(f.name)}</button>`).join('')}</div>

  async function loadFamTl(id) {

  // 목사님·장로님이 보는 사랑방 하나(목사님 홈에서 연 사랑방, 기도하기의 오늘의 사랑방). 한 번에 하나만 들고 있다
  function loadRoom(id) {

  // 섬기는 분들(설계서 S1): 사랑방 가정 아래 맨 끝에 점선 카드. 처음엔 접혀서 이름만, 누르면 부서 공개 기도제목이 펼쳐진다
  function serveCard() {

  }


  // 내 기도(시안과 같게): 왼쪽은 이번 달 내 기도제목(대상은 칩을 눌러 고르고, 공개 범위는 누를 때마다 바뀌고, 칸을 벗어나면 저장),
  //  오른쪽(휴대폰은 아래)은 새 기도제목 쓰기: 큰 칸에 쭉 써서 '항목으로 나누기' → 미리보기에서 빼기 → 추가하기
  // 처음 한 번만 보여 주는 안내: '알겠어요'를 누르면 이 기기에서는 다시 안 보여요
  // '이준건 · 정서연 가정 | 이준건': 가정 이름 안의 가운뎃점과 헷갈리지 않게 세로줄로 나눠요
  const famWho = (fam, person) => `${esc(fam)} 가정<span class="who-sep" aria-hidden="true"></span>${esc(person)}`;
  const tipOn = (k = 'scope') => { try { return !localStorage.getItem('koide-tip-' + k); } catch (e) { return false; } };
  function editLi(i, first) {

    return `<li class="edit s-${i.scope}"><fieldset ${i.pending ? 'disabled' : ''}>

      ${open ? `<div class="tgt-pick" role="group" aria-label="기도 대상 고르기"><div class="mchips">${targets.map(o => `<button class="mchip${o === i.target ? ' on' : ''}" aria-pressed="${o === i.target}" data-act="tgtpick" data-id="${esc(i.id)}" data-v="${esc(o)}">${esc(o)}</button>`).join('')}</div>

  function mineView() {

        ${ended.length ? `<div class="dropped"><p class="label">이번 달에 마친 기도제목</p>${ended.map(d => `<div class="drop-row"><span class="tgt">${esc(d.target)}</span><p class="drop-txt">${esc(d.text)}</p><button class="undo" data-act="reopen" data-id="${esc(d.id)}">되돌리기</button></div>`).join('')}</div>` : ''}
        ${mine.status === 'same' ? '<button class="btn wide ghost" data-act="confirm">이번 달도 그대로예요</button>' : `<p class="hint">${mine.status === 'confirmed' ? (staffMe() ? '이번 달도 그대로라고 표시했어요.' : '이번 달도 그대로라고 리더에게 알렸어요.') : '이번 달 기도제목을 손봤어요. 따로 제출할 필요 없어요.'}</p>`}
      </div>
      <div class="col side"><section class="card">
        <label class="label" for="add-t">새 기도제목 쓰기</label>

        ${tipOn('write') ? `<div class="coach" role="note"><p>한 줄에 하나씩 쓰면 나뉘어요. 카톡에 쓰던 글을 그대로 붙여 넣어도 돼요.</p><button data-act="tip" data-v="write">알겠어요</button></div>` : ''}
        <div class="actions"><button class="btn" data-act="split">항목으로 나누기</button><button class="link" data-act="sample">예시 넣어 보기</button></div>
        ${P ? `<div class="preview"><p class="hint">${P.length}개 항목으로 나눴어요. 앞에 쓴 이름표로 대상을 붙였어요. 빼야 할 줄은 ×를 눌러요.</p>
          <ul class="items">${P.map((x, k) => `<li class="item s-room"><span class="tgt">${esc(x.target)}</span><div class="item-body"><p class="txt">${esc(x.text)}</p></div><button class="rm-x" data-act="prevrm" data-v="${k}" aria-label="이 항목 빼기" title="빼기">${ICON.x}</button></li>`).join('')}</ul>
          <div class="actions"><button class="btn" data-act="addparts">추가하기</button><button class="btn ghost" data-act="unsplit">다시 쓰기</button></div></div>` : ''}
      </section></div></div>`;
  }
  function setTarget(id, target) {
    const i = itemOf(id); S.tgtOpen = null; if (!i || i.target === target) return render();
    i.target = target; i.same = false; render();
    const body = { id, target, text: i.text, scope: i.scope };
    save(() => api('saveItem', body));
  }
  // 새 기도제목 나누기: 가져오기와 같은 규칙(번호·글머리를 떼고, 형제ㅡ·이름표 줄로 대상을 정함). 이름표가 없는 줄은 글에서 대상을 짐작한다
  function splitDraft(text) {
    const mine = mineFam(), [a, b = ''] = solo() ? [S.me.person, ''] : mine.name.split(' · ');
    const fam = { a, b, kids: [...mine.kids] };
    const guess = t => { for (const k of mine.kids) if (t.includes(k)) return k;
      if (solo()) return /가족|엄마|아빠|부모|동생|언니|오빠|누나|형/.test(t) ? '가족' : /친구/.test(t) ? '친구' : /학교|직장|회사|시험|취업/.test(t) ? '학교·직장' : '나';
      return /남편|신랑/.test(t) ? '남편' : /아내|와이프/.test(t) ? '아내' : /부모님|어머니|아버지|시댁|친정|장인|장모|시어머니|시아버지/.test(t) ? '부모님' : '우리 가정'; };
    const clean = text.split('\n').filter(l => !/위해\s*기도합니다/.test(l)).join('\n');
    // 교역자는 우리 가정 → 함께, 남편 → 직분(목사님·장로님), 아내 → 사모님(장로님이면 배우자)
    const role = (S.month.me && S.month.me.role) || '목사님', staffT = { '우리 가정': '함께', '남편': role, '아내': role === '장로님' ? '배우자' : '사모님', '사모': '사모님', '목사': '목사님', '장로': '장로님', '전도사': '전도사님' };
    return splitItems(clean, fam, guess).map(x => ({ target: staffMe() ? staffT[x.target] || x.target : solo() && x.target === '우리 가정' ? '나' : x.target, text: x.text }));
  }


  // 리더 현황: 이번 달 가정마다 손봄 / 그대로 확인 / 지난달 그대로. "미작성"처럼 탓하는 말은 쓰지 않는다
  const STATUS = { edited: '이번 달 손봄', confirmed: '그대로 확인', same: '지난달 그대로' };
  const monthNum = () => Number(S.month.month.slice(5));
  const md = d => Number(d.slice(5, 7)) + '/' + Number(d.slice(8, 10));
  const remindText = () => monthNum() + '월 기도제목 앱에 한번 들어와 보세요. 바뀐 게 없으면 "이번 달도 그대로예요"만 눌러도 괜찮아요.\n' + location.origin + location.pathname;
  // 카톡방 문구: 지금 카톡방 형식 그대로. 남편은 형제, 아내는 자매, 우리 가정은 함께로 바꾸고
  //  형제 → 자매 → 자녀(가정에 적은 순서) → 그 밖(부모님 등) → 함께 순서. 사랑방 공개 항목만 담는다.
  //  개인 단위(청년부)는 "○○ 님을 위해", 나에 대한 항목을 먼저 이름표 없이 쓴다
  const SHARE_LABEL = { '남편': '형제', '아내': '자매', '우리 가정': '함께' };
  function shareText(f) {
    if (solo()) {
      const its = f.items.filter(i => i.scope === 'room' && !i.pending).sort((a, b) => (a.target === '나' ? 0 : 1) - (b.target === '나' ? 0 : 1));
      return f.name + ' 님을 위해 기도합니다' + (its.length ? '\n\n' + its.map(i => (i.target === '나' ? '' : i.target + 'ㅡ') + i.text).join('\n\n') : '');
    }
    const rank = t => t === '남편' ? 0 : t === '아내' ? 1 : f.kids.includes(t) ? 2 + f.kids.indexOf(t) / 100 : t === '우리 가정' ? 4 : 3;
    const its = f.items.filter(i => i.scope === 'room' && !i.pending).sort((a, b) => rank(a.target) - rank(b.target));
    return f.name.replace(' · ', ' ') + ' 가정을 위해 기도합니다' + (its.length ? '\n\n' + its.map(i => (SHARE_LABEL[i.target] || i.target) + 'ㅡ' + i.text).join('\n\n') : '');
  }
  // 자동 복사가 막힌 기기에서는 문구를 펼쳐서 길게 눌러 복사하게 한다
  const copyNote = (key, text) => S.copied && S.copied.key === key && !S.copied.ok
    ? `<p class="hint">자동 복사가 막혀 있어요. 아래 문구를 길게 눌러 복사하세요.</p><pre class="copybox">${esc(text)}</pre>` : '';
  async function copy(key, text) {
    let ok = false;
    try { await navigator.clipboard.writeText(text); ok = true; } catch (e) { /* 막힌 기기 */ }
    S.copied = { key, ok }; render();
    if (ok) toast('복사했어요. 카톡에 붙여 넣으세요.');
  }
  function statusCard() {
    const fams = S.month.families, by = k => fams.filter(f => f.status === k);

    return `<section class="card"><h2>${monthNum()}월 현황</h2>

      <ul class="legend"><li><i class="sw edited"></i>이번 달 손봄 ${e}</li><li><i class="sw confirmed"></i>그대로 확인 ${c}</li><li><i class="sw same"></i>지난달 그대로 ${s}</li></ul>
      ${group('same', `<button class="btn small ghost" data-act="copyremind">안부 문구 복사</button>${copyNote('remind', remindText())}`)}${group('edited')}${group('confirmed')}</section>`;
  }
  // 가정별 업데이트 이력: 지금 편성의 리더·코리더만(서버도 리더에게만 보낸다). 편성이 시작한 달부터 이번 달까지 칠한 칸만, 비율·순위는 없다
  const HIST_LABEL = { edited: '손봄', confirmed: '그대로 확인', same: '지난달 그대로', none: '기도제목 없음' };
  function histCard() {
    const H = S.pending && S.pending.history;
    if (!H || !H.rows.length) return '';
    const ms = H.months, y = m => m.slice(0, 4), n = m => Number(m.slice(5));
    const span = y(ms[0]) === y(ms[ms.length - 1]) ? `${y(ms[0])}년 ${n(ms[0])}${ms.length > 1 ? '~' + n(ms[ms.length - 1]) : ''}월` : `${y(ms[0])}년 ${n(ms[0])}월 ~ ${y(ms[ms.length - 1])}년 ${n(ms[ms.length - 1])}월`;

  }
  // 카톡방에 올릴 가정: 올린 지 오래된 가정부터(아직 안 올린 가정이 맨 앞). 맨 앞 가정을 "차례"로 골라 둔다
  function shareCard() {
    const P = S.pending, title = `<h2><span aria-hidden="true">💬 </span>카톡방에 올릴 ${words().one}</h2>`;
    if (!P) return `<section class="card">${title}<p class="hint">불러오는 중…</p></section>`;
    const posts = P.posts || {};

    if (!order.some(x => x.id === S.shareId)) S.shareId = up.id;  // 복사해서 순서가 바뀌어도 고른 가정은 그대로 둔다

      <div class="chips">${order.map(x => `<button class="chip-btn${x.id === f.id ? ' on' : ''}" data-act="sharepick" data-id="${x.id}" aria-pressed="${x.id === f.id}">${esc(x.name)}<small>${x === up ? '차례' : posts[x.id] ? md(posts[x.id]) + ' 올림' : '아직'}</small></button>`).join('')}</div>
      <pre class="share-text">${esc(text)}</pre>

  // ── 지난 기록 ────────────────────────────────────────
  // 사랑방: 달을 고르면 그 달에 우리 가정이 있던 사랑방의 기도제목(사랑방 공개, 그때 리더였으면 리더·목사님 항목까지).
  //  우리 가정: 달마다 우리 가정 기도제목 전부. 과거 기록은 그때 함께한 사람에게만 보인다(서버가 고른다)
  const monthLabel = (m, now) => (m.slice(0, 4) !== now.slice(0, 4) ? m.slice(0, 4) + '년 ' : '') + Number(m.slice(5)) + '월';

  function historyView() {

      <div class="seg fit" style="--n:3" role="tablist" aria-label="지난 기록 보기">${[['room', grp() + (staff ? '별' : '')], ['mine', words().mine], ['timeline', '기도 타임라인']].map(([k, l]) => `<button class="${tab === k ? 'on' : ''}" role="tab" aria-selected="${tab === k}" data-act="histtab" data-v="${k}">${l}</button>`).join('')}</div>`;

      ${staff && H.rooms ? (H.rooms.length ? `<div class="mchips" style="margin:10px 0 4px" role="radiogroup" aria-label="${esc(grp())}">${H.rooms.map(r => `<button class="mchip${r.id === H.roomId ? ' on' : ''}" role="radio" aria-checked="${r.id === H.roomId}" data-act="histroom" data-v="${esc(r.id)}">${esc(r.name)}</button>`).join('')}</div>` : '') : ''}

      ${H.families.length ? `<div class="fam-grid wide hist-grid">${H.families.map((f, k) => `<section class="card"><h3>${esc(f.name)}${f.own ? `<span class="me-tag">${words().mine}</span>` : ''}${f.role === '리더' || f.role === '코리더' ? `<span class="me-tag">${f.role}</span>` : ''}</h3>${histItems(f.items, H.month + '-' + k)}</section>`).join('')}</div>`

  // 기도 타임라인(우리 가정만 봄): 기도제목마다 처음 올린 달부터 마지막 달까지 한 줄. 이전 항목ID로 이어진 것을 서버가 묶어 준다.
  //  누르면 처음 올린 달의 우리 가정 카드로 가서 잠깐 강조한다
  const prevMon = m => { const [y, mo] = m.split('-').map(Number); return mo === 1 ? (y - 1) + '-12' : y + '-' + String(mo - 1).padStart(2, '0'); };
  //  F가 있으면 목사님·장로님이 보는 다른 가정의 타임라인(리더·목사님 항목까지). 줄을 눌러 가는 곳은 없다
  function timelineCard(H, F) {
    const T = H.threads || [], now = H.now;

    // 열은 가장 오래된 기도제목이 시작한 달부터 이번 달까지, 많아도 12달
    const oldest = T.reduce((a, t) => t.from < a ? t.from : a, now), cols = [now];

    return `<section class="card" style="margin-top:12px"><div class="row"><p class="label" style="margin:0">기도 타임라인${F ? ' · ' + esc(F) : ''}</p><span class="only">${ICON.lock}${F ? '목사님·장로님만' : esc(words().only) + ' 보여요'}</span></div>
      <p class="hint">지금 이어지는 기도제목 ${live.length}개${live.length ? ` · 가장 오래된 것은 ${Math.max(...live.map(len))}개월째예요` : ''}. ${F ? `리더·목사님 항목까지 보이고, "${esc(words().only)}" 항목은 빠져요.` : '기도제목을 누르면 처음 올린 달의 카드로 가요.'}</p>
      <div class="table-wrap"><table class="tl-table">
        <thead><tr><th scope="col"><span class="sr">기도제목</span></th>${cols.map(m => `<th scope="col"${m === now ? ' class="now"' : ''}>${Number(m.slice(5))}월</th>`).join('')}</tr></thead>
        <tbody>${rows.map(t => `<tr><th scope="row">${F ? `<span class="tl-go" title="${esc(t.text)}">${head(t)}</span>` : `<button class="tl-go" data-act="tlgo" data-v="${t.from}" title="${monthLabel(t.from, now)} 기도제목으로 가기: ${esc(t.text)}">${head(t)}</button>`}</th>${cols.map((m, k) => cell(t, m, k)).join('')}</tr>`).join('')}</tbody>
      </table></div>
      <ul class="legend"><li><i class="sw edited"></i>그 달에 올린 기도제목</li><li>마침: 이뤄졌거나 맡겨 둠 · 내림: 더 올리지 않음</li></ul></section>`;
  }
  async function loadHist(month) {

  // ── 표 보기·엑셀 내려받기 ──────────────────────────────
  // 이번 달 화면의 [카드 | 표]에서 표를 고르면 지금 구글 시트처럼 가정 | 기도제목 한 장으로 보인다.

        ${E.period === 'pick' ? (months.length ? `<div class="chips">${months.map(m => `<button class="chip-btn${E.month === m ? ' on' : ''}" data-act="exmonth" data-v="${m}" aria-pressed="${E.month === m}">${monthLabel(m, M.month)}</button>`).join('')}</div>` : `<p class="hint">${S.hist ? '아직 지난 달 기록이 없어요. 다음 달부터 고를 수 있어요.' : '달 목록을 불러오는 중…'}</p>`) : ''}
        ${isLead() ? `<label class="check"><input type="checkbox" data-act="exlead"${E.lead ? ' checked' : ''}> 리더·목사님 항목도 넣기</label>${E.lead ? '<p class="hint warn-text">파일은 다른 사람에게 전달될 수 있어요. 꼭 필요할 때만 넣으세요.</p>' : ''}` : ''}

    return `<section class="card print-area"><div class="row"><p class="label">${esc(M.room.name)} · ${M.month.slice(0, 4)}년 ${Number(M.month.slice(5))}월</p>
        <span class="actions print-hide"><button class="link" data-act="exprint">인쇄</button><button class="btn small ghost" data-act="exopen" aria-expanded="${E.open}">엑셀로 내려받기</button></span></div>
      ${panel}
      <div class="table-wrap"><table class="pray-table"><thead><tr><th scope="col">${solo() ? '이름' : '가정'}</th><th scope="col">기도제목</th></tr></thead>
        <tbody>${M.families.map(f => { const its = f.items.filter(i => !i.pending);
          return `<tr><th scope="row">${f.name.split(' · ').map(esc).join('<br>')}${f.own ? `<span class="me-tag">${words().mine}</span>` : ''}</th>
            <td>${its.length ? `<ul class="t-items">${its.map(i => `<li class="s-${i.scope}"><b>${esc(i.target)}</b> ${esc(i.text)}${i.scope !== 'room' ? ` <span class="b-scope ${i.scope}">${scopeName(i.scope)}</span>` : ''}</li>`).join('')}</ul>` : '<span class="hint">아직 올린 기도제목이 없어요</span>'}</td></tr>`; }).join('')}</tbody>
      </table></div></section>`;
  }
  // 파일 한 장(탭)에 들어갈 표: 제목, 가정 | "[대상] 내용"을 줄마다
  function sheetOf(room, month, fams, lead) {
    return { room, month, solo: solo(), title: room + ' · ' + month.slice(0, 4) + '년 ' + Number(month.slice(5)) + '월',
      rows: fams.map(f => ({ name: f.name, lines: f.items.filter(i => !i.pending && (i.scope === 'room' || (lead && i.scope === 'leader')))
        .map(i => '[' + i.target + '] ' + i.text + (i.scope === 'leader' ? ' (리더·목사님)' : '') + (i.ended ? ' (마침)' : '')) })) };
  }
  async function exportXlsx() {

    else {
      if (!S.hist) S.hist = await api('history', {});
      const list = E.period === 'pick' ? [E.month] : S.hist.months.filter(m => m.slice(0, 4) === M.month.slice(0, 4)).sort();
      if (!list[0]) return toast('내려받을 달을 골라 주세요.');
      for (const m of list) {
        if (m === M.month) { sheets.push(sheetOf(M.room.name, m, M.families, lead)); continue; }

  }
  // 엑셀(xlsx) 파일을 브라우저에서 바로 만든다. xlsx는 XML 파일 몇 개를 zip으로 묶은 것이라, 압축 없이(stored) 묶는다
  //  서식: 제목 굵게(가정·기도제목 두 칸 합침), 머리 행 회색, 칸 테두리, 기도제목 칸은 줄바꿈해서 보이게, 위 두 줄 고정
  const xml = v => String(v).replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c])).replace(/[\u0000-\u0008\u000B\u000C\u000E-\u001F]/g, '');
  const CRC = (() => { const t = new Uint32Array(256); for (let n = 0; n < 256; n++) { let c = n; for (let k = 0; k < 8; k++) c = c & 1 ? 0xEDB88320 ^ (c >>> 1) : c >>> 1; t[n] = c >>> 0; } return t; })();

      const name = enc.encode(f.name), data = enc.encode(f.data), crc = crc32(data);
      const h = head(0, 30); [[0, 0x04034b50, 4], [4, 20, 2], [6, 0x0800, 2], [8, 0, 2], [10, 0, 2], [12, 0x21, 2], [14, crc, 4], [18, data.length, 4], [22, data.length, 4], [26, name.length, 2], [28, 0, 2]]
        .forEach(([o, v, n]) => n === 4 ? h.setUint32(o, v, true) : h.setUint16(o, v, true));
      const c = head(0, 46); [[0, 0x02014b50, 4], [4, 20, 2], [6, 20, 2], [8, 0x0800, 2], [10, 0, 2], [12, 0, 2], [14, 0x21, 2], [16, crc, 4], [20, data.length, 4], [24, data.length, 4], [28, name.length, 2], [30, 0, 2], [32, 0, 2], [34, 0, 2], [36, 0, 2], [38, 0, 4], [42, off, 4]]

  function xlsxBlob(sheets) {

      </div><div class="col side"><section class="card"><p class="label" style="margin:0">오늘 기도할 순서${staffRoom ? ' · ' + esc((S.month.rooms.find(r => r.id === staffRoom) || {}).name || '') : ''}</p>
        <ol class="ps-list">${list.map(id => { const f = id.startsWith('f:') && famById(id.slice(2));
          return f ? `<li><span>${esc(f.name)}</span><span class="${f.today ? 'ok' : ''}">${f.today ? '오늘 ' + f.today + '번' : '아직'}</span></li>` : `<li><span>${esc(psPageName(id))}</span><span>${id === 'me' ? words().mine : id === 's' ? '함께 기억해요' : '하나님의 나라'}</span></li>`; }).join('')}</ol></section></div></div>`;
  }
  const psPageName = id => id.startsWith('f:') ? (famById(id.slice(2)) || {}).name || '' : id === 'me' ? words().mine : id === 's' ? '섬기는 분들' : id === 'c' ? '함께 섬기는 분들' : topicOf(id).name;
  // 받침에 맞춰 '와/과'로 잇는다(목사님 부부와 조믿음 장로님)
  const andJoin = L => L.map((x, k) => k === L.length - 1 ? x : x + ((c => c >= 0 && c % 28 ? '과' : '와')(x.charCodeAt(x.length - 1) - 0xAC00))).join(' ');
  const musicBtn = () => `<span class="pss-mus"><button class="pss-music${PSET.music ? ' on' : ''}" data-act="psmusic" aria-pressed="${PSET.music}">♪ <span class="trk">${PSET.music ? HYMNS[PSET.track].label : '음악 꺼짐'}</span></button>${PSET.music ? '<button class="pss-music" data-act="psnexttrack" aria-label="다음 곡">다음 곡 ›</button>' : ''}</span>`;
  function psHtml() {
    const ps = S.ps;
    if (ps.done) {
      const names = ps.prayed.map(id => (famById(id) || {}).name).filter(Boolean), n = names.length;
      return `<div class="pss-top"><span></span>${musicBtn()}</div>
        <div class="pss-body" style="justify-content:center"><p class="eyebrow">오늘의 기도</p><h2>${n ? n + words().count + '을 위해 기도했어요' : ps.extra.length ? '함께 기도했어요' : '오늘은 여기까지 해요'}</h2>
          ${n ? `<p>${names.map(esc).join(', ')}</p>` : ''}${ps.extra.filter(x => x !== 's' && x !== 'c').length ? `<p class="hint">함께 기도한 것 · ${ps.extra.filter(x => x !== 's' && x !== 'c').map(psPageName).map(esc).join(', ')}</p>` : ''}${ps.extra.includes('s') ? `<p class="hint">${esc(andJoin(serveList().map(s => s.label)))}도 함께 기억했어요</p>` : ''}${ps.extra.includes('c') ? '<p class="hint">리더와 동역자도 함께 기억했어요</p>' : ''}
          ${staffMe() ? roomCordHtml() : PSET.kinds.includes('room') || n ? cordHtml() : ''}</div>
        <div class="pss-nav one"><button data-act="psclose">마치기</button></div>`;
    }
    const id = ps.list[ps.i], last = ps.i === ps.list.length - 1, ready = ps.dur && ps.left === 0;
    const ring = ps.dur ? `<span class="pss-timer"><svg class="pss-ring" viewBox="0 0 100 100" aria-hidden="true"><circle cx="50" cy="50" r="44" class="track"/><circle cx="50" cy="50" r="44" class="bar" stroke-dasharray="276.5" stroke-dashoffset="${(276.5 * (1 - ps.left / ps.dur)).toFixed(1)}"/></svg><span id="pss-time">${fmtTime(ps.left)}</span></span>` : '';
    const top = `<div class="pss-top"><button class="pss-x" data-act="psend">끝내기</button><span class="pss-step">${ring}<span>${ps.i + 1} / ${ps.list.length}</span></span>${musicBtn()}</div>`;
    const li = (t, x) => `<li>${t ? `<span class="tgt">${esc(t)}</span>` : ''}<span>${esc(x)}</span></li>`;
    let body, pray;
    if (id.startsWith('f:')) {
      const f = famById(id.slice(2)) || { name: '', items: [], today: 0 }, capped = (f.today || 0) >= 3;
      body = `<h2>${esc(f.name)}</h2>${f.items.length ? `<ul>${f.items.map(i => li(i.target, i.text)).join('')}</ul>` : `<p class="hint">이번 달 기도제목이 아직 없어요. 이 ${words().one}을 떠올리며 기도해요.</p>`}`;
      pray = `<button class="pss-pray${ready ? ' ready' : ''}" data-act="pspray" ${capped ? 'disabled' : ''}>${capped ? ICON.check + ' 오늘은 여기까지' : ICON.hands.replace('<svg', '<svg width="20" height="20"') + ' 기도했어요'}</button>`;
    } else {
      if (id === 's') body = `<p class="eyebrow">섬기는 분들</p><h2>${esc(andJoin(serveList().map(s => s.label)))}</h2>${serveList().map(s => `<p class="label serve-who">${esc(s.label)}</p>${s.items.length ? `<ul>${s.items.map(i => li(i.target, i.text)).join('')}</ul>` : '<p class="hint">이번 달 기도제목이 아직 없어요. 이분들을 떠올리며 기도해요.</p>'}`).join('')}`;
      // 목사님·장로님: 함께 섬기는 분들. 사랑방마다 리더·코리더 이름, 본인을 뺀 섬기는 분들의 기도제목, 그 밖의 동역자 이름
      else if (id === 'c') { const others = serveList().filter(s => s.familyId !== S.month.me.familyId), mates = S.month.mates || [];
        const lead = r => [...(r.lead || r.leaders || []), ...(r.co || []).map(n => '코리더 ' + n)].join(', ');
        body = `<p class="eyebrow">함께 섬기는 분들</p><h2>리더와 동역자</h2><p class="label serve-who">${esc(grp())} 리더</p>
          <ul>${(S.month.rooms || []).map(r => li(r.name, lead(r) || '리더 미지정')).join('')}</ul>
          ${others.map(s => `<p class="label serve-who">${esc(s.label)}</p>${s.items.length ? `<ul>${s.items.map(i => li(i.target, i.text)).join('')}</ul>` : '<p class="hint">이번 달 기도제목이 아직 없어요.</p>'}`).join('')}
          ${mates.length ? `<p class="label serve-who">함께 섬기는 교역자</p><ul>${li('', andJoin(mates))}</ul>` : ''}`; }
      else if (id === 'me') { const m = S.month.families.find(f => f.own);
        body = `<p class="eyebrow">${words().mine}</p><h2>${esc(m.name)}</h2>${m.items.length ? `<ul>${m.items.map(i => li(i.target, i.text)).join('')}</ul>` : '<p class="hint">이번 달 기도제목이 아직 없어요.</p>'}`; }
      // 하나님의 나라: 오늘의 간구 문장 하나와 성경의 기도 하나만 보여 주고, 남은 시간은 "내 말로 이어서" 기도한다
      else { const t = topicOf(id), d = prayToday(t), line = ([x, r]) => `<li><span>${esc(x)}${r ? `<small class="pss-ref">${esc(r)}</small>` : ''}</span></li>`;
        body = `<p class="pss-lp">${t.lines.map(n => LORDS_PRAYER[n]).join(' ')}</p><p class="eyebrow">하나님의 나라</p><h2>${t.name}</h2><ul>${line(d.a)}${line(d.b)}</ul><p class="pss-next">${esc(d.next)}</p>`; }
      pray = `<button class="pss-pray${ready ? ' ready' : ''}" data-act="psextra">${ICON.hands.replace('<svg', '<svg width="20" height="20"')} 기도했어요</button>`;
    }
    const cd = ps.cd ? `<div class="pss-cd" role="status"><span><b id="pss-cd">${ps.cd}</b>초 뒤 ${last ? '마쳐요' : '다음 장으로 넘어가요'}</span><button data-act="psstay">머무르기</button></div>` : '';
    return `${top}<div class="pss-body">${body}</div><div class="pss-nav trio"><button data-act="psprev"${ps.i ? '' : ' disabled'}>이전</button><button data-act="psnext">${last ? '마치기' : '다음'}</button>${pray}${cd}</div>`;
  }
  // 한 장에 머무는 시간: 줄어드는 고리와 숫자. 다 되면 '기도했어요'가 부드럽게 반짝인다
  //  '저절로 다음 장으로'(flow)를 켰으면 3초 세고 기도한 것으로 세어 넘어간다. '머무르기'를 누르면 그 장에서는 멈춘다
  let psTimer = null;
  function psTick() {
    clearInterval(psTimer);
    const ps = S.ps; if (!ps || ps.done || !ps.dur) return;
    psTimer = setInterval(() => {
      if (S.ps !== ps || ps.done) return clearInterval(psTimer);
      if (ps.cd) {
        if (--ps.cd) { const c = document.getElementById('pss-cd'); if (c) c.textContent = ps.cd; return; }
        clearInterval(psTimer); psMark(); return psGo(ps.i + 1);
      }
      ps.left = Math.max(0, ps.left - 1);
      const t = document.getElementById('pss-time'), bar = document.querySelector('.pss-ring .bar');
      if (t) t.textContent = fmtTime(ps.left);
      if (bar) bar.setAttribute('stroke-dashoffset', (276.5 * (1 - ps.left / ps.dur)).toFixed(1));
      if (!ps.left) {
        if (ps.flow && !ps.stay) { ps.cd = 3; return psRender(); }
        clearInterval(psTimer); const b = document.querySelector('.pss-pray'); if (b) b.classList.add('ready');
      }
    }, 1000);
  }
  // 읽던 자리를 지키며 다시 그린다
  const psRender = () => { const P = $('#pss'), y = P.scrollTop; render(); P.scrollTop = y; };
  // 지금 장을 기도한 것으로 센다: 사랑방 가정은 기도했어요(하루 3번까지), 다른 장은 함께 기도한 것
  function psMark() {
    const ps = S.ps, id = ps.list[ps.i];
    if (id.startsWith('f:')) {
      const f = famById(id.slice(2)); if (!f || (f.today || 0) >= 3) return false;
      if (ps.prayed.indexOf(f.id) < 0) ps.prayed.push(f.id);
      prayFor(f);
    } else if (ps.extra.indexOf(id) < 0) ps.extra.push(id);
    return true;
  }
  // 저절로 내려 보기(flow): 화면보다 긴 장만. 처음 몇 초는 머물고, 시간의 70%가 될 때까지 천천히 끝까지 내린 뒤 남은 시간은 맨 아래에 둔다
  //  손가락·마우스 휠·키보드로 화면을 만지면 그 장에서는 멈춘다
  let psRaf = 0;
  function psScroll() {
    cancelAnimationFrame(psRaf);
    const ps = S.ps; if (!ps || ps.done || !ps.flow) return;
    const P = $('#pss'), hold = Math.min(8, ps.dur * .1) * 1000, end = ps.dur * 700;
    const step = () => {
      if (S.ps !== ps || ps.done || ps.held) return;
      const t = Date.now() - ps.pt0, max = P.scrollHeight - P.clientHeight;
      if (max > 4 && t > hold) P.scrollTop = Math.round(max * Math.min(1, (t - hold) / (end - hold)));
      if (t < end) psRaf = requestAnimationFrame(step);
    };
    psRaf = requestAnimationFrame(step);
  }
  ['touchstart', 'wheel', 'mousedown', 'keydown'].forEach(e => $('#pss').addEventListener(e, () => { if (S.ps) S.ps.held = true; }, { passive: true }));
  function psGo(i) {
    const ps = S.ps; ps.seen = Math.max(ps.seen || 1, Math.min(i + 1, ps.list.length));
    if (i >= ps.list.length) { ps.done = true; clearInterval(psTimer); }
    else { Object.assign(ps, { i, left: ps.dur, cd: 0, stay: false, held: false, pt0: Date.now() }); }
    render(); $('#pss').scrollTop = 0; psTick(); psScroll();
  }
  // 모임 모드(설계서 S1): 모임 때 화면에 크게 띄워 한 가정씩 넘긴다. 사랑방 공개 항목만 나와서 회원 누구나 열 수 있다.
  //  가정을 다 넘기면 마지막 장에서 주기도문으로 함께 마친다
  const meetFams = () => S.month.families;
  function meetHtml() {
    const M = S.month, fams = meetFams(), i = S.meet, n = fams.length, w = words().one;
    const head = `${esc(M.room.name)} · ${Number(M.month.slice(5))}월 기도제목`;
    const nav = (prev, next, act) => `<div class="pss-nav"><button data-act="meetprev"${prev ? '' : ' disabled'}>이전 ${w}</button><button class="pss-pray" data-act="${act}">${next}</button></div>`;
    if (i >= n) return `<div class="pss-top"><span class="pss-step">${head} · 함께 마치기</span><button class="pss-x" data-act="meetclose">닫기</button></div>
      <div class="pss-body lp"><p class="eyebrow">주기도문으로 함께 마쳐요</p><p class="lp-text">${LORDS_PRAYER.map(x => `<span>${x}</span>`).join(' ')}</p></div>
      ${nav(n > 0, '마치기', 'meetclose')}`;
    const f = fams[i], its = f.items.filter(x => x.scope === 'room' && !x.pending);
    return `<div class="pss-top"><span class="pss-step">${head} · ${i + 1} / ${n}</span><button class="pss-x" data-act="meetclose">닫기</button></div>
      <div class="pss-body"><h2>${esc(f.name)}</h2>
        ${its.length ? `<ul>${its.map(x => `<li><span class="tgt">${esc(SHARE_LABEL[x.target] || x.target)}</span><span>${esc(x.text)}</span></li>`).join('')}</ul>` : '<p class="hint">아직 올린 기도제목이 없어요.</p>'}</div>
      <p class="m-hint">${esc(grp())} 공개 기도제목만 나와요. 키보드 왼쪽·오른쪽 화살표로도 넘길 수 있어요.</p>
      ${nav(i > 0, i === n - 1 ? '주기도문으로 마치기' : '다음 ' + w, 'meetnext')}`;
  }
  function meetGo(i) { S.meet = Math.max(0, Math.min(meetFams().length, i)); S.meetSeen = Math.max(S.meetSeen || 1, S.meet + 1); render(); $('#pss').scrollTop = 0; }
  // 기도하는 동안 화면이 꺼지지 않게(되는 기기에서만)
  let wake = null;
  const wakeOn = () => { try { navigator.wakeLock.request('screen').then(w => { wake = w; }).catch(() => {}); } catch (e) { /* 안 되는 기기 */ } };
  const wakeOff = () => { try { if (wake) wake.release(); } catch (e) { /* 무시 */ } wake = null; };
  // '기도했어요': 화면은 먼저 늘리고 서버에는 뒤에서 적는다. 서버가 돌려준 이번 달·오늘 횟수로 맞춘다
  function prayFor(f) {
    f.today = (f.today || 0) + 1; f.prayed++;
    // 목사님·장로님: 그 사랑방 매듭을 이번 주 기도한 것으로(청장년부 기도의 끈)
    if (staffMe() && S.room && S.room.families.indexOf(f) >= 0) { const r = (S.month.rooms || []).find(x => x.id === S.room.room.id); if (r) r.week = true; }
    render();
    api('pray', { familyId: f.id }).then(r => {
      const g = famById(f.id) || f;
      if (r.today != null) { g.today = r.today; g.prayed = r.prayed; }
      if (r.capped && S.tab === 'home') toast('이 ' + words().one + '은 오늘 충분히 기도했어요. 내일 또 기도해 주세요.');
      paint();
    }).catch(err => { const g = famById(f.id) || f; g.today--; g.prayed--; paint(); oops(err); });
  }

  // 잔잔한 음악: 찬송가 1~8장(송영) 연주 파일. 운영자가 만든 파일을 app/music/hymn-01.mp3 ~ hymn-08.mp3에 둔다(config.js의 MUSIC으로 위치를 바꿀 수 있다)
  //  곡은 소리 장치(Web Audio)로 직접 이어서 튼다. "기도 시작"을 누를 때 한 번 열어 두면, 곡이 끝나 다음 곡으로 넘어갈 때 휴대폰이 막지 않는다
  //  아이폰 무음 스위치가 켜져 있어도 들리게 재생용 소리로 알리고, 받아 올 수 없으면 audio 요소로 튼다
  const HYMNS = Array.from({ length: 8 }, (_, i) => ({ label: (i + 1) + '장', file: (CFG.MUSIC || 'music/') + 'hymn-' + String(i + 1).padStart(2, '0') + '.mp3' }));
  const Music = (() => {
    let ctx = null, node = null, gain = null, token = 0;
    const cache = {}, player = new Audio(); player.preload = 'auto';
    function unlock() {
      try { if (navigator.audioSession) navigator.audioSession.type = 'playback'; } catch (e) { /* 무시 */ }
      try { if (!ctx) ctx = new (window.AudioContext || window.webkitAudioContext)(); if (ctx.state !== 'running') ctx.resume(); } catch (e) { ctx = null; }
    }
    const label = () => document.querySelectorAll('.pss-music .trk').forEach(e => { e.textContent = HYMNS[PSET.track].label; });
    const ended = () => { if (!PSET.music || !S.ps) return; play(PSET.auto ? (PSET.track + 1) % HYMNS.length : PSET.track); label(); };
    const load = i => cache[i] || (cache[i] = fetch(HYMNS[i].file).then(r => { if (!r.ok) throw new Error('no file'); return r.arrayBuffer(); })
      .then(buf => new Promise((ok, bad) => ctx.decodeAudioData(buf, ok, bad))).catch(e => { delete cache[i]; throw e; }));
    function stopNode() {
      if (!node || !ctx) return;
      const n = node, g = gain; node = null; gain = null; n.onended = null;
      g.gain.cancelScheduledValues(ctx.currentTime); g.gain.setValueAtTime(g.gain.value, ctx.currentTime); g.gain.linearRampToValueAtTime(0, ctx.currentTime + .6);
      try { n.stop(ctx.currentTime + .7); } catch (e) { /* 이미 멈춤 */ }
    }
    player.addEventListener('ended', () => { if (!node) ended(); });
    function play(i) {
      stopNode(); player.pause(); PSET.track = i; savePset();
      const my = ++token, file = () => { player.src = HYMNS[i].file; player.currentTime = 0; player.play().catch(() => {}); };
      if (!ctx) return file();
      load(i).then(buf => {
        if (my !== token) return;
        gain = ctx.createGain(); gain.gain.setValueAtTime(0, ctx.currentTime); gain.gain.linearRampToValueAtTime(.8, ctx.currentTime + 1);
        node = ctx.createBufferSource(); node.buffer = buf; node.connect(gain).connect(ctx.destination);
        node.onended = () => { if (my === token) { node = null; ended(); } };
        node.start();
        load((i + 1) % HYMNS.length).catch(() => {});
      }).catch(() => { if (my === token) file(); });
    }
    return { unlock, play, off() { token++; stopNode(); player.pause(); } };
  })();

  // ── 기존 시트 가져오기(관리자) ──────────────────────────
  // 구글 시트에서 복사한 글을 표로 바꾼다: 칸은 탭, 줄 바꿈이 든 칸은 "로 감싸고 안의 "는 ""로 쓴다
  function parseTSV(t) {
    const rows = [[]]; let cell = '', q = false;
    for (let i = 0; i < t.length; i++) {
      const ch = t[i];
      if (q) { if (ch === '"') { if (t[i + 1] === '"') { cell += '"'; i++; } else q = false; } else cell += ch; }
      else if (ch === '"' && cell === '') q = true;
      else if (ch === '\t') { rows[rows.length - 1].push(cell); cell = ''; }
      else if (ch === '\n' || ch === '\r') { if (ch === '\r' && t[i + 1] === '\n') i++; rows[rows.length - 1].push(cell); cell = ''; rows.push([]); }
      else cell += ch;
    }
    rows[rows.length - 1].push(cell);
    return rows;
  }
  // 사랑방 탭 하나 → { room, families: [{ a, b, kids, items: [{ target, text }] }] }
  //  맨 위 "○○ 사랑방" 칸이 사랑방 이름이고, [이름 칸][기도제목 칸]이 한 줄에 여러 쌍 있다. 이름은 "남편/아내"
  function readSheet(t) {
    const rows = parseTSV(t), cells = rows.flat().map(x => x.trim());
    const room = cells.find(x => /사랑방/.test(x) && x.length <= 20 && !/\n/.test(x)) || '';
    const families = [];
    rows.forEach(r => r.forEach((c, i) => {
      const name = c.trim(), text = (r[i + 1] || '').trim();
      if (!name || !text || /\n/.test(name) || name.length > 25 || /사랑방|기도제목/.test(name)) return;
      if (name.indexOf('/') < 0 && text.length < 10) return;
      const [a, b = ''] = name.split('/').map(x => x.trim());
      const fam = { a, b, kids: [] };
      fam.items = splitItems(text, fam);
      families.push(fam);
    }));
    return { room, families };
  }
  // 성을 뺀 이름(김도윤 → 도윤). 기도제목 안에서는 이름만 쓰는 분이 많다
  const given = n => /^[가-힣]{3,4}$/.test(n) ? n.slice(1) : n;
  const RELATION = /부모|어머|아버|시댁|친정|가족|동생|형님|누나|언니|오빠|할머|할아|조부|장인|장모|시아|사위|며느리/;
  // 이름표 → 대상. 형제·남편 이름은 남편, 자매·아내 이름은 아내, 가정·함께는 우리 가정, 그 밖의 이름은 그대로(자녀 등)
  function targetOf(label, fam) {
    const l = label.replace(/\s*\([^)]*\)\s*$/, '').trim();
    if (/^(형제|남편)$/.test(l)) return '남편';
    if (/^(자매|아내)$/.test(l)) return '아내';
    if (/^(가정|함께|우리\s*가정|가족)$/.test(l)) return '우리 가정';
    if (/^(양가\s*)?부모님$/.test(l)) return '부모님';
    const is = n => n && (l === n || l === given(n) || l.indexOf(n) === 0);
    if (is(fam.a)) return '남편';
    if (is(fam.b)) return '아내';
    return l;
  }
  const KNOWN = /^(형제|자매|남편|아내|가정|함께|우리\s*가정|가족|양가\s*부모님|부모님)$/;
  const LABEL = '([^\\s\\d:：ㅡ\\-–—.]{1,8}(?:\\s[^\\s\\d:：ㅡ\\-–—.]{1,4})?(?:\\s*\\([^)]{1,8}\\))?)';
  const INLINE = new RegExp('^' + LABEL + '\\s*(?:ㅡ|:|：|-|–|—)\\s*(.+)$'), HEAD = new RegExp('^' + LABEL + '\\s*(?:ㅡ|:|：|-|–|—)?$');
  // 이 줄이 이름표로 시작하는지: 아는 호칭·가정 사람 이름은 언제나, 모르는 이름은 "다엘(8세)"처럼 나이가 붙었거나
  //  "요엘- …"처럼 4자 이하 + 구분 기호가 있을 때만(문장 첫 낱말을 이름으로 잘못 보지 않게)
  function labelOf(s, fam) {
    const m = s.match(INLINE) || s.match(HEAD), head = !s.match(INLINE);
    if (!m) return null;
    const raw = m[1].trim(), age = /\(/.test(raw), bare = raw.replace(/\s*\([^)]*\)$/, '');
    const target = targetOf(raw, fam), known = KNOWN.test(bare) || target === '남편' || target === '아내';
    if (!known && !age && (head || /\s/.test(bare) || bare.length > 4)) return null;
    if (!known && !RELATION.test(bare) && fam.kids.indexOf(target) < 0) fam.kids.push(target);
    return { target, rest: head ? '' : m[2].trim(), head };
  }
  // 기도제목 칸 → 항목들. 번호(1.)·글머리(-)는 떼고, 이름표가 있으면 대상을 바꾼다.
  //  "형제ㅡ…" 바로 다음 줄이 이름표 없이 이어지면 앞 항목에 붙이고, 이름표만 있는 줄 아래 줄들은 하나씩 그 대상의 항목이 된다
  function splitItems(text, fam, guess) {
    const out = []; let cur = null, open = false;
    text.split('\n').forEach(line => {
      let s = line.trim();
      if (!s) { open = false; return; }
      const numbered = /^\d+\s*[.)]/.test(s); s = s.replace(/^\d+\s*[.)]\s*/, '');
      const bullet = /^[-•·*]\s*/.test(s); s = s.replace(/^[-•·*]\s*/, '');
      if (!s) return;
      const lab = labelOf(s, fam);
      if (lab && lab.head) { cur = lab.target; open = false; }
      else if (lab) { cur = lab.target; out.push({ target: cur, text: lab.rest }); open = true; }

          <button class="link danger" data-act="impdrop" data-v="${fi}.${ii}" style="margin-left:auto">빼기</button></div><p style="margin:0;font-size:.92em">${esc(it.text)}</p></div>`).join('')}</section>`).join('')}
