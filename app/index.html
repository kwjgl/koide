<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>코이데</title>
<meta name="theme-color" content="#2B6A62">
<!-- 홈 화면 앱(PWA): 홈 화면에 두면 주소창 없이 앱처럼 열린다. 아이폰은 apple- 줄들을 본다 -->
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="코이데">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 24 24%22%3E%3Ccircle cx=%2212%22 cy=%2212%22 r=%2212%22 fill=%22%232B6A62%22/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Gowun+Batang:wght@700&family=IBM+Plex+Sans+KR:wght@400;500;600&display=swap">
<style>
/* 시안(prototype/index.html)의 색과 글꼴을 그대로 쓴다. 실제 앱은 핵심 흐름만: 로그인 → 연결 → 이번 달 / 내 기도 / 더보기 */
:root {
  --page: #F3F5F2; --surface: #FFFFFF; --surface-2: #EEF2EF;
  --ink: #1B2523; --ink-2: #5B6965; --line: #DDE4E0; --line-strong: #B9C4BF;
  --accent: #2B6A62; --accent-mid: #8DBDB5; --accent-soft: #DCEBE7; --on-accent: #FFFFFF;
  --leader: #62519E; --leader-soft: #ECE7F7; --private: #E8ECEA;
  --warn: #9A5A14; --warn-soft: #F5E8D6; --shadow: rgba(20, 35, 32, .14);
  --neu-hi: rgba(255, 255, 255, .9); --neu-lo: rgba(20, 35, 32, .17);
  --base: 16px;
  --f-display: 'Gowun Batang', 'AppleMyungjo', 'Batang', serif;
  --f-body: 'IBM Plex Sans KR', 'Apple SD Gothic Neo', 'Malgun Gothic', sans-serif;
}
@media (prefers-color-scheme: dark) { :root:not([data-mode="light"]) {
  --page: #141B19; --surface: #1C2522; --surface-2: #232D2A;
  --ink: #E5ECE9; --ink-2: #9CAAA5; --line: #2D3935; --line-strong: #4A5853;
  --accent: #7CC2B7; --accent-mid: #3F7C73; --accent-soft: #1E3934; --on-accent: #0F1A18;
  --leader: #B6A8EA; --leader-soft: #2A2442; --private: #252E2B;
  --warn: #E2A563; --warn-soft: #3A2C1B; --shadow: rgba(0, 0, 0, .5); --neu-hi: rgba(255, 255, 255, .06); --neu-lo: rgba(0, 0, 0, .6); color-scheme: dark; } }
/* 화면 모드: 기기 설정이면 기기를 따르고, '밝게'·'어둡게'를 고르면 그대로(data-mode) */
:root[data-mode="dark"] {
  --page: #141B19; --surface: #1C2522; --surface-2: #232D2A;
  --ink: #E5ECE9; --ink-2: #9CAAA5; --line: #2D3935; --line-strong: #4A5853;
  --accent: #7CC2B7; --accent-mid: #3F7C73; --accent-soft: #1E3934; --on-accent: #0F1A18;
  --leader: #B6A8EA; --leader-soft: #2A2442; --private: #252E2B;
  --warn: #E2A563; --warn-soft: #3A2C1B; --shadow: rgba(0, 0, 0, .5); --neu-hi: rgba(255, 255, 255, .06); --neu-lo: rgba(0, 0, 0, .6); color-scheme: dark; }
/* 글씨: 휴대폰·태블릿 16px, PC 15px. 큰 글씨 모드는 약 1.2배 */
@media (min-width: 1000px) { :root { --base: 15px; } }
:root[data-big] { --base: 19px; }
@media (min-width: 1000px) { :root[data-big] { --base: 18px; } }
/* 색 테마(초록은 위 기본값). 시안의 THEMES와 같은 값: 밝은 화면 / 어두운 화면 */
:root[data-accent="amber"] { --page:#F7F2EA;--surface:#FFFDF9;--surface-2:#F1EADF;--ink:#2A221B;--ink-2:#6E6155;--line:#E6DCCD;--line-strong:#C9B9A3;--accent:#A9561B;--accent-mid:#E2B07F;--accent-soft:#F6E3CF;--on-accent:#FFFFFF;--private:#EFE8DE; }
@media (prefers-color-scheme: dark) { :root[data-accent="amber"]:not([data-mode="light"]) { --page:#1A1612;--surface:#231E19;--surface-2:#2B241E;--ink:#EEE6DC;--ink-2:#AE9F8E;--line:#3A3129;--line-strong:#5A4D41;--accent:#E9A066;--accent-mid:#8A5A32;--accent-soft:#3A2818;--on-accent:#1E140C;--private:#2E2721; } }
:root[data-accent="amber"][data-mode="dark"] { --page:#1A1612;--surface:#231E19;--surface-2:#2B241E;--ink:#EEE6DC;--ink-2:#AE9F8E;--line:#3A3129;--line-strong:#5A4D41;--accent:#E9A066;--accent-mid:#8A5A32;--accent-soft:#3A2818;--on-accent:#1E140C;--private:#2E2721; }
:root[data-accent="blue"] { --page:#F2F4F8;--surface:#FFFFFF;--surface-2:#EAEEF4;--ink:#1B2230;--ink-2:#5A6475;--line:#DCE2EB;--line-strong:#B6C0CF;--accent:#2F5D95;--accent-mid:#93AFD3;--accent-soft:#DCE6F3;--on-accent:#FFFFFF;--private:#E8EBF0; }
@media (prefers-color-scheme: dark) { :root[data-accent="blue"]:not([data-mode="light"]) { --page:#12161D;--surface:#1A2029;--surface-2:#212833;--ink:#E4E9F0;--ink-2:#9AA5B5;--line:#2C3542;--line-strong:#485466;--accent:#8EB4E6;--accent-mid:#3C5B85;--accent-soft:#1D2C42;--on-accent:#0E1622;--private:#232A35; } }
:root[data-accent="blue"][data-mode="dark"] { --page:#12161D;--surface:#1A2029;--surface-2:#212833;--ink:#E4E9F0;--ink-2:#9AA5B5;--line:#2C3542;--line-strong:#485466;--accent:#8EB4E6;--accent-mid:#3C5B85;--accent-soft:#1D2C42;--on-accent:#0E1622;--private:#232A35; }
:root[data-accent="rose"] { --page:#F8F2F3;--surface:#FFFDFD;--surface-2:#F2E8EA;--ink:#2A1E21;--ink-2:#6E5B60;--line:#E8DADD;--line-strong:#CDB6BC;--accent:#A8435C;--accent-mid:#DDA2B1;--accent-soft:#F5DFE5;--on-accent:#FFFFFF;--private:#F0E7E9; }
@media (prefers-color-scheme: dark) { :root[data-accent="rose"]:not([data-mode="light"]) { --page:#1A1416;--surface:#231B1E;--surface-2:#2B2226;--ink:#EEE3E6;--ink-2:#B09CA2;--line:#3A2D31;--line-strong:#5A464C;--accent:#E896AB;--accent-mid:#86475A;--accent-soft:#3B2029;--on-accent:#200E14;--private:#2E2428; } }
:root[data-accent="rose"][data-mode="dark"] { --page:#1A1416;--surface:#231B1E;--surface-2:#2B2226;--ink:#EEE3E6;--ink-2:#B09CA2;--line:#3A2D31;--line-strong:#5A464C;--accent:#E896AB;--accent-mid:#86475A;--accent-soft:#3B2029;--on-accent:#200E14;--private:#2E2428; }
:root[data-accent="ink"] { --page:#F4F4F2;--surface:#FFFFFF;--surface-2:#EDEDEA;--ink:#1D1D1B;--ink-2:#62625E;--line:#E0E0DC;--line-strong:#BDBDB7;--accent:#33332F;--accent-mid:#A3A39C;--accent-soft:#E6E6E1;--on-accent:#FFFFFF;--private:#ECECE8; }
@media (prefers-color-scheme: dark) { :root[data-accent="ink"]:not([data-mode="light"]) { --page:#141414;--surface:#1D1D1C;--surface-2:#252524;--ink:#ECECE8;--ink-2:#A3A39E;--line:#30302E;--line-strong:#4D4D4A;--accent:#E2E2DC;--accent-mid:#6A6A65;--accent-soft:#2E2E2C;--on-accent:#141414;--private:#262625; } }
:root[data-accent="ink"][data-mode="dark"] { --page:#141414;--surface:#1D1D1C;--surface-2:#252524;--ink:#ECECE8;--ink-2:#A3A39E;--line:#30302E;--line-strong:#4D4D4A;--accent:#E2E2DC;--accent-mid:#6A6A65;--accent-soft:#2E2E2C;--on-accent:#141414;--private:#262625; }
* { box-sizing: border-box; }
html, body { margin: 0; }
/* 휴대폰을 가로로 돌려도 브라우저가 글씨를 저절로 키우지 않게 */
html { -webkit-text-size-adjust: 100%; text-size-adjust: 100%; }
body { background: var(--page); color: var(--ink); font-family: var(--f-body); font-size: var(--base); line-height: 1.55; -webkit-tap-highlight-color: transparent; }
button, input, textarea, select { font: inherit; color: inherit; }
/* 틀(시안과 같게): 휴대폰·태블릿은 상단 바(배지·설정) + 하단 바(아이콘만), PC(1000px 이상)는 메뉴가 상단 바로 올라가고 2단 */
.ic { width: 1em; height: 1em; fill: none; stroke: currentColor; stroke-width: 1.5; stroke-linecap: round; stroke-linejoin: round; flex: none; }
.wrap { width: 100%; max-width: 1160px; margin: 0 auto; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
.topbar { position: sticky; top: 0; z-index: 20; background: var(--surface); border-bottom: 1px solid var(--line); padding-top: env(safe-area-inset-top, 0px); transition: transform .25s ease; }
.topbar .wrap { display: flex; align-items: center; gap: .6em; min-height: 3.4em; position: relative; }
.brand { display: inline-flex; align-items: center; gap: .45em; background: none; border: 0; padding: .3em 0; color: var(--ink); cursor: pointer; min-height: 44px; }
.brand-mark { width: 1.6em; height: 1.6em; border-radius: 50%; background: var(--accent); color: var(--on-accent); display: grid; place-items: center; }
.brand-mark .ic { width: .95em; height: .95em; }
.brand-name { font-family: var(--f-display); font-size: 1.05em; font-weight: 700; white-space: nowrap; }
.topnav { display: none; gap: .2em; margin-left: 1.2em; }
.topnav button { font-size: .92em; background: none; border: 0; color: var(--ink-2); padding: .5em .9em; border-radius: 10px; cursor: pointer; min-height: 40px; }
.topnav button.on { background: var(--accent-soft); color: var(--accent); font-weight: 600; }
.spacer { flex: 1; }
.badge-btn { display: inline-flex; align-items: center; gap: .4em; font-size: .8em; font-weight: 600; color: var(--ink); background: var(--surface-2); border: 1px solid var(--line); border-radius: 999px; padding: .35em .5em .35em .85em; min-height: 38px; cursor: pointer; white-space: nowrap; }
.role-tag { font-size: .86em; padding: .15em .6em; border-radius: 999px; background: var(--surface); color: var(--ink-2); border: 1px solid var(--line); }
.role-tag.leader { color: var(--leader); border-color: var(--leader); background: var(--leader-soft); }
.role-tag.admin { color: var(--on-accent); background: var(--accent); border-color: var(--accent); }
.icon-btn { width: 44px; height: 44px; display: grid; place-items: center; background: none; border: 0; border-radius: 12px; color: var(--ink); cursor: pointer; flex: none; }
.icon-btn .ic { width: 1.35em; height: 1.35em; }
.icon-btn[aria-expanded="true"] { background: var(--surface-2); }
.menu { position: absolute; top: calc(100% + 6px); right: max(16px, env(safe-area-inset-right, 0px)); width: min(300px, calc(100vw - 32px)); background: var(--surface); border: 1px solid var(--line); border-radius: 16px; box-shadow: 0 16px 40px -12px var(--shadow); padding: .5em; display: flex; flex-direction: column; gap: .1em; z-index: 25; }
.mlabel { font-size: .72em; font-weight: 600; color: var(--ink-2); margin: .6em .7em .3em; }
.mitem { display: flex; justify-content: space-between; align-items: center; gap: .6em; width: 100%; text-align: left; font-size: .9em; color: var(--ink); background: none; border: 0; border-radius: 10px; padding: .55em .7em; min-height: 44px; cursor: pointer; text-decoration: none; }
.mitem:hover { background: var(--surface-2); }
.mitem.static { cursor: default; flex-direction: column; align-items: flex-start; gap: .1em; }
.mitem.static:hover { background: none; }
.mitem small { font-size: .82em; color: var(--ink-2); }
.swatches { display: flex; gap: .55em; margin: .2em .4em .4em; flex-wrap: wrap; }
.swatch { width: 40px; height: 40px; border-radius: 50%; padding: 0; border: 2px solid transparent; background: none; cursor: pointer; display: grid; place-items: center; }
.swatch i { width: 28px; height: 28px; border-radius: 50%; display: block; box-shadow: inset 0 0 0 1px rgba(0, 0, 0, .12); }
.swatch.on { border-color: var(--ink); }
.menu .seg { margin: 0 .3em .3em; }
.card .swatches { margin: .6em 0 0; }
.set-row { display: flex; justify-content: space-between; align-items: center; gap: 12px; }
.mdiv { height: 1px; background: var(--line); margin: .35em .3em; }
@media (max-width: 420px) { .brand-name { display: none; } }
/* 스크롤을 내리면 상단 바와 하단 바가 함께 숨고, 조금이라도 올리면 다시 보인다 */
body.hide-bars .topbar { transform: translateY(-100%); }
body.hide-bars .tabs { transform: translateY(100%); }
@media (prefers-reduced-motion: reduce) { .topbar, .tabs { transition: none; } }
main.wrap { padding-top: 14px; padding-bottom: calc(110px + env(safe-area-inset-bottom)); }
/* 화면 제목 줄: 왼쪽 사랑방·제목, 오른쪽 날짜와 버튼 */
.page-top { display: flex; justify-content: space-between; align-items: flex-end; gap: 12px; }
.who-sep { display: inline-block; width: 1px; height: .9em; background: currentColor; opacity: .45; margin: 0 .6em; vertical-align: -.1em; }
  .eyebrow { margin-top: 0; }
.page-top-r { display: flex; flex-direction: column; align-items: flex-end; gap: 6px; }
.date { font-size: .76em; color: var(--ink-2); margin: 0; white-space: nowrap; }
/* 기기별 배치: 휴대폰 한 줄, 태블릿 가정 카드 2열, PC 2단(본문 + 오른쪽 고정 칸) */
.home-grid, .two-col { display: grid; gap: 14px; align-items: start; margin-top: 12px; }
.col { display: flex; flex-direction: column; gap: 12px; min-width: 0; }
.col > .card, .fam-grid > .card { margin: 0; }
.fam-grid { display: grid; gap: 12px; align-items: start; grid-template-columns: minmax(0, 1fr); }
.section-title { font-size: .9em !important; font-weight: 600; color: var(--ink-2); margin: 8px 2px 0 !important; }
@media (max-width: 999px) {
  /* 이번 달: '지금 함께 기도할 가정'과 아래 기도 카드들 사이를 선으로 나눈다 */
  .home-grid { gap: 0; }
  .home-grid .side { padding-bottom: 22px; margin-bottom: 22px; border-bottom: 1px solid var(--line-strong); }
}
@media (min-width: 640px) {
  .fam-grid { grid-template-columns: repeat(2, minmax(0, 1fr)); }
}
@media (min-width: 1000px) {
  .topnav { display: flex; }
  .tabs { display: none !important; }
  main.wrap { padding-top: 28px; padding-bottom: 56px; }
  h1 { font-size: 2em; }
  .home-grid { grid-template-columns: minmax(0, 1fr) 340px; gap: 24px; }
  /* 오른쪽 칸은 따로 스크롤하지 않는다. 화면보다 길면 화면과 함께 내려가다가 칸의 끝이 보이면 거기서 붙는다(stickSide가 top을 정한다) */
  .home-grid .side { grid-column: 2; grid-row: 1; position: sticky; top: calc(4.4em + env(safe-area-inset-top, 0px)); }
  .home-grid .main { grid-column: 1; grid-row: 1; }
  .two-col { grid-template-columns: minmax(0, 1fr) 380px; gap: 24px; }
  .two-col .side { position: sticky; top: calc(4.4em + env(safe-area-inset-top, 0px)); }
  .fam-grid.wide { grid-template-columns: repeat(3, minmax(0, 1fr)); }
  .card { padding: 1.15em 1.25em; }
}
html { scroll-padding-bottom: calc(80px + env(safe-area-inset-bottom)); }
fieldset { border: 0; padding: 0; margin: 0; min-width: 0; }
h1 { font-family: var(--f-display); font-size: 1.65em; line-height: 1.3; margin: .3em 0 .2em; }
h2 { font-size: 1.05em; margin: 0; }
.eyebrow { font-size: .8em; color: var(--ink-2); margin: 1em 0 0; }
.hint { font-size: .82em; color: var(--ink-2); margin: .4em 0 0; }
.card { background: var(--surface); border: 1px solid var(--line); border-radius: 16px; padding: 16px; margin: 12px 0; }
.row { display: flex; justify-content: space-between; align-items: center; gap: .6em; }
.btn { display: inline-flex; align-items: center; justify-content: center; gap: .4em; min-height: 44px; padding: 0 1.1em; border-radius: 12px; border: 1px solid var(--accent); background: var(--accent); color: var(--on-accent); font-weight: 600; cursor: pointer; }
.btn.ghost { background: transparent; color: var(--accent); }
/* 리더: 이번 달 현황과 카톡방에 올릴 가정 */
.big-num { font-size: 1.8em; font-weight: 600; margin: .2em 0 .3em; font-variant-numeric: tabular-nums; }
.big-num small { font-size: .45em; color: var(--ink-2); font-weight: 400; }
.bar { display: flex; height: 12px; border-radius: 999px; overflow: hidden; gap: 2px; }
.bseg.edited, .sw.edited { background: var(--accent); }
.bseg.confirmed, .sw.confirmed { background: var(--accent-mid); }
.bseg.same, .sw.same { background: var(--line-strong); }
/* 목사님 홈: 부서 숫자와 사랑방마다 이번 달 현황 */
.stats { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; text-align: center; }
.stat b { display: block; font-size: 1.6em; font-weight: 600; font-variant-numeric: tabular-nums; }
.stat span { font-size: .78em; color: var(--ink-2); }
.room-board { display: grid; grid-template-columns: repeat(auto-fill, minmax(240px, 1fr)); gap: 12px; }
.room-sum { font: inherit; color: inherit; text-align: left; cursor: pointer; display: flex; flex-direction: column; gap: 8px; width: 100%; }
.room-sum .row { display: flex; align-items: center; justify-content: space-between; gap: 8px; }
.room-sum .hint { margin: 0; }
/* 돌봄 신호: 오래된 순 목록 */
.signals { list-style: none; margin: 10px 0 6px; padding: 0; }
.signals li { padding: .6em 0; border-top: 1px solid var(--line); display: flex; flex-wrap: wrap; align-items: baseline; gap: .2em .5em; }
.signals li:first-child { border-top: 0; }
.signals small { flex-basis: 100%; color: var(--ink-2); }
.sig-go { font-weight: 600; color: var(--ink); min-height: 0; padding: 0; text-align: left; }
.sig-tag { font-size: .75em; font-weight: 600; color: var(--leader); background: var(--leader-soft); border-radius: 999px; padding: .15em .7em; }
.legend { list-style: none; margin: .6em 0 0; padding: 0; display: flex; flex-wrap: wrap; gap: .3em 1em; font-size: .78em; color: var(--ink-2); }
.sw { display: inline-block; width: .8em; height: .8em; border-radius: 3px; margin-right: .35em; vertical-align: -.05em; }
.sw.hollow { border: 1.5px solid var(--line-strong); box-sizing: border-box; }
/* 리더: 가정별 업데이트 이력(가정 × 월). 칠한 칸만 있고 비율·순위는 없다 */
.hist-table { border-collapse: separate; border-spacing: 4px; font-size: .84em; margin: 6px 0 0; }
.hist-table th { font-weight: 500; color: var(--ink-2); text-align: center; font-size: .86em; font-variant-numeric: tabular-nums; white-space: nowrap; }
.hist-table th.now { color: var(--accent); font-weight: 700; }
.hist-table tbody th { position: sticky; left: 0; background: var(--surface); text-align: left; color: var(--ink); padding-right: .5em; font-size: .92em; }
.hist-table td { padding: 0; }
/* 이달의 그림 모으기: 그림, 크게 보기, 달마다 모은 그림(시안과 같은 규칙) */
.pasture { display: block; width: 100%; height: auto; aspect-ratio: 32 / 15; border-radius: 14px; overflow: hidden; background: #F6C9A0; }
.pop-in { transform-box: fill-box; transform-origin: 50% 100%; animation: ps-pop .7s cubic-bezier(.3,1.6,.5,1) both; }
@keyframes ps-pop { 0% { transform: scale(0); } 100% { transform: scale(1); } }
/* 그림 크게 보기 */
.ps-frame { position: relative; cursor: zoom-in; }
/* 크게 보기: 그림을 덜 가리게 글자 없이 아이콘만 */
.ps-big { position: absolute; right: 8px; bottom: 8px; display: inline-grid; place-items: center; font: inherit; font-size: .72em;

/* 잔잔한 움직임: 아주 작고 느리게. 동작 줄이기를 켠 기기에서는 멈춘다 */

.mv-breathe { animation: ps-breathe 4s ease-in-out infinite; }

/* 한 줄에 둘을 놓아 폭이 좁으니, 하루 다 채운 뒤의 3/3은 뺀다('오늘은 여기까지'로 이미 알 수 있어서) */
.pray-row .pray.hero:disabled .pray-n { display: none; }
.pray-row .btn.next { flex: none; width: 6.2em; min-height: 0; border-radius: 14px; padding: 0 .6em; line-height: 1.25; text-align: center; }
/* 사랑방 가정 줄: 제목과 범례, 오른쪽에 카드 | 표 */
.section-row { display: flex; justify-content: space-between; align-items: center; gap: .6em; margin-top: .2em; }
.section-row .section-title { margin: 0 .2em !important; }
.sr-title { display: flex; align-items: baseline; gap: .6em; flex-wrap: wrap; }
.sr-legend { font-size: .74em; color: var(--ink-2); white-space: nowrap; }
/* 관리 화면: [관리 | 분석] */
.admin-seg { max-width: 320px; margin: 0 0 14px; }
/* 분석: 한눈에(비율 막대·주별 막대)와 달마다 흐름·칸 그림 */
.ov { display: flex; flex-direction: column; gap: .9em; }
.ov > .row, .ov-row > .row { justify-content: space-between; align-items: baseline; gap: .6em; }
.ov-row { display: flex; flex-direction: column; gap: .35em; }
.ov-row > .row b { font-variant-numeric: tabular-nums; white-space: nowrap; }
.ov-row > .row b small { font-weight: 400; color: var(--ink-2); margin-left: .3em; font-size: .8em; }
.ov-row .hint, .ov-note, .ov > .hint { margin: 0; }
.wk-bars { display: grid; grid-template-columns: repeat(8, minmax(0, 1fr)); gap: .35em; align-items: end; }
.wk { display: flex; flex-direction: column; align-items: center; justify-content: flex-end; gap: .2em; min-width: 0; }
.wk-bar { width: 70%; max-width: 2.2em; background: color-mix(in srgb, var(--accent) 55%, transparent); border-radius: 6px 6px 2px 2px; min-height: 4px; flex: none; }
.wk.now .wk-bar { background: repeating-linear-gradient(135deg, var(--accent) 0 4px, color-mix(in srgb, var(--accent) 45%, transparent) 4px 8px); }
.wk-n { font-size: .68em; color: var(--ink-2); font-variant-numeric: tabular-nums; }
.wk-d { font-size: .66em; color: var(--ink-2); white-space: nowrap; }
.wk.now .wk-d { color: var(--ink); font-weight: 600; }
.an-grid { display: grid; gap: 12px; }
.an-side { display: grid; gap: 12px; min-width: 0; align-content: start; }
@media (min-width: 1000px) { .an-grid { grid-template-columns: 1fr 1fr; align-items: start; } }
.an-sec { display: flex; flex-direction: column; gap: .7em; min-width: 0; }
.an-sec .hint, .an-sec .label { margin: 0; }
.an-pair { display: grid; gap: 1em; }
@media (min-width: 560px) { .an-pair { grid-template-columns: 1fr 1fr; } }
.an-mini { display: flex; flex-direction: column; gap: .4em; min-width: 0; }
.an-mini > .row { justify-content: space-between; align-items: baseline; gap: .5em; font-size: .9em; }
.an-cols { display: grid; grid-template-columns: repeat(6, minmax(0, 1fr)); gap: 2px; align-items: end; border-bottom: 1px solid var(--line); }
.an-col { display: flex; flex-direction: column; align-items: center; justify-content: flex-end; gap: .25em; min-width: 0; }
.an-bar { width: 62%; max-width: 1.8em; background: color-mix(in srgb, var(--accent) 45%, var(--surface)); border-radius: 4px 4px 0 0; }
.an-col.now .an-bar { background: var(--accent); }
.an-v { font-size: .66em; color: var(--ink-2); font-variant-numeric: tabular-nums; }
.an-col.now .an-v { color: var(--ink); font-weight: 600; }
.an-x { font-size: .66em; color: var(--ink-2); padding-bottom: .2em; }
.tr-cols { grid-template-columns: repeat(12, minmax(0, 1fr)); margin-top: 10px; }
.tr-bar { width: 62%; max-width: 1.6em; display: flex; flex-direction: column-reverse; border-radius: 4px 4px 0 0; overflow: hidden; }
.tr-e { background: var(--accent); }
.tr-c { background: var(--accent-mid); }
.an-scroll { overflow-x: auto; }
.an-heat { border-collapse: separate; border-spacing: 2px; width: 100%; font-size: .78em; font-variant-numeric: tabular-nums; }
.an-heat th { font-weight: 600; color: var(--ink-2); padding: .25em .3em; white-space: nowrap; }
.an-heat thead th { font-size: .9em; text-align: center; }
.an-heat tbody th { text-align: left; }
.an-heat td { text-align: center; padding: .55em .2em; border-radius: 4px; color: var(--ink); min-width: 2.2em; }
.an-heat td[data-dark] { color: var(--on-accent); font-weight: 600; }
.an-heat td.an-na { background: transparent; color: var(--ink-2); }
.an-heat th small { display: block; font-weight: 400; font-size: .85em; }
.td-etc { list-style: none; margin: .3em 0 0; padding: 0; display: flex; flex-direction: column; gap: .4em; font-size: .9em; }
.td-etc li { display: flex; gap: .5em; align-items: baseline; }
.td-etc .tgt { flex: none; font-size: .78em; }
.td-words { display: flex; flex-wrap: wrap; gap: 6px; margin: 10px 0 0; }
.td-word { font: inherit; font-size: .82em; border: 1px solid var(--line); background: var(--surface-2); color: var(--ink); border-radius: 999px; padding: .25em .75em; min-height: 32px; cursor: pointer; }
.an-head { margin: 22px 2px 10px !important; display: flex; align-items: baseline; gap: .6em; }
.an-sub { margin-top: .4em !important; padding-top: .9em; border-top: 1px solid var(--line); }
.an-hbars { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: .45em; font-size: .86em; }
.an-hbars li { display: grid; grid-template-columns: minmax(6.5em, 38%) 1fr 2.6em; align-items: center; gap: .6em; }
.an-hbars .an-l { color: var(--ink-2); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.an-track { height: 10px; background: var(--surface-2); border-radius: 0 4px 4px 0; }
.an-fill { display: block; height: 100%; background: var(--accent); border-radius: 0 4px 4px 0; }
.an-hbars b { text-align: right; font-variant-numeric: tabular-nums; font-weight: 600; }
.an-tiles { grid-template-columns: repeat(3, 1fr); row-gap: 12px; }
.an-tiles .stat b { font-size: 1.3em; }
.seg2 { display: grid; grid-template-columns: repeat(2, 1fr); gap: 3px; padding: 3px; background: var(--surface-2); border-radius: 10px; border: 1px solid var(--line); }
.seg2 button { font-size: .8em; border: 0; border-radius: 8px; padding: .3em 1em; min-height: 34px; background: transparent; color: var(--ink-2); cursor: pointer; }
.seg2 button.on { background: var(--surface); color: var(--ink); font-weight: 600; box-shadow: 0 1px 3px var(--shadow); }
/* 표 보기: 지금 구글 시트처럼 가정 | 기도제목 한 장 */
.table-wrap { overflow-x: auto; margin: 0 -.2em; }
/* 기도 타임라인: 기도제목마다 처음 올린 달부터 마지막 달까지 한 줄 */
.tl-table { border-collapse: collapse; width: 100%; font-size: .88em; }
.tl-table thead th { font-size: .8em; color: var(--ink-2); font-weight: 500; text-align: center; padding: 0 0 .4em; font-variant-numeric: tabular-nums; white-space: nowrap; }
.tl-table thead th.now { color: var(--accent); font-weight: 700; }
.tl-table tbody th { text-align: left; font-weight: 400; padding: .35em .5em .35em 0; width: 11em; max-width: 11em; }
.tl-go { display: flex; align-items: center; gap: .4em; width: 100%; background: none; border: 0; padding: .2em 0; font: inherit; color: var(--ink); text-align: left; cursor: pointer; min-height: 36px; }
.tl-go:hover .tl-text { color: var(--accent); text-decoration: underline; text-underline-offset: 3px; }
.tl-text { display: inline-block; max-width: 7.5em; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; vertical-align: middle; }
.tl-cell { position: relative; height: 34px; min-width: 2.4em; text-align: center; border-top: 1px solid var(--line); }
.tl-cell.on::before { content: ''; position: absolute; top: 50%; left: 0; right: 0; height: 8px; margin-top: -4px; background: var(--accent-mid); }
.tl-cell.start::before { left: 50%; }
.tl-cell.end::before { right: 50%; }
.tl-cell.start.end::before { display: none; }
.tl-cell.on::after { content: ''; position: absolute; left: 50%; top: 50%; width: 12px; height: 12px; margin: -6px 0 0 -6px; border-radius: 50%; background: var(--accent); }
.tl-end { font-size: .74em; color: var(--ink-2); white-space: nowrap; }
.only { display: inline-flex; align-items: center; gap: .25em; font-size: .75em; color: var(--ink-2); white-space: nowrap; }
.only svg { width: 1.1em; height: 1.1em; }
/* 연도 개편 마법사 */
.stepper { list-style: none; margin: 0 0 12px; padding: 0; display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: .4em; }
.stepper li { display: flex; flex-direction: column; gap: .3em; font-size: .76em; color: var(--ink-2); border-top: 3px solid var(--line); padding-top: .45em; }
.stepper li b { font-family: var(--f-display); font-size: 1.2em; }
.stepper li.done { border-color: var(--accent-mid); }
.stepper li.on { border-color: var(--accent); color: var(--ink); font-weight: 600; }
.rg-text { min-height: 12em; font-size: .86em; line-height: 1.6; resize: vertical; font-variant-numeric: tabular-nums; }
.sum-chips { display: flex; flex-wrap: wrap; gap: .5em; }
.sum-chip { display: inline-flex; align-items: baseline; gap: .35em; font-size: .84em; padding: .35em .8em; border-radius: 999px; background: var(--surface-2); color: var(--ink-2); }
.sum-chip b { font-size: 1.15em; color: var(--ink); font-variant-numeric: tabular-nums; }
.sum-chip.ok { background: var(--accent-soft); }
.sum-chip.warn { background: var(--warn-soft); }
.sum-chip.warn b { color: var(--warn); }
.rg-row { display: flex; justify-content: space-between; align-items: center; gap: .6em; flex-wrap: wrap; border-top: 1px solid var(--line); padding: .6em 0 0; margin-top: .6em; }
.rg-row > div:first-child { display: flex; flex-direction: column; gap: .1em; min-width: 0; }
.rg-row small { font-size: .76em; color: var(--ink-2); }
.rg-match summary { cursor: pointer; font-size: .9em; font-weight: 600; color: var(--accent); min-height: 28px; }
.comp { display: flex; flex-wrap: wrap; gap: .3em; margin: .4em 0; }
.comp-chip { font-size: .72em; padding: .15em .6em; border-radius: 999px; background: var(--surface-2); color: var(--ink-2); font-variant-numeric: tabular-nums; }
.rg-fams { list-style: none; margin: .4em 0 0; padding: 0; font-size: .9em; }
.rg-fams li { padding: .25em 0; display: flex; gap: .4em; align-items: baseline; flex-wrap: wrap; }
.rg-fams small { color: var(--ink-2); font-size: .8em; }
.mv-table { width: 100%; border-collapse: collapse; font-size: .88em; min-width: 320px; }
.mv-table th, .mv-table td { text-align: left; padding: .45em .5em; border-top: 1px solid var(--line); }
.mv-table thead th { font-size: .8em; color: var(--ink-2); font-weight: 600; border-top: 0; }
.mv-table tbody th { font-weight: 500; }
.mv-table td.to { color: var(--accent); font-weight: 600; }
.mv-table td.muted { color: var(--ink-2); }
.rg-dates { display: grid; gap: 10px; }
.rg-dates label { display: flex; flex-direction: column; gap: .3em; font-size: .9em; font-weight: 600; }
.card.hl { animation: hl-flash 2.4s ease-out; }
@keyframes hl-flash { 0%, 40% { box-shadow: 0 0 0 4px var(--accent-mid); } 100% { box-shadow: 0 0 0 4px transparent; } }
@media (prefers-reduced-motion: reduce) { .card.hl { animation: none; box-shadow: 0 0 0 3px var(--accent-mid); } }
.pray-table { width: 100%; border-collapse: collapse; font-size: .9em; table-layout: fixed; }
.pray-table th, .pray-table td { border-top: 1px solid var(--line); padding: .6em .5em; text-align: left; vertical-align: top; }
.pray-table thead th { font-size: .78em; color: var(--ink-2); font-weight: 600; border-top: 0; background: var(--surface-2); }
.pray-table thead th:first-child, .pray-table tbody th { width: 5.2em; }
.pray-table tbody th { font-weight: 600; word-break: keep-all; line-height: 1.45; }
.pray-table tbody th .me-tag { display: block; margin: .2em 0 0; }
.pray-table td { overflow-wrap: anywhere; }
.t-items { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: .35em; line-height: 1.5; }
.t-items b { font-weight: 600; color: var(--accent); margin-right: .2em; }
.t-items li.s-leader { border-left: 3px solid var(--leader); padding-left: .5em; }
.t-items li.s-family { background: var(--private); border-radius: 8px; padding: .2em .5em; }
.export { display: flex; flex-direction: column; gap: .55em; background: var(--surface-2); border-radius: 12px; padding: .8em; }
.export .seg { margin: 0; background: var(--surface); }
.check { display: flex; align-items: center; gap: .5em; font-size: .92em; cursor: pointer; }
.check input { width: 1.2em; height: 1.2em; accent-color: var(--accent); }
/* 소그룹 이름 바꾸기: 설명과 예를 한 줄씩(줄바꿈 없이) */
.grp-ren { align-items: flex-start; }
.grp-ren > span { display: flex; flex-direction: column; gap: .15em; min-width: 0; }
.grp-ren > span > * { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.grp-ren small { margin: 0; font-size: .9em; }
.warn-text { color: var(--warn); }
@media print {
  body { background: #fff; }
  .topbar, .demo, .tabs, .toast, .home-grid .side, .home-grid .main > :not(.print-area), .page-top-r, .export, .print-hide { display: none !important; }
  .home-grid { display: block; }
  .wrap { max-width: none; padding: 0; }
  .print-area { border: 0; padding: 0; }
  .table-wrap { overflow: visible; }
  .pray-table { font-size: 10pt; }
  .pray-table tr { break-inside: avoid; }
}
/* 내 기도(시안과 같게): 왼쪽 내 기도제목 목록, 오른쪽 새 기도제목 쓰기 */
.notice { background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: .8em 1em; margin: 0; font-size: .84em; line-height: 1.55; }
.edit-list { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: .7em; }
.edit-list .edit { margin: 0; padding: .8em; display: flex; flex-direction: column; gap: .5em; }
.edit-list .edit fieldset { display: flex; flex-direction: column; gap: .5em; }
.edit-list .edit-top { justify-content: space-between; flex-wrap: wrap; margin: 0; }
.tgt-btn, .scope-btn { font-size: .76em; font-weight: 600; border-radius: 999px; padding: .3em .85em; min-height: 36px; display: inline-flex; align-items: center; gap: .3em; cursor: pointer; border: 1px solid var(--line); background: var(--surface-2); color: var(--ink); }
.tgt-btn.open { border-color: var(--accent); color: var(--accent); }
.tgt-btn.open .ic { transform: rotate(180deg); }
.scope-btn.s-leader { color: var(--leader); border-color: var(--leader); background: var(--leader-soft); }
.scope-btn.s-family { background: var(--surface); }
.tgt-pick { display: flex; flex-direction: column; gap: .5em; background: var(--surface-2); border-radius: 10px; padding: .6em .65em; }
.mchips { display: flex; flex-wrap: wrap; gap: .35em; }
.mchip { font-size: .76em; border-radius: 999px; padding: .2em .8em; min-height: 34px; border: 1px solid var(--line); background: var(--surface); color: var(--ink); cursor: pointer; }
.mchip.on { background: var(--accent); border-color: var(--accent); color: var(--on-accent); font-weight: 600; }
.kid-form { display: flex; gap: .4em; }
.kid-form .field { flex: 1; min-width: 0; min-height: 40px; font-size: .86em; }
.edit-list .edit-foot { margin: 0; }
.state { font-size: .74em; color: var(--ink-2); }
.foot-acts { display: flex; gap: 1em; }
.link.quiet { color: var(--ink-2); font-weight: 500; }
.del-ask { display: flex; flex-direction: column; gap: .5em; padding: .7em .8em; border-radius: 10px; background: var(--warn-soft); }
.del-ask p { margin: 0; font-size: .84em; }
.btn.danger { background: var(--warn); border-color: var(--warn); color: var(--on-accent); }
.dropped { display: flex; flex-direction: column; gap: .5em; padding: .8em .9em; border-radius: 12px; border: 1px dashed var(--line-strong); }
.drop-row { display: grid; grid-template-columns: auto minmax(0, 1fr) auto; align-items: start; gap: .5em; font-size: .84em; color: var(--ink-2); }
.drop-row .tgt { font-size: .82em; font-weight: 600; padding: .2em .6em; border-radius: 999px; background: var(--surface-2); border: 1px solid var(--line); white-space: nowrap; }
.drop-txt { margin: .15em 0 0; line-height: 1.5; overflow-wrap: anywhere; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
.undo { font-size: .9em; font-weight: 600; white-space: nowrap; color: var(--accent); background: var(--surface); border: 1px solid var(--line); border-radius: 999px; padding: .2em .8em; min-height: 32px; cursor: pointer; }
.preview { border-top: 1px dashed var(--line-strong); padding-top: .8em; display: flex; flex-direction: column; gap: .6em; }
.rm-x { flex: none; display: inline-grid; place-items: center; width: 32px; height: 32px; margin: -.2em -.3em 0 0; border: 0; border-radius: 50%; background: transparent; color: var(--ink-2); cursor: pointer; }
.rm-x:hover, .rm-x:focus-visible { background: var(--warn-soft); color: var(--warn); }
.coach { position: relative; margin-top: .3em; background: var(--ink); color: var(--page); border-radius: 12px; padding: .7em .8em; display: flex; align-items: flex-start; gap: .7em; font-size: .86em; line-height: 1.5; }
.coach::before { content: ''; position: absolute; top: -6px; right: 2.6em; width: 12px; height: 12px; background: var(--ink); transform: rotate(45deg); border-radius: 2px; }
.coach p { margin: 0; flex: 1; }
.coach button { flex: none; font-weight: 600; font-size: .92em; color: var(--page); background: transparent; border: 1px solid color-mix(in srgb, var(--page) 45%, transparent); border-radius: 999px; padding: .2em .8em; min-height: 32px; cursor: pointer; }
.page-top .saved { color: var(--accent); font-weight: 600; font-size: .76em; white-space: nowrap; }
/* 더보기(시안과 같게): 우리 가정 정보, 역할 메뉴 카드(사랑방 현황·관리), 홈 화면에 두기, 로그아웃 */
.menu-card { flex-direction: row; justify-content: space-between; align-items: center; text-align: left; color: var(--ink); cursor: pointer; width: 100%; margin: 0; }
.menu-card > span { display: flex; flex-direction: column; gap: .15em; }
.menu-card b { font-weight: 600; }
.menu-card small { font-size: .76em; color: var(--ink-2); }
.menu-card .ic { width: 1.2em; height: 1.2em; color: var(--ink-2); }
.rm-head { display: flex !important; flex-direction: row !important; align-items: center; gap: .5em; }
.rm-feats { display: flex !important; flex-direction: row !important; flex-wrap: wrap; gap: .3em; margin-top: .35em; }
.rm-feats span { font-size: .7em; color: var(--ink-2); background: var(--surface-2); border-radius: 999px; padding: .15em .6em; }
.kids { display: flex; flex-wrap: wrap; gap: .4em; }
.kid { display: inline-flex; align-items: center; gap: .35em; font-size: .86em; background: var(--surface-2); border: 1px solid var(--line); border-radius: 999px; padding: .2em .75em .2em .3em; }
.kid small { display: grid; place-items: center; width: 1.5em; height: 1.5em; border-radius: 50%; background: var(--surface); font-size: .76em; color: var(--ink-2); }
.plain-form { display: flex; flex-direction: column; gap: .5em; }
.kid-list { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: .3em; }
.kid-list li { display: flex; align-items: center; gap: .5em; }
.kl-num { width: 1.6em; height: 1.6em; border-radius: 50%; display: grid; place-items: center; background: var(--surface-2); font-size: .78em; color: var(--ink-2); }
.kl-name { flex: 1; }
.icon-btn.sm { width: 36px; height: 36px; }
.ok { color: var(--accent); }
.link.back { display: inline-flex; align-items: center; gap: .2em; margin-bottom: .2em; }
/* 지난 기록 */
.seg.fit { display: inline-grid; grid-template-columns: repeat(var(--n, 3), auto); margin-top: 14px; }
.seg.fit button { padding-left: 1.4em; padding-right: 1.4em; }
@media (max-width: 480px) { .seg.fit { display: grid; } .seg.fit button { padding-left: .6em; padding-right: .6em; white-space: nowrap; } }
.hist-grid { margin-top: 12px; }
.hist-grid h3 { margin: 0 0 .5em; }
.hist-chips { display: flex; gap: 6px; overflow-x: auto; padding: 2px 0 8px; margin: 10px 0 4px; scrollbar-width: none; }
.hist-chips .chip-btn { flex: none; }
.items li.ended { color: var(--ink-2); }

.mrow[aria-expanded="true"] .ops-chev { transform: rotate(180deg); }
.mset { display: flex; flex-direction: column; gap: 12px; padding: .2em 0 .9em; }
.chg-list { list-style: none; margin: 0; padding: 0; }
.chg-list li { display: flex; flex-direction: column; gap: .1em; padding: .55em 0; border-top: 1px solid var(--line); font-size: .92em; }
.chg-list li:first-child { border-top: 0; }
.chg-list small { color: var(--ink-2); font-size: .85em; }
.rs-links { list-style: none; margin: 0; padding: 0; }
.rs-links li { display: flex; justify-content: space-between; align-items: center; gap: .6em; padding: .3em 0; }
.rs-links small { color: var(--ink-2); }
.ga-acts { flex-basis: 100%; margin-top: .4em; }
.ch-grid { display: grid; gap: 12px; grid-template-columns: minmax(0, 1fr); }
@media (min-width: 640px) { .ch-grid { grid-template-columns: repeat(2, minmax(0, 1fr)); } }
.ch-dept { display: flex; flex-direction: column; gap: .4em; text-align: left; color: inherit; font: inherit; cursor: pointer; margin: 0; }
.ch-dept .row { width: 100%; justify-content: flex-start; gap: .5em; }
.ch-dept .row .ic { margin-left: auto; color: var(--ink-2); }
.ch-dept small { color: var(--ink-2); font-size: .85em; }
.ch-dept.closed { opacity: .7; }
.ch-todos { display: flex; flex-wrap: wrap; gap: .3em; }
.ch-todo { font-size: .76em; font-weight: 600; color: var(--warn); background: var(--warn-soft); border-radius: 999px; padding: .15em .6em; }
.ch-todo.warn { color: var(--ink-2); background: var(--surface-2); }
.folds { padding-top: 0; padding-bottom: 0; }
.fold + .fold { border-top: 1px solid var(--line); }
.fold > .mrow { border-top: 0; }
.fold-body { padding: 0 0 1em; display: flex; flex-direction: column; gap: .6em; }
.fold-body > .row:first-child:empty { display: none; }
.ops-fold { padding: .8em 0; }
.ops-fold .ops-rows { margin-top: .6em; }
.more-out { align-self: center; margin: 4px auto 8px; display: block; }
.badge-dot { position: absolute; top: 2px; right: 2px; width: 8px; height: 8px; border-radius: 50%; background: var(--warn); }
.mitem.on span { font-weight: 700; }
.rs-rooms, .rs-people { list-style: none; margin: 0; padding: 0; }
.rs-room { border-top: 1px solid var(--line); }
.rs-room:first-child { border-top: 0; }
.rs-head, .rs-p { display: flex; align-items: center; gap: .5em; width: 100%; background: none; border: 0; padding: .7em 0; color: inherit; font: inherit; text-align: left; cursor: pointer; }
.rs-head b { flex: 1; }
.rs-head small, .rs-p small { color: var(--ink-2); font-size: .85em; }
.rs-head[aria-expanded="true"] .ops-chev { transform: rotate(180deg); }
.rs-people { margin: 0 0 .6em; padding-left: .8em; border-left: 2px solid var(--accent-soft); }
.rs-p { padding: .5em 0; flex-wrap: wrap; }
.rs-p > span:first-child { font-weight: 500; }
.rs-p small { margin-left: auto; }
.rs-people li.on { background: var(--surface-2); border-radius: 10px; padding: 0 .6em .6em; margin: .2em 0; }
.rs-acts { display: flex; flex-direction: column; gap: .6em; padding-top: .2em; }
.rs-acts .label { margin: 0; }
.rs-foot { flex-wrap: wrap; padding: .2em 0 .8em; }
.rs-form { margin: .3em 0 .8em; }
.fam-rec { display: flex; flex-wrap: wrap; align-items: center; gap: .3em 1em; margin: .9em 0 0; padding-top: .7em; border-top: 1px solid var(--line); font-size: .9em; color: var(--ink-2); }
.staff-form { display: flex; flex-direction: column; gap: .5em; border-top: 1px solid var(--line); padding-top: .8em; }
.serve-who { margin: .4em 0 0; }
.choice-sub { display: block; font-size: .8em; color: var(--ink-2); margin-top: .15em; }
/* 작은 글씨 안에 또 작은 글씨가 들어가 겹쳐 작아지는 곳 */
.chip-btn small, .edit-foot .state, .edit-foot .link { font-size: .93em; }
.ps-list li span:last-child { font-size: .85em; }
/* 글씨가 커져 '사랑방 가정' 줄(제목·범례 | 모임 모드·카드|표)이 휴대폰 폭을 넘으면 두 줄로 */
.section-row { flex-wrap: wrap; row-gap: .4em; }

/* ── 디자인 스타일 (설정에서 고름, 이 기기에만): basic(기본) / new(뉴모피즘) / classic(스큐어모피즘) / glass(글래스모피즘).
   시안(prototype/index.html)의 규칙을 실제 앱의 이름(:root[data-style], .tabs button, .seg, 기도하기·모임 모드 화면)에 맞춰 옮겼다.
   색은 모두 테마색과 화면 모드에서 가져온다 ── */

/* new: 누르는 것은 판에서 볼록하게, 고른 것과 담는 자리(이름표·입력칸)는 오목하게. 판(카드·바·메뉴)은 바탕과 같은 색에 그림자로 나눈다 */
:root[data-style="neu"] {
  --raise: -4px -4px 10px var(--neu-hi), 5px 5px 12px var(--neu-lo);
  --raise-sm: -3px -3px 7px var(--neu-hi), 3px 3px 8px var(--neu-lo);
  --press: inset 3px 3px 7px var(--neu-lo), inset -3px -3px 7px var(--neu-hi);
  --press-sm: inset 2px 2px 4px var(--neu-lo), inset -2px -2px 4px var(--neu-hi);
  /* 카드는 바탕보다 한 톤 밝게 올려서, 그림자만으로는 흐린 카드 경계를 또렷하게 한다 */
  --card: color-mix(in srgb, var(--surface) 60%, var(--page));
  --raise-card: -6px -6px 14px var(--neu-hi), 8px 8px 20px var(--neu-lo), 0 0 0 1px color-mix(in srgb, var(--line) 55%, transparent);
}
:root[data-style="neu"] .fam-grid, :root[data-style="neu"] .col { gap: 18px; }
:root[data-style="neu"] .card, :root[data-style="neu"] .notice { background-color: var(--card); border-color: transparent; box-shadow: var(--raise-card); }
:root[data-style="neu"] .card.today { background: linear-gradient(180deg, var(--accent-soft) 0%, var(--card) 100%); box-shadow: inset 0 4px 0 var(--accent), var(--raise-card); }
:root[data-style="neu"] .topbar { background: var(--page); border-bottom-color: transparent; box-shadow: 0 4px 12px -6px var(--neu-lo); }
:root[data-style="neu"] .tabs { background: var(--page); border-top-color: transparent; box-shadow: 0 -4px 12px -6px var(--neu-lo); }
:root[data-style="neu"] .tabs button.on:not(.pray-tab) { box-shadow: var(--press); border-radius: 16px; margin: 5px 10px; min-height: 46px; }
:root[data-style="neu"] .tabs button.on::after { content: none; }
:root[data-style="neu"] .tabs button.pray-tab .ic { background: var(--card); box-shadow: var(--raise-sm); }
:root[data-style="neu"] .tabs button.pray-tab.on .ic { background: var(--accent); box-shadow: var(--press); }
:root[data-style="neu"] .topnav button.on { background: var(--surface); box-shadow: var(--press); }
:root[data-style="neu"] .brand-mark { box-shadow: var(--raise-sm); }
:root[data-style="neu"] .badge-btn, :root[data-style="neu"] .topbar .icon-btn { background: var(--card); border-color: transparent; box-shadow: var(--raise-sm); }
:root[data-style="neu"] .topbar .icon-btn { border-radius: 50%; }
:root[data-style="neu"] .topbar .icon-btn[aria-expanded="true"] { box-shadow: var(--press); }
:root[data-style="neu"] .role-tag { background: var(--page); border-color: transparent; box-shadow: var(--press-sm); }
:root[data-style="neu"] .role-tag.leader { background: var(--leader-soft); }
:root[data-style="neu"] .role-tag.admin { background: var(--accent); }
:root[data-style="neu"] .menu { background: var(--card); border-color: transparent; box-shadow: var(--raise), 0 18px 40px -16px var(--neu-lo); }
:root[data-style="neu"] .mitem:hover { background: transparent; box-shadow: var(--press-sm); }
/* 누르는 것: 볼록하게 */
:root[data-style="neu"] .pray { border: 0; background: var(--surface); color: var(--accent); box-shadow: var(--raise-sm); transition: box-shadow .25s, background .25s, color .25s; }
:root[data-style="neu"] .pray:hover { border: 0; }
:root[data-style="neu"] .pray.on { background: var(--accent-soft); color: var(--accent); box-shadow: var(--press); }
:root[data-style="neu"] .pray.hero { background: var(--accent); color: var(--on-accent); box-shadow: var(--raise); }
:root[data-style="neu"] .pray.hero.on { background: color-mix(in srgb, var(--accent-soft) 60%, var(--surface)); color: var(--accent); box-shadow: var(--press); }
:root[data-style="neu"] .pray.on .pray-n { background: var(--accent); color: var(--on-accent); }
:root[data-style="neu"] .btn:not(.ghost):not(:disabled) { box-shadow: var(--raise-sm); }
:root[data-style="neu"] .btn.ghost, :root[data-style="neu"] .mchip, :root[data-style="neu"] .chip-btn, :root[data-style="neu"] .scope-btn, :root[data-style="neu"] .tgt-btn,
:root[data-style="neu"] .choice, :root[data-style="neu"] .icon-btn.sm, :root[data-style="neu"] .swatch, :root[data-style="neu"] .rm-x { background-color: var(--card); border-color: transparent; box-shadow: var(--raise-sm); }
:root[data-style="neu"] .mchip.on, :root[data-style="neu"] .chip-btn.open, :root[data-style="neu"] .chip-btn.on, :root[data-style="neu"] .swatch.on { box-shadow: var(--press); border-color: transparent; }
:root[data-style="neu"] .mchip.on, :root[data-style="neu"] .chip-btn.on { background: var(--page); color: var(--accent); font-weight: 600; }
:root[data-style="neu"] .btn:not(:disabled):active, :root[data-style="neu"] .pray:active, :root[data-style="neu"] .mchip:active, :root[data-style="neu"] .choice:active { box-shadow: var(--press); }
:root[data-style="neu"] .seg, :root[data-style="neu"] .seg2 { border: 0; background: var(--surface-2); box-shadow: var(--press); padding: 4px; gap: 5px; }
:root[data-style="neu"] .seg button.on, :root[data-style="neu"] .seg2 button.on { background: var(--surface); box-shadow: var(--raise-sm); }
/* 담는 자리: 오목하게 */
:root[data-style="neu"] .tgt, :root[data-style="neu"] .today .tgt, :root[data-style="neu"] .chip-status, :root[data-style="neu"] .kid { background: var(--page); border-color: transparent; box-shadow: var(--press-sm); }
:root[data-style="neu"] .st-edited, :root[data-style="neu"] .kid { background: var(--accent-soft); }
:root[data-style="neu"] .item.s-family, :root[data-style="neu"] .today .item.s-family, :root[data-style="neu"] .sub > li.s-family { background: var(--page); box-shadow: var(--press); }
:root[data-style="neu"] .received { box-shadow: var(--press-sm); }
:root[data-style="neu"] .received.r-plain { box-shadow: none; }
:root[data-style="neu"] .field, :root[data-style="neu"] .kid-form input, :root[data-style="neu"] .copybox { background: var(--page); border-color: transparent; box-shadow: var(--press); }
:root[data-style="neu"] .export, :root[data-style="neu"] .kid-list li { background: var(--page); box-shadow: var(--press); }
:root[data-style="neu"] .switch { background: var(--page); box-shadow: var(--press); }
:root[data-style="neu"] .switch.on { background: var(--accent); }
:root[data-style="neu"] .switch > span { background: var(--page); box-shadow: 1px 1px 3px var(--neu-lo); }
:root[data-style="neu"] .pray-table thead th { background: var(--page); }
:root[data-style="neu"] .pss { background: var(--page); }
:root[data-style="neu"] .pss-nav button { box-shadow: var(--raise); }
:root[data-style="neu"] .pss-nav button:first-child { background: var(--page); border-color: transparent; }
:root[data-style="neu"] .pss-body li { background: var(--card); box-shadow: var(--raise-sm); }
@media (prefers-reduced-motion: reduce) { :root[data-style="neu"] .pray { transition: none; } }

/* classic: 종이 카드, 천 무늬 바탕, 광택 있는 버튼, 박음질 */
:root[data-style="skeu"] {
  --paper-hi: color-mix(in srgb, var(--surface) 92%, #FFF6E0);
  --paper-lo: color-mix(in srgb, var(--surface) 88%, #E9DFC8);
  --gloss: linear-gradient(180deg, rgba(255,255,255,.38) 0%, rgba(255,255,255,.08) 50%, rgba(0,0,0,.06) 51%, rgba(0,0,0,.14) 100%);
  --bevel: inset 0 1px 0 rgba(255,255,255,.45), inset 0 -1px 0 rgba(0,0,0,.18), 0 1px 2px rgba(0,0,0,.25);
}
:root[data-style="skeu"] body { background-image: repeating-linear-gradient(45deg, rgba(0,0,0,.025) 0 2px, transparent 2px 4px), repeating-linear-gradient(-45deg, rgba(255,255,255,.035) 0 2px, transparent 2px 4px); }
:root[data-style="skeu"] .card, :root[data-style="skeu"] .notice, :root[data-style="skeu"] .menu {
  background: linear-gradient(180deg, var(--paper-hi), var(--paper-lo)); border: 1px solid color-mix(in srgb, var(--line-strong) 70%, transparent);
  box-shadow: inset 0 1px 0 rgba(255,255,255,.6), 0 1px 1px rgba(0,0,0,.08), 0 4px 0 -2px color-mix(in srgb, var(--paper-lo) 85%, #000), 0 8px 18px -8px rgba(0,0,0,.3); }
:root[data-style="skeu"] .card.today { background: linear-gradient(180deg, color-mix(in srgb, var(--accent-soft) 70%, var(--paper-hi)), var(--paper-lo));
  outline: 1.5px dashed color-mix(in srgb, var(--accent) 45%, transparent); outline-offset: -8px; box-shadow: inset 0 4px 0 var(--accent), 0 1px 1px rgba(0,0,0,.08), 0 10px 22px -10px rgba(0,0,0,.35); }
:root[data-style="skeu"] .topbar { background: linear-gradient(180deg, color-mix(in srgb, var(--surface) 80%, #fff), color-mix(in srgb, var(--surface-2) 85%, #000)); border-bottom: 1px solid rgba(0,0,0,.25); box-shadow: 0 2px 6px rgba(0,0,0,.15); }
:root[data-style="skeu"] .tabs { background: linear-gradient(180deg, color-mix(in srgb, var(--surface-2) 85%, #000), color-mix(in srgb, var(--surface-2) 70%, #000)); border-top: 1px solid rgba(255,255,255,.25); box-shadow: 0 -2px 6px rgba(0,0,0,.18); }
:root[data-style="skeu"] .tabs button { color: color-mix(in srgb, var(--ink) 60%, transparent); }
:root[data-style="skeu"] .tabs button.on { color: var(--accent); filter: drop-shadow(0 0 4px color-mix(in srgb, var(--accent) 50%, transparent)); }
:root[data-style="skeu"] .brand-mark { background: radial-gradient(circle at 35% 30%, color-mix(in srgb, var(--accent) 55%, #fff), var(--accent) 60%, color-mix(in srgb, var(--accent) 70%, #000)); box-shadow: var(--bevel); }
:root[data-style="skeu"] h1 { text-shadow: 0 1px 0 rgba(255,255,255,.55); }
/* 광택 버튼 */
:root[data-style="skeu"] .btn:not(.ghost), :root[data-style="skeu"] .pray.hero, :root[data-style="skeu"] .pray.on, :root[data-style="skeu"] .pss-nav .pss-pray, :root[data-style="skeu"] .role-tag.admin, :root[data-style="skeu"] .today-tag {
  background-image: var(--gloss); background-color: var(--accent); border: 1px solid color-mix(in srgb, var(--accent) 70%, #000); box-shadow: var(--bevel); text-shadow: 0 -1px 0 rgba(0,0,0,.25); }
:root[data-style="skeu"] .pray.hero.on { background: linear-gradient(180deg, color-mix(in srgb, var(--accent-soft) 60%, #000 6%), var(--accent-soft)); color: var(--accent);
  box-shadow: inset 0 2px 6px rgba(0,0,0,.25), 0 1px 0 rgba(255,255,255,.5); text-shadow: 0 1px 0 rgba(255,255,255,.5); border-color: color-mix(in srgb, var(--accent) 35%, transparent); }
:root[data-style="skeu"] .btn.ghost, :root[data-style="skeu"] .pray:not(.hero):not(.on), :root[data-style="skeu"] .mchip, :root[data-style="skeu"] .chip-btn, :root[data-style="skeu"] .scope-btn, :root[data-style="skeu"] .tgt-btn, :root[data-style="skeu"] .badge-btn,
:root[data-style="skeu"] .choice, :root[data-style="skeu"] .icon-btn.sm, :root[data-style="skeu"] .pss-nav button:not(.pss-pray), :root[data-style="skeu"] .pss-x, :root[data-style="skeu"] .pss-music {
  background-image: linear-gradient(180deg, rgba(255,255,255,.3), rgba(255,255,255,0) 60%, rgba(0,0,0,.06)); background-color: var(--surface); border: 1px solid color-mix(in srgb, var(--line-strong) 85%, #000 10%); box-shadow: inset 0 1px 0 rgba(255,255,255,.7), 0 1px 2px rgba(0,0,0,.15); }
:root[data-style="skeu"] .mchip.on, :root[data-style="skeu"] .chip-btn.open, :root[data-style="skeu"] .chip-btn.on { background: color-mix(in srgb, var(--surface-2) 80%, #000 6%); box-shadow: inset 0 2px 4px rgba(0,0,0,.2); color: var(--accent); border-color: color-mix(in srgb, var(--line-strong) 70%, #000 20%); }
:root[data-style="skeu"] .btn:not(:disabled):active, :root[data-style="skeu"] .pray:active, :root[data-style="skeu"] .mchip:active { box-shadow: inset 0 2px 5px rgba(0,0,0,.3); }
/* 이름표·입력칸은 종이에 찍힌 듯 */
:root[data-style="skeu"] .tgt, :root[data-style="skeu"] .chip-status, :root[data-style="skeu"] .role-tag { box-shadow: inset 0 1px 2px rgba(0,0,0,.15), 0 1px 0 rgba(255,255,255,.6); }
:root[data-style="skeu"] .field, :root[data-style="skeu"] .kid-form input, :root[data-style="skeu"] .copybox, :root[data-style="skeu"] .kakao {
  background: color-mix(in srgb, var(--surface) 96%, #FFF8E6); border: 1px solid color-mix(in srgb, var(--line-strong) 80%, #000 10%); box-shadow: inset 0 2px 3px rgba(0,0,0,.12); }
:root[data-style="skeu"] .kakao { background: #FEE500; }
:root[data-style="skeu"] textarea.field { line-height: 1.6em; background-image: repeating-linear-gradient(180deg, transparent 0 calc(1.6em - 1px), color-mix(in srgb, var(--accent) 22%, transparent) calc(1.6em - 1px) 1.6em);
  background-origin: content-box; background-clip: padding-box; background-attachment: local; }
/* 스위치·선택 버튼 */
:root[data-style="skeu"] .seg, :root[data-style="skeu"] .seg2 { background: linear-gradient(180deg, color-mix(in srgb, var(--surface-2) 85%, #000 8%), var(--surface-2)); border: 1px solid color-mix(in srgb, var(--line-strong) 80%, #000 15%); box-shadow: inset 0 1px 3px rgba(0,0,0,.18); }
:root[data-style="skeu"] .seg button.on, :root[data-style="skeu"] .seg2 button.on { background: linear-gradient(180deg, color-mix(in srgb, var(--surface) 82%, #fff), var(--surface)); color: var(--ink); box-shadow: inset 0 1px 0 #fff, 0 1px 2px rgba(0,0,0,.25); }
:root[data-style="skeu"] .switch { box-shadow: inset 0 2px 4px rgba(0,0,0,.3); }
:root[data-style="skeu"] .switch.on { background-image: var(--gloss); }
:root[data-style="skeu"] .switch > span { background: radial-gradient(circle at 40% 30%, #fff, #ddd); box-shadow: 0 1px 3px rgba(0,0,0,.4); }
:root[data-style="skeu"] .received { box-shadow: inset 0 1px 3px rgba(0,0,0,.12); }
:root[data-style="skeu"] .item.s-family, :root[data-style="skeu"] .sub > li.s-family { box-shadow: inset 0 1px 3px rgba(0,0,0,.12); }
:root[data-style="skeu"] .pss-body li { background: linear-gradient(180deg, var(--paper-hi), var(--paper-lo)); box-shadow: 0 1px 1px rgba(0,0,0,.08), 0 6px 14px -8px rgba(0,0,0,.3); }

/* glass: 테마색으로 은은하게 물든 바탕 위에 반투명 유리판(카드·바)을 얹는다. 글이 읽히도록 유리는 너무 투명하게 하지 않는다 */
:root[data-style="glass"] {
  --glass: color-mix(in srgb, var(--surface) 58%, transparent);
  --glass-strong: color-mix(in srgb, var(--surface) 78%, transparent);
  --glass-soft: color-mix(in srgb, var(--surface) 40%, transparent);
  --glass-blur: blur(18px) saturate(160%);
  --glass-edge: 1px solid color-mix(in srgb, var(--surface) 70%, transparent);
  --glass-shadow: inset 0 1px 0 var(--neu-hi), inset 0 0 0 1px color-mix(in srgb, var(--ink) 5%, transparent), 0 10px 30px -14px var(--shadow);
}
:root[data-style="glass"] body { position: relative; isolation: isolate; }
/* 바탕의 빛 번짐: 테마색 + 따뜻한 색 + 보라빛을 크게 흐리게 겹친다. 화면에 고정해 스크롤해도 유리 너머로 비친다 */
:root[data-style="glass"] body::before { content: ""; position: fixed; inset: 0; z-index: -1; pointer-events: none;
  background:
    radial-gradient(42% 38% at 12% 18%, color-mix(in srgb, var(--accent) 50%, transparent), transparent 72%),
    radial-gradient(38% 34% at 88% 30%, color-mix(in srgb, #F2A65A 45%, transparent), transparent 72%),
    radial-gradient(46% 40% at 70% 92%, color-mix(in srgb, var(--leader) 36%, transparent), transparent 72%),

<script>
/* 화면 모드·색 테마·큰 글씨는 이 기기에만 기억한다. 화면이 그려지기 전에 먼저 입힌다 */
try { const p = JSON.parse(localStorage.getItem('koide-pref') || '{}'), d = document.documentElement;
  if (p.mode === 'light' || p.mode === 'dark') d.dataset.mode = p.mode;
  if (p.accent && p.accent !== 'green') d.dataset.accent = p.accent;

  if (p.big) d.dataset.big = ''; } catch (e) { /* 무시 */ }

<script>
(function () {
  const CFG = window.KOIDE_CONFIG || {};
  // 데모: 서버 주소가 없거나, 주소 뒤에 ?demo를 붙였을 때. 지어낸 예시 데이터로 리더·회원 화면을 눌러 본다
  //  ?demo로 연 데모는 실제 앱과 같은 주소라서, 로그인·화면 기억을 따로 둬서 실제 로그인을 건드리지 않는다
  const DEMO_LINK = !!CFG.API_URL && new URLSearchParams(location.search).has('demo'), DEMO = !CFG.API_URL || DEMO_LINK;
  const $ = s => document.querySelector(s);
  const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
  const TOKEN = DEMO_LINK ? 'koide-demo-token' : 'koide-token';
  const getToken = () => { try { return localStorage.getItem(TOKEN); } catch (e) { return null; } };
  // 로그인 표시가 바뀌면(로그인·로그아웃) 기억해 둔 화면도 지운다. 다른 사람의 기도제목이 남지 않게
  const setToken = t => { try { t ? localStorage.setItem(TOKEN, t) : localStorage.removeItem(TOKEN); localStorage.removeItem(CACHE); } catch (e) { /* 무시 */ } };
  // 지난번 이번 달 화면: 앱을 열 때 서버를 기다리지 않고 먼저 보여 준다
  const CACHE = DEMO_LINK ? 'koide-demo-cache' : 'koide-cache';
  const readCache = () => { try { return JSON.parse(localStorage.getItem(CACHE)); } catch (e) { return null; } };
  const writeCache = () => { try { localStorage.setItem(CACHE, JSON.stringify({ me: S.me, month: S.month })); } catch (e) { /* 무시 */ } };

  // 화면 상태
  const S = { openItems: new Set(), openFams: new Set(), view: 'loading', me: null, depts: null, rooms: null, pick: {}, month: null, tab: 'home', pending: null, busy: false };

  // ── 서버 부르기: 데모는 브라우저 안의 서버 코드, 실제는 Apps Script 웹 앱 ──
  async function api(action, data) {
    const body = Object.assign({ action, token: getToken() }, S.op && !['start', 'me', 'login', 'logout', 'opsJoin', 'month'].includes(action) ? { ops: S.op } : {},
      S.grp && !S.op && !['start', 'me', 'login', 'logout', 'usage', 'groupCreate', 'groupJoin', 'sendFeedback', 'myExport', 'eraseRequest', 'eraseRequestCancel', 'saveFamily'].includes(action) ? { grp: S.grp } : {}, data || {});
    let res;
    if (DEMO) res = await window.koideDemo.call(body);
    else {
      // 본문을 글자로 보내면 브라우저가 미리 묻는 요청(CORS preflight) 없이 바로 보낸다. Apps Script는 그 요청을 받지 못한다
      // 한동안 안 쓰면 서버가 깨어나는 데 10~20초 걸린다. 4초가 넘으면 기다리는 이유를 알려 주고, 60초가 넘으면 그만 기다린다
      const slow = setTimeout(() => { const l = $('.loading'); if (l) l.textContent = '서버를 깨우는 중이에요. 처음에는 20초쯤 걸릴 수 있어요…'; }, 4000);
      const ctl = new AbortController(), stop = setTimeout(() => ctl.abort(), 60000);
      try {
        const r = await fetch(CFG.API_URL, { method: 'POST', body: JSON.stringify(body), signal: ctl.signal });
        res = await r.json();
      } catch (e) { throw { code: 'net', message: '서버가 답하지 않아요. 잠시 뒤 다시 해 주세요.' }; }
      finally { clearTimeout(slow); clearTimeout(stop); }
    }
    if (!res.ok) {
      if (res.code === 'login') { setToken(null); S.view = 'login'; render(); }
      throw res;
    }
    return res.data;
  }
  // ── 사용기록(설계서 10장): 행동과 숫자·선택지만 기기에 모아 두었다가, 앱을 열 때(start) 함께 보낸다 ──
  //  기기ID는 이 기기에서 무작위로 만든 값이고 가정·사람과 잇지 않는다. 이름, 기도제목, 쓴 글은 넣지 않는다
  const USAGE_Q = 'koide-usage', DEVICE = (() => {
    try {
      let d = localStorage.getItem('koide-device');
      if (!d) { d = (crypto.randomUUID ? crypto.randomUUID() : Math.random().toString(36).slice(2) + Date.now().toString(36)).replace(/[^a-z0-9]/gi, '').toLowerCase().slice(0, 24); localStorage.setItem('koide-device', d); }
      return d;
    } catch (e) { return ''; }
  })();
  const usageQ = () => { try { return JSON.parse(localStorage.getItem(USAGE_Q) || '[]'); } catch (e) { return []; } };
  function track(e, d) {
    try { const q = usageQ(); q.push({ at: new Date().toISOString(), e, d: d || {} }); localStorage.setItem(USAGE_Q, JSON.stringify(q.slice(-200))); } catch (err) { /* 기록 못 해도 앱은 그대로 */ }
    if (usageQ().length >= 30) sendUsage();
  }
  // 보낼 것: start에 붙이거나(usagePart) 많이 쌓이면 따로(sendUsage). 서버가 받았다고 하면(kept) 보낸 만큼만 지운다
  const usagePart = () => { const q = usageQ(); return q.length && DEVICE ? { device: DEVICE, events: q } : {}; };
  function usageSent(part, r) { if (!part.events || !r || !r.kept) return; try { localStorage.setItem(USAGE_Q, JSON.stringify(usageQ().slice(part.events.length))); } catch (e) { /* 다음에 다시 */ } }
  async function sendUsage() {
    if (sendUsage.busy || !getToken()) return; const part = usagePart(); if (!part.events) return;
    sendUsage.busy = true; try { usageSent(part, await api('usage', part)); } catch (e) { /* 다음에 다시 보낸다 */ } sendUsage.busy = false;
  }
  const widthKind = () => innerWidth < 640 ? 'phone' : innerWidth < 1024 ? 'tablet' : 'pc';
  // 앱을 연 기록은 하루 한 번
  function trackOpen() {
    try { if (localStorage.getItem('koide-usage-day') === new Date().toDateString()) return; localStorage.setItem('koide-usage-day', new Date().toDateString()); } catch (e) { return; }
    const me = S.month && S.month.me || {};
    track('열기', { role: me.admin ? '관리자' : me.role || '회원', width: widthKind(), style: (STYLES.find(s => s[0] === (PREF.style || 'flat')) || STYLES[0])[1], group: grp(), big: !!PREF.big, mode: PREF.mode || 'auto', app: STANDALONE });
  }
  function toast(msg) { const t = $('#toast'); t.textContent = msg; t.hidden = false; clearTimeout(toast.t); toast.t = setTimeout(() => { t.hidden = true; }, 2600); }
  const oops = e => toast((e && e.message) || '잠시 문제가 생겼어요. 다시 해 주세요.');

  // ── 시작: 카카오에서 돌아왔으면(code) 로그인부터, 아니면 내 상태를 확인 ──
  async function boot() {
    if (DEMO) { await loadDemo(); $('#demo').hidden = false; $('#demo').innerHTML = '데모 모드 · 지어낸 예시 데이터예요 <button data-act="demoreset">데모 데이터 지우기</button>' + (DEMO_LINK ? ' · <a href="./">실제 앱으로</a>' : ''); }
    const q = new URLSearchParams(location.search);
    // 초대 링크: 카카오 로그인을 다녀와도 남게 기기에 적어 두고 주소에서 뺀다
    if (q.get('gjoin')) { try { localStorage.setItem(GJOIN, q.get('gjoin')); } catch (e) { /* 이번만 */ } q.delete('gjoin'); history.replaceState(null, '', location.pathname + (q.toString() ? '?' + q.toString().replace(/=(&|$)/g, '$1') : '')); }
    if (q.get('opsjoin')) { try { localStorage.setItem(OPS_JOIN, q.get('opsjoin')); } catch (e) { /* 이번만 */ } q.delete('opsjoin'); history.replaceState(null, '', location.pathname + (q.toString() ? '?' + q.toString().replace(/=(&|$)/g, '$1') : '')); }
    if (q.get('join')) { try { localStorage.setItem(JOIN, q.get('join')); } catch (e) { /* 이번만 */ } q.delete('join'); history.replaceState(null, '', location.pathname + (q.toString() ? '?' + q.toString().replace(/=(&|$)/g, '$1') : '')); }
    if (q.get('code')) {
      try { const r = await api('login', { code: q.get('code'), redirectUri: CFG.REDIRECT_URI || '' }); setToken(r.token); }
      catch (e) { oops(e); }
      history.replaceState(null, '', location.pathname);
    }
    if (q.get('error')) { toast('카카오 로그인을 취소했어요.'); history.replaceState(null, '', location.pathname); }
    if (!getToken()) { S.view = 'login'; return render(); }
    // 지난번 화면이 기억돼 있으면 먼저 보여 주고, 서버에서 새로 받아 조용히 바꾼다
    const c = readCache();
    if (c && c.me && c.month) { S.me = c.me; S.month = c.month; S.view = 'app'; render(); return refreshMe(true); }
    await refreshMe();
  }
  function loadDemo() {
    return new Promise((ok, bad) => {
      const a = document.createElement('script'); a.src = 'demo/gas-shim.js';
      // 서버 코드는 app 폴더 밖이라 홈 화면 앱 도우미(sw.js)가 다루지 않는다. 브라우저에 남은 10분 사본 대신 늘 새로 받는다
      a.onload = () => { const b = document.createElement('script'); b.src = (CFG.DEMO_CODE || '../apps-script/Code.js') + '?t=' + Date.now(); b.onload = ok; b.onerror = bad; document.head.appendChild(b); };
      a.onerror = bad; document.head.appendChild(a);
    });
  }
  // quiet: 기억해 둔 화면을 보여 주는 중이라 "불러오는 중"이나 오류 화면으로 바꾸지 않는다
  async function refreshMe(quiet) {
    try {
      let r;
      // start가 없는 예전 서버 코드여도 열리게 예전 방식(me → month)으로 이어 간다
      const part = usagePart();
      let join = null; try { join = localStorage.getItem(JOIN); } catch (e) { /* 없음 */ }
      try { r = await api('start', Object.assign({}, part, join ? { join } : {})); usageSent(part, r.usage); } catch (e) { if (e.code !== 'bad') throw e; r = { me: await api('me') }; }
      S.me = r.me;
      // 운영 관리자 초대 링크로 왔으면 역할을 붙이고 그 부서의 운영 화면으로
      let oj = null; try { oj = localStorage.getItem(OPS_JOIN); } catch (e) { /* 없음 */ }
      if (oj) {
        try { localStorage.removeItem(OPS_JOIN); } catch (e) { /* 무시 */ }
        try { S.me = await api('opsJoin', { invite: oj }); toast('전체 관리자를 맡게 되었어요.'); try { localStorage.setItem(OP_KEY, '*'); } catch (e) { /* 무시 */ } }
        catch (e) { toast(e.message); }
      }
      // 운영 화면으로 보던 부서가 있으면(또는 가정 없이 운영 관리자만이면) 운영 화면으로
      let op = null; try { op = localStorage.getItem(OP_KEY); } catch (e) { /* 없음 */ }
      if (opsDepts().length && (op || !S.me.link)) {
        const id = opsDepts().some(d => d.id === op) ? op : opsDepts()[0].id;
        if (S.me.link && S.me.link.status === '연결') S.month = r.month || S.month;
        S.op = null; return S.me.ops.all && !opsDepts().some(d => d.id === op) ? enterChurch() : enterOps(id);
      }
      if (!S.me.link) {
        // 부서를 모르는 예전 서버면 사랑방 목록을 부서 하나로 본다
        S.depts = r.depts || [Object.assign({ id: '', name: '' }, DEPT0, { rooms: r.rooms || await api('rooms') })];
        S.pick = {};
        if (S.depts.length === 1) pickDept(S.depts[0].id); else S.view = 'dept';
        // 초대 링크로 왔으면 그 부서(와 사랑방)를 미리 고른다. 막힌 링크면 알리고 직접 고르게
        const J = r.join;
        if (J && J.bad) { toast('이 초대 링크는 더 이상 쓰지 않아요. 직접 골라 주세요.'); try { localStorage.removeItem(JOIN); } catch (e) { /* 무시 */ } }
        else if (J && S.depts.some(d => d.id === J.deptId)) {
          pickDept(J.deptId);
          if (J.roomId && S.rooms.some(x => x.id === J.roomId)) { S.pick.roomId = J.roomId; S.view = 'family'; }
        }
      }
      else if (join) { try { localStorage.removeItem(JOIN); } catch (e) { /* 무시 */ } }
      else if (S.me.link.status === '요청') S.view = 'wait';
      else if (S.grp) { /* 모임 화면을 보는 중이면 내 소그룹 화면은 돌아갈 때 쓴다 */ S.home = r.month || S.home; }
      else { const m = r.month || await api('month'); if (!waiting) S.month = m; S.view = 'app'; trackOpen(); }
      // 모임 초대 링크로 왔으면 함께하기 신청(우리 교회에 연결된 다음에)
      let gj = null; try { gj = localStorage.getItem(GJOIN); } catch (e) { /* 없음 */ }
      if (gj && S.me.link && S.me.link.status === '연결') {
        try { localStorage.removeItem(GJOIN); } catch (e) { /* 무시 */ }
        try { const g = await api('groupJoin', { invite: gj }); S.me = g.me; toast(g.wait ? `"${g.group}"에 함께하기를 신청했어요. 모임장이 승인하면 함께해요.` : `이미 "${g.group}"에 함께하고 있어요.`); }
        catch (e) { toast(e.message); }
      }
    } catch (e) {
      if (e.code === 'login') return;
      if (quiet) return oops(e);
      S.view = 'error'; S.err = e;
    }
    quiet ? paint() : render();
  }
  async function loadMonth() { S.month = await api('month'); }

  async function kakaoLogin(who) {
    // 데모: 카카오 화면 대신 고른 사람으로 바로 로그인(실제로는 카카오에서 돌아올 때 주소에 code가 붙는다)
    if (DEMO) {
      try { const r = await api('login', { code: 'demo:' + who, redirectUri: '' }); setToken(r.token); } catch (e) { return oops(e); }
      S.view = 'loading'; render(); return refreshMe();
    }
    location.href = 'https://kauth.kakao.com/oauth/authorize?response_type=code&client_id=' + encodeURIComponent(CFG.KAKAO_REST_KEY) + '&redirect_uri=' + encodeURIComponent(CFG.REDIRECT_URI);
  }

  // ── 부서마다 다른 말 ──
  // 부서 탭의 소그룹 이름(사랑방, 순)과 단위(가정, 개인)로 화면의 말을 바꾼다. 개인 단위는 청년부처럼 한 사람이 한 줄
  const DEPT0 = { group: '사랑방', unit: '가정' };
  const UNIT = {
    가정: { one: '가정', mine: '우리 가정', only: '우리 가정만', count: '가정', members: '가정', self: '우리 가정',
      targets: kids => ['우리 가정', '남편', '아내', ...kids, '부모님', '기타'] },
    개인: { one: '사람', mine: '나', only: '나만', count: '명', members: '식구', self: '나',
      targets: () => ['나', '가족', '친구', '학교·직장', '기타'] }
  };
  const dept = () => (S.view === 'app' && S.month && S.month.dept) || (S.depts && S.depts.find(d => d.id === S.pick.deptId)) || DEPT0;
  const words = () => UNIT[dept().unit] || UNIT.가정;
  const solo = () => dept().unit === '개인';
  const grp = () => dept().group || '사랑방';
  // 소그룹 이름 뒤의 조사를 받침에 맞춘다: gj('을/를') → 사랑방을, 조를
  const josa = (w, pair) => { const c = w.charCodeAt(w.length - 1) - 0xAC00, [a, b] = pair.split('/'); return w + (c >= 0 && c < 11172 && c % 28 ? a : b); };
  const gj = pair => josa(grp(), pair);
  // '(으)로': 받침이 없거나 ㄹ 받침이면 '로'
  const euro = w => { const c = w.charCodeAt(w.length - 1) - 0xAC00; return w + (c >= 0 && c < 11172 && c % 28 && c % 28 !== 8 ? '으로' : '로'); };
  // 기도 문장처럼 미리 적어 둔 글 속의 '사랑방'도 소그룹 이름으로
  const locG = x => typeof x === 'string' ? x.replace(/사랑방/g, grp()) : x;
  // 고른 소그룹의 가정 목록을 받았는지(그 소그룹 초대 링크로 들어왔을 때만)
  const roomListed = () => { const r = (S.rooms || []).find(x => x.id === S.pick.roomId); return !!(r && r.families); };
  function pickDept(id) { S.pick = { deptId: id }; S.rooms = S.depts.find(d => d.id === id).rooms; S.view = 'room'; }

  // ── 화면 ──
  const scopeName = k => ({ room: grp() + ' 공개', dept: (dept().name || '부서') + ' 공개', leader: '리더·목사님', family: words().only })[k];
  // 공개 범위는 누를 때마다 바뀐다. 교역자는 부서 공개 ↔ 우리 가정만
  const nextScope = s => S.grp ? (s === 'room' ? 'family' : 'room') : S.month && S.month.me && S.month.me.staff ? (s === 'dept' ? 'family' : 'dept') : ({ room: 'leader', leader: 'family', family: 'room' })[s] || 'room';
  // 기도 대상 칩: 교역자는 함께·직분·배우자·자녀·부모님·사역(설계서 섬기는 분들)
  const targetsFor = kids => {
    const me = S.month && S.month.me;
    if (!me || !me.staff) return words().targets(kids);
    const two = (mineFam().name || '').indexOf(' · ') > 0;
    return ['함께', me.role || '목사님', ...(two ? [me.role === '장로님' ? '배우자' : '사모님'] : []), ...kids, '부모님', '사역', '기타'];
  };
  const callName = n => { const g = String(n).slice(1), c = g.charCodeAt(g.length - 1) - 0xAC00; return g + (c >= 0 && c % 28 ? '이' : '가'); };
  const whoDid = by => !by || (S.me && by === S.me.person) ? '내가' : callName(by);
  // 기도제목 아래 한 줄: 누가 새로 썼는지·고쳤는지. 기존 시트에서 가져온 것은 사람 대신 '기존 시트에서 가져옴'
  const itemState = i => i.pending ? '저장 중…' : i.editedBy === '가져옴' ? (i.same ? '지난달과 같음 · ' : '') + '기존 시트에서 가져옴'
    : i.isNew ? whoDid(i.editedBy) + ' 새로 씀' : i.same ? '지난달과 같음 · ' + whoDid(i.editedBy) + ' 씀' : whoDid(i.editedBy) + ' 고침' + (i.editedAt ? ' · ' + i.editedAt : '');
  const steps = n => `<div class="steps" aria-hidden="true">${[1, 2, 3, 4].map(k => `<span class="${k <= n ? 'on' : ''}"></span>`).join('')}</div>`;
  const svg = d => `<svg class="ic" viewBox="0 0 16 16" aria-hidden="true">${d}</svg>`;
  const ICON = {
    bubble: '<svg viewBox="0 0 18 18" width="18" height="18" aria-hidden="true"><path fill="currentColor" d="M9 2.2c-4.1 0-7.4 2.6-7.4 5.8 0 2.1 1.4 3.9 3.5 4.9l-.8 2.9c-.1.3.2.5.4.3l3.4-2.3h.9c4.1 0 7.4-2.6 7.4-5.8S13.1 2.2 9 2.2z"/></svg>',
    home: svg('<path d="M2.5 7.5L8 3l5.5 4.5V13a1 1 0 0 1-1 1h-9a1 1 0 0 1-1-1z"/><path d="M6.5 14V10h3v4"/>'),
    pen: svg('<path d="M3 13l.8-3.2 6.7-6.7 2.4 2.4-6.7 6.7z"/><path d="M9.3 4.3l2.4 2.4"/>'),
    hands: svg('<path d="M8 2.5v10.5"/><path d="M8 2.5C6.7 3.8 6 5.6 6 7.6L3.4 10.4 5 13.5h3"/><path d="M8 2.5c1.3 1.3 2 3.1 2 5.1l2.6 2.8-1.6 3.1H8"/>'),
    book: svg('<rect x="3" y="2.5" width="10" height="11" rx="1.5"/><path d="M5.8 5.5h4.4M5.8 8h4.4M5.8 10.5h2.5"/>'),
    more: svg('<circle cx="3.5" cy="8" r=".9"/><circle cx="8" cy="8" r=".9"/><circle cx="12.5" cy="8" r=".9"/>'),
    room: svg('<circle cx="8" cy="8" r="5.5"/><path d="M2.5 8h11M8 2.5c1.6 1.6 2.3 3.4 2.3 5.5S9.6 11.9 8 13.5M8 2.5C6.4 4.1 5.7 5.9 5.7 8s.7 3.9 2.3 5.5"/>'),
    chev: svg('<path d="M4.5 6.5L8 10l3.5-3.5"/>'),
    chevR: svg('<path d="M6 3.5L10.5 8 6 12.5"/>'),
    chevL: svg('<path d="M10 3.5L5.5 8 10 12.5"/>'),
