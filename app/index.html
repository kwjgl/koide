    x: svg('<path d="M4 4l8 8M12 4l-8 8"/>'),
    expand: svg('<path d="M9.5 2.5h4v4M6.5 13.5h-4v-4M13.5 2.5L9.2 6.8M2.5 13.5l4.3-4.3"/>'),
    lock: svg('<rect x="3" y="7" width="10" height="7" rx="1.5"/><path d="M5.5 7V5a2.5 2.5 0 0 1 5 0v2"/>'),
    people: svg('<circle cx="6" cy="5.5" r="2"/><path d="M2.5 13c0-2 1.6-3.5 3.5-3.5s3.5 1.5 3.5 3.5"/><circle cx="11.2" cy="6" r="1.6"/><path d="M10.5 9.6c1.8 0 3 1.3 3 3.1"/>'),
    gear: svg('<circle cx="8" cy="8" r="2"/><path d="M8 1.8v1.6M8 12.6v1.6M3.6 3.6l1.1 1.1M11.3 11.3l1.1 1.1M1.8 8h1.6M12.6 8h1.6M3.6 12.4l1.1-1.1M11.3 4.7l1.1-1.1"/>'),
    screen: svg('<rect x="2" y="3" width="12" height="8" rx="1.2"/><path d="M6 14h4M8 11v3"/>'),
    knot: svg('<path d="M.5 8.5h3.8c1.2 0 1.7-1.5 1.7-2.8C6 3.7 7.3 2.5 9 2.5s3 1.2 3 3.1-1.8 3.1-4 3.3"/><path d="M5.6 10.1C7.6 9 9.6 8.5 15.5 8.5"/>'),
    check: '<svg viewBox="0 0 16 16" width="14" height="14" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3.5 8.5l3 3 6-7"/></svg>'
  };

  // 아이폰 Safari 등 카톡 밖 브라우저: 카카오 로그인이 카톡 앱을 오가는데, 비공개 릴레이가 켜져 있으면 IP가 달라져 카카오가 막는다
  const iosSafari = () => (/iP(hone|ad|od)/.test(navigator.userAgent) || (/Macintosh/.test(navigator.userAgent) && navigator.maxTouchPoints > 1)) && !/KAKAOTALK/i.test(navigator.userAgent);

  const VIEWS = {
    loading: () => '<p class="loading">불러오는 중…</p>',
    error: () => `<h1>잠시 문제가 생겼어요</h1><p class="hint">${esc(S.err && S.err.message)}</p><button class="btn" data-act="retry">다시 해 보기</button>`,
    login: () => `<p class="eyebrow">코이데 · 함께 기도하는 공동체</p><h1>서로의 기도를 나누고<br>함께 기도해요</h1>
      <p>처음 한 번만 로그인하면 돼요.</p>
      ${DEMO ? `<div class="choices">
          <button class="kakao" data-act="login" data-v="새 사람${Date.now() % 1000}">${ICON.bubble}카카오로 시작하기 (처음 오는 사람)</button>
          <button class="choice" data-act="login" data-v="김도윤">데모: 김도윤으로 들어가기 (2-20 리더)</button>
          <button class="choice" data-act="login" data-v="박민재">데모: 박민재로 들어가기 (회원)</button>
          <button class="choice" data-act="login" data-v="윤하람">데모: 윤하람으로 들어가기 (청년부 1순 리더)</button>
          <button class="choice" data-act="login" data-v="한기쁨">데모: 한기쁨으로 들어가기 (청장년부 목사님)</button>
          <button class="choice" data-act="login" data-v="최운영">데모: 최운영으로 들어가기 (운영 지원 · 가정 없음)</button></div>
          <p class="hint">데모 모드에서는 카카오 대신 이 버튼으로 사람을 골라 들어가요.</p>`
        : `<button class="kakao" data-act="login">${ICON.bubble}카카오로 시작하기</button>${iosSafari() ? '<p class="hint">아이폰에서 \'접속 정보를 확인해 주세요\'가 나오면, 카톡 채팅방에서 이 링크를 눌러 열거나 설정 → iCloud → 비공개 릴레이를 끄고 다시 해 주세요.</p>' : ''}`}
      <p class="hint name-note">코이데는 '교제'를 뜻하는 코이노니아와 '간구'를 뜻하는 데에시스에서 영감을 얻은 이름이에요. 서로의 기도를 나누고, 함께 기도하는 공동체를 뜻해요. 우리를 잇는 끈은 성령의 교통하심(코이노니아)이에요.</p>`,
    dept: () => `${steps(1)}<p class="eyebrow">처음 한 번만 확인할게요</p><h1>어느 부서인가요?</h1>
      <div class="choices">${(S.depts || []).map(d => `<button class="choice" data-act="pickdept" data-v="${esc(d.id)}">${esc(d.name)}</button>`).join('')}</div>`,
    room: () => `${steps(1)}<p class="eyebrow">${dept().name ? esc(dept().name) : '처음 한 번만 확인할게요'}</p><h1>어느 ${esc(grp())}인가요?</h1>
      <div class="choices">${(S.rooms || []).map(r => `<button class="choice" data-act="pickroom" data-v="${esc(r.id)}">${esc(r.name)}</button>`).join('')}</div>
      ${dept().hasStaff || (dept().staff || []).length ? '<button class="choice new" data-act="staffstart">목사님·장로님으로 들어가기</button>' : ''}
      ${S.depts && S.depts.length > 1 ? '<button class="link" data-act="back" data-v="dept">뒤로</button>' : ''}`,
    staffpick: () => `${steps(2)}<p class="eyebrow">${esc(dept().name || '')}</p><h1>어느 분이세요?</h1>
      <div class="choices">${(dept().staff || []).map(s => `<button class="choice" data-act="pickstaff" data-v="${esc(s.id)}">${esc(s.label)}<small class="choice-sub">${esc(s.name)}</small></button>`).join('')}</div>
      <p class="hint">목록에 없으면 부서 관리자에게 교역자 목록에 더해 달라고 해 주세요. 연결은 관리자가 승인해요.</p>
      <button class="link" data-act="back" data-v="room">뒤로</button>`,
    // 이름 쓰기: 소그룹 초대 링크 없이 들어오면 가정 목록 대신 내 이름을 써서 찾는다(교인 명단을 보여 주지 않는다)
    typename: () => { const r = S.rooms.find(x => x.id === S.pick.roomId) || {};
      return `${steps(2)}<p class="eyebrow">${S.pick.staff ? esc(dept().name || '') + ' · 목사님·장로님' : esc(r.name || '')}</p><h1>내 이름을 써 주세요</h1>
      <form data-form="typename"><input id="tn-a" class="field" required maxlength="10" autocomplete="name" aria-label="내 이름" value="${esc(S.pick.person || '')}">
        <p class="hint">${S.pick.staff ? '교역자 목록에 있는 이름과 같게 써요.' : `${esc(grp())} 명단에 있는 이름과 같게 써요.${solo() ? '' : ' 가정이면 남편이나 아내 중 내 이름이에요.'}`} 다른 분들의 이름은 보이지 않아요.</p>
        <button class="btn wide" type="submit" style="margin-top:12px">다음</button></form>
      ${S.pick.staff ? '' : `<button class="choice new" data-act="newfam">${solo() ? '처음 왔어요 · 새로 신청' : '새로 온 가정이에요 · 새 가정 신청'}</button>`}
      <button class="link" data-act="back" data-v="room">뒤로</button>`; },
    family: () => { const r = S.rooms.find(x => x.id === S.pick.roomId);
      return `${steps(2)}<p class="eyebrow">${esc(r.name)}</p><h1>${solo() ? '내 이름을 골라 주세요' : '우리 가정을 골라 주세요'}</h1>
      <div class="choices">${r.families.map(f => `<button class="choice" data-act="pickfam" data-v="${esc(f.id)}">${esc(f.name)}</button>`).join('')}
        <button class="choice new" data-act="newfam">${solo() ? '목록에 내 이름이 없어요 · 새로 왔어요' : '목록에 우리 가정이 없어요 · 새로 왔어요'}</button></div>
      <button class="link" data-act="back" data-v="room">뒤로</button>`; },
    who: () => { const f = famPicked();
      return `${steps(3)}<p class="eyebrow">${esc(f.name)} 가정</p><h1>누구세요?</h1>
      <div class="choices">${f.name.split(' · ').map(n => `<button class="choice" data-act="pickwho" data-v="${esc(n)}">${esc(n)}</button>`).join('')}</div>
      <p class="hint">우리 가정 안에서 누가 고쳤는지 보여 줄 때 써요.</p>
      <button class="link" data-act="back" data-v="${S.pick.staff ? 'staffpick' : 'family'}">뒤로</button>`; },
    consent: () => `${steps(4)}<p class="eyebrow">${S.pick.newFamily ? (solo() ? '새로 왔어요' : '새 가정 신청') : S.pick.byName || solo() ? esc(S.pick.person) : famWho(famPicked().name, S.pick.person)}</p><h1>기도제목은 이렇게 지켜요</h1>
      ${consentList()}
      <button class="btn wide" data-act="request" ${S.busy ? 'disabled' : ''}>동의하고 연결 요청</button>
      <p class="hint">동의하지 않으면 앱을 쓸 수 없어요. 궁금한 점은 리더나 목사님께 물어봐 주세요.</p>
      <button class="link" data-act="back" data-v="${S.pick.newFamily ? 'newfam' : S.pick.byName ? 'typename' : 'who'}">뒤로</button>`,
    newfam: () => solo() ? `${steps(2)}<p class="eyebrow">새로 왔어요</p><h1>이름을 알려 주세요</h1>
      <form data-form="newfam">
        <label class="f" for="nf-a">이름</label><input id="nf-a" class="field" required maxlength="10" value="${esc((S.pick.newFamily || {}).a || '')}">
        <p class="hint">신청하면 리더가 확인한 뒤 승인해요.</p>
        <button class="btn wide" type="submit" style="margin-top:12px">다음</button></form>
      <button class="link" data-act="back" data-v="${roomListed() ? 'family' : 'typename'}">뒤로</button>`
      : `${steps(2)}<p class="eyebrow">새 가정 신청</p><h1>우리 가정을 알려 주세요</h1>
      <form data-form="newfam">
        <label class="f" for="nf-a">남편 또는 본인 이름</label><input id="nf-a" class="field" required maxlength="10" value="${esc((S.pick.newFamily || {}).a || '')}">
        <label class="f" for="nf-b">아내 이름 · 1인 가정이면 비워 두세요</label><input id="nf-b" class="field" maxlength="10" value="${esc((S.pick.newFamily || {}).b || '')}">
        <label class="f" for="nf-k">자녀 이름 · 선택, 쉼표로 구분</label><input id="nf-k" class="field" maxlength="40" value="${esc((S.pick.newFamily || {}).kids || '')}">
        <p class="hint">신청하면 리더가 확인한 뒤 승인해요. 배우자는 나중에 각자 카카오로 연결하면 돼요.</p>
        <button class="btn wide" type="submit" style="margin-top:12px">다음</button></form>
      <button class="link" data-act="back" data-v="${roomListed() ? 'family' : 'typename'}">뒤로</button>`,
    wait: () => `${steps(4)}<p class="eyebrow">${esc(S.me.familyName || '')}</p><h1>연결을 요청했어요</h1>
      <p>${S.me.familyName && S.me.familyName !== S.me.link.person ? `${esc(S.me.link.person)} 님의 카카오 계정을 <b>${esc(S.me.familyName)}</b>에 연결해 달라고` : `${esc(S.me.link.person)} 님의 카카오 계정을 연결해 달라고`} ${S.me.staff ? '부서 관리자' : '리더'}에게 보냈어요. 승인되면 바로 열려요.</p>
      <div class="wait">${S.me.staff ? '관리자' : '리더'}가 확인하고 있어요</div>
      <button class="btn wide" data-act="retry">승인됐는지 다시 확인</button>
      <p class="hint">${DEMO ? '데모: 로그아웃하고 그 부서의 리더(청장년부는 김도윤, 청년부는 윤하람)로 들어가 더보기에서 승인해 보세요.' : '보통 하루 안에 끝나요.'}</p>
      <button class="link" data-act="logout">로그아웃</button>`,
    app: () => ({ home: homeView, mine: mineView, pray: prayView, history: historyView, more: moreView, about: aboutView, feedback: feedbackView, church: churchView, status: statusView, admin: adminView, import: importView, reorg: reorgView })[S.tab]()
  };
  // 고른 가정: 사랑방 가정, 또는 '목사님·장로님으로 들어가기'에서 고른 교역자 가정
  const famPicked = () => S.pick.staff ? (dept().staff || []).find(f => f.id === S.pick.familyId) : S.rooms.find(x => x.id === S.pick.roomId).families.find(f => f.id === S.pick.familyId);
  const consentList = () => `<ul class="consent">
      <li><b>무엇을</b><span>${solo() ? '이름, 내가 쓴 기도제목' : '가정 이름, 자녀 이름, 우리 가정이 쓴 기도제목'}, 카카오 회원번호와 닉네임</span></li>
      <li><b>어디에</b><span>교회가 관리하는 비공개 구글 시트 한 곳</span></li>
      <li><b>누가 보나</b><span>기도제목마다 고른 공개 범위대로만 보여요. 시트는 교회가 맡긴 관리자만 열 수 있고, 앱을 돌보는 데에만 써요</span></li>
      <li><b>얼마나</b><span>교회를 떠나면 1년 뒤 내용을 지우고 개수만 남겨요. 언제든 ${solo() ? '내' : '우리 가정'} 기록을 지워 달라고 할 수 있어요</span></li>
      <li><b>사용 기록</b><span>앱을 좋게 만들기 위해 이름 없는 사용 기록을 남겨요. "기도하기를 열었다"처럼 누른 것과 숫자만이고, 이름과 기도제목은 넣지 않아요</span></li></ul>`;

  // 이번 달: 우리 가정 + 사랑방 가정마다 기도제목과 "기도했어요"
  const todayLabel = () => { const d = new Date(); return (d.getMonth() + 1) + '월 ' + d.getDate() + '일 ' + '일월화수목금토'[d.getDay()]; };
  // 기도제목 줄(시안과 같게): 같은 대상은 칩 하나 아래로 묶고, 휴대폰에서는 3줄까지 보이고 '더 보기'로 펼친다.
  //  새 기도제목은 글 앞 작은 점, 공개 범위는 리더·목사님(보라 띠)·우리 가정만(회색 바탕 + 자물쇠)
  const SCOPE_ICON = { room: ICON.room, dept: ICON.room, leader: ICON.people, family: ICON.lock };
  //  famId가 있으면(사랑방 가정 카드) 글의 '더 보기'가 그 가정 카드 전체를 펼친다: 4개 넘는 항목과 접힌 글까지 한 번에
  function itemBody(i, clamp, famId) {
    const open = !famId && S.openItems.has(i.id);
    const dot = i.isNew ? '<i class="new-dot" title="이번 달 새 기도제목"></i><span class="sr">새 기도제목: </span>' : '';
    const tog = !clamp ? '' : famId ? `<button class="more-txt" data-act="famtoggle" data-id="${esc(famId)}" aria-expanded="false">더 보기</button>`
      : `<button class="more-txt" data-act="itemtoggle" data-id="${esc(i.id)}" aria-expanded="${open}">${open ? '접기' : '더 보기'}</button>`;
    // 기본 공개(사랑방 공개, 교역자의 부서 공개)는 표시하지 않는다
    const scope = i.scope === 'leader' || i.scope === 'family' ? `<span class="b-scope ${i.scope}">${SCOPE_ICON[i.scope]}${scopeName(i.scope)}</span>` : '';
    return `<div class="item-body"><p class="txt${clamp && !open ? ' clamp' : ''}">${dot}${esc(i.text)}${i.ended ? '<span class="end-tag">마침</span>' : ''}</p>${tog || scope ? `<div class="item-foot">${scope}${tog}</div>` : ''}</div>`;
  }
  function itemList(items, clamp, famId) {
    const groups = [];
    items.filter(i => !i.pending).forEach(i => { const g = groups.find(x => x.target === i.target); g ? g.items.push(i) : groups.push({ target: i.target, items: [i] }); });
    return `<ul class="items">${groups.map(g => g.items.length === 1 ? `<li class="item s-${g.items[0].scope}"><span class="tgt">${esc(g.target)}</span>${itemBody(g.items[0], clamp, famId)}</li>`
      : `<li class="item grp"><span class="tgt">${esc(g.target)}</span><ul class="sub">${g.items.map(i => `<li class="s-${i.scope}">${itemBody(i, clamp, famId)}</li>`).join('')}</ul></li>`).join('')}</ul>`;
  }
  // 기도했어요: 오늘 횟수(N/3)를 함께. 하루 3번이 되면 '오늘은 여기까지'
  function prayBtn(f, small, hero) {
    const t = f.today || 0, on = t > 0;
    if (t >= 3) return `<button class="pray on${small ? ' small' : ''}${hero ? ' hero' : ''}" disabled aria-label="오늘은 이 ${words().one}을 위해 3번 기도했어요. 내일 또 누를 수 있어요">${ICON.check}오늘은 여기까지<span class="pray-n" aria-hidden="true">3/3</span></button>`;
    return `<button class="pray${small ? ' small' : ''}${hero ? ' hero' : ''}${on ? ' on' : ''}${S.flash === f.id ? ' flash' : ''}" data-act="pray" data-v="${esc(f.id)}" aria-label="기도했어요${on ? ` (오늘 ${t}번 기도함, 하루 3번까지)` : ''}">${on ? ICON.check : ICON.hands}기도했어요${on ? `<span class="pray-n" aria-hidden="true">${t}/3</span>` : ''}</button>`;
  }
  const STATUS_LABEL = { same: '지난달 그대로', edited: '이번 달 손봄', confirmed: '그대로 확인' };
  // 우리 가정 카드의 한 줄: 이번 달 몇 가정이 우리 가정을 위해 기도했는지에 따라(누가 했는지는 보이지 않는다)
  function receivedLine() {
    const R = S.month.received || { n: 0, of: 0 };
    // 가정 단위는 '사랑방 가족이 우리 가정을', 개인 단위는 '순 식구가 나를'
    const g = grp() + (solo() ? ' 식구' : ' 가족'), me = solo() ? '나를' : '우리 가정을';
    // 아무도 누르지 않은 달에도 기도받지 못하는 가정은 없다(롬 8:34)
    const [k, t] = !R.n ? ['plain', '그리스도께서 ' + me + ' 위해 간구하고 계세요.'] : R.n * 2 >= R.of ? ['deep', g + '들이 함께 ' + me + ' 위해 기도하고 있어요'] : ['soft', g + (solo() ? '가 ' : '이 ') + me + ' 위해 기도했어요'];
    return `<p class="received r-${k}">${ICON.hands}<span>${t}</span></p>`;
  }
  function famCard(f) {
    // 펼치면 모든 항목을 접지 않고 다 보여 주고, 맨 아래 '접기' 하나로 다시 접는다
    const its = f.items.filter(i => !i.pending), open = S.openFams.has(f.id), more = its.length - 4;
    return `<article class="card"><div class="fam-head"><h3>${esc(f.name)}</h3>${prayBtn(f, true)}</div>
      ${its.length ? (open ? itemList(its, false) : itemList(its.slice(0, 4), true, f.id)) : '<p class="hint">아직 올린 기도제목이 없어요.</p>'}
      ${open ? `<button class="link" data-act="famtoggle" data-id="${esc(f.id)}" aria-expanded="true">접기</button>`
        : more > 0 ? `<button class="link" data-act="famtoggle" data-id="${esc(f.id)}" aria-expanded="false">더 보기 · ${more}개</button>` : ''}</article>`;
  }
  // ── 홈 화면에 두기(13장 홈 화면 앱) ──
  // 홈 화면 앱으로 열었으면 나오지 않는다. "알겠어요"를 누르면 이 기기에서는 다시 나오지 않고, 더보기에서 다시 볼 수 있다
  const STANDALONE = (window.matchMedia && matchMedia('(display-mode: standalone)').matches) || navigator.standalone === true;
  const A2HS_OFF = 'koide-a2hs-off';
  //  PC에서는 처음부터 띄우지 않는다(더보기에서는 볼 수 있다)
  S.a2hs = !STANDALONE && !!(window.matchMedia && matchMedia('(pointer: coarse)').matches) && (() => { try { return !localStorage.getItem(A2HS_OFF); } catch (e) { return true; } })();
  S.a2hsOs = /android/i.test(navigator.userAgent) ? 'android' : 'ios';
  // 안드로이드 크롬은 설치 창을 직접 띄울 수 있다. 그 기회를 받아 두었다가 "바로 설치"로 쓴다
  let installAsk = null;
  window.addEventListener('beforeinstallprompt', e => { e.preventDefault(); installAsk = e; if (S.view === 'app') paint(); });
  window.addEventListener('appinstalled', () => { installAsk = null; S.a2hs = false; if (S.view === 'app') paint(); });
  function a2hsCard() {
    if (!S.a2hs) return '';
    const os = S.a2hsOs;
    const how = os === 'ios' ? ['사파리에서 이 화면을 열어요', '아래쪽 공유 버튼(네모에 위 화살표)을 눌러요', '"홈 화면에 추가"를 눌러요']
      : ['크롬에서 이 화면을 열어요', '오른쪽 위 점 세 개를 눌러요', '"홈 화면에 추가" 또는 "앱 설치"를 눌러요'];
    // 화면 위에 뜨는 창(휴대폰은 아래에서 올라옴). 바깥이나 ×를 누르면 이번만 닫고, '알겠어요'는 다시 띄우지 않는다
    return `<div class="pop-scrim" data-act="a2hshide"></div>
      <section class="card a2hs pop-sheet" role="dialog" aria-modal="true" aria-labelledby="a2hs-t">
      <div class="row"><p class="label" id="a2hs-t">휴대폰 홈 화면에 코이데를 두세요</p><button class="icon-btn sm" data-act="a2hshide" aria-label="닫기">${ICON.x}</button></div>
      <p>앱처럼 아이콘을 눌러 바로 열 수 있어요. 링크를 찾지 않아도 돼요.</p>
      ${installAsk ? '<button class="btn" data-act="a2hsinstall">바로 설치하기</button>' : ''}
      <div class="seg2" role="tablist" aria-label="휴대폰 종류">${[['ios', '아이폰'], ['android', '안드로이드']].map(([k, l]) => `<button class="${os === k ? 'on' : ''}" role="tab" aria-selected="${os === k}" data-act="a2hsos" data-v="${k}">${l}</button>`).join('')}</div>
      <ol class="a2hs-steps">${how.map(x => `<li>${x}</li>`).join('')}</ol>
      <button class="btn ghost" data-act="a2hsclose">알겠어요</button>
    </section>`;
  }

  function homeView() {
    if (staffMe()) return staffHomeView();
    const M = S.month, others = M.families.filter(f => !f.own), t = todayFam();
    return `<div class="page-top"><div><p class="eyebrow">${esc(M.room.name)}</p><h1>${Number(M.month.slice(5))}월 기도제목 <span aria-hidden="true">🙏</span></h1></div><p class="date">${todayLabel()}</p></div>
      ${shiftCard()}<div class="home-grid"><div class="col side">${t ? `<section class="card today" aria-label="지금 함께 기도할 ${words().one}"><p class="today-tag">${ICON.hands}지금 함께 기도할 ${words().one}</p><h2>${esc(t.name)}</h2>
          <div class="today-body" data-id="${esc(t.id)}" tabindex="0" aria-label="${esc(t.name)} 기도제목">${t.items.length ? itemList(t.items, false) : `<p class="hint">아직 올린 기도제목이 없어요. 이 ${words().one}을 떠올리며 기도해요.</p>`}</div>
          <div class="pray-hero"><div class="pray-row">${prayBtn(t, false, true)}<button class="btn next${t.today ? '' : ' ghost'}" data-act="nexttoday">다음 ${words().one}</button></div>
            ${t.prayed ? `<p class="pray-done">이번 달 ${esc(t.name)}${solo() ? ' 님' : ' 가정'}을 위해 ${t.prayed}번 기도했어요</p>` : ''}</div>
          <p class="hint">앱을 열 때마다 이번 달 아직 기도하지 않은 ${words().one}부터 돌아가며 나와요.</p>
          ${cordHtml(t.id)}</section>` : ''}${artCard()}</div>
      <div class="col main">
        ${mineCard()}
        <div class="section-row"><div class="sr-title"><h2 class="section-title">${esc(grp())} ${words().members} ${others.length}</h2><span class="sr-legend"><i class="new-dot"></i>이번 달 새 기도제목</span></div>
          <div class="sr-tools"><button class="btn small ghost meet-btn" data-act="meet" title="모임 때 한 ${words().one}씩 크게 보기">${ICON.screen}모임 모드</button>
          <div class="seg2" role="tablist" aria-label="보기 방식">${[['card', '카드'], ['table', '표']].map(([k, l]) => `<button class="${(S.homeView || 'card') === k ? 'on' : ''}" role="tab" aria-selected="${(S.homeView || 'card') === k}" data-act="homeview" data-v="${k}">${l}</button>`).join('')}</div></div></div>
        ${S.homeView === 'table' ? tableCard() : `<div class="fam-grid">${others.map(famCard).join('')}</div>`}
        ${serveCard()}
      </div></div>`;
  }
  // 개편 안내: 새 리더에게는 맡을 가정 명단, 회원에게는 "12월부터 ○○ 사랑방이에요", 바뀐 달에는 한 번 "올해는 ○○ 사랑방이에요"
  function shiftCard() {
    const X = S.month.shift; if (!X) return '';
    const g = esc(grp()), key = 'koide-shift-' + (X.started || '');
    if (X.started) {
      try { if (localStorage.getItem(key)) return ''; } catch (e) { /* 늘 보여 준다 */ }
      return `<section class="notice" style="margin-bottom:12px"><b>${X.started}년 편성이 시작됐어요.</b> 올해는 <b>${esc(X.room)}</b>이에요. 아래가 새 ${g} ${words().members}이에요. <button class="link" data-act="shiftok" data-v="${key}">알겠어요</button></section>`;
    }
    const when = Number(X.start.slice(5)) + '월부터';
    return `<section class="notice" style="margin-bottom:12px"><b>${when} ${esc(X.room)}이에요.</b>${X.lead ? ` ${X.year}년에 ${esc(X.lead)}로 섬기게 돼요. 맡을 ${words().members}: ${X.families.map(esc).join(', ')}.` : ''}
      <span class="hint">그때까지는 지금 ${g}이 그대로예요. 새 ${g}의 기도제목은 ${when} 보여요.</span></section>`;
  }
  // 우리 가정 카드(회원과 목사님·장로님 홈에 같이 나온다)
  function mineCard() {
    const mine = S.month.families.find(f => f.own);
    return `<section class="card" aria-label="${words().mine}"><div class="fam-head"><div><p class="label">${words().mine}</p><h3>${esc(mine.name)}</h3></div><span class="chip-status st-${mine.status}">${STATUS_LABEL[mine.status]}</span></div>
      ${staffMe() ? '' : receivedLine()}
      ${mine.items.length ? itemList(mine.items, true) : '<p class="hint">아직 올린 기도제목이 없어요.</p>'}
      <div class="actions"><button class="btn" data-act="tab" data-v="mine">고치기</button>${mine.status === 'same' ? '<button class="btn ghost" data-act="confirm">이번 달도 그대로예요</button>' : ''}</div>
      ${mine.status === 'confirmed' ? `<p class="hint">이번 달도 그대로라고 ${staffMe() ? '표시했어요' : '리더에게 알렸어요'}.</p>` : ''}</section>`;
  }
  // S5 목사님 홈: 부서 전체를 훑어보고(사랑방마다 손봄·확인), 사랑방을 눌러 그 사랑방 가정을 보며 기도한다
  function staffHomeView() {
    if (S.openRoom) return staffRoomView();
    const M = S.month, rooms = M.rooms || [], sum = k => rooms.reduce((a, r) => a + r[k], 0);
    const stat = (n, l) => `<div class="stat"><b>${n}</b><span>${l}</span></div>`;
    return `<div class="page-top"><div><p class="eyebrow">${esc(M.dept.name)} 전체 · ${esc(M.me.label || M.me.person)}</p><h1>${Number(M.month.slice(5))}월 기도제목 <span aria-hidden="true">🙏</span></h1></div><p class="date">${todayLabel()}</p></div>
      <div class="home-grid"><div class="col side">
        <section class="card"><div class="stats">${stat(rooms.length, grp())}${stat(sum('n'), words().count)}${stat(sum('edited') + sum('confirmed'), '이번 달 손봄·확인')}</div></section>
        ${rooms.length ? `<section class="card">${roomCordHtml()}<p class="hint">매듭을 누르면 그 ${esc(gj('을/를'))} 위해 기도하러 가요.</p></section>` : ''}
        ${mineCard()}
      </div><div class="col main">
        <h2 class="section-title">${esc(grp())}별 이번 달 현황</h2>
        ${rooms.length ? `<div class="room-board">${rooms.map(r => { const same = r.n - r.edited - r.confirmed;
          return `<button class="card room-sum" data-act="openroom" data-v="${esc(r.id)}"><span class="row"><b>${esc(r.name)}</b>${ICON.chevR}</span>
            <span class="hint">리더 ${r.leaders.length ? r.leaders.map(esc).join(', ') : '미지정'} · ${r.n}${words().count}</span>
            <span class="bar" role="img" aria-label="이번 달 손봄 ${r.edited}, 그대로 확인 ${r.confirmed}, 지난달 그대로 ${same}"><span class="bseg edited" style="flex:${r.edited}"></span><span class="bseg confirmed" style="flex:${r.confirmed}"></span><span class="bseg same" style="flex:${same}"></span></span>
            <span class="hint">손봄 ${r.edited} · 그대로 확인 ${r.confirmed} · 지난달 그대로 ${same}${r.fresh ? ` · 새 기도제목 ${r.fresh}` : ''}</span></button>`; }).join('')}</div>
          <ul class="legend"><li><i class="sw edited"></i>이번 달 손봄</li><li><i class="sw confirmed"></i>그대로 확인</li><li><i class="sw same"></i>지난달 그대로</li></ul>`
        : `<p class="hint">아직 ${esc(gj('이/가'))} 없어요.</p>`}
        ${signalCard(M.signals, true)}
        ${topicFlowCard(loadTopics())}
        ${topicDictCard(S.topics)}
        ${serveCard()}
      </div></div>`;
  }
  // 돌봄 신호: 오래 그대로인 가정과 오래 이어진 기도제목. 종류(목사님은 사랑방도)로 거르고 오래된 순 5건만 먼저 보여 준다
  function signalCard(all, multi) {
    if (!all) return '';
    const type = S.sigType || 'same', of = all.filter(x => x.type === type);
    const rooms = multi ? (S.month.rooms || []).filter(r => of.some(x => x.roomId === r.id)) : [];
    const room = rooms.some(r => r.id === S.sigRoom) ? S.sigRoom : 'all';
    const list = of.filter(x => room === 'all' || x.roomId === room), shown = S.sigMore ? list : list.slice(0, 5);
    const tag = x => x.type === 'same' ? `${x.n}달째 지난달 그대로` : `${x.n}개월째 이어짐`;
    return `<section class="card"><div class="row"><p class="label" style="margin:0">돌봄 신호${multi ? ' · 전체' : ''}</p><span class="hint">${all.length}건</span></div>
      <div class="seg2" role="tablist" aria-label="돌봄 신호 종류">${[['same', '오래 그대로'], ['long', '오래 이어진 기도제목']].map(([k, l]) => `<button class="${type === k ? 'on' : ''}" role="tab" aria-selected="${type === k}" data-act="sigtype" data-v="${k}">${l} ${all.filter(x => x.type === k).length}</button>`).join('')}</div>
      ${rooms.length > 1 ? `<div class="mchips" style="margin-top:10px">${[{ id: 'all', name: '전체', n: of.length }, ...rooms.map(r => ({ id: r.id, name: r.name, n: of.filter(x => x.roomId === r.id).length }))].map(x => `<button class="mchip${room === x.id ? ' on' : ''}" data-act="sigroom" data-v="${esc(x.id)}" aria-pressed="${room === x.id}">${esc(x.name)} ${x.n}</button>`).join('')}</div>` : ''}

  function famTlCard(fams) {

  const famWho = (fam, person) => `${esc(fam)} 가정<span class="who-sep" aria-hidden="true"></span>${esc(person)}`;

  function editLi(i, first) {

      </div>

          <ul class="items">${P.map((x, k) => `<li class="item s-room"><span class="tgt">${esc(x.target)}</span><div class="item-body"><p class="txt">${esc(x.text)}</p></div><button class="rm-x" data-act="prevrm" data-v="${k}" aria-label="이 항목 빼기" title="빼기">${ICON.x}</button></li>`).join('')}</ul>

  function setTarget(id, target) {

  // 새 기도제목 나누기: 가져오기와 같은 규칙(번호·글머리를 떼고, 형제ㅡ·이름표 줄로 대상을 정함). 이름표가 없는 줄은 글에서 대상을 짐작한다
  function splitDraft(text) {

    const fam = { a, b, kids: [...mine.kids] };
    const guess = t => { for (const k of mine.kids) if (t.includes(k)) return k;
      if (solo()) return /가족|엄마|아빠|부모|동생|언니|오빠|누나|형/.test(t) ? '가족' : /친구/.test(t) ? '친구' : /학교|직장|회사|시험|취업/.test(t) ? '학교·직장' : '나';
      return /남편|신랑/.test(t) ? '남편' : /아내|와이프/.test(t) ? '아내' : /부모님|어머니|아버지|시댁|친정|장인|장모|시어머니|시아버지/.test(t) ? '부모님' : '우리 가정'; };

    const role = (S.month.me && S.month.me.role) || '목사님', staffT = { '우리 가정': '함께', '남편': role, '아내': role === '장로님' ? '배우자' : '사모님', '사모': '사모님', '목사': '목사님', '장로': '장로님', '전도사': '전도사님' };
    return splitItems(clean, fam, guess).map(x => ({ target: staffMe() ? staffT[x.target] || x.target : solo() && x.target === '우리 가정' ? '나' : x.target, text: x.text }));
  }


  // 리더 현황: 이번 달 가정마다 손봄 / 그대로 확인 / 지난달 그대로. "미작성"처럼 탓하는 말은 쓰지 않는다
  const STATUS = { edited: '이번 달 손봄', confirmed: '그대로 확인', same: '지난달 그대로' };
  const monthNum = () => Number(S.month.month.slice(5));
  const md = d => Number(d.slice(5, 7)) + '/' + Number(d.slice(8, 10));
  const remindText = () => monthNum() + '월 기도제목 앱에 한번 들어와 보세요. 바뀐 게 없으면 "이번 달도 그대로예요"만 눌러도 괜찮아요.\n' + location.origin + location.pathname;
  // 카톡방 문구: 지금 카톡방 형식 그대로. 남편은 형제, 아내는 자매, 우리 가정은 함께로 바꾸고
  //  형제 → 자매 → 자녀(가정에 적은 순서) → 그 밖(부모님 등) → 함께 순서. 사랑방 공개 항목만 담는다.
  //  개인 단위(청년부)는 "○○ 님을 위해", 나에 대한 항목을 먼저 이름표 없이 쓴다

  function shareText(f) {
    if (solo()) {
      const its = f.items.filter(i => i.scope === 'room' && !i.pending).sort((a, b) => (a.target === '나' ? 0 : 1) - (b.target === '나' ? 0 : 1));
      return f.name + ' 님을 위해 기도합니다' + (its.length ? '\n\n' + its.map(i => (i.target === '나' ? '' : i.target + 'ㅡ') + i.text).join('\n\n') : '');
    }

    const its = f.items.filter(i => i.scope === 'room' && !i.pending).sort((a, b) => rank(a.target) - rank(b.target));
    return f.name.replace(' · ', ' ') + ' 가정을 위해 기도합니다' + (its.length ? '\n\n' + its.map(i => (SHARE_LABEL[i.target] || i.target) + 'ㅡ' + i.text).join('\n\n') : '');
  }
  // 자동 복사가 막힌 기기에서는 문구를 펼쳐서 길게 눌러 복사하게 한다
  const copyNote = (key, text) => S.copied && S.copied.key === key && !S.copied.ok
    ? `<p class="hint">자동 복사가 막혀 있어요. 아래 문구를 길게 눌러 복사하세요.</p><pre class="copybox">${esc(text)}</pre>` : '';
  async function copy(key, text) {

  function statusCard() {

  // 월별 업데이트 추이(리더): 최근 12개월, 우리 사랑방 합계. 막대 높이는 손봄+그대로 확인 비율, 아래 진한 쪽이 손봄
  function trendCard() {
    const T = S.pending && S.pending.trend;
    if (!T || !T.some(t => t.n)) return '';
    const n = m => Number(m.slice(5)), last = T.length - 1;
    const cols = T.map((t, i) => { const p = t.n ? Math.round((t.edited + t.confirmed) / t.n * 100) : null;
      return `<div class="an-col${i === last ? ' now' : ''}" title="${n(t.month)}월 ${t.n ? `${t.n}${words().count} 중 손봄 ${t.edited} · 그대로 확인 ${t.confirmed}` : '기록 없음'}">
        <span class="an-v">${p == null ? '·' : p}</span><span class="tr-bar" style="height:${((p || 0) / 100 * 4.2).toFixed(2)}em"><span class="tr-e" style="flex:${t.edited}"></span><span class="tr-c" style="flex:${t.confirmed}"></span></span><span class="an-x">${n(t.month)}</span></div>`; }).join('');
    return `<section class="card"><div class="row"><p class="label" style="margin:0">월별 업데이트 추이 <small class="hint">최근 12개월 · %</small></p></div>
      <div class="an-cols tr-cols" role="img" aria-label="월별 손봄·확인 비율: ${T.map(t => `${n(t.month)}월 ${t.n ? Math.round((t.edited + t.confirmed) / t.n * 100) + '%' : '없음'}`).join(', ')}">${cols}</div>

  }
  // 가정별 업데이트 이력: 지금 편성의 리더·코리더만(서버도 리더에게만 보낸다). 편성이 시작한 달부터 이번 달까지 칠한 칸만, 비율·순위는 없다
  const HIST_LABEL = { edited: '손봄', confirmed: '그대로 확인', same: '지난달 그대로', none: '기도제목 없음' };
  function histCard() {
    const H = S.pending && S.pending.history;
    if (!H || !H.rows.length) return '';
    const ms = H.months, y = m => m.slice(0, 4), n = m => Number(m.slice(5));
    const span = y(ms[0]) === y(ms[ms.length - 1]) ? `${y(ms[0])}년 ${n(ms[0])}${ms.length > 1 ? '~' + n(ms[ms.length - 1]) : ''}월` : `${y(ms[0])}년 ${n(ms[0])}월 ~ ${y(ms[ms.length - 1])}년 ${n(ms[ms.length - 1])}월`;
    // 해가 바뀌는 달(1월)에는 위에 연도를 작게 단다
    const head = ms.map((m, i) => `<th scope="col"${i === ms.length - 1 ? ' class="now"' : ''}>${i && n(m) === 1 ? `<small>${y(m).slice(2)}년</small><br>` : ''}${n(m)}</th>`).join('');
    return `<section class="card">
      <div class="row"><p class="label" style="margin:0">${words().one}별 업데이트 이력 · ${esc(H.term)}년 편성</p><span class="only">${ICON.lock}지금 리더만</span></div>
      <p class="hint" style="margin-top:2px">${span}</p>
      <div class="table-wrap"><table class="hist-table">
        <thead><tr><th scope="col"><span class="sr">${words().one}</span></th>${head}</tr></thead>
        <tbody>${H.rows.map(r => `<tr><th scope="row">${esc(r.name)}</th>${r.marks.map((k, i) => `<td><span class="hc h-${k}" title="${n(ms[i])}월 ${HIST_LABEL[k]}"><span class="sr">${n(ms[i])}월 ${HIST_LABEL[k]}</span></span></td>`).join('')}</tr>`).join('')}</tbody>
      </table></div>
      <ul class="legend"><li><i class="sw edited"></i>손봄</li><li><i class="sw confirmed"></i>그대로 확인</li><li><i class="sw hollow"></i>지난달 그대로</li><li>빈칸: 기도제목 없음</li></ul>
      <p class="hint">${words().members}의 형편을 살피는 데 써요. 비율이나 순위는 보여 주지 않아요.</p></section>`;

  function shareCard() {
    const P = S.pending, title = `<h2><span aria-hidden="true">💬 </span>카톡방에 올릴 ${words().one}</h2>`;

    const posts = P.posts || {};

    if (!order.some(x => x.id === S.shareId)) S.shareId = up.id;  // 복사해서 순서가 바뀌어도 고른 가정은 그대로 둔다
    const f = order.find(x => x.id === S.shareId), text = shareText(f);

  function artCollection(list) {

  // 한 해 앨범은 지난해는 언제든, 올해는 12월 20일부터 연다
  const albumOpen = y => { const d = new Date(); return +y < d.getFullYear() || (+y === d.getFullYear() && d.getMonth() === 11 && d.getDate() >= 20); };
  // 한 해 마무리 앨범: 그해 그림을 한 화면에 모으고 "N일 기도했어요, N가정을 기억했어요"
  function albumHtml() {

        <div class="album-grid">${L.map(a => `<figure class="album-item">${sceneHtml(a.month, artN(a))}<figcaption>${esc(SCENES[sceneKey(a.month)].title)}</figcaption></figure>`).join('')}</div></div></div>`;

  // 나의 기도(설계서 10장 '누구를 위해 기도했나'): 내가 누른 기도했어요를 최근 6개월, 가정마다(목사님은 사랑방마다). 나만 본다
  function loadMyPrayers() {
    if (S.myp || S.mypLoading) return S.myp;

    api('myPrayers').then(r => { S.myp = r; S.mypLoading = false; paint(); })
      .catch(err => { S.mypLoading = false; S.myp = { err: err.code === 'bad' ? '서버 코드를 새 버전으로 배포하면 볼 수 있어요.' : err.message }; paint(); });

  }
  function myPrayView(P) {
    if (!P || P.err) return `<p class="hint" style="margin-top:12px">${P ? esc(P.err) : '불러오는 중…'}</p>`;

    const rows = P.rows.map(r => ({ r, total: r.cells.reduce((a, b) => a + b, 0), now: r.cells[last] }));
    const max = Math.max(1, ...rows.map(x => x.total)), low = Math.min(...rows.map(x => x.total));

        <p class="hint">${!max || rows.every(x => !x.total) ? '아직 누른 "기도했어요"가 없어요.' : least.length < rows.length ? `${least.map(esc).join(', ')}을 위해 조금 덜 기도했어요. 이번 주에 한 번 더 기억해 볼까요?` : `모든 ${esc(unit)}을 고르게 기억했어요.`}</p></section></div>

        <tbody>${rows.map(x => `<tr><th scope="row">${esc(x.r.name)}</th>${x.r.cells.map((n, i) => `<td><span class="mp-c l${lv(n)}${i === last ? ' now' : ''}" title="${mon(P.months[i])} ${n}번">${n || ''}</span></td>`).join('')}</tr>`).join('')}</tbody></table></div>
        <ul class="legend"><li><i class="sw mp-c l0"></i>없음</li><li><i class="sw mp-c l1"></i>1번</li><li><i class="sw mp-c l2"></i>2~3번</li><li><i class="sw mp-c l3"></i>4번 이상</li></ul></section></div></div>
      ${artCollection(P.art)}`;
  }
  // 지난 기록 검색: 내가 볼 수 있던 기도제목 중 낱말이 든 것. 누르면 그 달 기록으로 간다
  function searchView(R) {

      ${R.list.length ? `<ul class="sr-list">${R.list.map(x => `<li><button class="sr-item" data-act="srgo" data-v="${esc(x.to)}|${x.own ? 1 : 0}|${esc(x.roomId || '')}">

  function historyView() {

      ${staff && H.rooms ? (H.rooms.length ? `<div class="mchips" style="margin:10px 0 4px" role="radiogroup" aria-label="${esc(grp())}">${H.rooms.map(r => `<button class="mchip${r.id === H.roomId ? ' on' : ''}" role="radio" aria-checked="${r.id === H.roomId}" data-act="histroom" data-v="${esc(r.id)}">${esc(r.name)}</button>`).join('')}</div>` : '') : ''}
      <p class="hint">그 달의 ${esc(grp())} 모습 그대로 보여요. 해가 바뀌어 편성이 달라져도 그때 그대로예요.${staff ? ` 리더·목사님 항목까지 보이고, "${esc(words().only)}" 항목은 보이지 않아요.` : ''}</p>
      ${H.families.length ? `<div class="fam-grid wide hist-grid">${H.families.map((f, k) => `<section class="card"><h3>${esc(f.name)}${f.own ? `<span class="me-tag">${words().mine}</span>` : ''}${f.role === '리더' || f.role === '코리더' ? `<span class="me-tag">${f.role}</span>` : ''}</h3>${histItems(f.items, H.month + '-' + k)}</section>`).join('')}</div>`

  // 기도 타임라인(우리 가정만 봄): 기도제목마다 처음 올린 달부터 마지막 달까지 한 줄. 이전 항목ID로 이어진 것을 서버가 묶어 준다.
  //  누르면 처음 올린 달의 우리 가정 카드로 가서 잠깐 강조한다
  const prevMon = m => { const [y, mo] = m.split('-').map(Number); return mo === 1 ? (y - 1) + '-12' : y + '-' + String(mo - 1).padStart(2, '0'); };
  //  F가 있으면 목사님·장로님이 보는 다른 가정의 타임라인(리더·목사님 항목까지). 줄을 눌러 가는 곳은 없다
  function timelineCard(H, F) {
    const T = H.threads || [], now = H.now;
    if (!T.length) return `<p class="hint" style="margin-top:12px">${F ? '이 ' + words().one + '은 ' : ''}아직 올린 기도제목이 없어요.</p>`;

    const oldest = T.reduce((a, t) => t.from < a ? t.from : a, now), cols = [now];
    while (cols.length < 12 && cols[0] > oldest) cols.unshift(prevMon(cols[0]));
    const rows = T.filter(t => t.to >= cols[0]), live = T.filter(t => t.to === now && !t.ended);
    const len = t => { let n = 1; for (let m = t.to; m > t.from && n < 600; m = prevMon(m)) n++; return n; };

      <p class="hint">지금 이어지는 기도제목 ${live.length}개${live.length ? ` · 가장 오래된 것은 ${Math.max(...live.map(len))}개월째예요` : ''}. ${F ? `리더·목사님 항목까지 보이고, "${esc(words().only)}" 항목은 빠져요.` : '기도제목을 누르면 처음 올린 달의 카드로 가요.'}</p>

        <tbody>${rows.map(t => `<tr><th scope="row">${F ? `<span class="tl-go" title="${esc(t.text)}">${head(t)}</span>` : `<button class="tl-go" data-act="tlgo" data-v="${t.from}" title="${monthLabel(t.from, now)} 기도제목으로 가기: ${esc(t.text)}">${head(t)}</button>`}</th>${cols.map((m, k) => cell(t, m, k)).join('')}</tr>`).join('')}</tbody>

  // ── 표 보기·엑셀 내려받기 ──────────────────────────────

    return `<section class="card print-area"><div class="row"><p class="label">${esc(M.room.name)} · ${M.month.slice(0, 4)}년 ${Number(M.month.slice(5))}월</p>

  // 읽던 자리를 지키며 다시 그린다
  const psRender = () => { const P = $('#pss'), y = P.scrollTop; render(); P.scrollTop = y; };
  // 지금 장을 기도한 것으로 센다: 사랑방 가정은 기도했어요(하루 3번까지), 다른 장은 함께 기도한 것
  function psMark() {
    const ps = S.ps, id = ps.list[ps.i];
    if (id.startsWith('f:')) {
      const f = famById(id.slice(2)); if (!f || (f.today || 0) >= 3) return false;
      if (ps.prayed.indexOf(f.id) < 0) ps.prayed.push(f.id);

  }
  // 저절로 내려 보기(flow): 화면보다 긴 장만. 처음 몇 초는 머물고, 시간의 70%가 될 때까지 천천히 끝까지 내린 뒤 남은 시간은 맨 아래에 둔다

  let psRaf = 0;
  function psScroll() {
    cancelAnimationFrame(psRaf);

  // 모임 모드(설계서 S1): 모임 때 화면에 크게 띄워 한 가정씩 넘긴다. 사랑방 공개 항목만 나와서 회원 누구나 열 수 있다.
  //  가정을 다 넘기면 마지막 장에서 주기도문으로 함께 마친다
  const meetFams = () => S.month.families;
  function meetHtml() {

        ${its.length ? `<ul>${its.map(x => `<li><span class="tgt">${esc(SHARE_LABEL[x.target] || x.target)}</span><span>${esc(x.text)}</span></li>`).join('')}</ul>` : '<p class="hint">아직 올린 기도제목이 없어요.</p>'}</div>

  }
  function meetGo(i) { S.meet = Math.max(0, Math.min(meetFams().length, i)); S.meetSeen = Math.max(S.meetSeen || 1, S.meet + 1); render(); $('#pss').scrollTop = 0; }
  // 기도하는 동안 화면이 꺼지지 않게(되는 기기에서만)
  let wake = null;
  const wakeOn = () => { try { navigator.wakeLock.request('screen').then(w => { wake = w; }).catch(() => {}); } catch (e) { /* 안 되는 기기 */ } };

  // '기도했어요': 화면은 먼저 늘리고 서버에는 뒤에서 적는다. 서버가 돌려준 이번 달·오늘 횟수로 맞춘다
  function prayFor(f, hero) {
    artBump(f);
    const before = !staffMe() && roomFams().every(x => x.prayed > 0);
    if (!f.prayed) S.cordNew = f.id;
    f.today = (f.today || 0) + 1; f.prayed++; S.myp = null; S.flash = f.id;
    // 목사님·장로님: 그 사랑방 매듭을 이번 주 기도한 것으로(청장년부 기도의 끈)
    if (staffMe() && S.room && S.room.families.indexOf(f) >= 0) { const r = (S.month.rooms || []).find(x => x.id === S.room.room.id); if (r && !r.week) { r.week = true; S.roomNew = r.id; } }

      paint();
    }).catch(err => { const g = famById(f.id) || f; g.today--; g.prayed--; paint(); oops(err); });
  }

  // 잔잔한 음악: 찬송가 1~8장(송영) 연주 파일. 운영자가 만든 파일을 app/music/hymn-01.mp3 ~ hymn-08.mp3에 둔다(config.js의 MUSIC으로 위치를 바꿀 수 있다)
  //  곡은 소리 장치(Web Audio)로 직접 이어서 튼다. "기도 시작"을 누를 때 한 번 열어 두면, 곡이 끝나 다음 곡으로 넘어갈 때 휴대폰이 막지 않는다
  //  아이폰 무음 스위치가 켜져 있어도 들리게 재생용 소리로 알리고, 받아 올 수 없으면 audio 요소로 튼다
  const HYMNS = Array.from({ length: 8 }, (_, i) => ({ label: (i + 1) + '장', file: (CFG.MUSIC || 'music/') + 'hymn-' + String(i + 1).padStart(2, '0') + '.mp3' }));
  const Music = (() => {
    let ctx = null, node = null, gain = null, token = 0;

    }
    const label = () => document.querySelectorAll('.pss-music .trk').forEach(e => { e.textContent = HYMNS[PSET.track].label; });
    const ended = () => { if (!PSET.music || !S.ps) return; play(PSET.auto ? (PSET.track + 1) % HYMNS.length : PSET.track); label(); };
    const load = i => cache[i] || (cache[i] = fetch(HYMNS[i].file).then(r => { if (!r.ok) throw new Error('no file'); return r.arrayBuffer(); })
      .then(buf => new Promise((ok, bad) => ctx.decodeAudioData(buf, ok, bad))).catch(e => { delete cache[i]; throw e; }));
    function stopNode() {
      if (!node || !ctx) return;
      const n = node, g = gain; node = null; gain = null; n.onended = null;
      g.gain.cancelScheduledValues(ctx.currentTime); g.gain.setValueAtTime(g.gain.value, ctx.currentTime); g.gain.linearRampToValueAtTime(0, ctx.currentTime + .6);
      try { n.stop(ctx.currentTime + .7); } catch (e) { /* 이미 멈춤 */ }
    }
    player.addEventListener('ended', () => { if (!node) ended(); });
    function play(i) {
      stopNode(); player.pause(); PSET.track = i; savePset();
      const my = ++token, file = () => { player.src = HYMNS[i].file; player.currentTime = 0; player.play().catch(() => {}); };
      if (!ctx) return file();
      load(i).then(buf => {
        if (my !== token) return;
        gain = ctx.createGain(); gain.gain.setValueAtTime(0, ctx.currentTime); gain.gain.linearRampToValueAtTime(.8, ctx.currentTime + 1);
        node = ctx.createBufferSource(); node.buffer = buf; node.connect(gain).connect(ctx.destination);
        node.onended = () => { if (my === token) { node = null; ended(); } };
        node.start();
        load((i + 1) % HYMNS.length).catch(() => {});

  })();

  // ── 기존 시트 가져오기(관리자) ──────────────────────────
  // 구글 시트에서 복사한 글을 표로 바꾼다: 칸은 탭, 줄 바꿈이 든 칸은 "로 감싸고 안의 "는 ""로 쓴다
  function parseTSV(t) {
    const rows = [[]]; let cell = '', q = false;
    for (let i = 0; i < t.length; i++) {
      const ch = t[i];
      if (q) { if (ch === '"') { if (t[i + 1] === '"') { cell += '"'; i++; } else q = false; } else cell += ch; }
      else if (ch === '"' && cell === '') q = true;
      else if (ch === '\t') { rows[rows.length - 1].push(cell); cell = ''; }
      else if (ch === '\n' || ch === '\r') { if (ch === '\r' && t[i + 1] === '\n') i++; rows[rows.length - 1].push(cell); cell = ''; rows.push([]); }
      else cell += ch;
    }
    rows[rows.length - 1].push(cell);
    return rows;
  }
  // 사랑방 탭 하나 → { room, families: [{ a, b, kids, items: [{ target, text }] }] }
  //  맨 위 "○○ 사랑방" 칸이 사랑방 이름이고, [이름 칸][기도제목 칸]이 한 줄에 여러 쌍 있다. 이름은 "남편/아내"
  function readSheet(t) {
    const rows = parseTSV(t), cells = rows.flat().map(x => x.trim());
    const room = cells.find(x => /사랑방/.test(x) && x.length <= 20 && !/\n/.test(x)) || '';
    const families = [];
    rows.forEach(r => r.forEach((c, i) => {
      const name = c.trim(), text = (r[i + 1] || '').trim();
      if (!name || !text || /\n/.test(name) || name.length > 25 || /사랑방|기도제목/.test(name)) return;
      if (name.indexOf('/') < 0 && text.length < 10) return;
      const [a, b = ''] = name.split('/').map(x => x.trim());

    }));

  }
  // 성을 뺀 이름(김도윤 → 도윤). 기도제목 안에서는 이름만 쓰는 분이 많다
  const given = n => /^[가-힣]{3,4}$/.test(n) ? n.slice(1) : n;
  const RELATION = /부모|어머|아버|시댁|친정|가족|동생|형님|누나|언니|오빠|할머|할아|조부|장인|장모|시아|사위|며느리/;
  // 이름표 → 대상. 형제·남편 이름은 남편, 자매·아내 이름은 아내, 가정·함께는 우리 가정, 그 밖의 이름은 그대로(자녀 등)

    if (/^(자매|아내)$/.test(l)) return '아내';

    if (/^(양가\s*)?부모님$/.test(l)) return '부모님';

  const LABEL = '([^\\s\\d:：ㅡ\\-–—.]{1,8}(?:\\s[^\\s\\d:：ㅡ\\-–—.]{1,4})?(?:\\s*\\([^)]{1,8}\\))?)';
  const INLINE = new RegExp('^' + LABEL + '\\s*(?:ㅡ|:|：|-|–|—)\\s*(.+)$'), HEAD = new RegExp('^' + LABEL + '\\s*(?:ㅡ|:|：|-|–|—)?$');
  // 이 줄이 이름표로 시작하는지: 아는 호칭·가정 사람 이름은 언제나, 모르는 이름은 "다엘(8세)"처럼 나이가 붙었거나
  //  "요엘- …"처럼 4자 이하 + 구분 기호가 있을 때만(문장 첫 낱말을 이름으로 잘못 보지 않게)

    if (!known && !age && (head || /\s/.test(bare) || bare.length > 4)) return null;
    if (!known && !RELATION.test(bare) && fam.kids.indexOf(target) < 0) fam.kids.push(target);
    return { target, rest: head ? '' : m[2].trim(), head };
  }
  // 기도제목 칸 → 항목들. 번호(1.)·글머리(-)는 떼고, 이름표가 있으면 대상을 바꾼다.
  //  "형제ㅡ…" 바로 다음 줄이 이름표 없이 이어지면 앞 항목에 붙이고, 이름표만 있는 줄 아래 줄들은 하나씩 그 대상의 항목이 된다
  function splitItems(text, fam, guess) {
    const out = []; let cur = null, open = false;
    text.split('\n').forEach(line => {
      let s = line.trim();
      if (!s) { open = false; return; }
      const numbered = /^\d+\s*[.)]/.test(s); s = s.replace(/^\d+\s*[.)]\s*/, '');
      const bullet = /^[-•·*]\s*/.test(s); s = s.replace(/^[-•·*]\s*/, '');
      if (!s) return;
      const lab = labelOf(s, fam);
      if (lab && lab.head) { cur = lab.target; open = false; }
      else if (lab) { cur = lab.target; out.push({ target: cur, text: lab.rest }); open = true; }
      else if (open && !numbered && !bullet) out[out.length - 1].text += ' ' + s;
      else { out.push({ target: cur || (guess ? guess(s) : '우리 가정'), text: s }); open = false; }
    });
    return out.filter(i => i.text);
  }
  const famName = f => f.b ? f.a + ' · ' + f.b : f.a;
  function importView() {
    const I = S.imp;
    const head = `<button class="link back" data-act="tab" data-v="admin">${ICON.chevL}관리</button><p class="eyebrow">관리자</p><h1>기존 기도제목 가져오기</h1>`;
    if (I && I.done) return `${head}<section class="card"><h2>${esc(I.done.room)}을 가져왔어요</h2>
      <p>${I.done.families}가정 · 기도제목 ${I.done.items}개${I.done.made ? ` · 새로 만든 가정 ${I.done.made}` : ''}${I.done.replaced ? ` · 바꾼 가정 ${I.done.replaced}` : ''}</p>
      <p class="hint">모두 "${esc(grp())} 공개"로 들어갔어요. 가정마다 내 기도에서 공개 범위를 바꿀 수 있어요.</p>
      <button class="btn wide" data-act="impreset" style="margin-top:12px">다음 ${esc(grp())} 붙여 넣기</button></section>`;
    if (!I) return `${head}<p class="hint">구글 시트에서 ${esc(grp())} 탭 하나를 통째로 복사해(Ctrl+A → Ctrl+C) 아래에 붙여 넣어요. 한 번에 ${esc(grp())} 하나씩 가져와요.</p>
      <textarea id="imp-t" class="field" rows="8" placeholder="여기에 붙여 넣기"></textarea>
      <button class="btn wide" data-act="impparse" style="margin-top:8px">나눠 보기</button>
      <p class="hint">붙여 넣은 내용은 이 화면과 교회 구글 시트에만 들어가요.</p>`;
    const n = I.families.reduce((a, f) => a + f.items.length, 0);
    return `${head}<label class="f" for="imp-room">${esc(grp())} 이름</label><input id="imp-room" class="field" value="${esc(I.room)}">
      <p class="hint">${I.families.length}가정 · 기도제목 ${n}개로 나눴어요. 대상이 틀리면 고르고, 빼야 할 줄은 빼기를 눌러요.</p>
      ${I.families.map((f, fi) => `<section class="card"><h2>${esc(famName(f))}</h2>${f.kids.length ? `<p class="hint">자녀: ${f.kids.map(esc).join(', ')}</p>` : ''}
        ${f.items.map((it, ii) => `<div class="edit"><div class="edit-top"><select data-imp="${fi}.${ii}" aria-label="대상">${[...new Set([it.target, '우리 가정', '남편', '아내', ...f.kids, '부모님', '기타'])].map(t => `<option${t === it.target ? ' selected' : ''}>${esc(t)}</option>`).join('')}</select>
          <button class="link danger" data-act="impdrop" data-v="${fi}.${ii}" style="margin-left:auto">빼기</button></div><p style="margin:0;font-size:.92em">${esc(it.text)}</p></div>`).join('')}</section>`).join('')}
      <button class="btn wide" data-act="impgo" ${S.busy ? 'disabled' : ''}>${S.busy ? '가져오는 중…' : '이번 달 기도제목으로 가져오기'}</button>
      <button class="link" data-act="impreset" style="margin-top:8px">다시 붙여 넣기</button>
      <p class="hint">코이데에 이미 있는 가정은 이번 달 기도제목이 가져온 것으로 바뀌어요. 공개 범위는 모두 "${esc(grp())} 공개"로 들어가요.</p>`;
  }

  // 더보기: (리더) 이번 달 현황·카톡방에 올릴 가정·연결 승인·해제, 로그아웃
  const isLeaderRole = () => S.month.me.role === '리더' || S.month.me.role === '코리더';
  // 가정 관리(연결 승인·해제): 리더는 우리 사랑방, 관리자는 우리 부서의 모든 사랑방
  function manageCard() {
    const P = S.pending, me = S.month.me;

    }
    function arm() { clearTimeout(timer); t0 = performance.now(); timer = setTimeout(() => { if (i < SC.length - 1) show(i + 1); else stop(true); }, left); tick(); }
    function btn() { const b = el.querySelector('[data-iv=toggle]'); b.innerHTML = playing ? I.pause : I.play; b.setAttribute('aria-label', playing ? '멈추기' : '재생'); el.classList.toggle('paused', !playing); }
    function stop(end) { if (!playing) return; playing = false; clearTimeout(timer); left = end ? 0 : Math.max(0, left - (performance.now() - t0)); tick(); btn(); }
    function play() { if (playing) return; if (i === SC.length - 1 && left <= 0) { playing = true; btn(); return show(0); } playing = true; btn(); arm(); }
    function close() {
      if (!el) return;
      clearTimeout(timer); cancelAnimationFrame(raf); playing = false;
      document.removeEventListener('keydown', onKey, true); document.removeEventListener('visibilitychange', onHide);
      el.remove(); el = null; document.documentElement.classList.remove('iv-open');
      if (O.onEvent) O.onEvent('close', i + 1, SC.length);
      if (opener && opener.isConnected) opener.focus();
    }
    function onKey(e) {
      if (!el) return;
      if (e.key === 'Escape') { e.preventDefault(); e.stopPropagation(); close(); }
      else if (e.key === ' ' && !(e.target.closest && e.target.closest('button'))) { e.preventDefault(); playing ? stop() : play(); }
      else if (e.key === 'ArrowRight') { e.preventDefault(); show(i + 1); }
      else if (e.key === 'ArrowLeft') { e.preventDefault(); show(i - 1); }
      else if (e.key === 'Tab') { const f = [...el.querySelectorAll('button:not([disabled])')]; if (!f.length) return;
        if (e.shiftKey && document.activeElement === f[0]) { e.preventDefault(); f[f.length - 1].focus(); }
        else if (!e.shiftKey && document.activeElement === f[f.length - 1]) { e.preventDefault(); f[0].focus(); } }
    }
    const onHide = () => { if (document.hidden) stop(); };
    function open(opts) {
      if (el) close();
      O = opts || {}; SC = scenes(); opener = document.activeElement; playing = true;
      el = document.createElement('div');
      el.className = 'ivid'; el.setAttribute('role', 'dialog'); el.setAttribute('aria-modal', 'true'); el.setAttribute('aria-label', '코이데 소개 영상');
      el.innerHTML = `<div class="iv-top"><div class="iv-bars" aria-hidden="true">${SC.map(() => '<i><b></b></i>').join('')}</div>
          <button class="iv-btn sm" data-iv="x" aria-label="닫기">${I.x}</button></div>
        <div class="iv-stage" data-iv="stage"><div class="iv-sc"></div></div>
        <p class="iv-cap" aria-live="polite"></p>
        <div class="iv-ctl"><button class="iv-btn" data-iv="prev" aria-label="이전 장면">${I.prev}</button>
          <button class="iv-btn main" data-iv="toggle" aria-label="멈추기">${I.pause}</button>
          <button class="iv-btn" data-iv="next" aria-label="다음 장면">${I.next}</button></div>`;
      el.addEventListener('click', e => {
        const b = e.target.closest('[data-iv]'); if (!b) return;
        const a = b.dataset.iv;
        if (a === 'x') close();
        else if (a === 'prev') show(i - 1);
        else if (a === 'next') show(i + 1);
        else if (a === 'toggle' || a === 'stage') playing ? stop() : play();
        else if (a === 'replay') { playing = true; btn(); show(0); }
        else if (a === 'cta') { close(); if (O.onCta) O.onCta(); }
      });
      document.body.appendChild(el); document.documentElement.classList.add('iv-open');
      document.addEventListener('keydown', onKey, true); document.addEventListener('visibilitychange', onHide);
      show(0); btn(); el.querySelector('[data-iv=toggle]').focus();
      if (O.onEvent) O.onEvent('open', 1, SC.length);
    }
    return { open, close };
  })();

  // 마법사 상태 만들기: 예약이 있으면 그 내용으로 채워 둔다(고치기)
  function rgStart() {
    const D = S.rgData, P = D.plan, def = monAdd(D.month, Number(D.month.slice(5)) < 12 ? 12 - Number(D.month.slice(5)) : 1);
    const start = P ? P.start : def;
    S.rg = { step: 1, text: P ? P.rows.map(r => `${r.room}\t${r.name.split(' · ').join('/')}`).join('\n') : '', dec: {}, miss: {}, leaders: {}, co: {}, find: '',
      start, lf: P ? P.leaderFrom : dayAdd(start + '-01', -14), mf: P ? P.memberFrom : dayAdd(start + '-01', -7) };
    if (P) {
      rgMatch();
      P.leave.forEach(id => { S.rg.miss[id] = 'leave'; }); P.hold.forEach(id => { S.rg.miss[id] = 'hold'; });
      S.rg.res.rows.forEach((r, i) => { const p = P.rows.find(x => r.ex && x.familyId === r.ex.id); if (p && p.role === '리더') S.rg.leaders[r.room] = i; if (p && p.role === '코리더') S.rg.co[r.room] = i; });
    }
  }
  // 붙여 넣은 편성표를 지금 가정과 이름으로 맞춘다: 표기만 다르면(/, 띄어쓰기, 부부 순서) 자동, 한 사람만 같으면 확인, 처음 보는 이름은 새 가정
  function rgMatch() {
    const D = S.rgData, rg = S.rg, grpWord = grp().replace(/[.*+?^${}()|[\]\\]/g, '\\$&');
    const pool = D.current.map(f => ({ ...f, parts: f.name.split(' · '), key: nameKey(f.name.split(' · ')) }));
    (D.plan ? D.plan.rows : []).forEach(r => { if (!pool.some(f => f.id === r.familyId)) pool.push({ id: r.familyId, name: r.name, room: '', parts: r.name.split(' · '), key: nameKey(r.name.split(' · ')) }); });
    const used = new Set(), bad = [];
    const rows = rg.text.split(/\n+/).map(l => l.trim()).filter(Boolean).map(l => {
      const cut = l.indexOf('\t') > 0 ? [l.slice(0, l.indexOf('\t')), l.slice(l.indexOf('\t') + 1)] : (l.match(new RegExp('^(.+?' + grpWord + ')\\s*(.+)$')) || []).slice(1);
      if (cut.length < 2 || !cut[1].trim()) { bad.push(l); return null; }
      const parts = nameParts(cut[1]); if (!parts.length) { bad.push(l); return null; }
      const hit = pool.find(f => !used.has(f.id) && f.key === nameKey(parts));
      if (hit) used.add(hit.id);
      return { room: cut[0].trim(), raw: parts.join(' · '), parts, status: hit ? 'match' : '', ex: hit || null };
    }).filter(Boolean);
    rows.forEach(r => { if (r.status) return;
      const near = pool.find(f => !used.has(f.id) && f.parts.some(x => r.parts.includes(x)));
      if (near) { used.add(near.id); r.status = 'check'; r.ex = near; } else r.status = 'new'; });
    rg.res = { rows, bad, missing: D.current.filter(f => !used.has(f.id)) };
  }
  // 이 줄이 기존 가정인지(자동으로 맞췄거나 '같은 가정이에요'를 고름)
  const rgSame = i => { const r = S.rg.res.rows[i]; return r.status === 'match' || (r.status === 'check' && S.rg.dec[i] === 'same'); };
  const rgLabel = i => rgSame(i) ? S.rg.res.rows[i].ex.name : S.rg.res.rows[i].raw;
  const rgRooms = () => { const m = {}; S.rg.res.rows.forEach((r, i) => { (m[r.room] = m[r.room] || []).push(i); }); return m; };
  // 편성표에 없는 가정: 같은 가정이 아니라고 고른 '확인' 줄의 기존 가정도 여기로
  const rgMissing = () => [...S.rg.res.missing, ...S.rg.res.rows.filter((r, i) => r.status === 'check' && S.rg.dec[i] === 'new').map(r => r.ex)];
  function reorgView() {
    const D = S.rgData, rg = S.rg;
    const head = `<button class="link back" data-act="tab" data-v="admin">${ICON.chevL}관리</button>
      <div class="page-top"><div><p class="eyebrow">관리자 · ${esc(D ? D.dept.name : '')}</p><h1>${D ? D.next + '년 ' : ''}${esc(grp())} 개편</h1></div></div>`;
    if (!D || !rg) return head + '<p class="loading">불러오는 중…</p>';
    const stepper = `<ol class="stepper">${RG_STEPS.map((x, i) => `<li class="${i + 1 === rg.step ? 'on' : i + 1 < rg.step ? 'done' : ''}"><b>${i + 1}</b>${x}</li>`).join('')}</ol>`;
    const nav = (next, label, off) => `<div class="actions" style="margin-top:12px">${rg.step > 1 ? '<button class="btn ghost" data-act="rgback">이전</button>' : ''}<button class="btn" data-act="${next}"${off ? ' disabled' : ''}>${label}</button></div>`;
    if (rg.step === 1) return `${head}${stepper}<section class="card">
        <label class="label" for="rg-text">교회에서 받은 ${D.next}년 편성표를 그대로 붙여 넣으세요</label>
        <p class="hint">한 줄에 "${esc(grp())} 이름 + ${solo() ? '이름' : '가정 이름'}"이면 돼요. 엑셀에서 두 칸을 복사해 붙여도 되고, ${solo() ? '' : '"홍길동/김영희", "김영희 홍길동"처럼 '}표기가 달라도 괜찮아요. ${esc(grp())} 이름이 지금과 같으면 그대로 이어지고, 바뀐 이름은 새 ${esc(gj('이/가'))} 돼요.</p>
        <textarea id="rg-text" class="field rg-text" rows="10" placeholder="1-1 ${esc(grp())}&#9;${solo() ? '홍길동' : '홍길동/김영희'}">${esc(rg.text)}</textarea>
        ${rg.msg ? `<p class="hint warn-text">${esc(rg.msg)}</p>` : ''}
        ${nav('rgmatch', '맞춰 보기')}</section>`;
    const res = rg.res, idx = s => res.rows.map((r, i) => ({ r, i })).filter(x => x.r.status === s);
    if (rg.step === 2) {
      const checks = idx('check'), news = idx('new'), matches = idx('match'), undecided = checks.filter(x => !rg.dec[x.i]).length, miss = rgMissing();
      const names = Object.keys(rgRooms()), nowRooms = [...new Set(D.current.map(f => f.room))];
      const chip = (n, l, cls) => `<span class="sum-chip ${cls || ''}"><b>${n}</b>${l}</span>`;
      return `${head}${stepper}
        <section class="card"><div class="sum-chips">${chip(matches.length, '자동으로 맞춤', 'ok')}${chip(checks.length, '확인 필요', checks.length ? 'warn' : '')}${chip(news.length, '새 ' + words().one)}${chip(miss.length, '편성표에 없음')}</div>
          <p class="hint">표기만 다른 ${words().one}(/, 띄어쓰기, 부부 순서)은 자동으로 같은 ${words().one}으로 맞췄어요. 아래만 확인해 주세요.</p>
          ${res.bad.length ? `<p class="hint warn-text">읽지 못한 줄 ${res.bad.length}개: ${res.bad.slice(0, 3).map(esc).join(' / ')}${res.bad.length > 3 ? ' …' : ''}</p>` : ''}</section>
        <section class="card"><p class="label">${esc(grp())} ${names.length}곳</p>
          <ul class="rg-fams">${names.map(n => `<li><b>${esc(n)}</b><small>${nowRooms.includes(n) ? '그대로 이어져요' : '새 ' + esc(grp())}</small></li>`).join('')}</ul>
          ${nowRooms.filter(n => !names.includes(n)).length ? `<p class="hint">새 편성에 없는 ${esc(grp())}: ${nowRooms.filter(n => !names.includes(n)).map(esc).join(', ')}. 지난 기록에는 그대로 남아요.</p>` : ''}</section>
        ${checks.length ? `<section class="card"><p class="label">확인 필요 · 비슷한 이름</p>${checks.map(({ r, i }) => `<div class="rg-row">
            <div><b>${esc(r.raw)}</b><small>편성표 · ${esc(r.room)}</small><small>지금: ${esc(r.ex.name)} (${esc(r.ex.room)})</small></div>
            <div class="seg2">${[['same', '같은 ' + words().one + '이에요'], ['new', '새 ' + words().one + '이에요']].map(([v, l]) => `<button class="${rg.dec[i] === v ? 'on' : ''}" data-act="rgdec" data-v="${i}:${v}" aria-pressed="${rg.dec[i] === v}">${l}</button>`).join('')}</div></div>`).join('')}</section>` : ''}
        ${news.length ? `<section class="card"><p class="label">새 ${words().one} · 바뀌는 날부터 목록에 나오고, 처음 들어올 때 카카오로 연결해요</p><ul class="rg-fams">${news.map(({ r }) => `<li>${esc(r.raw)} <small>${esc(r.room)}</small></li>`).join('')}</ul></section>` : ''}
        ${miss.length ? `<section class="card"><p class="label">편성표에 없는 ${words().one}</p>${miss.map(f => `<div class="rg-row">
            <div><b>${esc(f.name)}</b><small>${D.now}년 ${esc(f.room || '')}</small></div>
            <div class="seg2">${[['leave', '떠남'], ['hold', '편성 보류']].map(([v, l]) => `<button class="${(rg.miss[f.id] || 'leave') === v ? 'on' : ''}" data-act="rgmiss" data-v="${esc(f.id)}:${v}" aria-pressed="${(rg.miss[f.id] || 'leave') === v}">${l}</button>`).join('')}</div></div>`).join('')}
          <p class="hint">떠남이어도 기록은 남고 목록에서만 빠져요. 편성 보류는 사랑방이 정해질 때까지 "새 편성을 정하고 있어요" 안내가 나와요. 둘 다 바뀌는 날부터예요.</p></section>` : ''}
        ${matches.length ? `<details class="card rg-match"><summary>자동으로 맞춘 ${words().one} ${matches.length}${words().count} 보기</summary><ul class="rg-fams">${matches.map(({ r }) => `<li>${esc(r.raw)} → ${esc(r.ex.name)} <small>${esc(r.room)}</small></li>`).join('')}</ul></details>` : ''}
        ${nav('rgnext', undecided ? `확인 필요 ${undecided}개 남음` : '다음: 리더 정하기', undecided)}`;
    }
    const rooms = rgRooms();
    if (rg.step === 3) return `${head}${stepper}<div class="room-board">${Object.keys(rooms).map((n, k) => `<section class="card">
        <h3>${esc(n)}</h3><p class="hint">${rooms[n].length}${words().count}</p>
        <label class="label" for="rg-l-${k}">리더</label><select id="rg-l-${k}" class="field" data-rg="leaders" data-room="${esc(n)}"><option value="">아직 안 정함</option>${rooms[n].map(i => `<option value="${i}"${rg.leaders[n] === i ? ' selected' : ''}>${esc(rgLabel(i))}</option>`).join('')}</select>
        <label class="label" for="rg-c-${k}" style="margin-top:8px">코리더 · 없으면 비워 두세요</label><select id="rg-c-${k}" class="field" data-rg="co" data-room="${esc(n)}"><option value="">없음</option>${rooms[n].map(i => `<option value="${i}"${rg.co[n] === i ? ' selected' : ''}>${esc(rgLabel(i))}</option>`).join('')}</select>
      </section>`).join('')}</div>
      <p class="hint">리더를 정하지 않은 ${esc(gj('은/는'))} 바뀐 뒤 관리 화면에서 정할 수 있어요.</p>${nav('rgnext', '다음: 확인과 예약')}`;
    // 4. 미리보기(구성과 이동만, 기도제목 내용은 바뀌는 날부터)와 날짜
    const from = i => rgSame(i) ? (res.rows[i].ex.room || '') : '';
    const moves = [...res.rows.map((r, i) => ({ name: rgLabel(i), from: from(i) || '새 ' + words().one, to: r.room })),
      ...rgMissing().map(f => ({ name: f.name, from: f.room, to: (rg.miss[f.id] || 'leave') === 'leave' ? '떠남' : '편성 보류' }))];
    const role = (n, i) => rg.leaders[n] === i ? ' <small>리더</small>' : rg.co[n] === i ? ' <small>코리더</small>' : '';
    const months = Array.from({ length: 6 }, (_, k) => monAdd(D.month, k + 1));
    return `${head}${stepper}
      <section class="card"><p><b>${Object.keys(rooms).length}개 ${esc(grp())}, ${res.rows.length}${words().count}</b>으로 ${D.next}년 편성을 만들어요.</p>
        <p class="hint">미리보기에는 구성과 이동만 나와요. 기도제목 내용은 바뀌는 날부터 새 ${esc(grp())}에 보여요.</p></section>
      <div class="room-board">${Object.keys(rooms).map(n => { const c = {}; rooms[n].forEach(i => { const k = from(i) || '새 ' + words().one; c[k] = (c[k] || 0) + 1; });
        return `<section class="card"><h3>${esc(n)}</h3><div class="comp">${Object.entries(c).map(([k, v]) => `<span class="comp-chip">${esc(k)}${k.startsWith('새 ') ? '' : '에서'} ${v}</span>`).join('')}</div>
          <ul class="rg-fams">${rooms[n].map(i => `<li>${esc(rgLabel(i))}${role(n, i)}</li>`).join('')}</ul></section>`; }).join('')}</div>
      <section class="card"><p class="label">${words().one}별 이동표</p>
        <input id="rg-find" class="field" type="search" placeholder="이름으로 찾기" aria-label="이름으로 찾기" value="${esc(rg.find)}" autocomplete="off">
        <div class="table-wrap"><table class="mv-table"><thead><tr><th scope="col">${solo() ? '이름' : '가정'}</th><th scope="col">${D.now}년</th><th scope="col">${D.next}년</th></tr></thead>
          <tbody>${moves.map(m => `<tr data-name="${esc(m.name)}"${rg.find && !m.name.includes(rg.find) ? ' hidden' : ''}><th scope="row">${esc(m.name)}</th><td>${esc(m.from)}</td><td class="${m.to === '떠남' || m.to === '편성 보류' ? 'muted' : 'to'}">${esc(m.to)}</td></tr>`).join('')}</tbody></table></div></section>
      <section class="card"><p class="label">날짜</p><div class="rg-dates">
        <label>바뀌는 날<select class="field" data-rg="start">${months.map(m => `<option value="${m}"${rg.start === m ? ' selected' : ''}>${monName(m)} 1일</option>`).join('')}</select></label>
        <label>새 리더에게 맡을 ${words().one} 명단 보여 주기<input class="field" type="date" data-rg="lf" value="${rg.lf}" max="${dayAdd(rg.start + '-01', -1)}"></label>
        <label>회원에게 "${Number(rg.start.slice(5))}월부터 ○○ ${esc(gj('이에요/예요'))}" 안내하기<input class="field" type="date" data-rg="mf" value="${rg.mf}" max="${dayAdd(rg.start + '-01', -1)}"></label></div>
        <p class="hint">바뀌는 날 0시에 새 편성이 저절로 적용돼요. 그 전까지는 ${D.now}년 편성이 그대로이고, 예약은 언제든 고치거나 취소할 수 있어요. 카카오 연결과 기도 기록은 그대로 따라가요.</p></section>
      ${rg.msg ? `<p class="hint warn-text">${esc(rg.msg)}</p>` : ''}
      ${nav('rgsave', S.busy ? '예약하는 중…' : `${monName(rg.start)} 1일에 바뀌도록 예약`, S.busy)}`;
  }

      <div class="page-top"><div><p class="eyebrow">${S.month.dept && S.month.dept.name ? esc(S.month.dept.name) : '관리자'}${S.op ? (S.month.me.all ? ' · 전체 관리자' : ' · 운영 지원') : ''}${S.op && S.month.dept.closed ? ' · 닫힌 부서' : ''}</p><h1>${tab === 'analysis' ? '분석' : '관리'}</h1></div></div>${seg}`;

        fold('groups', '교회 안 모임', G ? (G.length ? G.length + '개' : '아직 없어요') : '불러오는 중…', groupsAllCard())
      ],
      ops: [
        opsProblems().length ? '' : `<div class="fold ops-fold">${opsCard().replace(/^\s*<section[^>]*>/, '').replace(/<\/section>\s*$/, '')}</div>`,
        privacyN() ? '' : fold('privacy', '개인정보 요청', O ? (O.privacy.later ? `떠난 ${words().one} ${O.privacy.later}곳 · 1년이 되면 올라와요` : '지울 기록이 없어요') : '불러오는 중…', privacyCard()),
        fold('changes', '변경 기록', '누가 언제 무엇을 바꿨는지', changesCard(false)),
        fbNew() ? '' : fold('feedback', '의견함', O ? (O.feedback.length ? `받은 의견 ${O.feedback.length}` : '아직 없어요') : '불러오는 중…', feedbackCard()),
      ],

        solo() || S.op ? '' : fold('import', '기존 기도제목 가져오기', `구글 시트의 ${esc(grp())} 탭을 붙여 넣어 옮겨요`, `<p class="hint">지금 쓰는 구글 시트의 ${esc(grp())} 탭을 붙여 넣어 이번 달 기도제목으로 옮겨요.</p><button class="btn small ghost" data-act="tab" data-v="import">가져오기 열기</button>`),

    return `${head}

        <p class="more-h">편성</p>${rosterCard()}

  // ── ⑤ 초대 링크 · QR: 링크로 들어온 사람은 부서·사랑방 고르기를 건너뛴다. 승인은 지금처럼 리더가 ──
  const JOIN = 'koide-join';

        S.ps = { list, i: 0, dur: PSET.dur, left: PSET.dur, flow: !!(PSET.flow && PSET.dur), cd: 0, pt0: Date.now(), prayed: [], extra: [], done: false, t0: Date.now(), seen: 1 };
        track('기도하기 시작', { kinds: PSET.kinds.join('·'), cards: list.length, secs: PSET.dur, music: !!PSET.music, flow: S.ps.flow });
        if (PSET.music) { Music.unlock(); Music.play(PSET.track); }
        wakeOn(); render(); psTick(); return psScroll();
      }
      case 'psprev': return S.ps.i > 0 && psGo(S.ps.i - 1);
      case 'psnext': return psGo(S.ps.i + 1);
      case 'pspray': case 'psextra': return psMark() && psGo(S.ps.i + 1);
      case 'psstay': clearInterval(psTimer); S.ps.cd = 0; S.ps.stay = true; return psRender();
      case 'psflow': PSET.flow = !PSET.flow; savePset(); return render();
      case 'psend': S.ps.done = true; clearInterval(psTimer); return render();
      case 'psclose':
        // 몇 장까지 봤는지, 끝 장까지 가기 전에 끝냈는지(early: '끝내기'도 마친 화면을 보여 주므로 본 장 수로 정한다), 머문 시간(분)
        { const seen = Math.min(S.ps.list.length, Math.max(S.ps.seen || 1, S.ps.i + 1));
          track('기도하기 마침', { kinds: PSET.kinds.join('·'), cards: S.ps.list.length, seen, mins: (Date.now() - S.ps.t0) / 60000, music: !!PSET.music, early: seen < S.ps.list.length }); }
        clearInterval(psTimer); S.ps = null; Music.off(); wakeOff(); return render();
      case 'meet': S.meet = 0; S.meetSeen = 1; S.menu = null; wakeOn(); track('모임 모드 시작', { cards: meetFams().length + 1 }); return render();
      case 'meetprev': return meetGo(S.meet - 1);
      case 'meetnext': return meetGo(S.meet + 1);
      case 'meetclose': track('모임 모드 마침', { cards: meetFams().length + 1, seen: S.meetSeen }); S.meet = null; wakeOff(); return render();
      case 'impparse': {
        const r = readSheet($('#imp-t').value);
        if (!r.families.length) return toast('가정을 찾지 못했어요. 시트의 ' + grp() + ' 탭을 통째로 복사해 주세요.');
        S.imp = r; render(); return window.scrollTo(0, 0);
      }
      case 'impdrop': { const [fi, ii] = v.split('.').map(Number); S.imp.families[fi].items.splice(ii, 1); return render(); }
      case 'impreset': S.imp = null; render(); return window.scrollTo(0, 0);
      case 'impgo': {
        const room = $('#imp-room').value.trim(); if (!room) return toast(grp() + ' 이름을 적어 주세요.');
        S.busy = true; render();
        try { S.imp = { done: await api('importRoom', { roomName: room, families: S.imp.families }) }; S.month = await api('month'); }
        catch (err) { oops(err); }
        S.busy = false; render(); return window.scrollTo(0, 0);
      }
      case 'copyremind': return copy('remind', remindText());
      case 'sharepick': S.shareId = id; S.copied = null; return render();
      // 카톡용 복사 = 오늘 올림. 화면은 먼저 바꾸고, 서버가 실패하면 되돌린다
      case 'copyshare': case 'unpost': {
        const P = S.pending, before = P.posts[id], on = b.dataset.act === 'copyshare';
        if (on) copy('share-' + id, shareText(S.month.families.find(x => x.id === id)));
        if (on) P.posts[id] = P.today; else { delete P.posts[id]; S.copied = null; }
        render();
        try { S.pending = await api(on ? 'post' : 'unpost', { familyId: id }); render(); }
        catch (err) { if (before) P.posts[id] = before; else delete P.posts[id]; render(); oops(err); }
        return;
      }
      case 'stadd': S.staffEdit = { serve: true }; return render();
      case 'stedit': { const s = S.pending.staff.find(x => x.familyId === v), [a, b = ''] = s.name.split(' · '); S.staffEdit = { familyId: v, a, b, title: s.title, label: s.label, serve: s.serve }; return render(); }
      case 'stcancel': S.staffEdit = null; return render();
      case 'sttitle': keepStaff(); S.staffEdit.title = v; return render();
      case 'stserve': keepStaff(); S.staffEdit.serve = S.staffEdit.serve === false; return render();
      case 'stend': {
        const s = S.pending.staff.find(x => x.familyId === v);
        if (!confirm(s.label + '을(를) 교역자 목록에서 마칠까요? 연결도 풀리고, 기도제목 기록은 남아요.')) return;
        try { S.pending = await api('endStaff', { familyId: v }); render(); toast('교역자 목록에서 마쳤어요.'); } catch (err) { oops(err); }
        return;
      }
      case 'approve': case 'reject': case 'unlink':
        try { S.pending = await api(b.dataset.act, { kakaoId: v }); render(); toast(b.dataset.act === 'approve' ? '승인했어요.' : b.dataset.act === 'reject' ? '거절했어요.' : '연결을 해제했어요.'); } catch (err) { oops(err); }
        return;
    }
  });
  // 모임 모드: PC나 TV에 띄웠을 때 키보드 왼쪽·오른쪽 화살표로 넘기고, Esc로 닫는다
  document.addEventListener('keydown', e => {
    if (e.key === 'Escape' && !$('#pop').hidden) { S.a2hs = false; return render(); }
    if (S.meet == null || S.ps || S.view !== 'app') return;
    if (e.key === 'Escape') { track('모임 모드 마침', { cards: meetFams().length + 1, seen: S.meetSeen }); S.meet = null; wakeOff(); render(); }
    else if (e.key === 'ArrowRight') meetGo(S.meet + 1);
    else if (e.key === 'ArrowLeft') meetGo(S.meet - 1);
  });
  // 글을 쓰는 칸은 글 길이에 맞춰 높이가 늘어난다(길게 써도 칸 안에서 스크롤하지 않게)
  function autosize(t) { t.style.height = 'auto'; t.style.height = (t.scrollHeight + 2) + 'px'; }
  document.addEventListener('input', e => {
    if (e.target.id === 'fb-t') { const n = $('#fb-n'); if (n) n.textContent = [...e.target.value].length; }
    if (e.target.matches('textarea.field')) autosize(e.target);
    // 개편 미리보기의 이동표 찾기: 다시 그리지 않고 줄만 숨긴다
    if (e.target.id === 'rg-find' && S.rg) { S.rg.find = e.target.value.trim(); document.querySelectorAll('.mv-table tbody tr').forEach(tr => { tr.hidden = !!S.rg.find && !tr.dataset.name.includes(S.rg.find); }); }
  });
  // 칸을 벗어나면(내용·대상) 저장
  document.addEventListener('change', e => {
    const t = e.target;
    if (t.dataset.imp) { const [fi, ii] = t.dataset.imp.split('.').map(Number); S.imp.families[fi].items[ii].target = t.value; return; }
    // 연도 개편: 리더·코리더 고르기, 날짜(바뀌는 달을 바꾸면 안내 날짜도 2주·1주 전으로 다시 맞춘다)
    if (t.dataset.rg && S.rg) {
      const k = t.dataset.rg, rg = S.rg;
      if (k === 'leaders' || k === 'co') { if (t.value === '') delete rg[k][t.dataset.room]; else rg[k][t.dataset.room] = Number(t.value); }
      else if (k === 'start') { rg.start = t.value; rg.lf = dayAdd(t.value + '-01', -14); rg.mf = dayAdd(t.value + '-01', -7); }
      else if (t.value) rg[k] = t.value;
      return render();
    }
    if (t.matches('textarea[data-id]')) {
      const id = t.dataset.id, i = itemOf(id), text = t.value.trim(), target = i.target;
      if (!text || text === i.text) return;
      // 칸에는 이미 고친 글이 보이니 다시 그리지 않고 기억만 바꾼다(칸을 벗어나며 바로 누른 탭이 그대로 눌리게)
      Object.assign(i, { text, target });
      const body = { id, target, text, scope: i.scope };
      save(() => api('saveItem', body));
      track('기도제목 저장', { items: 1, split: false });
    }
  });
  // 교역자 칸의 글을 기억한다(직분·스위치를 바꾸며 다시 그려도 남게)
  function keepStaff() { const E = S.staffEdit; if (!E) return; [['a', '#st-a'], ['b', '#st-b'], ['label', '#st-l']].forEach(([k, s]) => { const x = $(s); if (x) E[k] = x.value.trim(); }); }
  document.addEventListener('submit', async e => {
    e.preventDefault();
    const f = e.target;
    if (f.dataset.form === 'gcreate') {
      const n = f.elements.n.value.trim(); if (!n) return toast('모임 이름을 적어 주세요.');
      S.busy = true; render();
      try { const r = await api('groupCreate', { name: n }); S.me = r.me; S.gNew = false; toast(`"${n}" 모임을 만들었어요. 초대 링크를 보내 보세요.`); S.busy = false; await enterGroup(r.id); S.tab = 'more'; return render(); }
      catch (err) { oops(err); }
      S.busy = false; return render();
    }
    if (f.dataset.form === 'grename') {
      const n = f.elements.n.value.trim(); if (!n) return;
      try { S.month = await api('groupRename', { name: n }); S.gEdit = null; toast('이름을 바꿨어요.'); } catch (err) { oops(err); }
      return render();
    }
    if (f.dataset.form === 'rsroom' || f.dataset.form === 'rsrename') {
      const n = f.elements.n.value.trim(); if (!n) return;
      S.rostEdit = null;
      return rosterDo(f.dataset.form === 'rsroom' ? { op: 'addRoom', name: n } : { op: 'renameRoom', roomId: f.dataset.v, name: n }, f.dataset.form === 'rsroom' ? josa(n, '을/를') + ' 만들었어요.' : '이름을 바꿨어요.');
    }
    if (f.dataset.form === 'rsadd') {
      const a = f.elements.a.value.trim(), bb = f.elements.b ? f.elements.b.value.trim() : ''; if (!a) return;
      S.rostEdit = null;
      return rosterDo({ op: 'addPerson', roomId: f.dataset.v, a, b: bb }, '더했어요.');
    }
    if (f.dataset.form === 'deptsave') {
      const E = S.deptNew || { group: '순', unit: '개인' }, name = ($('#dp-n') || {}).value.trim();
      if (!name) return toast('부서 이름을 적어 주세요.');
      S.busy = true; render();
      try { const r = await api('deptSave', { name, group: E.group, unit: E.unit }); S.me = r.me; S.deptNew = null; toast(josa(name, '을/를') + ' 만들었어요.'); S.busy = false; return enterOps(r.id); }
      catch (err) { oops(err); }
      S.busy = false; return render();
    }
    if (f.dataset.form === 'staffsave') {
      keepStaff(); const E = S.staffEdit; S.busy = true; render();
      try { S.pending = await api('saveStaff', { familyId: E.familyId, a: E.a, b: E.b, title: E.title || STAFF_TITLES[0], label: E.label, serve: E.serve !== false }); S.staffEdit = null; toast('교역자를 저장했어요.'); } catch (err) { oops(err); }
      S.busy = false; return render();
    }
    if (f.dataset.form === 'typename') {
      const n = ($('#tn-a') || {}).value.trim(); if (!n) return;
      S.pick.person = n; S.pick.byName = true; delete S.pick.newFamily; S.view = 'consent'; return render();
    }
    if (f.dataset.form === 'newfam') {
      const val = id => { const x = $(id); return x ? x.value.trim() : ''; };
      S.pick.newFamily = { a: val('#nf-a'), b: val('#nf-b'), kids: val('#nf-k') };
      S.view = 'consent'; return render();
    }
    if (f.dataset.form === 'famsave') {
      keepFam(); const E = S.famEdit; if (!E.a) return toast('이름을 적어 주세요.');
      S.busy = true; render();
      try { S.month = await api('saveFamily', { a: E.a, b: E.b, kids: E.kids }); S.famEdit = null; S.famMsg = '저장했어요.'; refreshMe(true); }
      catch (err) { oops(err); }
      S.busy = false; return render();
    }
    if (f.dataset.form === 'histq') {
      const q = f.querySelector('input').value.trim(); if (!q) { S.sr = null; return render(); }
      try { S.sr = await api('search', { q }); track('화면 보기', { screen: '검색' }); } catch (err) { oops(err); }
      return render();
    }
    if (f.dataset.form === 'grpcustom') { const v = f.querySelector('input').value.trim(); if (v) { S.grpPick = v; render(); } return; }
    if (f.dataset.form === 'tdadd') { const v = f.querySelector('input').value.trim(); if (v) topicWord(f.dataset.topic, v, false); return; }
    if (f.dataset.form === 'tgtcustom') { const v = f.querySelector('input').value.trim(); if (v) setTarget(f.dataset.id, v); return; }

  });

  // 스크롤: 아래로 내리면 상단 바와 하단 바가 함께 숨고, 조금이라도 올리면 다시 보인다(메뉴가 열렸거나 기도하는 중에는 그대로)
  let lastY = window.scrollY, ticking = false;
  window.addEventListener('scroll', () => {
    if (ticking) return; ticking = true;
    requestAnimationFrame(() => {
      ticking = false;
      const y = window.scrollY, dy = y - lastY;
      if (S.menu || S.ps || S.meet != null) { lastY = y; return; }
      if (y < 40 || dy < -6) document.body.classList.remove('hide-bars');
      else if (dy > 6) document.body.classList.add('hide-bars');
      else return;
      lastY = y;
    });
  }, { passive: true });

  // 글을 쓰는 동안 숨긴 아래 메뉴는 조금 늦게 다시 보여 준다. 키보드가 내려가며 화면이 움직이는 사이에 누른 더하기가 메뉴에 가로채이지 않게
  let typingOff;
  function hideTypingSoon() { clearTimeout(typingOff); typingOff = setTimeout(() => document.body.classList.remove('typing'), 600); }
  document.addEventListener('focusin', e => { if (e.target.matches('textarea, input, select')) { clearTimeout(typingOff); document.body.classList.add('typing'); } });
  document.addEventListener('focusout', hideTypingSoon);

  // 홈 화면 앱: 화면 파일을 기기에 남겨 두는 도우미(sw.js). https나 내 컴퓨터(localhost)에서만 된다
  if ('serviceWorker' in navigator && (location.protocol === 'https:' || location.hostname === 'localhost')) navigator.serviceWorker.register('sw.js').catch(() => { /* 없어도 앱은 그대로 */ });

  // 시작하다 막히면 "불러오는 중"에 멈춰 있지 않고 다시 해 보기 버튼을 보여 준다
  boot().catch(e => { S.view = 'error'; S.err = e; render(); });
})();
</script>
</body>
</html>
