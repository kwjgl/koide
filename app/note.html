<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#2B6A62">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="코이데">
<title>코이데 기도 노트</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Gowun+Batang:wght@700&family=IBM+Plex+Sans+KR:wght@400;500;600&display=swap">
<script>
/* 화면 모드·색 테마·디자인·큰 글씨: 공동체 앱과 같은 설정(이 기기에만). 화면이 그려지기 전에 먼저 입힌다 */
try { const p = JSON.parse(localStorage.getItem('koide-pref') || '{}'), d = document.documentElement;
  if (p.mode === 'light' || p.mode === 'dark') d.dataset.mode = p.mode;
  if (p.accent && p.accent !== 'green') d.dataset.accent = p.accent;
  if (p.style && p.style !== 'flat') d.dataset.style = p.style;
  if (p.big) d.dataset.big = ''; } catch (e) { /* 무시 */ }
</script>
<style>
/* 코이데 기도 노트: 공동체 앱(index.html)과 같은 폴더·같은 홈 화면 앱 안의 '나' 공간. 같은 색·글꼴·설정(화면 모드, 색 테마, 큰 글씨).
   기록은 이 기기에만 저장하고 서버로 보내지 않는다. 공동체로는 '사랑방에 나누기'(글만 넘겨 내 기도에서 고르고 저장)와 '공동체로' 링크로 오간다 */
:root {
  --page: #F3F5F2; --surface: #FFFFFF; --surface-2: #EEF2EF;
  --ink: #1B2523; --ink-2: #5B6965; --line: #DDE4E0; --line-strong: #B9C4BF;
  --accent: #2B6A62; --accent-mid: #8DBDB5; --accent-soft: #DCEBE7; --on-accent: #FFFFFF;
  --warm: #9A5A14; --warm-soft: #F5E8D6; --shadow: rgba(20, 35, 32, .14);
  --leader: #62519E; --private: #E8ECEA; --neu-hi: rgba(255, 255, 255, .9); --neu-lo: rgba(20, 35, 32, .17);
  --wood: #B98756; --wood-back: #E9D9C2; --plaque: #FBF6EC; --linen: #EFE6D6;
  --f-display: 'Gowun Batang', 'AppleMyungjo', 'Batang', serif;
  --f-body: 'IBM Plex Sans KR', 'Apple SD Gothic Neo', 'Malgun Gothic', sans-serif;
  --base: 16px;
}
@media (prefers-color-scheme: dark) { :root:not([data-mode="light"]) {
  --page: #141B19; --surface: #1C2522; --surface-2: #232D2A;
  --ink: #E5ECE9; --ink-2: #9CAAA5; --line: #2D3935; --line-strong: #4A5853;
  --accent: #7CC2B7; --accent-mid: #3F7C73; --accent-soft: #1E3934; --on-accent: #0F1A18;
  --warm: #E2A563; --warm-soft: #3A2C1B; --shadow: rgba(0, 0, 0, .5); --leader: #B6A8EA; --private: #252E2B; --neu-hi: rgba(255, 255, 255, .06); --neu-lo: rgba(0, 0, 0, .6); --wood: #7A5636; --wood-back: #3A2E24; --plaque: #2B2620; --linen: #3A3328; color-scheme: dark; } }
:root[data-mode="dark"] {
  --page: #141B19; --surface: #1C2522; --surface-2: #232D2A;
  --ink: #E5ECE9; --ink-2: #9CAAA5; --line: #2D3935; --line-strong: #4A5853;
  --accent: #7CC2B7; --accent-mid: #3F7C73; --accent-soft: #1E3934; --on-accent: #0F1A18;
  --warm: #E2A563; --warm-soft: #3A2C1B; --shadow: rgba(0, 0, 0, .5); --leader: #B6A8EA; --private: #252E2B; --neu-hi: rgba(255, 255, 255, .06); --neu-lo: rgba(0, 0, 0, .6); --wood: #7A5636; --wood-back: #3A2E24; --plaque: #2B2620; --linen: #3A3328; color-scheme: dark; }
/* 큰 글씨와 색 테마: 공동체 앱과 같은 값 */
:root[data-big] { --base: 19px; }
@media (min-width: 1000px) { :root[data-big] { --base: 18px; } }
:root[data-accent="amber"] { --page:#F7F2EA;--surface:#FFFDF9;--surface-2:#F1EADF;--ink:#2A221B;--ink-2:#6E6155;--line:#E6DCCD;--line-strong:#C9B9A3;--accent:#A9561B;--accent-mid:#E2B07F;--accent-soft:#F6E3CF;--on-accent:#FFFFFF;--private:#EFE8DE; }
@media (prefers-color-scheme: dark) { :root[data-accent="amber"]:not([data-mode="light"]) { --page:#1A1612;--surface:#231E19;--surface-2:#2B241E;--ink:#EEE6DC;--ink-2:#AE9F8E;--line:#3A3129;--line-strong:#5A4D41;--accent:#E9A066;--accent-mid:#8A5A32;--accent-soft:#3A2818;--on-accent:#1E140C;--private:#2E2721; } }
:root[data-accent="amber"][data-mode="dark"] { --page:#1A1612;--surface:#231E19;--surface-2:#2B241E;--ink:#EEE6DC;--ink-2:#AE9F8E;--line:#3A3129;--line-strong:#5A4D41;--accent:#E9A066;--accent-mid:#8A5A32;--accent-soft:#3A2818;--on-accent:#1E140C;--private:#2E2721; }
:root[data-accent="blue"] { --page:#F2F4F8;--surface:#FFFFFF;--surface-2:#EAEEF4;--ink:#1B2230;--ink-2:#5A6475;--line:#DCE2EB;--line-strong:#B6C0CF;--accent:#2F5D95;--accent-mid:#93AFD3;--accent-soft:#DCE6F3;--on-accent:#FFFFFF;--private:#E8EBF0; }
@media (prefers-color-scheme: dark) { :root[data-accent="blue"]:not([data-mode="light"]) { --page:#12161D;--surface:#1A2029;--surface-2:#212833;--ink:#E4E9F0;--ink-2:#9AA5B5;--line:#2C3542;--line-strong:#485466;--accent:#8EB4E6;--accent-mid:#3C5B85;--accent-soft:#1D2C42;--on-accent:#0E1622;--private:#232A35; } }
:root[data-accent="blue"][data-mode="dark"] { --page:#12161D;--surface:#1A2029;--surface-2:#212833;--ink:#E4E9F0;--ink-2:#9AA5B5;--line:#2C3542;--line-strong:#485466;--accent:#8EB4E6;--accent-mid:#3C5B85;--accent-soft:#1D2C42;--on-accent:#0E1622;--private:#232A35; }
:root[data-accent="rose"] { --page:#F8F2F3;--surface:#FFFDFD;--surface-2:#F2E8EA;--ink:#2A1E21;--ink-2:#6E5B60;--line:#E8DADD;--line-strong:#CDB6BC;--accent:#A8435C;--accent-mid:#DDA2B1;--accent-soft:#F5DFE5;--on-accent:#FFFFFF;--private:#F0E7E9; }
@media (prefers-color-scheme: dark) { :root[data-accent="rose"]:not([data-mode="light"]) { --page:#1A1416;--surface:#231B1E;--surface-2:#2B2226;--ink:#EEE3E6;--ink-2:#B09CA2;--line:#3A2D31;--line-strong:#5A464C;--accent:#E896AB;--accent-mid:#86475A;--accent-soft:#3B2029;--on-accent:#200E14;--private:#2E2428; } }
:root[data-accent="rose"][data-mode="dark"] { --page:#1A1416;--surface:#231B1E;--surface-2:#2B2226;--ink:#EEE3E6;--ink-2:#B09CA2;--line:#3A2D31;--line-strong:#5A464C;--accent:#E896AB;--accent-mid:#86475A;--accent-soft:#3B2029;--on-accent:#200E14;--private:#2E2428; }
:root[data-accent="ink"] { --page:#F4F4F2;--surface:#FFFFFF;--surface-2:#EDEDEA;--ink:#1D1D1B;--ink-2:#62625E;--line:#E0E0DC;--line-strong:#BDBDB7;--accent:#33332F;--accent-mid:#A3A39C;--accent-soft:#E6E6E1;--on-accent:#FFFFFF;--private:#ECECE8; }
@media (prefers-color-scheme: dark) { :root[data-accent="ink"]:not([data-mode="light"]) { --page:#141414;--surface:#1D1D1C;--surface-2:#252524;--ink:#ECECE8;--ink-2:#A3A39E;--line:#30302E;--line-strong:#4D4D4A;--accent:#E2E2DC;--accent-mid:#6A6A65;--accent-soft:#2E2E2C;--on-accent:#141414;--private:#262625; } }
:root[data-accent="ink"][data-mode="dark"] { --page:#141414;--surface:#1D1D1C;--surface-2:#252524;--ink:#ECECE8;--ink-2:#A3A39E;--line:#30302E;--line-strong:#4D4D4A;--accent:#E2E2DC;--accent-mid:#6A6A65;--accent-soft:#2E2E2C;--on-accent:#141414;--private:#262625; }
* { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; text-size-adjust: 100%; }
body { margin: 0; background: var(--page); color: var(--ink); font-family: var(--f-body); font-size: var(--base); line-height: 1.55; }
button, input, textarea { font: inherit; color: inherit; }
/* 아이폰에서 빠르게 두세 번 눌러도 화면이 확대되지 않게(두 손가락으로 벌려 확대하는 것은 그대로). 캔버스·3D 무대는 건드리지 않는다 */
button, a, label, summary, select, input, [role="button"], [data-a], .brand { touch-action: manipulation; }
.wrap { max-width: 640px; margin: 0 auto; padding: calc(12px + env(safe-area-inset-top, 0px)) 16px calc(96px + env(safe-area-inset-bottom, 0px)); }
/* 위쪽 막대(공동체 화면과 같은 짜임): 코이데 · 배지(함께하는 곳) · 톱니바퀴(화면 설정) */
.ic { width: 1em; height: 1em; fill: none; stroke: currentColor; stroke-width: 1.5; stroke-linecap: round; stroke-linejoin: round; flex: none; }
.topbar { position: sticky; top: 0; z-index: 20; background: var(--surface); border-bottom: 1px solid var(--line); padding-top: env(safe-area-inset-top, 0px); }
.topbar .wrap { display: flex; align-items: center; gap: .6em; min-height: 3.4em; position: relative; padding-top: 0; padding-bottom: 0; }
.wrap.has-top { padding-top: 16px; }
.brand { display: inline-flex; align-items: center; gap: .45em; background: none; border: 0; padding: .3em 0; color: var(--ink); cursor: pointer; min-height: 44px; font: inherit; }
.brand-mark { width: 1.6em; height: 1.6em; border-radius: 50%; background: var(--accent); color: var(--on-accent); display: grid; place-items: center; }
.brand-mark .ic { width: .95em; height: .95em; }
.brand-name { font-family: var(--f-display); font-size: 1.05em; font-weight: 700; white-space: nowrap; }
.spacer { flex: 1; }
.topnav { display: none; gap: .2em; margin-left: 1.2em; }
.topnav button { font-size: .92em; background: none; border: 0; color: var(--ink-2); padding: .5em .9em; border-radius: 10px; cursor: pointer; min-height: 40px; }
.topnav button.on { background: var(--accent-soft); color: var(--accent); font-weight: 600; }
/* PC(공동체 화면과 같은 1000px): 아래 탭 대신 위쪽 메뉴, 내용은 가운데 한 칸을 넓게 */
@media (min-width: 1000px) {
  .topnav { display: flex; }
  .tabs { display: none !important; }
  .topbar .wrap { max-width: 1160px; }
  .wrap.has-top { max-width: 960px; padding-top: 28px; padding-bottom: 56px; }
  /* 오늘 화면: 왼쪽에 오늘 기도할 제목, 오른쪽에 끈과 감사(공동체 '이번 달'과 같은 짜임). 위쪽 메뉴와 같은 폭으로 맞춘다 */
  .wrap.has-top:has(.t-grid) { max-width: 1160px; }
  .t-grid { display: grid; grid-template-columns: minmax(0, 1fr) 340px; gap: 0 24px; align-items: start; }
  .t-side { position: sticky; top: calc(4.4em + env(safe-area-inset-top, 0px)); }
}
.badge-btn { position: relative; display: inline-flex; align-items: center; gap: .4em; font: inherit; font-size: .8em; font-weight: 600; color: var(--ink); background: var(--surface-2); border: 1px solid var(--line); border-radius: 999px; padding: .35em .5em .35em .85em; min-height: 38px; cursor: pointer; white-space: nowrap; }
.role-tag { font-size: .93em; padding: .15em .6em; border-radius: 999px; background: var(--surface); color: var(--ink-2); border: 1px solid var(--line); }
.badge-dot { position: absolute; top: 2px; right: 2px; width: 8px; height: 8px; border-radius: 50%; background: var(--warm); }
.icon-btn { width: 44px; height: 44px; display: grid; place-items: center; background: none; border: 0; border-radius: 12px; color: var(--ink); cursor: pointer; flex: none; }
.icon-btn .ic { width: 1.35em; height: 1.35em; }
.icon-btn[aria-expanded="true"] { background: var(--surface-2); }
.menu { position: absolute; top: calc(100% + 6px); right: max(16px, env(safe-area-inset-right, 0px)); width: min(300px, calc(100vw - 32px)); background: var(--surface); border: 1px solid var(--line); border-radius: 16px; box-shadow: 0 16px 40px -12px var(--shadow); padding: .5em; display: flex; flex-direction: column; gap: .1em; z-index: 25; }
.mlabel { font-size: .72em; font-weight: 600; color: var(--ink-2); margin: .6em .7em .3em; }
.mitem { display: flex; justify-content: space-between; align-items: center; gap: .6em; width: 100%; text-align: left; font: inherit; font-size: .9em; color: var(--ink); background: none; border: 0; border-radius: 10px; padding: .55em .7em; min-height: 44px; cursor: pointer; text-decoration: none; }
.mitem:hover { background: var(--surface-2); }
.mitem.on { cursor: default; } .mitem.on span { font-weight: 700; } .mitem.on:hover { background: none; }
.mitem[aria-disabled="true"] { cursor: default; opacity: .7; } .mitem[aria-disabled="true"]:hover { background: none; }
.mitem small { font-size: .82em; color: var(--ink-2); text-align: right; }
.mdiv { height: 1px; background: var(--line); margin: .35em .3em; }
.menu-set { display: flex; flex-direction: column; gap: .6em; padding: 0 .4em .4em; }
.pilot { font-size: .74em; color: var(--accent); background: var(--accent-soft); border-radius: 999px; padding: .3em .9em; display: inline-block; margin-bottom: 10px; }
.top { display: flex; justify-content: space-between; align-items: flex-end; gap: 12px; margin-bottom: 12px; }
.eyebrow { margin: 0; font-size: .8em; color: var(--ink-2); }
h1 { font-family: var(--f-display); font-size: 1.6em; margin: .1em 0 0; line-height: 1.3; word-break: keep-all; text-wrap: balance; }
h2 { font-family: var(--f-display); font-size: 1.15em; margin: 0; }
.card { background: var(--surface); border: 1px solid var(--line); border-radius: 16px; padding: 1em; display: flex; flex-direction: column; gap: .7em; margin-bottom: 12px; }
.label { margin: 0; font-size: .8em; font-weight: 600; color: var(--ink-2); }
.hint { margin: 0; font-size: .82em; color: var(--ink-2); word-break: keep-all; }
.plain { margin: 0; word-break: keep-all; }
.row { display: flex; justify-content: space-between; align-items: center; gap: 10px; }
/* 단추 모서리는 공동체와 같게(12px, 작은 것은 10px). 칩·태그·스위치·기도했어요 단추는 공동체도 알약형이라 그대로 */
.btn { white-space: nowrap; flex: none; border: 0; border-radius: 12px; background: var(--accent); color: var(--on-accent); font-weight: 600; padding: .65em 1.2em; min-height: 44px; cursor: pointer; }
.btn.ghost { background: var(--surface); color: var(--accent); border: 1.5px solid var(--accent-mid); }
.btn.small { padding: .35em .9em; min-height: 36px; font-size: .88em; border-radius: 10px; }
.btn.wide { width: 100%; }
.btn:disabled { opacity: .45; cursor: default; }
/* 1000px 미만: 두 칸 틀은 레이아웃에 영향을 주지 않는다(카드가 지금과 같은 순서·간격으로 쌓임). 오른쪽에만 쓰는 순서 카드는 숨김 */
.n-two, .n-main, .n-side, .n-end { display: contents; }
.card.n-ord { display: none; }
.ps-ord { margin: 0; padding-left: 1.4em; display: flex; flex-direction: column; gap: .4em; font-size: .92em; }
.ps-ord li { padding-left: .1em; }
.ps-ord li > div { display: flex; justify-content: space-between; align-items: baseline; gap: 10px; }
.ps-ord li > div > span:first-child { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.ps-ord li > div > span:last-child { flex: none; font-size: .82em; color: var(--ink-2); }
.ps-ord li .ok { color: var(--accent); font-weight: 600; }
@media (min-width: 1000px) {
  /* 내 기도·기도하기·지난 기록·더보기도 같은 두 칸: 왼쪽 본문 + 오른쪽 380px 고정 칸(공동체 .two-col과 같은 짜임). 오른쪽이 화면보다 길면 칸 안에서 스크롤 */
  .wrap.has-top:has(.n-two) { max-width: 1160px; }
  .n-two { display: grid; grid-template-columns: minmax(0, 1fr) 380px; gap: 0 24px; align-items: start; }
  .n-main, .n-side { display: block; min-width: 0; grid-row: 1; }
  .n-main { grid-column: 1; }
  .n-side { grid-column: 2; position: sticky; top: calc(4.4em + env(safe-area-inset-top, 0px)); max-height: calc(100vh - 5.4em - env(safe-area-inset-top, 0px)); overflow-y: auto; overscroll-behavior: contain; scrollbar-width: thin; }
  .n-end { display: block; grid-column: 1 / -1; grid-row: 2; }
  .card.n-ord { display: flex; }
  /* 지난 기록의 달력은 칸이 너무 커지지 않게 */
  .n-main .weeks { max-width: 440px; width: 100%; margin: 0 auto; }
}
.link { background: none; border: 0; padding: .3em 0; color: var(--accent); font-weight: 600; cursor: pointer; min-height: 36px; }
.link.quiet { color: var(--ink-2); font-weight: 500; }
.field { width: 100%; min-width: 0; flex: 1; border: 1px solid var(--line-strong); border-radius: 12px; background: var(--surface); padding: .7em .8em; }
textarea.field { flex: none; min-height: 5.5em; resize: vertical; overflow: hidden; }
.field:focus { outline: 2px solid var(--accent-mid); border-color: var(--accent); }
.chips { display: flex; flex-wrap: wrap; gap: 6px; }
.chip { border: 1px solid var(--line-strong); background: var(--surface); border-radius: 999px; padding: .35em .85em; min-height: 36px; cursor: pointer; font-size: .9em; }
.chip.on { background: var(--accent); color: var(--on-accent); border-color: var(--accent); }
.chip.add { border-style: dashed; color: var(--accent); }
.tag { display: inline-block; font-size: .76em; font-weight: 600; color: var(--accent); background: var(--accent-soft); border-radius: 999px; padding: .1em .65em; margin-right: .4em; }
.days { font-size: .76em; color: var(--ink-2); }
/* 오늘 */
.today-item { border: 1px solid var(--line); border-radius: 14px; padding: .8em .9em; display: flex; flex-direction: column; gap: .5em; background: var(--surface); }
.today-item.on { background: var(--accent-soft); border-color: var(--accent-mid); }
.today-item p { margin: 0; word-break: keep-all; }
.pray-btn { align-self: flex-start; display: inline-flex; align-items: center; gap: .4em; border-radius: 999px; border: 1.5px solid var(--accent); background: var(--surface); color: var(--accent); font-weight: 600; padding: .45em 1em; min-height: 40px; cursor: pointer; }
.pray-btn.on { background: var(--accent); color: var(--on-accent); }
.pray-btn svg { width: 16px; height: 16px; }
/* 내가 기도하는 사람들의 끈 */
/* 기도의 끈(시안과 같게): 자리마다 매듭, 이웃한 두 자리가 다 지어지면 그 사이 끈이 팽팽, 다 이으면 양 끝 리본 */
.cord { width: 100%; text-align: left; display: flex; flex-direction: column; gap: .3em; }
.cord-head { display: flex; justify-content: space-between; align-items: baseline; gap: .6em; }
.cord-n { font-size: .78em; color: var(--ink-2); margin: 0; text-align: right; }
.cord-n b { color: var(--accent); font-weight: 700; }
.cord-wrap { position: relative; padding: 0 18px; max-width: 520px; width: 100%; margin: 0 auto; box-sizing: border-box; }
.cord-line { position: absolute; left: 18px; top: 3px; width: calc(100% - 36px); height: 26px; overflow: visible; pointer-events: none; }
.cord-seg { fill: none; stroke: var(--line-strong); stroke-width: 1.5; stroke-linecap: round; }
.cord-seg.tight { stroke: var(--accent); stroke-width: 3; }
.cord-seg.pull { animation: cord-pull .7s ease-out; }
@keyframes cord-pull { from { stroke: var(--line-strong); stroke-width: 1.5; } }
.cord-end { position: absolute; top: 3px; width: 18px; height: 26px; overflow: visible; pointer-events: none; }
.cord-end.l { left: 0; } .cord-end.r { right: 0; }
.cord-end path { fill: none; stroke: var(--line-strong); stroke-width: 1.5; stroke-linecap: round; }
.cord-end.bow path { stroke: var(--accent); stroke-width: 2.2; stroke-linejoin: round; }
.cord-end.bow .loop { fill: var(--accent-soft); }
.cord-end.bow.new { animation: knot-tie .7s .3s cubic-bezier(.3,1.6,.5,1) both; transform-origin: center; }
.cord-knots { position: relative; display: grid; }
.knot { display: flex; flex-direction: column; align-items: center; gap: 3px; background: none; border: 0; padding: 0 0 2px; font: inherit; color: var(--ink-2); min-height: 44px; min-width: 0; }
button.knot { cursor: pointer; }
.knot-g { width: 32px; height: 32px; display: grid; place-items: center; border-radius: 50%; }
.knot-g svg { width: 32px; height: 32px; overflow: visible; }
.knot-g .slot { fill: var(--surface); stroke: var(--line-strong); stroke-width: 1.5; }
.knot-g .tie { fill: none; stroke: var(--accent); stroke-width: 3; stroke-linecap: round; stroke-linejoin: round; }
.knot-l { font-size: .7em; font-weight: 600; line-height: 1; margin-top: -4px; max-width: 100%; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.knot.on .knot-l { color: var(--accent); }
.knot.cur .knot-g { background: color-mix(in srgb, var(--accent-soft) 85%, transparent); box-shadow: 0 0 0 1.5px var(--accent-mid); }
.knot.cur .knot-l { color: var(--ink); }
.knot.new .knot-g svg { animation: knot-tie .6s cubic-bezier(.3,1.6,.5,1); }
@keyframes knot-tie { 0% { transform: scale(.3) rotate(-60deg); opacity: .3; } 100% { transform: none; opacity: 1; } }
@media (prefers-reduced-motion: reduce) { .cord-seg.pull, .knot.new .knot-g svg, .cord-end.bow.new { animation: none; } }
/* 노트 */
.note { border-top: 1px solid var(--line); padding-top: .7em; display: flex; flex-direction: column; gap: .35em; }

/* 내 기도 목록: 공동체 앱 '내 기도'와 같은 카드(대상 칩 단추, 바로 고치는 칸, 아래 줄 날짜와 링크) */

/* 카드 아래 단추(마치기·나누기·지우기)는 공동체 내 기도와 같은 크기(.78em × 1.04 ≈ .81em) */

/* 내 기도 목록 위의 대상 걸러 보기: 칩 한 줄(공동체 앱 .hist-chips처럼 휴대폰은 옆으로 밀어 보고 막대는 안 보인다). 넓은 화면은 줄바꿈 */
.tgt-filter { display: flex; gap: 6px; overflow-x: auto; padding: 2px 0 8px; margin: 0 0 .2em; scrollbar-width: none; position: relative; }
.tgt-filter::-webkit-scrollbar { display: none; }

@media (min-width: 1000px) { .tgt-filter { flex-wrap: wrap; overflow: visible; } }
/* 지난 기록 */
.weeks { display: grid; grid-template-columns: repeat(7, 1fr); gap: 5px; }
.weeks i { aspect-ratio: 1; border-radius: 6px; background: var(--surface-2); display: grid; place-items: center; font-style: normal; font-size: .68em; color: var(--ink-2); }

/* 함께 짠 그물(더보기 › 내 모임 › 함께 짠 그물)의 입체 그림 */
.stage3d { position: relative; width: 100%; border-radius: 12px; background: radial-gradient(120% 100% at 50% 40%, var(--surface), var(--surface-2)); cursor: grab; overflow: hidden; touch-action: pan-y; }
.stage3d.weaves { aspect-ratio: 21 / 10; cursor: pointer; }
  box-shadow: 0 1px 4px rgba(60, 40, 20, .2); -webkit-backdrop-filter: blur(4px); backdrop-filter: blur(4px); }
.mn-t { display: flex; flex-direction: column; align-items: center; text-align: center; min-width: 0; }

.month-nav { display: flex; align-items: center; justify-content: space-between; gap: 10px; margin-bottom: 12px; }

.thanks li { list-style: none; border-left: 3px solid var(--warm); padding: .2em 0 .2em .7em; margin-bottom: .7em; }
.thanks { margin: 0; padding: 0; }
.thanks small { display: block; color: var(--ink-2); font-size: .76em; }
.thanks q { display: block; color: var(--ink-2); font-size: .82em; quotes: none; margin-top: .2em; }

/* 돌아보기: 칸 수(--n)만큼 같은 폭으로(0인 칸은 아예 빼서 1~4칸). 표시 방식은 .seg[style*="--n"]과 같다 */
.stats[style*="--n"] { grid-template-columns: repeat(var(--n), 1fr); }
/* 달마다 기도한 날 막대: 공동체 나의 기도의 .mp-bars · .an-track과 같은 모양 */
.mp-bars { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: .55em; }
.mp-bars li { display: grid; grid-template-columns: 2.6em minmax(0, 1fr) 3em; align-items: center; gap: .6em; font-size: .86em; }

.mp-name { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.an-track { height: 10px; background: var(--surface-2); border-radius: 0 4px 4px 0; }
.an-fill { display: block; height: 100%; background: var(--accent); border-radius: 0 4px 4px 0; }
/* 나의 배지: 둥근 네모 칸(56px) 안에 그림 + 아래에 이름. 칸 나누기(grid)와 flex만 쓴다(float · 줄 자르기 없음).
   처음부터 모두 보인다. 받은 것은 색이 있고(칸 바탕 --accent-soft), 안 한 것(.off)은 칸 바탕이 중립색이고 그림만 색 없이 흐리다 */
.bdgs { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 14px 6px; }

.bdg { display: flex; flex-direction: column; align-items: center; gap: .45em; padding: 2px 0; min-height: 44px; font: inherit; color: var(--ink); background: none; border: 0; cursor: pointer; text-align: center; }
.bdg-n { font-size: .76em; line-height: 1.3; word-break: keep-all; overflow-wrap: anywhere; }

/* 아래 탭 */
.ic { width: 1em; height: 1em; fill: none; stroke: currentColor; stroke-width: 1.5; stroke-linecap: round; stroke-linejoin: round; flex: none; }
.tabs { position: fixed; left: 0; right: 0; bottom: 0; display: grid; grid-template-columns: repeat(5, 1fr); background: var(--surface); border-top: 1px solid var(--line); padding: 0 env(safe-area-inset-right, 0px) max(6px, env(safe-area-inset-bottom, 0px)) env(safe-area-inset-left, 0px); z-index: 10; }

/* 기도하기 판 */
.sheet-back { position: fixed; inset: 0; background: color-mix(in srgb, var(--ink) 45%, transparent); z-index: 30; display: grid; place-items: end center; padding: 16px; }

/* 크게 보기: 그물 한 장만 화면 가득. 오른쪽 위에 작은 동그란 버튼들 */
.gbig { position: fixed; inset: 0; z-index: 70; background: radial-gradient(120% 100% at 50% 40%, var(--surface), var(--surface-2)); touch-action: none; overscroll-behavior: contain; }

.gbig-foot .wcap { display: flex; flex-direction: column; align-items: center; gap: 2px; background: var(--surface); border-radius: 14px; padding: .5em 1em; box-shadow: 0 2px 10px var(--shadow); text-align: center; }

/* 더보기: 작은 제목 아래에 카드와 줄로 묶는다(공동체 더보기와 같은 짜임) */
.more-h { font-size: .8em; font-weight: 600; color: var(--ink-2); margin: 24px 4px 8px; line-height: 1.2; letter-spacing: .02em; }
.mrows { padding-top: 4px; padding-bottom: 4px; gap: 0; }

.mrows > .label:first-child { margin-top: 12px; }
/* 줄 아래에 붙는 안내글(.hint): gap을 없앴으니 띄우는 틈과 카드 아래 여백을 직접 */
.mrows > .hint { margin: 11px 0 12px; }
/* 창(.sheet)의 줄이 이어질 때: 창의 gap(12px)만큼 당겨서 줄 사이 틈을 없앤다 */

.mset { display: flex; flex-direction: column; gap: 10px; border-top: 1px solid var(--line); padding: .9em 0; }
/* 고르는 버튼 묶음: 공동체 앱과 같은 모양(디자인 스타일 new·classic·glass가 그대로 입혀진다) */
.seg { display: grid; grid-auto-flow: column; grid-auto-columns: 1fr; gap: 3px; padding: 3px; background: var(--surface-2); border-radius: 12px; }
.seg button { font: inherit; font-size: .86em; word-break: keep-all; padding: 0 4px; border: 0; border-radius: 9px; min-height: 44px; background: transparent; color: var(--ink-2); cursor: pointer; }
.seg button.on { background: var(--surface); color: var(--ink); font-weight: 600; box-shadow: 0 1px 3px rgba(0,0,0,.12); }
/* --n이 있는 단추 판은 그 칸 수만큼 여러 줄로 놓인다(공동체 앱과 같다) */
.seg[style*="--n"] { grid-auto-flow: row; grid-template-columns: repeat(var(--n), 1fr); }
.seg button svg { width: 1em; height: 1em; vertical-align: -.12em; }
.ps-topics { margin-top: 8px; padding: 8px 10px; border-radius: 12px; background: var(--surface-2); }
.ps-topics .seg { background: var(--surface); margin-top: 6px; }
.people li { display: flex; justify-content: space-between; align-items: center; padding: .4em 0; border-top: 1px solid var(--line); list-style: none; }
.people { margin: 0; padding: 0; }
.people li:first-child { border-top: 0; }
.swatches { display: flex; gap: .55em; flex-wrap: wrap; }

.swatch i { width: 28px; height: 28px; border-radius: 50%; display: block; box-shadow: inset 0 0 0 1px rgba(0, 0, 0, .12); }
.swatch.on { border-color: var(--ink); }
.switch { width: 48px; height: 28px; border-radius: 999px; border: 0; background: var(--line-strong); position: relative; flex: none; padding: 0; cursor: pointer; }
.switch > span { position: absolute; top: 3px; left: 3px; width: 22px; height: 22px; border-radius: 50%; background: var(--surface); transition: left .2s; }
.switch.on { background: var(--accent); }
.switch.on > span { left: 23px; }
/* 기도하는 화면: 공동체(index.html의 .pss-*)와 같은 값. 전체 화면이 스크롤 칸이고, 위 줄과 아래 단추 줄은 늘 화면에 붙어 있다. 색 변수만 쓴다 */
.pss { position: fixed; inset: 0; z-index: 40; background: var(--page); overflow-y: auto; display: flex; flex-direction: column; gap: 16px; padding: max(16px, env(safe-area-inset-top)) 16px 0; }
.pss-top { display: flex; justify-content: space-between; align-items: center; gap: 8px; max-width: 640px; width: 100%; margin: 0 auto; flex-wrap: wrap; }
/* 기도제목이 길어 내려 읽어도 끝내기·남은 시간·음악은 늘 위에 보이게 붙여 둔다(아래 버튼 줄과 짝) */
.pss-top { position: sticky; top: calc(-1 * max(16px, env(safe-area-inset-top))); z-index: 2; padding: max(10px, env(safe-area-inset-top)) 0 10px; margin-top: calc(-1 * max(16px, env(safe-area-inset-top))); background: linear-gradient(var(--page) 75%, transparent); }
.pss-step { font-size: .86em; color: var(--ink-2); font-variant-numeric: tabular-nums; display: inline-flex; align-items: center; gap: .6em; }
.pss-timer { display: inline-flex; align-items: center; gap: .3em; color: var(--accent); font-weight: 600; }
.pss-ring { width: 22px; height: 22px; transform: rotate(-90deg); }
.pss-ring circle { fill: none; stroke-width: 12; }
.pss-ring .track { stroke: var(--accent-soft); }

  function ownNoteKey(base, uid) {

  const dayDiff = (a, b) => { const f = k => { const [y, m, d] = k.split('-').map(Number); return new Date(y, m - 1, d); }; return Math.round((f(b) - f(a)) / 864e5); };

  const KP = window.KOIDE_PRAY;

    const goTutorial = auto => { if (window.koideSpace) window.koideSpace.going('note'); const to = 'note.html?tutorial' + (DEMO_LINK ? '&demo' : ''); if (auto === true) location.replace(to); else location.href = to; };

    function drop() {
      const gone = new Set(D.items.filter(i => i.practice).map(i => i.id));

  // 내가 기도하는 사람들의 끈(공동체 앱의 기도의 끈과 같은 모양): 나 + 내가 기도하는 사람마다 매듭.

  const KNOT_SVG = '<svg viewBox="0 0 32 32" aria-hidden="true"><path class="tie" d="M0 16H8.5C11 16 12 13 12 10.5C12 6.5 14.5 4 18 4S24 6.5 24 10.2 21 16 16.5 16.4"/><path class="tie" d="M11 19.2C15 17 19 16 32 16"/></svg>';

    if (slots.length < 2) return '';

  // ── 기도의 순례길(맛보기: 아브라함의 길 12구간, 결정 기록 2026-10-31) ─────────────────────────
  //  기도한 날 하루 = 한 구간. 걸은 구간·장소·쉼터·돌은 저장하지 않고 그때그때 셈하고, 저장하는 것은 D.pilgrim 셋뿐이다:
  //   start(이 기능이 이 노트에서 처음 열린 날, 이 날부터 센다) · days(걸은 날, 오늘 앞의 날은 한 번 적으면 지우지 않는다) · seen(본 이야기: p장소번호·end → 날짜)

  const PG_N = 12;

    0: { tag: '하란', name: '하란 · 떠나는 곳', text: '부르신 말씀만 듣고, 갈 곳을 모른 채 길을 떠났어요.', ref: '창세기 12:1~4' },

  const PG_ARRIVE = { 4: '세겜에 닿았어요. 다음은 벧엘이에요.', 7: '벧엘에 닿았어요. 다음은 헤브론이에요.', 10: '헤브론에 닿았어요. 다음은 별이 가득한 밤이에요.' };
  function pgDay(k) { return typeof k === 'string' && /^\d{4}-\d{2}-\d{2}$/.test(k); } // (migrate가 맨 처음 부르니 const가 아니라 함수로 둔다)
  // 저장된 모양을 바로잡는다(객체가 아니면 없음). start를 여기서 채우지 않는다: 남의 기록·백업에도 쓰여서, 채우면 합칠 때 시작일이 늦어진다
  function pgNorm(p) {

    return { start: pgDay(p.start) ? p.start : '', days: [...new Set((Array.isArray(p.days) ? p.days : []).filter(pgDay))].sort(), seen };

  // 두 기록(이 기기 · 동기화로 온 것 · 백업 파일)을 합친다: 시작은 이른 날, 걸은 날은 합집합, 본 이야기는 키마다 이른 날. 한쪽이 없으면 다른 쪽
  function pgMerge(a, b) {

  // 이 기능이 처음 열린 날을 적는다. 맨 끝 첫 render() 앞과 노트를 비운 뒤, 백업을 불러온 뒤에 부른다
  function pgEnsure() { if (!D.pilgrim || !D.pilgrim.start) { D.pilgrim = Object.assign(pgNorm(D.pilgrim) || { days: [], seen: {} }, { start: TODAY() }); saveLocal(); } }
  // 오늘 앞의 기도한 날을 걸은 날에 적는다(지우지 않는다): 기도제목을 지우면 기도 기록도 지워지니, 기록에서만 셈하면 걸은 구간이 뒤로 간다

      else { const who = people().find(x => s.includes(x.name)); out.push({ target: who ? 'p:' + who.id : cur || guessTarget(s), text: s }); open = false; }
    });
    return out.filter(x => x.text).map(x => ({ target: x.target, text: x.text.slice(0, 1000) }));
  }
  // 미리보기에서 고를 수 있는 대상: 나 · 내가 기도하는 사람 · 교회 · 나라·세상, 그리고 이 글에서 처음 나온 이름(새 사람)
  function prevTargets(cur) {
    const L = targets(), fresh = [...new Set((S.preview || []).map(x => x.target).filter(t => t.startsWith('new:')))];
    const all = [...L, ...fresh.map(t => [t, t.slice(4)])];
    return all.some(([t]) => t === cur) ? all : [...all, [cur, cur]];
  }

  // 내 기도: 왼쪽(휴대폰은 위)은 늘 새 기도제목 쓰기, 오른쪽은 기도제목마다 카드 하나(공동체 앱 '내 기도'와 같게).
  //  대상은 칩 단추를 눌러 고르고, 내용은 카드 안에서 바로 고치고 칸을 벗어나면 저장해요. 카드 아래에는 마치기·나누기·지우기
  function noteLi(i) {
    const open = S.tgtOpen === i.id;
    return `<li class="edit"><div class="edit-top"><button class="tgt-btn${open ? ' open' : ''}" data-a="tgtopen" data-v="${i.id}" aria-expanded="${open}" aria-label="대상 고르기: 지금 ${esc(targetName(i.target))}">${esc(targetName(i.target))}${CHEV}</button></div>
      ${open ? `<div class="tgt-pick chips" role="group" aria-label="기도 대상 고르기">${targets().map(([t, n]) => `<button class="chip${t === i.target ? ' on' : ''}" aria-pressed="${t === i.target}" data-a="tgtpick" data-v="${i.id}" data-t="${esc(t)}">${esc(n)}</button>`).join('')}<button class="chip add" data-a="addperson">+ 사람</button></div>` : ''}
      <textarea class="field" rows="2" maxlength="1000" data-item="${i.id}" aria-label="기도제목 내용">${esc(i.text)}</textarea>

        <span class="foot-acts"><button class="link" data-a="done" data-v="${i.id}">마치기</button><button class="link quiet" data-a="share" data-v="${i.id}">나누기</button><button class="link quiet" data-a="delitem" data-v="${i.id}">지우기</button></span></div></li>`;
  }
  // 내 기도 목록은 늘 한 줄로 길게 이어지고, 위의 대상 칩으로 걸러 본다(고른 대상은 이번에만 기억하고 저장·동기화하지 않는다).
  //  새로 더한 기도제목이 걸러 둔 대상이 아니면 전체로 풀어서 바로 보이게 한다
  function filterReveal(targets) {
    if (S.tgtFilter && S.tgtFilter !== 'all' && !targets.includes(S.tgtFilter)) S.tgtFilter = 'all';
  }
  function noteView() {
    const T = targets(), all = T.flatMap(([t]) => open().filter(i => i.target === t));
    // 열린 기도제목이 있는 대상만 칩으로(대상이 둘 이상일 때만). 고른 대상에 기도제목이 없으면 전체로 본다
    const cnt = T.map(([t, n]) => [t, n, all.filter(i => i.target === t).length]).filter(c => c[2]);

    const filt = cnt.length > 1 ? `<div class="tgt-filter" role="group" aria-label="대상별로 걸러 보기">${[['all', '전체', all.length], ...cnt].map(([t, n, c]) => `<button class="chip${t === f ? ' on' : ''}" aria-pressed="${t === f}" data-a="tgtfilter" data-v="${esc(t)}">${esc(n)} · ${c}</button>`).join('')}</div>` : '';

  // ── 지난 기록 아래쪽(달력·감사와 응답·오래 이어 온 기도 다음): 돌아보기(올해 기도한 모습)와 나의 배지(노트에서 해 본 일 · 이어 온 날) ──
  //  돌아보기는 이 노트의 기록(기도한 날 · 기도제목 · 감사)에서 바로 셈하고 따로 저장하는 것은 없다. 원칙(설계서 1장 · 5장): 0은 보여 주지 않고(없으면 칸 · 줄 · 카드를 통째로 뺀다),
  //  견주기 · 순위 · 연속 기록 · 등급 · 잃을 수 있는 것은 두지 않는다. 나의 배지만 예외: 처음부터 모두 보이고 안 한 것은 색 없이 흐리게 보인다(사용자 결정 2026-10-31, 배지는 기도의 양이 아니라 앱을 배우는 일이라 안내가 된다)
  function reflectHtml() {
    const y = TODAY().slice(0, 4), P = prays().filter(p => p.d.startsWith(y)), tg = new Map(D.items.map(i => [i.id, i.target]));
    const days = new Set(P.map(p => p.d)).size, who = new Set(P.map(p => tg.get(p.item)).filter(t => t && t.startsWith('p:'))).size;
    const T = D.thanks.filter(x => x.date && x.date.startsWith(y)), ans = T.filter(x => x.kind === 'answer').length;
    const tiles = [[days, '기도한 날'], [who, '기억한 사람'], [T.length - ans, '감사 기록'], [ans, '응답 기록']].filter(t => t[0] > 0);
    const mc = Array(12).fill(0); new Set(P.map(p => p.d)).forEach(d => { mc[Number(d.slice(5, 7)) - 1]++; });
    const mmax = Math.max(...mc), rows = mc.map((n, i) => [i + 1, n]).filter(r => r[1] > 0);
    if (!tiles.length) return ''; // 오래 이어 온 기도제목은 바로 아래 '오래 이어 온 기도' 카드가 맡는다(같은 것을 두 번 보이지 않게)
    return `<section class="card"><div class="row"><p class="label">돌아보기</p><span class="hint">${y}년</span></div>
      ${tiles.length ? `<div class="stats" style="--n:${tiles.length}">${tiles.map(([n, l]) => `<div><b>${n}</b><span>${l}</span></div>`).join('')}</div>` : ''}
      ${rows.length ? `<ul class="mp-bars" aria-label="${y}년 달마다 기도한 날">${rows.map(([m, n]) => `<li><span class="mp-name">${m}월</span><span class="an-track"><span class="an-fill" style="width:${Math.round(n / mmax * 100)}%"></span></span><b>${n}일</b></li>`).join('')}</ul>` : ''}</section>`;
  }
  // 나의 배지: 노트에서 해 볼 일을 하나씩 해 보면 색이 들어오는 작은 둥근 네모 칸(칸 안에 그림, 아래에 짧은 이름). 처음부터 모두 보이고, 안 한 것은 색 없이 흐리다. 누르면 작은 창이 열린다
  //  · 써 보기 배지(tut): 노트의 기록에서 바로 알아낸다(예전부터 써 온 사람은 이미 해 본 일이 배지로 나온다). 기록에 남지 않는 일(기도하기 · 홈 화면 · 의견 보내기 · 동기화 켜기)만

  //  · 기념 배지(m-): 1년 이어 온 기도 · 노트와 함께한 1년. 그날이 오면 생긴다. 아브라함의 길(p-)은 순례길을 끝까지 걸은 날 생긴다. 처음 쓴 날 · 처음 기도 · 처음 감사 · 처음 응답은 써 보기 배지와 같은 일이라 한 배지에 날짜를 붙였다
  //  at(): 받지 못했으면 null, 받았는데 날짜를 모르면 '', 아니면 'yyyy-mm-dd'. can(): 이 기기에서 해 볼 수 있는 일인지(홈 화면은 휴대폰만, 동기화는 잠금이 되는 주소만). 안 되는 기기에서도 배지는 보이고,
  //  창에서 noCan 글을 더해 알려 준다(홈 화면은 방법 안내 창을 그대로 열고(guideOnly), 동기화는 해 보기 없이 닫기만). when: 기념 배지가 언제 생기는지
  //  나열 순서는 배우는 길(쉬운 것부터). 받았든 안 받았든 이 순서 그대로 모두 늘어놓는다
  //  모임 만들기(n-group): 노트에서 내 모임을 만들면 받는다(만들기 성공 때 earn). 서버가 알려 준 내 모임 목록(noteMe)에 모임장인 모임이 이미 있으면 그것도 받은 것으로 센다(모임은 끝나면 사라지므로 loadMe에서 한 번 earn으로 남긴다)
  // 받은 날을 노트 기록에 남긴다(장면 · 연습 페이지에서는 남기지 않는다). 이미 있으면 그대로(처음 받은 날)

  const BADGES = [
    { k: 'n-first', tut: 1, ic: 'pen', name: '첫 기도제목', mean: '기도제목을 처음 노트에 적었어요.', todo: '내 기도에서 기도제목을 한 줄 써 보세요. 한 줄이면 충분해요.',

  // 지난 기록: 달마다 한 장. 위에서 달을 넘기고, 그 달의 기도한 날·감사와 응답·마친 기도만 보여서 쌓여도 길어지지 않는다
  function lookView() {
    const cur = TODAY().slice(0, 7), firsts = [...prays().map(p => p.d), ...D.thanks.map(x => x.date), ...D.items.map(i => i.created)].filter(Boolean).sort();

  // ── 함께 짠 그물: 모임 화면의 '함께 짜는 그물'을 담아 둔 것 ──

  // 3D 도구(vendor/three.min.js)와 그림(note-3d.js)은 함께 짠 그물 화면을 처음 열 때 불러온다. 그림은 만들어 두고 다시 그릴 때 자리만 옮긴다

  function mountWeaves(X) {
    const sigOf = o => JSON.stringify(o) + (PREF.accent || '') + (PREF.mode || '') + matchMedia('(prefers-color-scheme: dark)').matches;

      document.querySelectorAll('.stage3d .wait, .gbig-host .wait').forEach(w => { if (w.parentNode !== host) w.remove(); });
      const w = host.querySelector('.wait'); if (w) w.remove(); G3[key].attach(host);
    };
    const card = $('#weave3d');

    }
  });
  // 내 기도 카드의 글: 칸을 벗어날 때 바뀌었으면 저장(입력 중에는 다시 그리지 않아 커서가 그대로). 빈 글이면 원래 글로 되돌려요
  document.addEventListener('change', e => {
    const ta = e.target.matches && e.target.matches('textarea[data-item]') ? e.target : null; if (!ta) return;
    const i = D.items.find(x => x.id === ta.dataset.item), t = ta.value.trim(); if (!i) return;
    if (!t) { ta.value = i.text; return autosize(ta); }
    if (t !== i.text) { i.text = t.slice(0, 1000); i.up = now(); save(); }
  });
  document.addEventListener('change', e => {
    if (e.target.id === 'gc-m') { S.gMonths = Number(e.target.value) || 3; return; }
    if (e.target.matches && e.target.matches('.prev-t') && S.preview) { const k = Number(e.target.dataset.k); if (S.preview[k]) S.preview[k].target = e.target.value; return; }
    if (e.target.id !== 'restore-file' || !e.target.files[0]) return;
    const r = new FileReader();
    r.onload = () => {
      try {
        const x = JSON.parse(r.result);
        if (x.app !== 'koide-note' || !Array.isArray(x.items)) throw new Error();
        if (!confirm(`백업(${x.saved ? short(dkey(new Date(x.saved))) : '날짜 모름'}, 기도제목 ${x.items.length}개)으로 바꿀까요? 지금 이 휴대폰의 기도 노트는 지워져요.`)) return;
        const vault = D.vault, sv = D.survey, gd = D.guide, bg = D.badge, pg = D.pilgrim; D = migrate(Object.assign(blank(), x)); delete D.app; delete D.saved; D.vault = vault; D.pilgrim = pgMerge(pg, D.pilgrim); pgEnsure(); pgKeep(); D.survey = KOIDE_SURVEY.merge(sv, D.survey); if (gd && (!D.guide || gd < D.guide)) D.guide = gd; D.badge = mergeBadge(bg, D.badge); KOIDE_SURVEY.reload(); save(); S.tab = 'today'; toast('백업을 불러왔어요');
      } catch (err) { toast('코이데 기도 노트 백업 파일이 아니에요'); }
    };
    r.readAsText(e.target.files[0]);
  });
  document.addEventListener('change', e => {
    if (e.target.id === 'cut-del' && S.cut) { S.cut.del = e.target.checked; const h = $('#cut-hint'); if (h) h.hidden = !S.cut.del; }
  });
  document.addEventListener('keydown', e => {
    if (e.key !== 'Escape') return;
    if (S.pgStone) { S.pgStone = null; return render(); }
    if (S.pgEnd) { pgEndClose(); return render(); }
    if (S.pgDlg) { pgDlgClose(); return render(); }
    if (S.pg) { S.pg = false; return render(); }
    if (S.wopen != null) { S.wopen = null; render(); } else if (S.ps) { psStop(); render(); } else if (S.bdg) { S.bdg = null; render(); } else if (S.done) { S.done = null; render(); } else if (S.kc) { S.kc = null; render(); } else if (S.cut) { S.cut = null; render(); } else if (S.vsheet) { S.vsheet = null; render(); } else if (S.share) { S.share = null; render(); } else if (S.mv) { S.mv = null; render(); }
  });
  // 모임 화면의 '그물 담기'로 오면(?weave=모임ID) 모임 화면이 건네준 그물(sessionStorage)을 노트에 담고 '함께 짠 그물' 화면을 연다
  { const q = new URLSearchParams(location.search), wid = q.get('weave'); if (wid) {
    q.delete('weave'); history.replaceState(null, '', location.pathname + (q.toString() ? '?' + q.toString().replace(/=(&|$)/g, '$1') : ''));
    let pack = null; try { pack = JSON.parse(sessionStorage.getItem('koide-weave-pack') || 'null'); sessionStorage.removeItem('koide-weave-pack'); } catch (e) { /* 건네받지 못함 */ }
    if (pack && pack.id === wid && weaveAdd(pack)) setTimeout(() => toast('그물을 담았어요'), 300); else setTimeout(() => toast('그물을 담지 못했어요. 모임 화면에서 다시 해 주세요'), 300);
  } }
  // 따라 하기 페이지에서 돌아오면(?tutdone) 마침을 적고 주소에서 지운다
  { const q = new URLSearchParams(location.search); if (q.has('tutdone')) { TUTDONE = q.get('tutdone') || 'done'; q.delete('tutdone'); history.replaceState(null, '', location.pathname + (q.toString() ? '?' + q.toString().replace(/=(&|$)/g, '$1') : '')); if (TUTDONE === 'fail') setTimeout(() => toast('연습 페이지를 열지 못했어요. 더보기 › 사용법에서 다시 할 수 있어요.'), 300); else if (!QUIET && getToken()) NoteGuide.markDone(); } }
  // 카카오 로그인이 기본: 로그인하지 않았으면 로그인 화면으로(노트는 이 휴대폰에 그대로 남아 있다)
  if (!QUIET && !getToken()) { if (window.koideSpace) window.koideSpace.going('community'); location.replace('index.html' + QS); return; }
  // 공동체의 '함께하는 곳' 메뉴에서 '+ 모임 만들기'로 오면(?new) 더보기 › 내 모임의 만들기 창을 바로 연다
  { const q = new URLSearchParams(location.search); if (q.has('new')) { S.tab = 'more'; S.gNew = true; q.delete('new'); history.replaceState(null, '', location.pathname + (q.toString() ? '?' + q.toString().replace(/=(&|$)/g, '$1') : '')); } }
  // 모임 화면의 '내 기도 노트로 옮기기'로 오면(?move=모임ID) 옮길 기도제목 고르는 창을 바로 연다
  { const q = new URLSearchParams(location.search), mid = q.get('move'); if (mid) { q.delete('move'); history.replaceState(null, '', location.pathname + (q.toString() ? '?' + q.toString().replace(/=(&|$)/g, '$1') : '')); if (!SC) setTimeout(() => mvOpen(mid), 0); } }
  pgEnsure(); // 순례길 시작일(TODAY·dkey가 만들어진 뒤라야 한다)
  // 순례길 장면: 오늘 카드에서 시작하는 것(pilgrimtoday · pilgrimrest)과 지난 기록(pilgrimbadge)이 아니면 순례길 화면을 바로 연다
  if (SC && /^pilgrim/.test(SC.at)) { if (SC.at === 'pilgrimbadge') S.tab = 'look'; else if (!['pilgrimtoday', 'pilgrimrest'].includes(SC.at)) { S.pg = true; pgLoad(); pgNext(); } }
  render();
  // 연습 페이지는 데모 띠가 없어 진짜 노트처럼 보인다. 6초 안에 안내가 시작되지 않으면 갇히지 않게 진짜 노트로 돌려보낸다
  if (TUT) setTimeout(() => { if (!NoteGuide.begun()) tutFail(); }, 6000);
  // 시작 화면(splash.js)을 닫고, 다시 켤 때 기도 노트로 시작하게 적어 둔다
  if (window.koideSplash) window.koideSplash.hide();
  if (window.koideSpace) window.koideSpace.used('note');
  if (SC && !window.KoideBeatitudes.scene(SC.at)) window.KoideSunrain.scene(SC.at, { n: people().length + 1 });
  // 노트 주인을 아직 모르면(예전 로그인) 서버에 한 번 묻고, 내 노트 자리가 달라지면 다시 연다. 서버가 답하지 않으면 이번에는 예전 자리 그대로
  if (!QUIET) (async () => {
    if (!getUid()) {
      try { const r = await api('me'); if (r && r.uid) { try { localStorage.setItem(UID, r.uid); } catch (e) { /* 무시 */ } if (ownNoteKey(BASE, r.uid) !== KEY) return location.reload(); } }
      catch (e) { if (e && e.code === 'login') { if (window.koideSpace) window.koideSpace.going('community'); return location.replace('index.html' + QS); } }
    }
    let resume = null; try { resume = localStorage.getItem('koide-note-resume'); localStorage.removeItem('koide-note-resume'); } catch (e) { /* 무시 */ }
    if (resume === 'vault' && getToken()) { S.tab = 'sync'; vaultStart(); }
    else if (D.vault && D.vault.on && !D.vault.paused) sync();
    loadMe();
  })();
  document.addEventListener('visibilitychange', () => { if (!document.hidden && D.vault && D.vault.on && !D.vault.paused) sync(); });
  if ('serviceWorker' in navigator && (location.protocol === 'https:' || location.hostname === 'localhost')) navigator.serviceWorker.register('sw.js').catch(() => {});
})();
</script>
</body>
