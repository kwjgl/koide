<meta name="apple-mobile-web-app-title" content="코이데">
<title>코이데 기도 노트</title>

<link rel="preconnect" href="https://fonts.googleapis.com">

<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Gowun+Batang:wght@700&family=IBM+Plex+Sans+KR:wght@400;500;600&display=swap">
<script>
/* 화면 모드·색 테마·디자인·큰 글씨: 공동체 앱과 같은 설정(이 기기에만). 화면이 그려지기 전에 먼저 입힌다 */
try { const p = JSON.parse(localStorage.getItem('koide-pref') || '{}'), d = document.documentElement;
  if (p.mode === 'light' || p.mode === 'dark') d.dataset.mode = p.mode;
  if (p.accent && p.accent !== 'green') d.dataset.accent = p.accent;
  if (p.style && p.style !== 'flat') d.dataset.style = p.style;
  if (p.big) d.dataset.big = ''; } catch (e) { /* 무시 */ }
</script>
<style>
/* 코이데 기도 노트: 공동체 앱(index.html)과 같은 폴더·같은 홈 화면 앱 안의 '나' 공간. 같은 색·글꼴·설정(화면 모드, 색 테마, 큰 글씨).
   기록은 이 기기에만 저장하고 서버로 보내지 않는다. 공동체로는 '사랑방에 나누기'(글만 넘겨 내 기도에서 고르고 저장)와 '공동체로' 링크로 오간다 */
:root {
  --page: #F3F5F2; --surface: #FFFFFF; --surface-2: #EEF2EF;
  --ink: #1B2523; --ink-2: #5B6965; --line: #DDE4E0; --line-strong: #B9C4BF;
  --accent: #2B6A62; --accent-mid: #8DBDB5; --accent-soft: #DCEBE7; --on-accent: #FFFFFF;
  --warm: #9A5A14; --warm-soft: #F5E8D6; --shadow: rgba(20, 35, 32, .14);
  --leader: #62519E; --private: #E8ECEA; --neu-hi: rgba(255, 255, 255, .9); --neu-lo: rgba(20, 35, 32, .17);
  --wood: #B98756; --wood-back: #E9D9C2; --plaque: #FBF6EC; --linen: #EFE6D6;
  --f-display: 'Gowun Batang', 'AppleMyungjo', 'Batang', serif;
  --f-body: 'IBM Plex Sans KR', 'Apple SD Gothic Neo', 'Malgun Gothic', sans-serif;
  --base: 16px;
}

  --accent: #7CC2B7; --accent-mid: #3F7C73; --accent-soft: #1E3934; --on-accent: #0F1A18;
  --warm: #E2A563; --warm-soft: #3A2C1B; --shadow: rgba(0, 0, 0, .5); --leader: #B6A8EA; --private: #252E2B; --neu-hi: rgba(255, 255, 255, .06); --neu-lo: rgba(0, 0, 0, .6); --wood: #7A5636; --wood-back: #3A2E24; --plaque: #2B2620; --linen: #3A3328; color-scheme: dark; } }
:root[data-mode="dark"] {
  --page: #141B19; --surface: #1C2522; --surface-2: #232D2A;
  --ink: #E5ECE9; --ink-2: #9CAAA5; --line: #2D3935; --line-strong: #4A5853;
  --accent: #7CC2B7; --accent-mid: #3F7C73; --accent-soft: #1E3934; --on-accent: #0F1A18;
  --warm: #E2A563; --warm-soft: #3A2C1B; --shadow: rgba(0, 0, 0, .5); --leader: #B6A8EA; --private: #252E2B; --neu-hi: rgba(255, 255, 255, .06); --neu-lo: rgba(0, 0, 0, .6); --wood: #7A5636; --wood-back: #3A2E24; --plaque: #2B2620; --linen: #3A3328; color-scheme: dark; }
/* 큰 글씨와 색 테마: 공동체 앱과 같은 값 */

:root[data-accent="blue"][data-mode="dark"] { --page:#12161D;--surface:#1A2029;--surface-2:#212833;--ink:#E4E9F0;--ink-2:#9AA5B5;--line:#2C3542;--line-strong:#485466;--accent:#8EB4E6;--accent-mid:#3C5B85;--accent-soft:#1D2C42;--on-accent:#0E1622;--private:#232A35; }

:root[data-accent="rose"][data-mode="dark"] { --page:#1A1416;--surface:#231B1E;--surface-2:#2B2226;--ink:#EEE3E6;--ink-2:#B09CA2;--line:#3A2D31;--line-strong:#5A464C;--accent:#E896AB;--accent-mid:#86475A;--accent-soft:#3B2029;--on-accent:#200E14;--private:#2E2428; }

@media (prefers-color-scheme: dark) { :root[data-accent="ink"]:not([data-mode="light"]) { --page:#141414;--surface:#1D1D1C;--surface-2:#252524;--ink:#ECECE8;--ink-2:#A3A39E;--line:#30302E;--line-strong:#4D4D4A;--accent:#E2E2DC;--accent-mid:#6A6A65;--accent-soft:#2E2E2C;--on-accent:#141414;--private:#262625; } }
:root[data-accent="ink"][data-mode="dark"] { --page:#141414;--surface:#1D1D1C;--surface-2:#252524;--ink:#ECECE8;--ink-2:#A3A39E;--line:#30302E;--line-strong:#4D4D4A;--accent:#E2E2DC;--accent-mid:#6A6A65;--accent-soft:#2E2E2C;--on-accent:#141414;--private:#262625; }
* { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; text-size-adjust: 100%; }
body { margin: 0; background: var(--page); color: var(--ink); font-family: var(--f-body); font-size: var(--base); line-height: 1.55; }
button, input, textarea { font: inherit; color: inherit; }
.wrap { max-width: 640px; margin: 0 auto; padding: calc(12px + env(safe-area-inset-top, 0px)) 16px calc(96px + env(safe-area-inset-bottom, 0px)); }
.space { display: flex; justify-content: space-between; align-items: center; gap: 8px; margin-bottom: 10px; }
.space a { color: var(--accent); font-weight: 600; font-size: .86em; text-decoration: none; min-height: 36px; display: inline-flex; align-items: center; }
.pilot { font-size: .74em; color: var(--accent); background: var(--accent-soft); border-radius: 999px; padding: .3em .9em; display: inline-block; margin-bottom: 10px; }
.top { display: flex; justify-content: space-between; align-items: flex-end; gap: 12px; margin-bottom: 12px; }
.eyebrow { margin: 0; font-size: .8em; color: var(--ink-2); }
h1 { font-family: var(--f-display); font-size: 1.6em; margin: .1em 0 0; line-height: 1.3; word-break: keep-all; text-wrap: balance; }
h2 { font-family: var(--f-display); font-size: 1.15em; margin: 0; }
.card { background: var(--surface); border: 1px solid var(--line); border-radius: 16px; padding: 1em; display: flex; flex-direction: column; gap: .7em; margin-bottom: 12px; }
.label { margin: 0; font-size: .8em; font-weight: 600; color: var(--ink-2); }
.hint { margin: 0; font-size: .82em; color: var(--ink-2); word-break: keep-all; }
.plain { margin: 0; word-break: keep-all; }
.row { display: flex; justify-content: space-between; align-items: center; gap: 10px; }
.btn { white-space: nowrap; flex: none; border: 0; border-radius: 999px; background: var(--accent); color: var(--on-accent); font-weight: 600; padding: .65em 1.2em; min-height: 44px; cursor: pointer; }
.btn.ghost { background: var(--surface); color: var(--accent); border: 1.5px solid var(--accent-mid); }
.btn.small { padding: .35em .9em; min-height: 36px; font-size: .88em; }
.btn.wide { width: 100%; }
.btn:disabled { opacity: .45; cursor: default; }
.link { background: none; border: 0; padding: .3em 0; color: var(--accent); font-weight: 600; cursor: pointer; min-height: 36px; }
.link.quiet { color: var(--ink-2); font-weight: 500; }
.field { width: 100%; min-width: 0; flex: 1; border: 1px solid var(--line-strong); border-radius: 12px; background: var(--surface); padding: .7em .8em; }
textarea.field { min-height: 5.5em; resize: vertical; }
.field:focus { outline: 2px solid var(--accent-mid); border-color: var(--accent); }
.chips { display: flex; flex-wrap: wrap; gap: 6px; }
.chip { border: 1px solid var(--line-strong); background: var(--surface); border-radius: 999px; padding: .35em .85em; min-height: 36px; cursor: pointer; font-size: .9em; }
.chip.on { background: var(--accent); color: var(--on-accent); border-color: var(--accent); }
.chip.add { border-style: dashed; color: var(--accent); }
.tag { display: inline-block; font-size: .76em; font-weight: 600; color: var(--accent); background: var(--accent-soft); border-radius: 999px; padding: .1em .65em; margin-right: .4em; }
.days { font-size: .76em; color: var(--ink-2); }
/* 오늘 */
.today-item { border: 1px solid var(--line); border-radius: 14px; padding: .8em .9em; display: flex; flex-direction: column; gap: .5em; background: var(--surface); }
.today-item.on { background: var(--accent-soft); border-color: var(--accent-mid); }
.today-item p { margin: 0; word-break: keep-all; }
.pray-btn { align-self: flex-start; display: inline-flex; align-items: center; gap: .4em; border-radius: 999px; border: 1.5px solid var(--accent); background: var(--surface); color: var(--accent); font-weight: 600; padding: .45em 1em; min-height: 40px; cursor: pointer; }
.pray-btn.on { background: var(--accent); color: var(--on-accent); }
.pray-btn svg { width: 16px; height: 16px; }
/* 내가 기도하는 사람들의 끈 */
.cord { display: grid; gap: 0; align-items: start; }
.cord svg { width: 100%; height: 46px; display: block; overflow: visible; }
.cord .seg { fill: none; stroke-width: 2.5; stroke-linecap: round; }
.cord .seg.loose { stroke: var(--line-strong); }
.cord .seg.taut { stroke: var(--accent); }
.cord .slot { fill: var(--surface); stroke: var(--line-strong); stroke-width: 1.5; }
.cord .knot { fill: var(--accent-soft); stroke: var(--accent); stroke-width: 2.5; }
.cord-names { display: grid; text-align: center; font-size: .72em; color: var(--ink-2); margin-top: -4px; }
.cord-names span.on { color: var(--accent); font-weight: 600; }
/* 노트 */
.group h3 { margin: .3em 0 0; font-size: .86em; color: var(--ink-2); font-weight: 600; }
.note { border-top: 1px solid var(--line); padding-top: .7em; display: flex; flex-direction: column; gap: .35em; }
.note:first-of-type { border-top: 0; padding-top: 0; }
.note p { margin: 0; word-break: keep-all; white-space: pre-wrap; }
.note .row { flex-wrap: wrap; row-gap: 0; }
.note .acts { display: flex; gap: 14px; margin-left: auto; }
.note .acts button { white-space: nowrap; }
/* 지난 기록 */
.weeks { display: grid; grid-template-columns: repeat(7, 1fr); gap: 5px; }
.weeks i { aspect-ratio: 1; border-radius: 6px; background: var(--surface-2); display: grid; place-items: center; font-style: normal; font-size: .68em; color: var(--ink-2); }
.weeks i.on { background: var(--accent); color: var(--on-accent); }
.weeks i.today { outline: 2px solid var(--accent-mid); }
.weeks i.wd { background: none; aspect-ratio: auto; font-size: .7em; }
.weeks i.blank { background: none; }
/* 지난 기록의 입체 그림: 나의 올해 끈, 이달의 소품 선반, 끈 보관함 */
.card-head { display: flex; justify-content: space-between; align-items: baseline; gap: 10px; flex-wrap: wrap; }
.card-head span { font-size: .8em; color: var(--ink-2); font-variant-numeric: tabular-nums; }
.stage3d { position: relative; width: 100%; border-radius: 12px; background: radial-gradient(120% 100% at 50% 40%, var(--surface), var(--surface-2)); cursor: grab; overflow: hidden; }
.stage3d.cord { aspect-ratio: 16 / 9; }
.stage3d.shelf { aspect-ratio: 4 / 5; max-height: 70vh; }
.stage3d.chest { aspect-ratio: 16 / 11; }
.stage3d .wait { position: absolute; inset: 0; display: grid; place-items: center; font-size: .82em; color: var(--ink-2); }
.pick3d { border-left: 3px solid var(--accent); padding: .3em 0 .3em .8em; }
.pick3d.gold { border-left-color: #D4A64A; }
.pick3d small { display: block; font-size: .76em; color: var(--ink-2); }
.pick3d p { margin: .1em 0 0; word-break: keep-all; }
.pick3d q { display: block; font-size: .82em; color: var(--ink-2); quotes: none; margin-top: .2em; }
.pick3d ul { margin: .3em 0 0; padding-left: 1.1em; font-size: .9em; }
.legend3d { display: flex; gap: 14px; flex-wrap: wrap; font-size: .78em; color: var(--ink-2); }
.legend3d i { display: inline-block; width: 12px; height: 12px; border-radius: 50%; margin-right: 5px; vertical-align: -2px; }
.legend3d .k { background: var(--accent); }
.legend3d .g { background: none; border: 2.5px solid #D4A64A; width: 8px; height: 8px; }
/* 오늘 화면: 소품이 놓였다는 한 줄 */
.keep-note { display: flex; justify-content: space-between; align-items: center; gap: 10px; flex-wrap: wrap; width: 100%; text-align: left; background: var(--accent-soft); color: var(--ink); border: 0; border-radius: 12px; padding: .65em .9em; font-size: .88em; cursor: pointer; }
.keep-note .go { color: var(--accent); font-weight: 600; white-space: nowrap; }
.month-nav { display: flex; align-items: center; justify-content: space-between; gap: 10px; margin-bottom: 12px; }
.month-nav b { font-family: var(--f-display); font-size: 1.1em; }
.month-nav .btn { min-width: 44px; font-size: 1.1em; }
.thanks li { list-style: none; border-left: 3px solid var(--warm); padding: .2em 0 .2em .7em; margin-bottom: .7em; }
.thanks { margin: 0; padding: 0; }
.thanks small { display: block; color: var(--ink-2); font-size: .76em; }
.thanks q { display: block; color: var(--ink-2); font-size: .82em; quotes: none; margin-top: .2em; }
.stats { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; text-align: center; }
.stats b { display: block; font-family: var(--f-display); font-size: 1.6em; line-height: 1.1; }
.stats span { font-size: .76em; color: var(--ink-2); }
/* 아래 탭 */
.ic { width: 1em; height: 1em; fill: none; stroke: currentColor; stroke-width: 1.5; stroke-linecap: round; stroke-linejoin: round; flex: none; }
.tabs { position: fixed; left: 0; right: 0; bottom: 0; display: grid; grid-template-columns: repeat(5, 1fr); background: var(--surface); border-top: 1px solid var(--line); padding: 0 env(safe-area-inset-right, 0px) max(6px, env(safe-area-inset-bottom, 0px)) env(safe-area-inset-left, 0px); z-index: 10; }
.tabs button { background: none; border: 0; color: var(--ink-2); display: grid; place-items: center; padding: .55em 0; min-height: 56px; cursor: pointer; position: relative; }
.tabs .ic { width: 28px; height: 28px; stroke-width: 1.4; }
.tabs button.on { color: var(--accent); }
.tabs button.on .ic { stroke-width: 1.8; }
.tabs button.on::after { content: ''; position: absolute; bottom: 6px; width: 5px; height: 5px; border-radius: 50%; background: var(--accent); }
.tabs button.pray-tab .ic { width: 44px; height: 44px; padding: 8px; border-radius: 50%; background: var(--accent-soft); color: var(--accent); }
.tabs button.pray-tab.on .ic { background: var(--accent); color: var(--on-accent); }
.tabs button.pray-tab.on::after { content: none; }
/* 기도하기 판 */
.sheet-back { position: fixed; inset: 0; background: color-mix(in srgb, var(--ink) 45%, transparent); z-index: 30; display: grid; place-items: end center; padding: 16px; }
.sheet { width: min(480px, 100%); background: var(--surface); border-radius: 20px; padding: 18px; display: flex; flex-direction: column; gap: 12px; max-height: calc(100dvh - 32px); overflow: auto; }
@media (min-width: 640px) { .sheet-back { place-items: center; } }
.ps { position: fixed; inset: 0; z-index: 40; background: var(--page); display: flex; flex-direction: column; }
.ps-top { display: flex; justify-content: space-between; align-items: center; padding: calc(12px + env(safe-area-inset-top, 0px)) 16px 8px; }
.ps-body { flex: 1; display: grid; place-items: center; padding: 16px; text-align: center; overflow: auto; }
.ps-body .in { max-width: 30em; display: flex; flex-direction: column; gap: 14px; align-items: center; }
.ps-text { font-family: var(--f-display); font-size: clamp(1.25rem, 4.5vw, 1.7rem); line-height: 1.6; margin: 0; word-break: keep-all; white-space: pre-wrap; }
.ps-nav { display: grid; grid-template-columns: 1fr 1.4fr 1fr; gap: 10px; padding: 12px 16px calc(16px + env(safe-area-inset-bottom, 0px)); }
.bar { height: 3px; background: var(--line); margin: 0 16px; border-radius: 2px; overflow: hidden; }
.bar b { display: block; height: 100%; background: var(--accent); }
.toast { position: fixed; left: 50%; bottom: calc(84px + env(safe-area-inset-bottom, 0px)); transform: translateX(-50%); background: var(--ink); color: var(--page); padding: .55em 1.1em; border-radius: 999px; font-size: .88em; z-index: 50; }
.empty { text-align: center; padding: 1.4em 1em; }
.notice { background: var(--warm-soft); color: var(--ink); border-radius: 14px; padding: .8em .9em; font-size: .86em; word-break: keep-all; }
.notice b { color: var(--warm); }
.mrow { display: flex; justify-content: space-between; align-items: center; gap: 10px; background: none; border: 0; border-top: 1px solid var(--line); padding: .8em 0; width: 100%; text-align: left; cursor: pointer; }
.mrow:first-of-type { border-top: 0; padding-top: 0; }
.mrow small { display: block; color: var(--ink-2); font-size: .8em; }
.seg { display: grid; grid-auto-flow: column; grid-auto-columns: 1fr; border: 1px solid var(--line-strong); border-radius: 999px; overflow: hidden; }
.seg button { background: var(--surface); border: 0; padding: .5em .3em; min-height: 40px; cursor: pointer; font-size: .9em; }
.seg button.on { background: var(--accent); color: var(--on-accent); font-weight: 600; }
.people li { display: flex; justify-content: space-between; align-items: center; padding: .4em 0; border-top: 1px solid var(--line); list-style: none; }

<body>
<div id="root"></div>
<script src="config.js"></script>
<script src="pray-data.js"></script>
<script src="art-data.js"></script>
<script>
(() => {
  // ── 저장: 이 기기에만. 서버로 보내지 않는다 ─────────────────────────────
  // 서버 주소가 없거나 ?demo로 열면 데모: 공동체 앱의 데모처럼 서버 코드를 브라우저 안에서 돌린다. 데모의 노트는 실제 노트와 따로 둔다
  const CFG = window.KOIDE_CONFIG || {};
  const DEMO_LINK = !!CFG.API_URL && new URLSearchParams(location.search).has('demo'), DEMO = !CFG.API_URL || DEMO_LINK, QS = DEMO_LINK ? '?demo' : '';
  // 기도 노트는 카카오 계정마다 따로 둔다(한 기기를 여럿이 써도 다른 사람의 노트가 보이지 않게). 주인 표시는 서버가 주는 값(uid)이다.
  //  주인 표시가 생기기 전의 노트는 처음 확인된 계정의 것으로 옮긴다. 주인을 아직 모르면(예전 로그인, 예전 서버) 예전 자리를 그대로 쓴다
  function ownNoteKey(base, uid) {
    if (!uid) return base;
    const k = base + ':' + uid;
    try {
      if (localStorage.getItem(k) == null && localStorage.getItem(base) != null) {
        localStorage.setItem(k, localStorage.getItem(base)); const lk = localStorage.getItem(base + '-key'); if (lk != null) localStorage.setItem(k + '-key', lk);
        localStorage.removeItem(base); localStorage.removeItem(base + '-key');
      }
    } catch (e) { return base; }
    return k;
  }
  const BASE = DEMO_LINK ? 'koide-demo-note-v1' : 'koide-note-v1', TOKEN = DEMO_LINK ? 'koide-demo-token' : 'koide-token', UID = DEMO_LINK ? 'koide-demo-uid' : 'koide-uid';
  const getUid = () => { try { return localStorage.getItem(UID) || ''; } catch (e) { return ''; } };
  const KEY = ownNoteKey(BASE, getUid()), LOCK_KEY = KEY + '-key';
  // 기도제목·사람·감사·기도한 날마다 고친 시각(up)을 둔다. 다른 기기와 이어 둘 때 더 나중 것을 남기려고(지운 것도 지웠다는 표시로 남긴다)
  const blank = () => ({ v: 2, started: false, name: '', nameUp: 0, people: [], items: [], prays: [], thanks: [], today: null, mode: '', vault: null });
  let D;
  try { D = migrate(Object.assign(blank(), JSON.parse(localStorage.getItem(KEY) || 'null') || {})); } catch (e) { D = blank(); }
  let canSave = true;
  function saveLocal() { try { localStorage.setItem(KEY, JSON.stringify(D)); } catch (e) { canSave = false; } }
  // 손으로 고친 것은 저장한 뒤 몇 초 있다가 이어 둔 곳에도 맡긴다
  let syncT;
  function save() { saveLocal(); if (D.vault && D.vault.on) { clearTimeout(syncT); syncT = setTimeout(() => sync(), 3000); } }
  if (navigator.storage && navigator.storage.persist) navigator.storage.persist().catch(() => {});
  // 예전(고친 시각이 없던) 노트도 그대로 쓰게: 고친 시각이 없으면 0(가장 오래된 것)으로 본다
  function migrate(x) {
    ['items', 'people', 'thanks', 'prays'].forEach(k => { x[k] = Array.isArray(x[k]) ? x[k] : []; x[k].forEach(o => { if (o.up == null) o.up = 0; }); });
    x.v = 2; return x;
  }

  // ── 다른 기기와 연결하기: 휴대폰에서 비밀 문구로 잠가 서버에 맡긴다. 서버와 시트에는 잠긴 글만 남는다 ──────────
  //  열쇠: 비밀 문구 + 소금(무작위) → PBKDF2(SHA-256, 25만 번) → AES-GCM 256. 열쇠는 이 기기에만 두고(노트도 이 기기에 그대로 있으니),
  //  비밀 문구는 어디에도 저장하지 않는다. 잊으면 다른 기기에서는 아무도 열 수 없다
  const getToken = () => { try { return localStorage.getItem(TOKEN); } catch (e) { return null; } };
  let demoReady = null;
  function loadDemo() {
    return new Promise((ok, bad) => {
      const a = document.createElement('script'); a.src = 'demo/gas-shim.js';
      a.onload = () => { const b = document.createElement('script'); b.src = (CFG.DEMO_CODE || '../apps-script/Code.js') + '?t=' + Date.now(); b.onload = ok; b.onerror = bad; document.head.appendChild(b); };
      a.onerror = bad; document.head.appendChild(a);
    });
  }
  async function api(action, data) {
    const body = Object.assign({ action, token: getToken() }, data || {});
    let res;
    if (DEMO) { await (demoReady || (demoReady = loadDemo())); res = await window.koideDemo.call(body); }
    else {
      const ctl = new AbortController(), stop = setTimeout(() => ctl.abort(), 60000);
      try { res = await (await fetch(CFG.API_URL, { method: 'POST', body: JSON.stringify(body), signal: ctl.signal })).json(); }
      catch (e) { throw { code: 'net', message: '서버가 답하지 않아요. 잠시 뒤 다시 해 주세요.' }; }
      finally { clearTimeout(stop); }
    }
    if (!res.ok) throw res;
    return res.data;
  }
  const te = new TextEncoder(), td = new TextDecoder();
  const b64 = buf => { const a = new Uint8Array(buf); let s = ''; for (let i = 0; i < a.length; i += 0x8000) s += String.fromCharCode.apply(null, a.subarray(i, i + 0x8000)); return btoa(s); };
  const unb64 = s => Uint8Array.from(atob(s), c => c.charCodeAt(0));
  const canLock = () => !!(window.crypto && crypto.subtle);
  async function deriveKey(pass, salt) {
    const base = await crypto.subtle.importKey('raw', te.encode(pass), 'PBKDF2', false, ['deriveKey']);
    return crypto.subtle.deriveKey({ name: 'PBKDF2', salt: unb64(salt), iterations: 250000, hash: 'SHA-256' }, base, { name: 'AES-GCM', length: 256 }, true, ['encrypt', 'decrypt']);
  }
  async function keepKey(key) { const raw = await crypto.subtle.exportKey('raw', key); try { localStorage.setItem(LOCK_KEY, b64(raw)); } catch (e) { /* 다음에 다시 묻는다 */ } }
  async function loadKey() { let r = null; try { r = localStorage.getItem(LOCK_KEY); } catch (e) { /* 없음 */ } return r ? crypto.subtle.importKey('raw', unb64(r), 'AES-GCM', false, ['encrypt', 'decrypt']) : null; }
  async function lockUp(key, obj) { const iv = crypto.getRandomValues(new Uint8Array(12)); return b64(iv) + '.' + b64(await crypto.subtle.encrypt({ name: 'AES-GCM', iv }, key, te.encode(JSON.stringify(obj)))); }
  async function unlockUp(key, s) { const [iv, ct] = s.split('.'); return JSON.parse(td.decode(await crypto.subtle.decrypt({ name: 'AES-GCM', iv: unb64(iv) }, key, unb64(ct)))); }
  // 맡기는 것: 이 기기만의 것(오늘 고른 3개, 화면 모드, 이어 두기 상태)은 빼고
  const payload = () => ({ v: 2, name: D.name, nameUp: D.nameUp, people: D.people, items: D.items, prays: D.prays, thanks: D.thanks });
  function mergeBy(a, b, key) {
    const m = new Map();
    [...(a || []), ...(b || [])].forEach(x => { const k = key(x), o = m.get(k); if (!o || (x.up || 0) > (o.up || 0)) m.set(k, x); });
    return [...m.values()];
  }
  function mergeIn(r) {
    r = migrate(Object.assign({}, r));
    D.items = mergeBy(D.items, r.items, x => x.id);
    D.people = mergeBy(D.people, r.people, x => x.id);
    D.thanks = mergeBy(D.thanks, r.thanks, x => x.id);
    D.prays = mergeBy(D.prays, r.prays, x => x.d + '|' + x.item);
    if ((r.nameUp || 0) > (D.nameUp || 0)) { D.name = r.name; D.nameUp = r.nameUp; }
    D.started = true;
  }
  let syncing = false, syncAgain = false;
  async function sync() {
    if (!D.vault || !D.vault.on || !canLock()) return;
    if (syncing) { syncAgain = true; return; }
    syncing = true; S.syncMsg = ''; paintSync('맞추는 중…');
    try {
      const key = await loadKey();
      if (!key) { D.vault.on = false; saveLocal(); throw { message: '이 기기에서 비밀 문구를 다시 넣어야 해요.' }; }
      for (let tries = 0; tries < 3; tries++) {
        const r = await api('noteGet');
        let base = 0;
        if (r && r.data) {
          try { mergeIn(await unlockUp(key, r.data)); } catch (e) { throw { message: '다른 기기에서 비밀 문구를 바꿨어요. 연결을 끊고 새 비밀 문구로 다시 연결해 주세요.' }; }
          base = r.rev;
        }
        const w = await api('notePut', { salt: D.vault.salt, data: await lockUp(key, payload()), baseRev: base });
        if (w.stale) continue;
        D.vault.rev = w.rev; D.vault.last = now(); saveLocal();
        break;
      }
    } catch (e) {
      S.syncMsg = e.code === 'login' ? '카카오 로그인이 끝났어요. 다시 로그인하면 이어서 맞춰요.' : e.code === 'bad' && /모르는 요청/.test(e.message || '') ? '서버를 새 버전으로 배포해야 연결할 수 있어요.' : (e.message || '맞추지 못했어요.');
    } finally {
      syncing = false;
      if (syncAgain) { syncAgain = false; sync(); } else safeRender();
    }
  }
  // 글을 쓰는 중이면 다시 그리지 않고 상태 글만 바꾼다(쓰던 글이 날아가지 않게)
  function paintSync(t) { const el = document.getElementById('sync-state'); if (el) el.textContent = t; }
  function safeRender() { const a = document.activeElement; if (a && a.matches && a.matches('input, textarea')) return paintSync(syncLabel()); render(); }
  const hhmm = t => { const d = new Date(t); return `${d.getMonth() + 1}월 ${d.getDate()}일 ${String(d.getHours()).padStart(2, '0')}:${String(d.getMinutes()).padStart(2, '0')}`; };
  const syncLabel = () => syncing ? '맞추는 중…' : S.syncMsg ? S.syncMsg : D.vault && D.vault.last ? '마지막으로 맞춘 때 · ' + hhmm(D.vault.last) : '아직 맞추지 않았어요';


  const $ = s => document.querySelector(s);
  const esc = s => String(s == null ? '' : s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' })[c]);
  const now = () => Date.now();
  const people = () => D.people.filter(p => !p.del);
  const prays = () => D.prays.filter(p => !p.off);
  const uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2, 6);
  const dkey = (d = new Date()) => d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0');
  const TODAY = () => dkey();
  const dateLabel = k => { const [y, m, d] = k.split('-').map(Number), w = '일월화수목금토'[new Date(y, m - 1, d).getDay()]; return `${m}월 ${d}일 ${w}요일`; };
  const short = k => { const [, m, d] = k.split('-').map(Number); return `${m}월 ${d}일`; };
  const daysSince = k => Math.max(1, Math.round((new Date(TODAY()) - new Date(k)) / 864e5) + 1);
  const ICON = {
    sun: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><circle cx="12" cy="12" r="4"/><path d="M12 2.5v2M12 19.5v2M2.5 12h2M19.5 12h2M5.3 5.3l1.4 1.4M17.3 17.3l1.4 1.4M5.3 18.7l1.4-1.4M17.3 6.7l1.4-1.4"/></svg>',
    pen: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M4 20h4L19 9l-4-4L4 16z"/><path d="M14 6l4 4"/></svg>',
    hands: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M12 21V9.5c0-1.6-.8-3-2-4L8 4v6"/><path d="M12 21V9.5c0-1.6.8-3 2-4L16 4v6"/><path d="M8 10l-3 5 4 6M16 10l3 5-4 6"/></svg>',
    book: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M4 5.5C6 4.5 9 4.5 12 6c3-1.5 6-1.5 8-.5V19c-2-1-5-1-8 .5-3-1.5-6-1.5-8-.5z"/><path d="M12 6v13.5"/></svg>',
    more: '<svg viewBox="0 0 24 24" fill="currentColor"><circle cx="5" cy="12" r="1.6"/><circle cx="12" cy="12" r="1.6"/><circle cx="19" cy="12" r="1.6"/></svg>',
    check: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg>'
  };
  // 아래 탭 아이콘: 공동체 앱과 같은 그림(오늘은 해)
  const tic = d => `<svg class="ic" viewBox="0 0 16 16" aria-hidden="true">${d}</svg>`;
  const TICON = {
    sun: tic('<circle cx="8" cy="8" r="2.8"/><path d="M8 1.8v1.4M8 12.8v1.4M1.8 8h1.4M12.8 8h1.4M3.6 3.6l1 1M11.4 11.4l1 1M3.6 12.4l1-1M11.4 4.6l1-1"/>'),
    pen: tic('<path d="M3 13l.8-3.2 6.7-6.7 2.4 2.4-6.7 6.7z"/><path d="M9.3 4.3l2.4 2.4"/>'),
    hands: tic('<path d="M8 2.5v10.5"/><path d="M8 2.5C6.7 3.8 6 5.6 6 7.6L3.4 10.4 5 13.5h3"/><path d="M8 2.5c1.3 1.3 2 3.1 2 5.1l2.6 2.8-1.6 3.1H8"/>'),
    book: tic('<rect x="3" y="2.5" width="10" height="11" rx="1.5"/><path d="M5.8 5.5h4.4M5.8 8h4.4M5.8 10.5h2.5"/>'),
    more: tic('<circle cx="3.5" cy="8" r=".9"/><circle cx="8" cy="8" r=".9"/><circle cx="12.5" cy="8" r=".9"/>')
  };

  // ── 기도 대상: 나, 내가 기도하는 사람들, 교회, 나라·세상 ─────────────────
  const FIXED = [['me', '나'], ['church', '교회'], ['world', '나라·세상']];
  const targetName = t => t.startsWith('p:') ? ((D.people.find(p => p.id === t.slice(2)) || {}).name || '떠난 이름') : (FIXED.find(f => f[0] === t) || [, '나'])[1];
  const targets = () => [['me', '나'], ...people().map(p => ['p:' + p.id, p.name]), ['church', '교회'], ['world', '나라·세상']];
  const open = () => D.items.filter(i => !i.done);
  const lastPrayed = id => prays().filter(p => p.item === id).reduce((m, p) => p.d > m ? p.d : m, '');
  const prayedToday = id => prays().some(p => p.item === id && p.d === TODAY());

  // 오늘 기도할 제목: 하루에 3개를 정해 두고(그날은 바뀌지 않게), 오래 기도하지 않은 것부터
  function todaySet() {
    const t = TODAY(), live = open().map(i => i.id);
    if (!D.today || D.today.d !== t) {
      const pick = open().slice().sort((a, b) => (lastPrayed(a.id) || '0').localeCompare(lastPrayed(b.id) || '0') || a.created.localeCompare(b.created)).slice(0, 3).map(i => i.id);
      D.today = { d: t, ids: pick }; save();
    }
    D.today.ids = D.today.ids.filter(id => live.indexOf(id) >= 0);
    if (D.today.ids.length < 3) {
      const more = open().filter(i => D.today.ids.indexOf(i.id) < 0).sort((a, b) => (lastPrayed(a.id) || '0').localeCompare(lastPrayed(b.id) || '0')).slice(0, 3 - D.today.ids.length).map(i => i.id);
      if (more.length) { D.today.ids.push(...more); save(); }
    }
    return D.today.ids.map(id => D.items.find(i => i.id === id)).filter(Boolean);
  }
  function togglePray(id) {
    const t = TODAY(), p = D.prays.find(x => x.item === id && x.d === t);
    if (p) { p.off = !p.off; p.up = now(); } else D.prays.push({ d: t, item: id, up: now() });
    save();
  }

  const S = { tab: D.started ? 'today' : 'start', edit: null, draftT: 'me', done: null, ps: null, toast: '', pick: null, tour: null };

  // ── 화면 설정: 공동체 앱과 같은 곳(koide-pref)에 둔다. 예전 노트의 화면 모드는 한 번 옮긴다 ──────────
  const PREF = (() => { try { return JSON.parse(localStorage.getItem('koide-pref')) || {}; } catch (e) { return {}; } })();
  const MODES = [['system', '기기 설정'], ['light', '밝게'], ['dark', '어둡게']];
  const STYLES = [['flat', 'basic'], ['neu', 'new'], ['skeu', 'classic'], ['glass', 'glass']];
  const ACCENTS = [['green', '초록', '#2B6A62'], ['amber', '주황', '#C46A24'], ['blue', '파랑', '#2F5D95'], ['rose', '장미', '#A8435C'], ['ink', '먹색', '#3A3A36']];
  function setPref(k, v) {
    PREF[k] = v;
    try { localStorage.setItem('koide-pref', JSON.stringify(PREF)); } catch (e) { /* 무시 */ }
    const d = document.documentElement;
    if (PREF.mode === 'light' || PREF.mode === 'dark') d.dataset.mode = PREF.mode; else delete d.dataset.mode;
    if (PREF.accent && PREF.accent !== 'green') d.dataset.accent = PREF.accent; else delete d.dataset.accent;
    if (PREF.style && PREF.style !== 'flat') d.dataset.style = PREF.style; else delete d.dataset.style;
    if (PREF.big) d.dataset.big = ''; else delete d.dataset.big;
  }
  if (D.mode && !PREF.mode) setPref('mode', D.mode);
  if (D.mode) { D.mode = ''; saveLocal(); }

  // ── 기도하기 설정: 무엇을(오늘의 세 가지 / 모든 기도제목 / 빼기), 하나님 나라, 잔잔한 음악 ──────────
  const KP = window.KOIDE_PRAY;
  const PSK = DEMO_LINK ? 'koide-demo-note-pset' : 'koide-note-pset';
  const PS = Object.assign({ set: 'today', world: false, topics: KP.PRAY_TOPICS.map(t => t.k), music: false, track: 0, auto: true }, (() => { try { return JSON.parse(localStorage.getItem(PSK)) || {}; } catch (e) { return {}; } })());
  const savePs = () => { try { localStorage.setItem(PSK, JSON.stringify(PS)); } catch (e) { /* 이번만 */ } };
  // 공동체용 문장의 '사랑방'을 혼자 쓰는 노트에 맞게
  const solo = x => String(x || '').replace(/우리 사랑방/g, '내 주변').replace(/사랑방/g, '공동체');
  // 오늘 보여 줄 하나님 나라 문장: 공동체 앱과 같은 날에는 같은 문장(절기면 하루걸러 절기 문장)
  function prayDay(t) {
    const day = new Date(), n = KP.dayNo(day), s = KP.PRAY_SEASONS.find(x => x.k === KP.seasonKey(day));
    return { a: s && s.topic === t.k && n % 2 === 0 ? [s.text, s.ref] : [t.a[n % t.a.length], ''], b: t.b[n % t.b.length], next: t.next };
  }
  const topicByK = k => [...KP.PRAY_TOPICS, KP.PRAY_THANKS].find(t => t.k === k);
  // 한 장씩 넘길 목록: 기도제목(고른 것) + 하나님 나라(고른 주제, 마지막은 늘 감사와 찬양)
  function psList(set) {
    const items = set === 'all' ? open() : set === 'none' ? [] : todaySet();
    const world = PS.world ? [...KP.PRAY_TOPICS.filter(t => PS.topics.includes(t.k)), KP.PRAY_THANKS].map(t => ({ topic: t.k })) : [];
    return [...items, ...world];
  }
  // 잔잔한 음악: 찬송가 1~8장 연주 파일(공동체 앱과 같은 파일)
  const HYMNS = Array.from({ length: 8 }, (_, i) => ({ label: (i + 1) + '장', file: (CFG.MUSIC || 'music/') + 'hymn-' + String(i + 1).padStart(2, '0') + '.mp3' }));
  const player = new Audio(); player.preload = 'auto';
  function playTrack(i) { PS.track = i; savePs(); player.src = HYMNS[i].file; player.play().catch(() => {}); document.querySelectorAll('.ps-music .trk').forEach(e => { e.textContent = HYMNS[i].label; }); }
  player.addEventListener('ended', () => { if (S.ps && PS.music) playTrack(PS.auto ? (PS.track + 1) % HYMNS.length : PS.track); });
  const musicOff = () => { player.pause(); };

  // ── 사용법 안내: 처음 시작할 때 한 번, 더보기에서 다시 보기 ──────────
  const TOUR_KEY = DEMO_LINK ? 'koide-demo-note-tour' : 'koide-note-tour';
  const TOUR = [
    ['오늘', '하루 세 가지', '날마다 기도제목 세 개가 나와요. 오래 기도하지 않은 것부터예요. 기도하고 "기도했어요"를 눌러요.'],
    ['내 기도', '쓰고, 마치고, 감사해요', '기도제목을 쓰고 누구를 위한 것인지 골라요. 응답받으면 마치기 › "응답받았어요"로 감사 기록을 남겨요.'],
    ['기도하기', '한 장씩 넘기며', '내 기도제목에 하나님 나라 주제와 잔잔한 음악을 더할 수 있어요. 마지막에는 주기도문으로 마쳐요.'],
    ['나만 봐요', '이 휴대폰에 저장돼요', '서버로 보내지 않아서 아무도 볼 수 없어요. 휴대폰을 바꿀 때는 더보기 › 다른 기기와 연결하기나 백업을 써요.']];
  function tourSheet() {
    const i = S.tour, [ey, h, t] = TOUR[i], last = i === TOUR.length - 1;
    return `<div class="sheet-back" data-a="tourend"><section class="sheet" role="dialog" aria-modal="true" aria-labelledby="tr-t" data-stop>
      <p class="eyebrow">${ey}</p><h2 id="tr-t">${h}</h2><p class="plain">${t}</p>
      <div class="tour-dots" aria-hidden="true">${TOUR.map((_, k) => `<i class="${k === i ? 'on' : ''}"></i>`).join('')}</div>
      <div class="row"><button class="link quiet" data-a="tourend">건너뛰기</button><span style="display:flex;gap:8px">${i ? '<button class="btn ghost small" data-a="tourgo" data-v="-1">이전</button>' : ''}<button class="btn small" data-a="${last ? 'tourend' : 'tourgo'}" data-v="1">${last ? '시작하기' : '다음'}</button></span></div></section></div>`;
  }

  // ── 화면 ─────────────────────────────────────────────────────────────
  function cordHtml() {
    const nodes = [['me', '나'], ...people().map(p => ['p:' + p.id, p.name])];
    if (nodes.length < 2) return '';
    const on = nodes.map(([t]) => D.items.some(i => i.target === t && prayedToday(i.id)));
    const N = nodes.length, W = 100 * N, x = k => 50 + k * 100;
    let s = '';
    for (let k = 0; k < N - 1; k++) { const both = on[k] && on[k + 1]; s += `<path class="seg ${both ? 'taut' : 'loose'}" d="M${x(k)} 18Q${x(k) + 50} ${both ? 18 : 34} ${x(k + 1)} 18"/>`; }
    nodes.forEach((n, k) => { s += on[k] ? `<circle class="knot" cx="${x(k)}" cy="18" r="10"/>` : `<circle class="slot" cx="${x(k)}" cy="18" r="8"/>`; });
    return `<section class="card"><div class="row"><p class="label">내가 기도하는 사람들</p><span class="hint">${on.filter(Boolean).length} / ${N}</span></div>
      <div class="cord"><svg viewBox="0 0 ${W} 44" preserveAspectRatio="none" aria-label="오늘 기도한 사람은 매듭이 지어져요">${s}</svg>
      <div class="cord-names" style="grid-template-columns:repeat(${N},1fr)">${nodes.map(([, n], k) => `<span class="${on[k] ? 'on' : ''}">${esc(n)}</span>`).join('')}</div></div>
      <p class="hint">오늘 그 사람을 위해 기도하면 매듭이 지어지고, 이웃한 두 사람을 다 기도하면 끈이 팽팽해져요.</p></section>`;
  }
  function todayView() {
    const set = todaySet(), all = open(), done = set.filter(i => prayedToday(i.id)).length;
    const head = `<header class="top"><div><p class="eyebrow">${dateLabel(TODAY())}</p><h1>오늘의 기도</h1></div></header>`;
    if (!all.length) return head + `<section class="card empty"><h2>아직 기도제목이 없어요</h2><p class="hint">나와 가족, 친구, 교회를 위한 기도제목을 써 보세요. 이 휴대폰에만 저장돼요.</p><button class="btn" data-a="tab" data-v="note">기도제목 쓰기</button></section>` + thanksQuick();
    return head + `<section class="card"><div class="row"><p class="label">오늘 기도할 제목</p><span class="hint">${done} / ${set.length}</span></div>
      ${set.map(i => { const on = prayedToday(i.id); return `<div class="today-item${on ? ' on' : ''}"><p><span class="tag">${esc(targetName(i.target))}</span>${esc(i.text)}</p>
        <div class="row"><span class="days">${daysSince(i.created)}일째 기도하고 있어요</span><button class="pray-btn${on ? ' on' : ''}" data-a="pray" data-v="${i.id}" aria-pressed="${on}">${on ? ICON.check + '기도했어요' : '기도했어요'}</button></div></div>`; }).join('')}
      ${done === set.length ? `<p class="hint">오늘 기도할 제목을 다 기도했어요.${all.length > set.length ? ' 다른 기도제목도 함께 기도해 볼까요?' : ''}</p>` : ''}
      ${done === set.length && todayProp() ? `<button class="keep-note" data-a="keep" data-v="shelf"><span>${todayProp().all ? '이달의 소품을 다 모았어요' : `오늘 <b>${esc(todayProp().name)}</b>${josaN(todayProp().name)} 보관함에 놓였어요`}</span><span class="go">보관함 보기 ›</span></button>` : ''}
      <button class="btn ghost" data-a="psopen" data-v="${done === set.length ? 'all' : 'today'}">${done === set.length && all.length > set.length ? '모든 기도제목으로 기도하기' : '한 장씩 기도하기'}</button></section>
      ${cordHtml()}${thanksQuick()}`;
  }
  function thanksQuick() {
    const t = D.thanks.filter(x => x.date === TODAY());
    return `<section class="card"><p class="label">오늘 감사한 것</p>
      ${t.length ? `<ul class="thanks">${t.map(x => `<li>${esc(x.text)}</li>`).join('')}</ul>` : ''}
      <form data-f="thanks" class="row" style="align-items:stretch"><input class="field" id="th-in" maxlength="200" placeholder="한 줄이면 충분해요" aria-label="오늘 감사한 것" value="${esc(S.thDraft || '')}"><button class="btn small" type="submit">남기기</button></form></section>`;
  }
  function noteView() {
    const T = targets(), groups = T.map(([t, n]) => [t, n, open().filter(i => i.target === t)]).filter(g => g[2].length);
    const e = S.edit && D.items.find(i => i.id === S.edit);
    const form = `<section class="card"><p class="label">${e ? '기도제목 고치기' : '새 기도제목'}</p>
      <form data-f="item"><textarea class="field" id="it-text" maxlength="1000" placeholder="무엇을 위해 기도할까요?" aria-label="기도제목">${esc(S.draft != null ? S.draft : e ? e.text : '')}</textarea>
        <p class="label" style="margin-top:10px">누구를 위해</p>
        <div class="chips" role="radiogroup" aria-label="누구를 위해">${T.map(([t, n]) => `<button type="button" class="chip${S.draftT === t ? ' on' : ''}" role="radio" aria-checked="${S.draftT === t}" data-a="tgt" data-v="${t}">${esc(n)}</button>`).join('')}<button type="button" class="chip add" data-a="addperson">+ 사람</button></div>
        <div class="row" style="margin-top:12px;justify-content:flex-end">${e ? '<button type="button" class="btn ghost small" data-a="editcancel">취소</button>' : ''}<button class="btn" type="submit">${e ? '고치기' : '더하기'}</button></div></form></section>`;
    return `<header class="top"><div><p class="eyebrow">나만 보는 기도제목</p><h1>내 기도</h1></div><span class="hint">${open().length}개</span></header>${form}
      ${groups.length ? `<section class="card group">${groups.map(([t, n, L]) => `<h3>${esc(n)}</h3>${L.map(i => `<div class="note"><p>${esc(i.text)}</p>
        <div class="row"><span class="days">${short(i.created)}부터 · ${daysSince(i.created)}일째${lastPrayed(i.id) ? ' · 마지막 기도 ' + short(lastPrayed(i.id)) : ''}</span>
        <span class="acts"><button class="link quiet" data-a="edit" data-v="${i.id}">고치기</button><button class="link quiet" data-a="share" data-v="${i.id}">나누기</button><button class="link" data-a="done" data-v="${i.id}">마치기</button></span></div></div>`).join('')}`).join('')}</section>` : '<p class="hint" style="text-align:center">위에 첫 기도제목을 써 보세요.</p>'}`;
  }
  // 지난 기록: 달마다 한 장. 위에서 달을 넘기고, 그 달의 기도한 날·감사와 응답·마친 기도만 보여서 쌓여도 길어지지 않는다
  function lookView() {
    const cur = TODAY().slice(0, 7), firsts = [...prays().map(p => p.d), ...D.thanks.map(x => x.date), ...D.items.map(i => i.created)].filter(Boolean).sort();
    const first = (firsts[0] || TODAY()).slice(0, 7), M = S.lookM && S.lookM >= first && S.lookM <= cur ? S.lookM : cur;
    const [y, m] = M.split('-').map(Number), shift = k => { const d = new Date(y, m - 1 + k, 1); return d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0'); };
    const prayedDays = new Set(prays().map(p => p.d).filter(d => d.startsWith(M)));
    const thanks = D.thanks.filter(x => x.date.startsWith(M)).sort((p, q) => q.date.localeCompare(p.date));
    const doneL = D.items.filter(i => i.done && i.done.date.startsWith(M)).sort((p, q) => q.done.date.localeCompare(p.done.date));
    const lead = new Date(y, m - 1, 1).getDay(), days = new Date(y, m, 0).getDate();
    const cells = [...Array(lead).fill('<i class="blank"></i>'), ...Array.from({ length: days }, (_, k) => { const d = M + '-' + String(k + 1).padStart(2, '0');
      return `<i class="${prayedDays.has(d) ? 'on' : ''}${d === TODAY() ? ' today' : ''}" title="${short(d)}">${k + 1}</i>`; })].join('');
    const tab = S.lookTab === 'done' ? 'done' : 'thanks';
    const list = tab === 'thanks'
      ? (thanks.length ? `<ul class="thanks">${thanks.map(x => { const it = x.item && D.items.find(i => i.id === x.item); return `<li><small>${short(x.date)}${x.kind === 'answer' ? ' · 응답' : ''}</small>${esc(x.text)}${it ? `<q>기도제목: ${esc(it.text)}</q>` : ''}</li>`; }).join('')}</ul>` : '<p class="hint">이 달에는 남긴 감사가 없어요. 기도제목을 "응답받았어요"로 마치거나, 오늘 화면에서 감사한 것을 남기면 여기에 모여요.</p>')
      : (doneL.length ? doneL.map(i => `<div class="note"><p><span class="tag">${esc(targetName(i.target))}</span>${esc(i.text)}</p><span class="days">${short(i.created)} ~ ${short(i.done.date)} · ${i.done.how === 'answer' ? '응답받았어요' : '맡겨 두었어요'}</span>
        <button class="link quiet" data-a="undone" data-v="${i.id}" style="align-self:flex-start">다시 기도하기</button></div>`).join('') : '<p class="hint">이 달에 마친 기도는 없어요.</p>');
    const longest = M === cur ? open().slice().sort((p, q) => p.created.localeCompare(q.created)).slice(0, 3) : [];
    return `<header class="top"><div><p class="eyebrow">나만 보는 기록</p><h1>지난 기록</h1></div></header>
      <div class="month-nav"><button class="btn ghost small" data-a="lookm" data-v="${shift(-1)}"${M > first ? '' : ' disabled'} aria-label="이전 달">‹</button><b>${y}년 ${m}월</b><button class="btn ghost small" data-a="lookm" data-v="${shift(1)}"${M < cur ? '' : ' disabled'} aria-label="다음 달">›</button></div>
      <section class="card"><div class="stats"><div><b>${prayedDays.size}</b><span>기도한 날</span></div><div><b>${thanks.length}</b><span>감사·응답</span></div><div><b>${doneL.length}</b><span>마친 기도</span></div></div>
        <div class="weeks" aria-label="${m}월 중 기도한 날">${'일월화수목금토'.split('').map(w => `<i class="wd">${w}</i>`).join('')}${cells}</div>
        <p class="hint">남과 견주지 않는 나만의 기록이에요. 빈 날이 있어도 괜찮아요.</p></section>
      <section class="card"><div class="seg" role="tablist">${[['thanks', '감사와 응답 · ' + thanks.length], ['done', '마친 기도 · ' + doneL.length]].map(([k, l]) => `<button class="${tab === k ? 'on' : ''}" role="tab" aria-selected="${tab === k}" data-a="looktab" data-v="${k}">${l}</button>`).join('')}</div>${list}</section>
      ${longest.length ? `<section class="card"><p class="label">오래 이어 온 기도</p>${longest.map(i => `<p class="plain"><span class="tag">${esc(targetName(i.target))}</span>${esc(i.text)} <span class="days">· ${daysSince(i.created)}일째</span></p>`).join('')}</section>` : ''}
      <section class="card"><button class="mrow" data-a="keep" data-v=""><span><b>나의 보관함</b><small>올해 끈 · 이달의 소품 · 끈 보관함</small></span><span aria-hidden="true">›</span></button></section>`;
  }
  // 나의 보관함: 지난 기록 맨 아래 입구로 들어가는 화면. 입체 그림 셋 중 하나를 크게(올해 끈 · 이달의 소품 · 끈 보관함)
  const KEEPS = [['cord', '올해 끈'], ['shelf', '이달의 소품'], ['chest', '끈 보관함']];
  const keepKind = () => KEEPS.some(k => k[0] === S.keep) ? S.keep : 'cord';
  function keepView() {
    const k = keepKind(), C = k === 'cord' ? cordData() : null;
    const head = k === 'cord' ? `<div class="card-head"><h2>나의 ${C.year}년 끈</h2><span>기도한 날 ${C.days.reduce((a, b) => a + b, 0)}일 · 응답 ${C.answers.length} · 감사 ${C.thanks.length}</span></div>`
      : `<p class="hint">${k === 'shelf' ? '기도한 날마다 그 달 그림의 소품이 하나씩 선반에 놓여요. 공동체의 이달의 그림과 같은 주제예요.' : '한 해가 끝나면 그해의 끈을 감아 상자에 넣어요. 해가 갈수록 한 칸씩 채워져요.'}</p>`;

      <section class="card"><p class="plain">기도제목을 쓰고, 날마다 몇 개씩 기도하고, 감사와 응답을 남겨요.</p>
        <div class="notice"><b>기록은 이 휴대폰에만 저장돼요.</b> 서버로 보내지 않아서 운영하는 사람도 볼 수 없어요. 그래서 휴대폰을 바꾸면 백업 파일로 옮겨야 해요. 아이폰은 꼭 <b>홈 화면에 추가</b>해서 써 주세요(공유 버튼 › 홈 화면에 추가).</div>
        <form data-f="start"><label class="label" for="st-name">부를 이름 (선택)</label><input class="field" id="st-name" maxlength="20" autocomplete="nickname" style="margin-top:6px">
          <label class="label" for="st-people" style="display:block;margin-top:12px">늘 기도하는 사람 (선택, 쉼표로 나눠요)</label><input class="field" id="st-people" maxlength="200" placeholder="예) 엄마, 아빠, 지우" style="margin-top:6px">
          <button class="btn wide" type="submit" style="margin-top:16px">시작하기</button></form>
        ${canLock() ? '<button class="link" data-a="vstart" style="align-self:center">다른 기기에서 쓰던 노트 불러오기</button>' : ''}</section>`;
  }
  function doneSheet() {
    const i = D.items.find(x => x.id === S.done); if (!i) return '';
    return `<div class="sheet-back" data-a="doneclose"><section class="sheet" role="dialog" aria-modal="true" aria-labelledby="dn-t" data-stop>
      <h2 id="dn-t">이 기도제목을 마칠까요?</h2><p class="plain"><span class="tag">${esc(targetName(i.target))}</span>${esc(i.text)}</p>
      <div class="seg" role="radiogroup" aria-label="어떻게 마칠까요">${[['answer', '응답받았어요'], ['leave', '맡겨 둘게요']].map(([k, l]) => `<button class="${(S.doneHow || 'answer') === k ? 'on' : ''}" role="radio" aria-checked="${(S.doneHow || 'answer') === k}" data-a="donehow" data-v="${k}">${l}</button>`).join('')}</div>
      ${(S.doneHow || 'answer') === 'answer' ? '<label class="label" for="dn-note">어떻게 응답하셨나요? (감사 기록으로 남아요)</label><textarea class="field" id="dn-note" maxlength="1000" placeholder="한 줄이어도 좋아요"></textarea>' : '<p class="hint">하나님께 맡겨 두고 마쳐요. 지난 기록의 마친 기도에 남고, 언제든 다시 기도할 수 있어요.</p>'}
      <div class="row" style="justify-content:flex-end"><button class="btn ghost" data-a="doneclose">취소</button><button class="btn" data-a="doneok">마치기</button></div></section></div>`;
  }
  function psHtml() {
    const P = S.ps, L = P.list, last = P.i >= L.length;
    const mus = `<span style="display:flex;gap:6px"><button class="ps-music${PS.music ? ' on' : ''}" data-a="psmusic" aria-pressed="${PS.music}">♪ <span class="trk">${PS.music ? HYMNS[PS.track].label : '음악 꺼짐'}</span></button>${PS.music ? '<button class="ps-music" data-a="psnexttrack" aria-label="다음 곡">다음 곡 ›</button>' : ''}</span>`;
    const top = `<div class="ps-top"><span class="hint">${last ? '마침' : `${P.i + 1} / ${L.length}`}</span>${mus}<button class="link" data-a="psclose">닫기</button></div><div class="bar"><b style="width:${Math.min(100, P.i / L.length * 100)}%"></b></div>`;
    const n = L.filter(x => x.topic ? P.extra.includes(x.topic) : prayedToday(x.id)).length;
    // 마지막 장: 주기도문으로 마치고, 오늘 감사한 것을 남긴다
    if (last) return `<div class="ps" role="dialog" aria-modal="true" aria-label="기도하기">${top}<div class="ps-body"><div class="in">
      <p class="eyebrow">주기도문으로 마쳐요</p><p class="ps-lord">${KP.LORDS_PRAYER.map(x => `<span>${x}</span>`).join('')}</p>
      <p class="hint">${n ? n + '장을 기도했어요.' : '오늘도 함께해 주신 아버지께 감사해요.'}</p>
      <form data-f="thanks" style="width:100%;display:flex;gap:8px"><input class="field" id="th-in" maxlength="200" placeholder="오늘 감사한 것 한 줄" aria-label="오늘 감사한 것" value="${esc(S.thDraft || '')}"><button class="btn small" type="submit">남기기</button></form></div></div>
      <div class="ps-nav" style="grid-template-columns:1fr"><button class="btn" data-a="psclose">마치기</button></div></div>`;
    const it = L[P.i];
    let body, on;
    if (it.topic) {
      // 하나님 나라: 주기도문의 간구, 오늘의 간구 문장 하나와 성경의 기도 하나, 내 말로 이어서
      const t = topicByK(it.topic), d = prayDay(t); on = P.extra.includes(it.topic);
      body = `<p class="ps-lp">${t.lines.map(k => KP.LORDS_PRAYER[k]).join(' ')}</p><p class="eyebrow">하나님 나라</p><h2>${esc(t.name)}</h2>
        <ul class="ps-list"><li>${esc(solo(d.a[0]))}${d.a[1] ? `<small>${esc(d.a[1])}</small>` : ''}</li><li>${esc(solo(d.b[0]))}<small>${esc(d.b[1])}</small></li></ul><p class="ps-next">${esc(solo(d.next))}</p>`;
    } else {
      on = prayedToday(it.id);
      body = `<span class="tag">${esc(targetName(it.target))}</span><p class="ps-text">${esc(it.text)}</p><span class="days">${daysSince(it.created)}일째 기도하고 있어요</span>`;
    }
    return `<div class="ps" role="dialog" aria-modal="true" aria-label="기도하기">${top}<div class="ps-body"><div class="in">${body}</div></div>
      <div class="ps-nav"><button class="btn ghost" data-a="psgo" data-v="-1"${P.i ? '' : ' disabled'}>이전</button>
        <button class="pray-btn${on ? ' on' : ''}" style="align-self:stretch;justify-content:center" data-a="${it.topic ? 'psxtra' : 'pspray'}" data-v="${it.topic || ''}" aria-pressed="${on}">${on ? ICON.check + '기도했어요' : '기도했어요'}</button>
        <button class="btn ghost" data-a="psgo" data-v="1">${P.i === L.length - 1 ? '마침' : '다음'}</button></div></div>`;
  }
  function prayTab() {
    const nT = todaySet().length, nA = open().length, list = psList(PS.set);
    const seg = (items, cur, act) => `<div class="seg" role="radiogroup">${items.map(([k, l]) => `<button class="${cur === k ? 'on' : ''}" role="radio" aria-checked="${cur === k}" data-a="${act}" data-v="${k}">${l}</button>`).join('')}</div>`;
    const sw = (on, act, label) => `<button class="switch${on ? ' on' : ''}" role="switch" aria-checked="${!!on}" aria-label="${label}" data-a="${act}"><span></span></button>`;
    return `<header class="top"><div><p class="eyebrow">한 장씩 넘기며</p><h1>기도하기</h1></div></header>
      <section class="card"><p class="plain">조용한 화면에서 한 장씩 넘기며 기도해요. 마지막에는 주기도문으로 마쳐요.</p>
        <p class="label">내 기도제목</p>${seg([['today', '오늘의 ' + nT + '개'], ['all', '모두 ' + nA + '개'], ['none', '빼기']], PS.set, 'psset')}
        <div class="row" style="margin-top:6px"><div><p class="plain">하나님 나라</p><p class="hint">주기도문의 간구를 따라 교회와 나라와 세상을 위해 기도해요. 마지막엔 감사와 찬양이에요.</p></div>${sw(PS.world, 'psworld', '하나님 나라')}</div>
        ${PS.world ? `<div class="chips">${KP.PRAY_TOPICS.map(t => `<button class="chip${PS.topics.includes(t.k) ? ' on' : ''}" data-a="pstopic" data-v="${t.k}" aria-pressed="${PS.topics.includes(t.k)}">${esc(t.name)}</button>`).join('')}</div>` : ''}
        <div class="row" style="margin-top:6px"><div><p class="plain">잔잔한 음악 (찬송가 1~8장)</p><p class="hint">기도하는 동안 조용히 흘러요. 이어폰을 권해요.</p></div>${sw(PS.music, 'psmusic', '잔잔한 음악')}</div>
        ${PS.music ? `<div class="chips">${HYMNS.map((h, i) => `<button class="chip${PS.track === i ? ' on' : ''}" data-a="pstrack" data-v="${i}" aria-pressed="${PS.track === i}">${h.label}</button>`).join('')}</div>
          <div class="row"><p class="hint">${PS.auto ? '다 들으면 다음 곡으로 이어져요.' : HYMNS[PS.track].label + '만 반복해요.'}</p>${sw(PS.auto, 'psauto', '다 들으면 다음 곡으로')}</div>` : ''}
        <button class="btn wide" data-a="psopen" data-v="tab" style="margin-top:8px;min-height:52px"${list.length ? '' : ' disabled'}>${list.length ? '기도 시작 · ' + list.length + '장' : nA ? '무엇을 위해 기도할지 골라 주세요' : '먼저 내 기도에 기도제목을 써 주세요'}</button></section>`;
  }
  const TABS = [['today', '오늘', TICON.sun], ['note', '내 기도', TICON.pen], ['pray', '기도하기', TICON.hands], ['look', '지난 기록', TICON.book], ['more', '더보기', TICON.more]];
  function render() {
    const V = { start: startView, today: todayView, note: noteView, pray: prayTab, look: lookView, keep: keepView, more: moreView }[S.tab];
    $('#root').innerHTML = `<div class="wrap">${S.tab !== 'start' ? `<div class="space"><span class="pilot" style="margin:0">나의 기도 노트 · ${D.vault && D.vault.on ? '연결됨' : '이 휴대폰에 저장'}</span>${inCommunity() ? `<a href="index.html${QS}">공동체로 ›</a>` : ''}</div>` : ''}${V()}</div>
      ${S.tab === 'start' ? '' : `<nav class="tabs" aria-label="메뉴">${TABS.map(([k, l, ic]) => { const on = (S.tab === 'keep' ? 'look' : S.tab) === k; return `<button class="${k === 'pray' ? 'pray-tab ' : ''}${on ? 'on' : ''}" data-a="tab" data-v="${k}" aria-label="${l}" title="${l}" ${on ? 'aria-current="page"' : ''}>${ic}</button>`; }).join('')}</nav>`}
      ${S.done ? doneSheet() : ''}${S.tour != null ? tourSheet() : ''}${S.vsheet ? vaultSheet() : ''}${S.share ? shareSheet() : ''}${S.ps ? psHtml() : ''}${S.toast ? `<div class="toast" role="status">${esc(S.toast)}</div>` : ''}
      ${canSave ? '' : '<div class="toast" role="alert">이 브라우저에서는 저장할 수 없어요. 개인 정보 보호 모드를 끄고 열어 주세요.</div>'}`;
    document.documentElement.style.overflow = S.ps || S.done || S.vsheet || S.share || S.tour != null ? 'hidden' : '';
    mount3d();
  }
  let toastT;
  function toast(m) { S.toast = m; render(); clearTimeout(toastT); toastT = setTimeout(() => { S.toast = ''; render(); }, 2200); }
  function go(t) { S.tab = t; S.edit = null; render(); window.scrollTo(0, 0); }
  function addPerson() {
    const n = (prompt('기도할 사람의 이름') || '').trim().slice(0, 12); if (!n) return null;
    const p = { id: uid(), name: n, up: now() }; D.people.push(p); save(); return p;
  }

  // ── 누르기 ─────────────────────────────────────────────────────────────
  document.addEventListener('click', e => {
    const b = e.target.closest('[data-a]'); if (!b) return;
    // 다시 그려도 쓰던 글이 남게(대상 고르기·사람 더하기를 눌러도)
    const ta = $('#it-text'); if (ta) S.draft = ta.value;
    const th = $('#th-in'); if (th) S.thDraft = th.value;
    // 창 안을 눌렀는데 가장 가까운 동작이 바깥 배경(닫기)이면 무시한다(창 안의 입력 칸·제출 버튼을 눌러도 창이 닫히지 않게)
    if (b.classList.contains('sheet-back') && e.target.closest('[data-stop]')) return;
    const a = b.dataset.a, v = b.dataset.v;
    switch (a) {
      case 'tab': S.draft = null; S.thDraft = ''; return go(v);
      case 'pray': togglePray(v); return render();
      case 'tgt': S.draftT = v; return render();
      case 'addperson': { const p = addPerson(); if (p && S.tab === 'note') S.draftT = 'p:' + p.id; return render(); }
      case 'edit': { const i = D.items.find(x => x.id === v); S.edit = v; S.draftT = i.target; S.draft = null; render(); $('#it-text').focus(); return window.scrollTo(0, 0); }
      case 'editcancel': S.edit = null; S.draft = null; return render();
      case 'done': S.done = v; S.doneHow = 'answer'; return render();
      case 'donehow': S.doneHow = v; return render();
      case 'doneclose': S.done = null; return render();
      case 'doneok': {
        const i = D.items.find(x => x.id === S.done), how = S.doneHow || 'answer', note = how === 'answer' ? ($('#dn-note').value || '').trim() : '';
        i.done = { date: TODAY(), how }; i.up = now();
        if (how === 'answer') D.thanks.push({ id: uid(), date: TODAY(), text: note || '응답받았어요', item: i.id, kind: 'answer', up: now() });
        save(); S.done = null; return toast(how === 'answer' ? '감사 기록으로 남겼어요' : '맡겨 두었어요');
      }
      case 'share': S.share = v; return render();
      case 'shareclose': S.share = null; return render();
      case 'shareto': {
        // 나누기: 글만 공동체 앱의 '내 기도' 쓰기 칸으로 넘긴다(복사). 사랑방이나 고른 모임에서 공개 범위를 고르고 추가해야 나눠진다. 노트의 원본은 그대로
        const i = D.items.find(x => x.id === S.share); if (!i) return;
        try { localStorage.setItem('koide-share', JSON.stringify({ text: (i.target === 'me' ? '' : targetName(i.target) + 'ㅡ') + i.text, at: Date.now(), grp: v || null })); } catch (e) { return toast('옮겨 적지 못했어요'); }
        S.share = null; location.href = 'index.html' + QS;
        return;
      }
      case 'undone': { const i = D.items.find(x => x.id === v); i.done = null; i.up = now(); save(); return toast('다시 내 기도에 넣었어요'); }
      case 'psopen': {
        // 기도하기 탭은 고른 대로, 오늘 화면의 '한 장씩 기도하기'는 그 기도제목에 하나님 나라(켜 두었으면)를 더해서
        const L = psList(v === 'tab' ? PS.set : v); if (!L.length) return;
        S.ps = { list: L, i: 0, extra: [] }; if (PS.music) playTrack(PS.track); render(); const b = document.querySelector('.ps-body'); if (b) b.scrollTop = 0; return;
      }
      case 'psgo': S.ps.i = Math.max(0, S.ps.i + Number(v)); render(); { const b = document.querySelector('.ps-body'); if (b) b.scrollTop = 0; } return;
      case 'pspray': togglePray(S.ps.list[S.ps.i].id); return render();
      case 'psclose': S.ps = null; musicOff(); return render();
      case 'renperson': { const p = D.people.find(x => x.id === v), n = (prompt('새 이름', p.name) || '').trim().slice(0, 12); if (n) { p.name = n; p.up = now(); save(); } return render(); }
      case 'delperson': {
        const p = D.people.find(x => x.id === v), n = D.items.filter(i => i.target === 'p:' + v && !i.done).length;
        if (!confirm(`${p.name} 님을 뺄까요?${n ? ` 이 사람을 위한 기도제목 ${n}개는 "나"로 옮겨요.` : ''}`)) return;
        D.items.forEach(i => { if (i.target === 'p:' + v) { i.target = 'me'; i.up = now(); } }); p.del = true; p.up = now(); save(); return render();
      }
      case 'mode': setPref('mode', v === 'system' ? '' : v); return render();
      case 'accent': setPref('accent', v); return render();
      case 'style': setPref('style', v); return render();
      case 'lookm': S.lookM = v; return render();
      case 'keep': S.keep = v || S.keep; S.tab = 'keep'; render(); return window.scrollTo(0, 0);
      case 'looktab': S.lookTab = v; return render();
      case 'big': setPref('big', !PREF.big); return render();
      case 'tourgo': S.tour = v === 'restart' ? 0 : Math.max(0, Math.min(TOUR.length - 1, S.tour + Number(v))); return render();
      case 'tourend': S.tour = null; try { localStorage.setItem(TOUR_KEY, '1'); } catch (err) { /* 무시 */ } return render();
      case 'psset': PS.set = v; savePs(); return render();
      case 'psworld': PS.world = !PS.world; savePs(); return render();
      case 'pstopic': { const k = PS.topics.indexOf(v); if (k >= 0) { if (PS.topics.length > 1) PS.topics.splice(k, 1); } else PS.topics.push(v); savePs(); return render(); }
      case 'psmusic': PS.music = !PS.music; savePs(); if (S.ps) { PS.music ? playTrack(PS.track) : musicOff(); } return render();
      case 'pstrack': PS.track = Number(v); savePs(); return render();
      case 'psauto': PS.auto = !PS.auto; savePs(); return render();
      case 'psnexttrack': playTrack((PS.track + 1) % HYMNS.length); return;
      case 'psxtra': { const k = S.ps.extra.indexOf(v); k >= 0 ? S.ps.extra.splice(k, 1) : S.ps.extra.push(v); return render(); }
      case 'vstart': return vaultStart();
      case 'vclose': S.vsheet = null; return render();
      case 'vsync': return sync();
      case 'voff': {
        if (!confirm('이 기기에서 연결을 끊을까요? 노트는 이 기기에 그대로 남아요.')) return;
        const del = confirm('서버에 맡긴 잠긴 노트도 지울까요?\n[확인] 지우기 — 다른 기기에서도 더 불러올 수 없어요\n[취소] 남겨 두기 — 다른 기기는 계속 연결돼요');
        D.vault = null; saveLocal(); try { localStorage.removeItem(LOCK_KEY); } catch (e) { /* 무시 */ }
        if (del) api('noteDel').then(() => toast('맡긴 노트를 지웠어요'), () => toast('맡긴 노트를 지우지 못했어요. 다시 연결한 뒤 끊어 주세요'));
        else toast('이 기기에서 연결을 끊었어요');
        return render();
      }
      case 'backup': {
        const blob = new Blob([JSON.stringify(Object.assign({ app: 'koide-note', saved: new Date().toISOString() }, D, { vault: null }), null, 1)], { type: 'application/json' });
        const u = URL.createObjectURL(blob), l = document.createElement('a'); l.href = u; l.download = `코이데-기도노트-${TODAY()}.json`; document.body.appendChild(l); l.click(); l.remove(); setTimeout(() => URL.revokeObjectURL(u), 1000);
        return toast('백업 파일을 내려받았어요');
      }
      case 'restore': return $('#restore-file').click();
      case 'logout': {
        if (!confirm('로그아웃할까요? 기도 노트는 이 기기에 그대로 남고, 같은 카카오로 다시 로그인해야 보여요. 다른 사람이 이 기기에서 로그인해도 내 노트는 보이지 않아요.')) return;
        api('logout').catch(() => {}).then(() => { try { localStorage.removeItem(TOKEN); localStorage.removeItem(UID); localStorage.removeItem(DEMO_LINK ? 'koide-demo-cache' : 'koide-cache'); } catch (err) { /* 무시 */ } location.replace('index.html' + QS); });
        return;
      }
      case 'wipe': if (!confirm(`이 휴대폰의 기도 노트를 모두 지울까요?${D.vault && D.vault.on ? ' 다른 기기에 연결해 둔 것은 그대로 남고, 이 휴대폰만 연결이 끊겨요.' : ' 되돌릴 수 없어요. 먼저 백업을 내려받아 두세요.'}`)) return;
        D = blank(); saveLocal(); try { localStorage.removeItem(LOCK_KEY); } catch (e) { /* 무시 */ } S.tab = 'start'; return render();
      case 'fbcopy': {
        const home = !!(navigator.standalone || (window.matchMedia && matchMedia('(display-mode: standalone)').matches));
        const t = `코이데 기도 노트 의견\n- 쓴 기간: ${prays().length ? short(prays().map(p => p.d).sort()[0]) + ' ~ ' + short(TODAY()) : '오늘'}\n- 기도제목 ${D.items.length}개 · 기도한 날 ${new Set(prays().map(p => p.d)).size}일 · 감사 기록 ${D.thanks.length}개(응답 ${D.thanks.filter(x => x.kind === 'answer').length})\n- 홈 화면 앱: ${home ? '예' : '아니요'} · 다른 기기와 연결: ${D.vault && D.vault.on ? '예' : '아니요'}\n\n1. 날마다 쓰게 됐나요? 며칠쯤 지나서 덜 열게 됐나요?\n2. 응답·감사 기록은 어땠나요?\n3. 사랑방·모임에 나누기, 공동체 기도하기의 "내 기도 노트"를 써 봤나요?\n4. 휴대폰에만 저장되는 것, 다른 기기와 연결하기(비밀 문구)는 어땠나요?\n5. 막히거나 헷갈린 곳:\n6. 있었으면 하는 것:`;
        (navigator.clipboard ? navigator.clipboard.writeText(t) : Promise.reject()).then(() => toast('복사했어요. 카톡에 붙여 넣어 보내 주세요'), () => prompt('아래 글을 복사해 보내 주세요', t));
        return;
      }
    }
  });
  document.addEventListener('submit', e => {
    const f = e.target.closest('[data-f]'); if (!f) return; e.preventDefault();
    if (f.dataset.f === 'start') {
      D.name = $('#st-name').value.trim().slice(0, 20); D.nameUp = now();
      ($('#st-people').value || '').split(/[,，·]/).map(s => s.trim().slice(0, 12)).filter(Boolean).slice(0, 12).forEach(n => D.people.push({ id: uid(), name: n, up: now() }));
      D.started = true; save();
      let seen = null; try { seen = localStorage.getItem(TOUR_KEY); } catch (err) { /* 없음 */ }
      if (!seen) S.tour = 0;
      return go('note');
    }
    if (f.dataset.f === 'item') {
      const t = $('#it-text').value.trim(); if (!t) return $('#it-text').focus();
      S.draft = null;
      if (S.edit) { const i = D.items.find(x => x.id === S.edit); i.text = t; i.target = S.draftT; i.up = now(); S.edit = null; save(); return toast('고쳤어요'); }
      D.items.push({ id: uid(), text: t, target: S.draftT, created: TODAY(), done: null, up: now() }); save(); return toast('내 기도에 더했어요');
    }
    if (f.dataset.f === 'vcreate' || f.dataset.f === 'vunlock') {
      const V = S.vsheet, a = $('#vs-a').value, b = $('#vs-b') ? $('#vs-b').value : a;
      if (a.length < 6) { V.err = '6글자 넘게 써 주세요.'; return render(); }
      if (a !== b) { V.err = '두 번 쓴 비밀 문구가 달라요.'; return render(); }
      V.busy = true; V.err = ''; render();
      (async () => {
        try {
          if (f.dataset.f === 'vcreate') {
            const salt = b64(crypto.getRandomValues(new Uint8Array(16))), key = await deriveKey(a, salt);
            await keepKey(key); D.vault = { on: true, salt, rev: 0, last: 0 };
          } else {
            const key = await deriveKey(a, V.remote.salt);
            let data; try { data = await unlockUp(key, V.remote.data); } catch (e) { V.busy = false; V.err = '비밀 문구가 달라요.'; return render(); }
            await keepKey(key); mergeIn(data); D.vault = { on: true, salt: V.remote.salt, rev: V.remote.rev, last: 0 };
          }
          D.started = true; saveLocal(); S.vsheet = null; if (S.tab === 'start') S.tab = 'today';
          render(); toast(f.dataset.f === 'vcreate' ? '잠가서 맡겼어요' : '맡겨 둔 노트를 합쳤어요'); sync();
        } catch (e) { V.busy = false; V.err = '잠그지 못했어요. 다시 해 주세요.'; render(); }
      })();
      return;
    }
    if (f.dataset.f === 'thanks') {
      const t = $('#th-in').value.trim(); if (!t) return;
      S.thDraft = ''; D.thanks.push({ id: uid(), date: TODAY(), text: t.slice(0, 200), kind: 'thanks', up: now() }); save(); return toast('감사를 남겼어요');
    }
  });
  document.addEventListener('change', e => {
    if (e.target.id !== 'restore-file' || !e.target.files[0]) return;
    const r = new FileReader();
    r.onload = () => {
      try {
        const x = JSON.parse(r.result);
        if (x.app !== 'koide-note' || !Array.isArray(x.items)) throw new Error();
        if (!confirm(`백업(${x.saved ? short(dkey(new Date(x.saved))) : '날짜 모름'}, 기도제목 ${x.items.length}개)으로 바꿀까요? 지금 이 휴대폰의 기도 노트는 지워져요.`)) return;
        const vault = D.vault; D = migrate(Object.assign(blank(), x)); delete D.app; delete D.saved; D.started = true; D.vault = vault; save(); S.tab = 'today'; toast('백업을 불러왔어요');
      } catch (err) { toast('코이데 기도 노트 백업 파일이 아니에요'); }
    };
    r.readAsText(e.target.files[0]);
  });
  document.addEventListener('keydown', e => {
    if (e.key !== 'Escape') return;
    if (S.ps) { S.ps = null; musicOff(); render(); } else if (S.done) { S.done = null; render(); } else if (S.vsheet) { S.vsheet = null; render(); } else if (S.share) { S.share = null; render(); }
  });
  // 카카오 로그인이 기본: 로그인하지 않았으면 로그인 화면으로(노트는 이 휴대폰에 그대로 남아 있다)
  if (!getToken()) { location.replace('index.html' + QS); return; }
  render();
  // 노트 주인을 아직 모르면(예전 로그인) 서버에 한 번 묻고, 내 노트 자리가 달라지면 다시 연다. 서버가 답하지 않으면 이번에는 예전 자리 그대로
  (async () => {
    if (!getUid()) {
      try { const r = await api('me'); if (r && r.uid) { try { localStorage.setItem(UID, r.uid); } catch (e) { /* 무시 */ } if (ownNoteKey(BASE, r.uid) !== KEY) return location.reload(); } }
      catch (e) { if (e && e.code === 'login') return location.replace('index.html' + QS); }
    }
    let resume = null; try { resume = localStorage.getItem('koide-note-resume'); localStorage.removeItem('koide-note-resume'); } catch (e) { /* 무시 */ }
    if (resume === 'vault' && getToken()) { if (D.started) S.tab = 'more'; vaultStart(); }
    else if (D.vault && D.vault.on) sync();
  })();
  document.addEventListener('visibilitychange', () => { if (!document.hidden && D.vault && D.vault.on) sync(); });
  if ('serviceWorker' in navigator && (location.protocol === 'https:' || location.hostname === 'localhost')) navigator.serviceWorker.register('sw.js').catch(() => {});
})();
</script>
</body>
</html>
