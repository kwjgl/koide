<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#2B6A62">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="코이데">
<title>코이데 기도 노트</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Gowun+Batang:wght@700&family=IBM+Plex+Sans+KR:wght@400;500;600&display=swap">
<script>
/* 화면 모드·색 테마·디자인·큰 글씨: 공동체 앱과 같은 설정(이 기기에만). 화면이 그려지기 전에 먼저 입힌다 */
try { const p = JSON.parse(localStorage.getItem('koide-pref') || '{}'), d = document.documentElement;
  if (p.mode === 'light' || p.mode === 'dark') d.dataset.mode = p.mode;
  if (p.accent && p.accent !== 'green') d.dataset.accent = p.accent;
  if (p.style && p.style !== 'flat') d.dataset.style = p.style;
  if (p.big) d.dataset.big = ''; } catch (e) { /* 무시 */ }
</script>
<style>
/* 코이데 기도 노트: 공동체 앱(index.html)과 같은 폴더·같은 홈 화면 앱 안의 '나' 공간. 같은 색·글꼴·설정(화면 모드, 색 테마, 큰 글씨).
   기록은 이 기기에만 저장하고 서버로 보내지 않는다. 공동체로는 '사랑방에 나누기'(글만 넘겨 내 기도에서 고르고 저장)와 '공동체로' 링크로 오간다 */
:root {
  --page: #F3F5F2; --surface: #FFFFFF; --surface-2: #EEF2EF;
  --ink: #1B2523; --ink-2: #5B6965; --line: #DDE4E0; --line-strong: #B9C4BF;
  --accent: #2B6A62; --accent-mid: #8DBDB5; --accent-soft: #DCEBE7; --on-accent: #FFFFFF;
  --warm: #9A5A14; --warm-soft: #F5E8D6; --shadow: rgba(20, 35, 32, .14);
  --leader: #62519E; --private: #E8ECEA; --neu-hi: rgba(255, 255, 255, .9); --neu-lo: rgba(20, 35, 32, .17);
  --wood: #B98756; --wood-back: #E9D9C2; --plaque: #FBF6EC; --linen: #EFE6D6;
  --f-display: 'Gowun Batang', 'AppleMyungjo', 'Batang', serif;
  --f-body: 'IBM Plex Sans KR', 'Apple SD Gothic Neo', 'Malgun Gothic', sans-serif;
  --base: 16px;
}
@media (prefers-color-scheme: dark) { :root:not([data-mode="light"]) {
  --page: #141B19; --surface: #1C2522; --surface-2: #232D2A;
  --ink: #E5ECE9; --ink-2: #9CAAA5; --line: #2D3935; --line-strong: #4A5853;
  --accent: #7CC2B7; --accent-mid: #3F7C73; --accent-soft: #1E3934; --on-accent: #0F1A18;
  --warm: #E2A563; --warm-soft: #3A2C1B; --shadow: rgba(0, 0, 0, .5); --leader: #B6A8EA; --private: #252E2B; --neu-hi: rgba(255, 255, 255, .06); --neu-lo: rgba(0, 0, 0, .6); --wood: #7A5636; --wood-back: #3A2E24; --plaque: #2B2620; --linen: #3A3328; color-scheme: dark; } }
:root[data-mode="dark"] {
  --page: #141B19; --surface: #1C2522; --surface-2: #232D2A;
  --ink: #E5ECE9; --ink-2: #9CAAA5; --line: #2D3935; --line-strong: #4A5853;
  --accent: #7CC2B7; --accent-mid: #3F7C73; --accent-soft: #1E3934; --on-accent: #0F1A18;
  --warm: #E2A563; --warm-soft: #3A2C1B; --shadow: rgba(0, 0, 0, .5); --leader: #B6A8EA; --private: #252E2B; --neu-hi: rgba(255, 255, 255, .06); --neu-lo: rgba(0, 0, 0, .6); --wood: #7A5636; --wood-back: #3A2E24; --plaque: #2B2620; --linen: #3A3328; color-scheme: dark; }
/* 큰 글씨와 색 테마: 공동체 앱과 같은 값 */
:root[data-big] { --base: 19px; }
@media (min-width: 1000px) { :root[data-big] { --base: 18px; } }
:root[data-accent="amber"] { --page:#F7F2EA;--surface:#FFFDF9;--surface-2:#F1EADF;--ink:#2A221B;--ink-2:#6E6155;--line:#E6DCCD;--line-strong:#C9B9A3;--accent:#A9561B;--accent-mid:#E2B07F;--accent-soft:#F6E3CF;--on-accent:#FFFFFF;--private:#EFE8DE; }
@media (prefers-color-scheme: dark) { :root[data-accent="amber"]:not([data-mode="light"]) { --page:#1A1612;--surface:#231E19;--surface-2:#2B241E;--ink:#EEE6DC;--ink-2:#AE9F8E;--line:#3A3129;--line-strong:#5A4D41;--accent:#E9A066;--accent-mid:#8A5A32;--accent-soft:#3A2818;--on-accent:#1E140C;--private:#2E2721; } }
:root[data-accent="amber"][data-mode="dark"] { --page:#1A1612;--surface:#231E19;--surface-2:#2B241E;--ink:#EEE6DC;--ink-2:#AE9F8E;--line:#3A3129;--line-strong:#5A4D41;--accent:#E9A066;--accent-mid:#8A5A32;--accent-soft:#3A2818;--on-accent:#1E140C;--private:#2E2721; }
:root[data-accent="blue"] { --page:#F2F4F8;--surface:#FFFFFF;--surface-2:#EAEEF4;--ink:#1B2230;--ink-2:#5A6475;--line:#DCE2EB;--line-strong:#B6C0CF;--accent:#2F5D95;--accent-mid:#93AFD3;--accent-soft:#DCE6F3;--on-accent:#FFFFFF;--private:#E8EBF0; }
@media (prefers-color-scheme: dark) { :root[data-accent="blue"]:not([data-mode="light"]) { --page:#12161D;--surface:#1A2029;--surface-2:#212833;--ink:#E4E9F0;--ink-2:#9AA5B5;--line:#2C3542;--line-strong:#485466;--accent:#8EB4E6;--accent-mid:#3C5B85;--accent-soft:#1D2C42;--on-accent:#0E1622;--private:#232A35; } }
:root[data-accent="blue"][data-mode="dark"] { --page:#12161D;--surface:#1A2029;--surface-2:#212833;--ink:#E4E9F0;--ink-2:#9AA5B5;--line:#2C3542;--line-strong:#485466;--accent:#8EB4E6;--accent-mid:#3C5B85;--accent-soft:#1D2C42;--on-accent:#0E1622;--private:#232A35; }
:root[data-accent="rose"] { --page:#F8F2F3;--surface:#FFFDFD;--surface-2:#F2E8EA;--ink:#2A1E21;--ink-2:#6E5B60;--line:#E8DADD;--line-strong:#CDB6BC;--accent:#A8435C;--accent-mid:#DDA2B1;--accent-soft:#F5DFE5;--on-accent:#FFFFFF;--private:#F0E7E9; }
@media (prefers-color-scheme: dark) { :root[data-accent="rose"]:not([data-mode="light"]) { --page:#1A1416;--surface:#231B1E;--surface-2:#2B2226;--ink:#EEE3E6;--ink-2:#B09CA2;--line:#3A2D31;--line-strong:#5A464C;--accent:#E896AB;--accent-mid:#86475A;--accent-soft:#3B2029;--on-accent:#200E14;--private:#2E2428; } }
:root[data-accent="rose"][data-mode="dark"] { --page:#1A1416;--surface:#231B1E;--surface-2:#2B2226;--ink:#EEE3E6;--ink-2:#B09CA2;--line:#3A2D31;--line-strong:#5A464C;--accent:#E896AB;--accent-mid:#86475A;--accent-soft:#3B2029;--on-accent:#200E14;--private:#2E2428; }
:root[data-accent="ink"] { --page:#F4F4F2;--surface:#FFFFFF;--surface-2:#EDEDEA;--ink:#1D1D1B;--ink-2:#62625E;--line:#E0E0DC;--line-strong:#BDBDB7;--accent:#33332F;--accent-mid:#A3A39C;--accent-soft:#E6E6E1;--on-accent:#FFFFFF;--private:#ECECE8; }
@media (prefers-color-scheme: dark) { :root[data-accent="ink"]:not([data-mode="light"]) { --page:#141414;--surface:#1D1D1C;--surface-2:#252524;--ink:#ECECE8;--ink-2:#A3A39E;--line:#30302E;--line-strong:#4D4D4A;--accent:#E2E2DC;--accent-mid:#6A6A65;--accent-soft:#2E2E2C;--on-accent:#141414;--private:#262625; } }
:root[data-accent="ink"][data-mode="dark"] { --page:#141414;--surface:#1D1D1C;--surface-2:#252524;--ink:#ECECE8;--ink-2:#A3A39E;--line:#30302E;--line-strong:#4D4D4A;--accent:#E2E2DC;--accent-mid:#6A6A65;--accent-soft:#2E2E2C;--on-accent:#141414;--private:#262625; }
* { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; text-size-adjust: 100%; }
body { margin: 0; background: var(--page); color: var(--ink); font-family: var(--f-body); font-size: var(--base); line-height: 1.55; }
button, input, textarea { font: inherit; color: inherit; }
/* 아이폰에서 빠르게 두세 번 눌러도 화면이 확대되지 않게(두 손가락으로 벌려 확대하는 것은 그대로). 캔버스·3D 무대는 건드리지 않는다 */
button, a, label, summary, select, input, [role="button"], [data-a], .brand { touch-action: manipulation; }
.wrap { max-width: 640px; margin: 0 auto; padding: calc(12px + env(safe-area-inset-top, 0px)) 16px calc(96px + env(safe-area-inset-bottom, 0px)); }
/* 위쪽 막대(공동체 화면과 같은 짜임): 코이데 · 배지(함께하는 곳) · 톱니바퀴(화면 설정) */
.ic { width: 1em; height: 1em; fill: none; stroke: currentColor; stroke-width: 1.5; stroke-linecap: round; stroke-linejoin: round; flex: none; }
.topbar { position: sticky; top: 0; z-index: 20; background: var(--surface); border-bottom: 1px solid var(--line); padding-top: env(safe-area-inset-top, 0px); }
.topbar .wrap { display: flex; align-items: center; gap: .6em; min-height: 3.4em; position: relative; padding-top: 0; padding-bottom: 0; }
.wrap.has-top { padding-top: 16px; }
.brand { display: inline-flex; align-items: center; gap: .45em; background: none; border: 0; padding: .3em 0; color: var(--ink); cursor: pointer; min-height: 44px; font: inherit; }
.brand-mark { width: 1.6em; height: 1.6em; border-radius: 50%; background: var(--accent); color: var(--on-accent); display: grid; place-items: center; }
.brand-mark .ic { width: .95em; height: .95em; }
.brand-name { font-family: var(--f-display); font-size: 1.05em; font-weight: 700; white-space: nowrap; }
.spacer { flex: 1; }
.topnav { display: none; gap: .2em; margin-left: 1.2em; }
.topnav button { font-size: .92em; background: none; border: 0; color: var(--ink-2); padding: .5em .9em; border-radius: 10px; cursor: pointer; min-height: 40px; }
.topnav button.on { background: var(--accent-soft); color: var(--accent); font-weight: 600; }
/* PC(공동체 화면과 같은 1000px): 아래 탭 대신 위쪽 메뉴, 내용은 가운데 한 칸을 넓게 */
@media (min-width: 1000px) {
  .topnav { display: flex; }
  .tabs { display: none !important; }
  .topbar .wrap { max-width: 1160px; }
  .wrap.has-top { max-width: 960px; padding-top: 28px; padding-bottom: 56px; }
  /* 오늘 화면: 왼쪽에 오늘 기도할 제목, 오른쪽에 끈과 감사(공동체 '이번 달'과 같은 짜임). 위쪽 메뉴와 같은 폭으로 맞춘다 */
  .wrap.has-top:has(.t-grid) { max-width: 1160px; }
  .t-grid { display: grid; grid-template-columns: minmax(0, 1fr) 340px; gap: 0 24px; align-items: start; }
  .t-side { position: sticky; top: calc(4.4em + env(safe-area-inset-top, 0px)); }
}
.badge-btn { position: relative; display: inline-flex; align-items: center; gap: .4em; font: inherit; font-size: .8em; font-weight: 600; color: var(--ink); background: var(--surface-2); border: 1px solid var(--line); border-radius: 999px; padding: .35em .5em .35em .85em; min-height: 38px; cursor: pointer; white-space: nowrap; }
.role-tag { font-size: .93em; padding: .15em .6em; border-radius: 999px; background: var(--surface); color: var(--ink-2); border: 1px solid var(--line); }
.badge-dot { position: absolute; top: 2px; right: 2px; width: 8px; height: 8px; border-radius: 50%; background: var(--warm); }
.icon-btn { width: 44px; height: 44px; display: grid; place-items: center; background: none; border: 0; border-radius: 12px; color: var(--ink); cursor: pointer; flex: none; }
.icon-btn .ic { width: 1.35em; height: 1.35em; }
.icon-btn[aria-expanded="true"] { background: var(--surface-2); }
.menu { position: absolute; top: calc(100% + 6px); right: max(16px, env(safe-area-inset-right, 0px)); width: min(300px, calc(100vw - 32px)); background: var(--surface); border: 1px solid var(--line); border-radius: 16px; box-shadow: 0 16px 40px -12px var(--shadow); padding: .5em; display: flex; flex-direction: column; gap: .1em; z-index: 25; }
.mlabel { font-size: .72em; font-weight: 600; color: var(--ink-2); margin: .6em .7em .3em; }
.mitem { display: flex; justify-content: space-between; align-items: center; gap: .6em; width: 100%; text-align: left; font: inherit; font-size: .9em; color: var(--ink); background: none; border: 0; border-radius: 10px; padding: .55em .7em; min-height: 44px; cursor: pointer; text-decoration: none; }
.mitem:hover { background: var(--surface-2); }
.mitem.on { cursor: default; } .mitem.on span { font-weight: 700; } .mitem.on:hover { background: none; }
.mitem[aria-disabled="true"] { cursor: default; opacity: .7; } .mitem[aria-disabled="true"]:hover { background: none; }
.mitem small { font-size: .82em; color: var(--ink-2); text-align: right; }
.mdiv { height: 1px; background: var(--line); margin: .35em .3em; }
.menu-set { display: flex; flex-direction: column; gap: .6em; padding: 0 .4em .4em; }
.pilot { font-size: .74em; color: var(--accent); background: var(--accent-soft); border-radius: 999px; padding: .3em .9em; display: inline-block; margin-bottom: 10px; }
.top { display: flex; justify-content: space-between; align-items: flex-end; gap: 12px; margin-bottom: 12px; }
.eyebrow { margin: 0; font-size: .8em; color: var(--ink-2); }
h1 { font-family: var(--f-display); font-size: 1.6em; margin: .1em 0 0; line-height: 1.3; word-break: keep-all; text-wrap: balance; }
h2 { font-family: var(--f-display); font-size: 1.15em; margin: 0; }
.card { background: var(--surface); border: 1px solid var(--line); border-radius: 16px; padding: 1em; display: flex; flex-direction: column; gap: .7em; margin-bottom: 12px; }
.label { margin: 0; font-size: .8em; font-weight: 600; color: var(--ink-2); }
.hint { margin: 0; font-size: .82em; color: var(--ink-2); word-break: keep-all; }
.plain { margin: 0; word-break: keep-all; }
.row { display: flex; justify-content: space-between; align-items: center; gap: 10px; }
/* 단추 모서리는 공동체와 같게(12px, 작은 것은 10px). 칩·태그·스위치·기도했어요 단추는 공동체도 알약형이라 그대로 */
.btn { white-space: nowrap; flex: none; border: 0; border-radius: 12px; background: var(--accent); color: var(--on-accent); font-weight: 600; padding: .65em 1.2em; min-height: 44px; cursor: pointer; }
.btn.ghost { background: var(--surface); color: var(--accent); border: 1.5px solid var(--accent-mid); }
.btn.small { padding: .35em .9em; min-height: 36px; font-size: .88em; border-radius: 10px; }
.btn.wide { width: 100%; }
.btn:disabled { opacity: .45; cursor: default; }
/* 1000px 미만: 두 칸 틀은 레이아웃에 영향을 주지 않는다(카드가 지금과 같은 순서·간격으로 쌓임). 오른쪽에만 쓰는 순서 카드는 숨김 */
.n-two, .n-main, .n-side, .n-end { display: contents; }
.card.n-ord { display: none; }
.ps-ord { margin: 0; padding-left: 1.4em; display: flex; flex-direction: column; gap: .4em; font-size: .92em; }
.ps-ord li { padding-left: .1em; }
.ps-ord li > div { display: flex; justify-content: space-between; align-items: baseline; gap: 10px; }
.ps-ord li > div > span:first-child { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.ps-ord li > div > span:last-child { flex: none; font-size: .82em; color: var(--ink-2); }
.ps-ord li .ok { color: var(--accent); font-weight: 600; }
@media (min-width: 1000px) {
  /* 내 기도·기도하기·지난 기록·더보기도 같은 두 칸: 왼쪽 본문 + 오른쪽 380px 고정 칸(공동체 .two-col과 같은 짜임). 오른쪽이 화면보다 길면 칸 안에서 스크롤 */
  .wrap.has-top:has(.n-two) { max-width: 1160px; }
  .n-two { display: grid; grid-template-columns: minmax(0, 1fr) 380px; gap: 0 24px; align-items: start; }
  .n-main, .n-side { display: block; min-width: 0; grid-row: 1; }
  .n-main { grid-column: 1; }
  .n-side { grid-column: 2; position: sticky; top: calc(4.4em + env(safe-area-inset-top, 0px)); max-height: calc(100vh - 5.4em - env(safe-area-inset-top, 0px)); overflow-y: auto; overscroll-behavior: contain; scrollbar-width: thin; }
  .n-end { display: block; grid-column: 1 / -1; grid-row: 2; }
  .card.n-ord { display: flex; }
  /* 지난 기록의 달력은 칸이 너무 커지지 않게 */
  .n-main .weeks { max-width: 440px; width: 100%; margin: 0 auto; }
}
.link { background: none; border: 0; padding: .3em 0; color: var(--accent); font-weight: 600; cursor: pointer; min-height: 36px; }
.link.quiet { color: var(--ink-2); font-weight: 500; }
.field { width: 100%; min-width: 0; flex: 1; border: 1px solid var(--line-strong); border-radius: 12px; background: var(--surface); padding: .7em .8em; }
textarea.field { flex: none; min-height: 5.5em; resize: vertical; overflow: hidden; }
.field:focus { outline: 2px solid var(--accent-mid); border-color: var(--accent); }
.chips { display: flex; flex-wrap: wrap; gap: 6px; }
.chip { border: 1px solid var(--line-strong); background: var(--surface); border-radius: 999px; padding: .35em .85em; min-height: 36px; cursor: pointer; font-size: .9em; }
.chip.on { background: var(--accent); color: var(--on-accent); border-color: var(--accent); }
.chip.add { border-style: dashed; color: var(--accent); }
.tag { display: inline-block; font-size: .76em; font-weight: 600; color: var(--accent); background: var(--accent-soft); border-radius: 999px; padding: .1em .65em; margin-right: .4em; }
.days { font-size: .76em; color: var(--ink-2); }
/* 오늘 */
.today-item { border: 1px solid var(--line); border-radius: 14px; padding: .8em .9em; display: flex; flex-direction: column; gap: .5em; background: var(--surface); }
.today-item.on { background: var(--accent-soft); border-color: var(--accent-mid); }
.today-item p { margin: 0; word-break: keep-all; }
.pray-btn { align-self: flex-start; display: inline-flex; align-items: center; gap: .4em; border-radius: 999px; border: 1.5px solid var(--accent); background: var(--surface); color: var(--accent); font-weight: 600; padding: .45em 1em; min-height: 40px; cursor: pointer; }
.pray-btn.on { background: var(--accent); color: var(--on-accent); }
.pray-btn svg { width: 16px; height: 16px; }
/* 내가 기도하는 사람들의 끈 */
/* 기도의 끈(시안과 같게): 자리마다 매듭, 이웃한 두 자리가 다 지어지면 그 사이 끈이 팽팽, 다 이으면 양 끝 리본 */
.cord { width: 100%; text-align: left; display: flex; flex-direction: column; gap: .3em; }
.cord-head { display: flex; justify-content: space-between; align-items: baseline; gap: .6em; }
.cord-n { font-size: .78em; color: var(--ink-2); margin: 0; text-align: right; }
.cord-n b { color: var(--accent); font-weight: 700; }
.cord-wrap { position: relative; padding: 0 18px; max-width: 520px; width: 100%; margin: 0 auto; box-sizing: border-box; }
.cord-line { position: absolute; left: 18px; top: 3px; width: calc(100% - 36px); height: 26px; overflow: visible; pointer-events: none; }
.cord-seg { fill: none; stroke: var(--line-strong); stroke-width: 1.5; stroke-linecap: round; }
.cord-seg.tight { stroke: var(--accent); stroke-width: 3; }
.cord-seg.pull { animation: cord-pull .7s ease-out; }
@keyframes cord-pull { from { stroke: var(--line-strong); stroke-width: 1.5; } }
.cord-end { position: absolute; top: 3px; width: 18px; height: 26px; overflow: visible; pointer-events: none; }
.cord-end.l { left: 0; } .cord-end.r { right: 0; }
.cord-end path { fill: none; stroke: var(--line-strong); stroke-width: 1.5; stroke-linecap: round; }
.cord-end.bow path { stroke: var(--accent); stroke-width: 2.2; stroke-linejoin: round; }
.cord-end.bow .loop { fill: var(--accent-soft); }
.cord-end.bow.new { animation: knot-tie .7s .3s cubic-bezier(.3,1.6,.5,1) both; transform-origin: center; }
.cord-knots { position: relative; display: grid; }
.knot { display: flex; flex-direction: column; align-items: center; gap: 3px; background: none; border: 0; padding: 0 0 2px; font: inherit; color: var(--ink-2); min-height: 44px; min-width: 0; }
button.knot { cursor: pointer; }
.knot-g { width: 32px; height: 32px; display: grid; place-items: center; border-radius: 50%; }
.knot-g svg { width: 32px; height: 32px; overflow: visible; }
.knot-g .slot { fill: var(--surface); stroke: var(--line-strong); stroke-width: 1.5; }
.knot-g .tie { fill: none; stroke: var(--accent); stroke-width: 3; stroke-linecap: round; stroke-linejoin: round; }
.knot-l { font-size: .7em; font-weight: 600; line-height: 1; margin-top: -4px; max-width: 100%; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.knot.on .knot-l { color: var(--accent); }
.knot.cur .knot-g { background: color-mix(in srgb, var(--accent-soft) 85%, transparent); box-shadow: 0 0 0 1.5px var(--accent-mid); }
.knot.cur .knot-l { color: var(--ink); }
.knot.new .knot-g svg { animation: knot-tie .6s cubic-bezier(.3,1.6,.5,1); }
@keyframes knot-tie { 0% { transform: scale(.3) rotate(-60deg); opacity: .3; } 100% { transform: none; opacity: 1; } }
@media (prefers-reduced-motion: reduce) { .cord-seg.pull, .knot.new .knot-g svg, .cord-end.bow.new { animation: none; } }
/* 노트 */
.note { border-top: 1px solid var(--line); padding-top: .7em; display: flex; flex-direction: column; gap: .35em; }
.note:first-of-type { border-top: 0; padding-top: 0; }
.note p { margin: 0; word-break: keep-all; white-space: pre-wrap; }
.note .row { flex-wrap: wrap; row-gap: 0; }
.preview { display: flex; flex-direction: column; gap: 8px; border-top: 1px solid var(--line); padding-top: 10px; }
.prev-row { display: flex; align-items: flex-start; gap: 8px; }
.prev-row p { margin: .2em 0 0; flex: 1; min-width: 0; word-break: keep-all; }
.prev-t { flex: none; max-width: 8.5em; border: 1px solid var(--accent-mid); background: var(--accent-soft); color: var(--accent); font-weight: 600; font-size: .8em; border-radius: 999px; padding: .3em .6em; }
.note .acts { display: flex; gap: 14px; margin-left: auto; }
.note .acts button { white-space: nowrap; }
/* 내 기도 목록: 공동체 앱 '내 기도'와 같은 카드(대상 칩 단추, 바로 고치는 칸, 아래 줄 날짜와 링크) */
.edit-list { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: .7em; }
.edit-list .edit { background: var(--surface); border: 1px solid var(--line); border-radius: 14px; margin: 0; padding: .8em; display: flex; flex-direction: column; gap: .5em; }
.edit-top { display: flex; gap: .5em; align-items: center; justify-content: space-between; flex-wrap: wrap; }
.tgt-btn { font: inherit; font-size: .76em; font-weight: 600; border-radius: 999px; padding: .3em .85em; min-height: 36px; display: inline-flex; align-items: center; gap: .3em; cursor: pointer; border: 1px solid var(--line); background: var(--surface-2); color: var(--ink); }
.tgt-btn.open { border-color: var(--accent); color: var(--accent); }
.tgt-btn.open .ic { transform: rotate(180deg); }
.tgt-pick { display: flex; flex-wrap: wrap; gap: .4em; background: var(--surface-2); border-radius: 10px; padding: .6em .65em; }
.tgt-pick .chip { font-size: .76em; min-height: 34px; padding: .2em .8em; }
.edit-foot { display: flex; justify-content: space-between; align-items: center; gap: .6em; font-size: .78em; color: var(--ink-2); }
.state { font-size: .74em; color: var(--ink-2); }
.foot-acts { display: flex; gap: 1em; flex: none; }
/* 카드 아래 단추(마치기·나누기·지우기)는 공동체 내 기도와 같은 크기(.78em × 1.04 ≈ .81em) */
.edit-foot .link { font-size: 1.04em; padding: .35em 0; white-space: nowrap; }
/* 내 기도 목록 위의 대상 걸러 보기: 칩 한 줄(공동체 앱 .hist-chips처럼 휴대폰은 옆으로 밀어 보고 막대는 안 보인다). 넓은 화면은 줄바꿈 */
.tgt-filter { display: flex; gap: 6px; overflow-x: auto; padding: 2px 0 8px; margin: 0 0 .2em; scrollbar-width: none; position: relative; }
.tgt-filter::-webkit-scrollbar { display: none; }
.tgt-filter .chip { flex: none; white-space: nowrap; }
@media (min-width: 1000px) { .tgt-filter { flex-wrap: wrap; overflow: visible; } }
/* 지난 기록 */
.weeks { display: grid; grid-template-columns: repeat(7, 1fr); gap: 5px; }
.weeks i { aspect-ratio: 1; border-radius: 6px; background: var(--surface-2); display: grid; place-items: center; font-style: normal; font-size: .68em; color: var(--ink-2); }
.weeks i.on { background: var(--accent); color: var(--on-accent); }
.weeks i.today { outline: 2px solid var(--accent-mid); }
.weeks i.wd { background: none; aspect-ratio: auto; font-size: .7em; }
.weeks i.blank { background: none; }
/* 지난 기록의 입체 그림: 나의 올해의 실타래, 이달의 조각보, 실타래 상자 */
.card-head { display: flex; justify-content: space-between; align-items: baseline; gap: 10px; flex-wrap: wrap; }
.card-head span { font-size: .8em; color: var(--ink-2); font-variant-numeric: tabular-nums; }
.stage3d { position: relative; width: 100%; border-radius: 12px; background: radial-gradient(120% 100% at 50% 40%, var(--surface), var(--surface-2)); cursor: grab; overflow: hidden; touch-action: pan-y; }
.stage3d.cord { aspect-ratio: 16 / 9; }
.stage3d.garden { aspect-ratio: 4 / 3; cursor: default; }
.stage3d.garden.tap, .stage3d.garden.tap canvas { cursor: pointer; }
.stage3d.weaves { aspect-ratio: 21 / 10; cursor: pointer; }
/* 크게 보기 아이콘: 공동체 이달의 그림(.ps-big)과 같은 모양·자리. 그림 저장 사진은 3D 화면만 찍어 아이콘이 안 들어간다 */
.g-frame { position: relative; }
.g-big { position: absolute; right: 8px; bottom: 8px; display: grid; place-items: center; font-size: .72em; color: #4A3A2E; background: rgba(255, 250, 242, .82); border: 0; border-radius: 50%; padding: 0; width: 32px; height: 32px; cursor: pointer;
  box-shadow: 0 1px 4px rgba(60, 40, 20, .2); -webkit-backdrop-filter: blur(4px); backdrop-filter: blur(4px); }
.g-big .ic { width: 1.1em; height: 1.1em; stroke-width: 1.8; }
.mn-t { display: flex; flex-direction: column; align-items: center; text-align: center; min-width: 0; }
.mn-t small { font-size: .74em; color: var(--ink-2); }
.mstrip { display: grid; grid-template-columns: repeat(6, 1fr); gap: 8px 4px; }
.mstrip button { background: none; border: 0; padding: 0; display: flex; flex-direction: column; align-items: center; gap: 3px; cursor: pointer; font-size: .72em; color: var(--ink-2); }
.mstrip i { width: 42px; height: 42px; border-radius: 50%; background: var(--surface-2); display: grid; place-items: center; overflow: hidden; border: 2px solid transparent; }
.mstrip img { width: 80%; height: 80%; object-fit: contain; opacity: .35; filter: grayscale(1); }
.mstrip .got img { opacity: 1; filter: none; }
.mstrip .full i { border-color: var(--accent); }
.mstrip .on span { color: var(--accent); font-weight: 700; }
.mstrip .on i { box-shadow: 0 0 0 2px var(--surface), 0 0 0 4px var(--accent-mid); }
.mstrip .off { cursor: default; opacity: .5; }
.stage3d.chest { aspect-ratio: 16 / 11; }
.stage3d .wait { position: absolute; inset: 0; display: grid; place-items: center; font-size: .82em; color: var(--ink-2); }
.pick3d { border-left: 3px solid var(--accent); padding: .3em 0 .3em .8em; }
.pick3d.gold { border-left-color: #D4A64A; }
.pick3d small { display: block; font-size: .76em; color: var(--ink-2); }
.pick3d p { margin: .1em 0 0; word-break: keep-all; }
.pick3d q { display: block; font-size: .82em; color: var(--ink-2); quotes: none; margin-top: .2em; }
.pick3d ul { margin: .3em 0 0; padding-left: 1.1em; font-size: .9em; }
.legend3d { display: flex; gap: 14px; flex-wrap: wrap; font-size: .78em; color: var(--ink-2); }
.legend3d i { display: inline-block; width: 12px; height: 12px; border-radius: 50%; margin-right: 5px; vertical-align: -2px; }
.legend3d .k { background: var(--accent); }
.legend3d .g { background: none; border: 2.5px solid #D4A64A; width: 8px; height: 8px; }
/* 오늘 화면: 소품이 놓였다는 한 줄 */
.keep-note { display: flex; justify-content: space-between; align-items: center; gap: 10px; flex-wrap: wrap; width: 100%; text-align: left; background: var(--accent-soft); color: var(--ink); border: 0; border-radius: 12px; padding: .65em .9em; font-size: .88em; cursor: pointer; }
.keep-note .go { color: var(--accent); font-weight: 600; white-space: nowrap; }
.month-nav { display: flex; align-items: center; justify-content: space-between; gap: 10px; margin-bottom: 12px; }
.month-nav b { font-family: var(--f-display); font-size: 1.1em; }
.month-nav .btn { min-width: 44px; font-size: 1.1em; }
.thanks li { list-style: none; border-left: 3px solid var(--warm); padding: .2em 0 .2em .7em; margin-bottom: .7em; }
.thanks { margin: 0; padding: 0; }
.thanks small { display: block; color: var(--ink-2); font-size: .76em; }
.thanks q { display: block; color: var(--ink-2); font-size: .82em; quotes: none; margin-top: .2em; }
.stats { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; text-align: center; }
.stats b { display: block; font-family: var(--f-display); font-size: 1.6em; line-height: 1.1; }
.stats span { font-size: .76em; color: var(--ink-2); }
/* 아래 탭 */
.ic { width: 1em; height: 1em; fill: none; stroke: currentColor; stroke-width: 1.5; stroke-linecap: round; stroke-linejoin: round; flex: none; }
.tabs { position: fixed; left: 0; right: 0; bottom: 0; display: grid; grid-template-columns: repeat(5, 1fr); background: var(--surface); border-top: 1px solid var(--line); padding: 0 env(safe-area-inset-right, 0px) max(6px, env(safe-area-inset-bottom, 0px)) env(safe-area-inset-left, 0px); z-index: 10; }
.tabs button { background: none; border: 0; color: var(--ink-2); display: grid; place-items: center; padding: .55em 0; min-height: 56px; cursor: pointer; position: relative; }
.tabs .ic { width: 28px; height: 28px; stroke-width: 1.4; }
.tabs button.on { color: var(--accent); }
.tabs button.on .ic { stroke-width: 1.8; }
.tabs button.on::after { content: ''; position: absolute; bottom: 6px; width: 5px; height: 5px; border-radius: 50%; background: var(--accent); }
.tabs button.pray-tab .ic { width: 44px; height: 44px; padding: 8px; border-radius: 50%; background: var(--accent-soft); color: var(--accent); }
.tabs button.pray-tab.on .ic { background: var(--accent); color: var(--on-accent); }
.tabs button.pray-tab.on::after { content: none; }
/* 기도하기 판 */
.sheet-back { position: fixed; inset: 0; background: color-mix(in srgb, var(--ink) 45%, transparent); z-index: 30; display: grid; place-items: end center; padding: 16px; }
.sheet { width: min(480px, 100%); background: var(--surface); border-radius: 20px; padding: 18px; display: flex; flex-direction: column; gap: 12px; max-height: calc(100dvh - 32px); overflow: auto; }
@media (min-width: 640px) { .sheet-back { place-items: center; } }
.toast { position: fixed; left: 50%; bottom: calc(84px + env(safe-area-inset-bottom, 0px)); transform: translateX(-50%); background: var(--ink); color: var(--page); padding: .55em 1.1em; border-radius: 999px; font-size: .88em; z-index: 50; }
.empty { text-align: center; padding: 1.4em 1em; }
.garden-acts { display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 10px 12px; margin-top: 10px; }
.garden-acts .hint { flex-basis: 100%; margin: 0; }
.g-hand { display: flex; align-items: center; gap: 10px; }
.g-hand div { display: flex; flex-direction: column; line-height: 1.3; }   /* 스위치가 앞에 있어 글이 바뀌어도 스위치는 제자리 */
.g-hand small { font-size: .74em; color: var(--ink-2); }
.g-btns { display: flex; flex-wrap: wrap; gap: 8px; margin-left: auto; justify-content: flex-end; }
#keep3d-pick { min-height: 3.2em; margin-top: 10px; }
/* 직접 놓기 바구니: 아직 자리가 없는 소품이 줄지어 기다린다. 하나를 누르면 조각보에 놓을 수 있는 칸이 빛난다 */
.gtray { margin-top: 10px; background: var(--surface-2); border-radius: 12px; padding: 8px 10px 10px; }
.gtray[hidden] { display: none; }
.gtray .hint { margin: 0 0 6px; }
.gt-list { display: flex; gap: 8px; overflow-x: auto; padding: 2px 2px 4px; }
.gt-it { flex: none; width: 78px; display: flex; flex-direction: column; align-items: center; gap: 2px; border: 2px solid transparent; background: var(--surface); border-radius: 12px; padding: 6px 4px; font-size: .72em; line-height: 1.3; color: var(--ink); cursor: pointer; word-break: keep-all; text-align: center; }
.gt-it img { width: 48px; height: 48px; object-fit: contain; }
.gt-it.on { border-color: var(--accent); background: var(--accent-soft); }
/* 크게 보기: 조각보만 화면 가득. 오른쪽 위에 작은 동그란 버튼들 */
.gbig { position: fixed; inset: 0; z-index: 70; background: radial-gradient(120% 100% at 50% 40%, var(--surface), var(--surface-2)); touch-action: none; overscroll-behavior: contain; }
.gbig-host { position: absolute; inset: 0; }
.gbig-host canvas { cursor: grab; }
.gbig-bar { position: absolute; top: calc(10px + env(safe-area-inset-top, 0px)); right: 10px; display: flex; gap: 8px; }
.gbig-x { width: 44px; height: 44px; border-radius: 50%; border: 1.5px solid var(--line-strong); background: var(--surface); color: var(--ink); display: grid; place-items: center; padding: 0; cursor: pointer; }
.gbig-x .ic { width: 1.25em; height: 1.25em; stroke-width: 1.9; }
.gbig-x.main { background: var(--accent); border-color: var(--accent); color: var(--on-accent); }
.gbig-x:disabled { opacity: .45; cursor: default; }
.gbig-foot { position: absolute; left: 0; right: 0; bottom: 0; display: flex; flex-direction: column; align-items: center; gap: 8px; padding: 0 12px calc(12px + env(safe-area-inset-bottom, 0px)); pointer-events: none; }
.gbig-say { max-width: 100%; background: var(--surface); border-radius: 14px; padding: .5em .9em; box-shadow: 0 2px 10px var(--shadow); }
.gbig-say:empty { display: none; }
.gbig-foot .wcap { display: flex; flex-direction: column; align-items: center; gap: 2px; background: var(--surface); border-radius: 14px; padding: .5em 1em; box-shadow: 0 2px 10px var(--shadow); text-align: center; }
.gbig-foot .wcap small { color: var(--ink-2); font-size: .8em; }
.gbig-foot .wdel { pointer-events: auto; background: var(--surface); border: 1.5px solid var(--line-strong); color: var(--ink-2); border-radius: 12px; min-height: 40px; padding: 0 1em; font: inherit; font-size: .86em; cursor: pointer; }
.gbig-foot .gtray { pointer-events: auto; width: 100%; max-width: 640px; margin-top: 0; }
.notice { background: var(--warm-soft); color: var(--ink); border-radius: 14px; padding: .8em .9em; font-size: .86em; word-break: keep-all; margin-bottom: 12px; }
.notice b { color: var(--warm); }
/* 동기화 카드 */
.sync-h { display: flex; justify-content: space-between; align-items: center; gap: .6em; }
.sync-h h2 { margin: 0; font-family: var(--f-display); font-size: 1.1em; font-weight: 700; }
.sync-st { display: flex; align-items: flex-start; gap: .6em; margin: 0; font-size: .95em; line-height: 1.55; word-break: keep-all; }
.sync-st .dot { flex: none; width: 8px; height: 8px; margin-top: .62em; border-radius: 50%; background: var(--accent); }
.sync-st.off { color: var(--ink-2); }
.sync-st.off .dot { background: var(--line-strong); }
.sync-st .dot.err { background: var(--warm); }
.sync-lock { display: flex; align-items: flex-start; gap: .5em; margin: 0; font-size: .84em; color: var(--ink-2); line-height: 1.55; word-break: keep-all; }
.sync-lock .ic { width: 1.1em; height: 1.1em; margin-top: .22em; }
.sync-act { display: flex; align-items: center; justify-content: space-between; gap: .6em; margin-top: .2em; padding-top: .8em; border-top: 1px solid var(--line); }
.sync-act .btn { display: inline-flex; align-items: center; gap: .4em; }
.sync-act .btn .ic { width: 1.15em; height: 1.15em; }
.quiet-link { display: inline-block; margin: 0 0 0 auto; padding: 0; background: none; border: 0; font: inherit; color: var(--ink-2); font-size: .84em; min-height: 36px; cursor: pointer; text-decoration: underline; text-underline-offset: 3px; }
.chk { display: flex; align-items: center; gap: .6em; min-height: 44px; cursor: pointer; }
.chk input { width: 20px; height: 20px; accent-color: var(--accent); flex: none; }
.mrow { display: flex; justify-content: space-between; align-items: center; gap: 10px; background: none; border: 0; border-top: 1px solid var(--line); padding: .8em 0; width: 100%; text-align: left; cursor: pointer; }
.mrow:first-of-type { border-top: 0; padding-top: 0; }
.mrow-sub { display: flex; align-items: center; gap: 10px; margin: -.3em 0 .5em; }
.mrow-sub .link { font-size: .86em; padding: 0; }
.mrow-sub .warn-text { color: var(--warm); font-size: .8em; }
.mrow-end { display: flex; align-items: center; gap: .5em; flex: none; color: var(--ink-2); }
.mrow-end .tag { margin-right: 0; }
.tag.off { color: var(--ink-2); background: var(--surface-2); }
.mrow small { display: block; color: var(--ink-2); font-size: .8em; }
/* 더보기: 작은 제목 아래에 카드와 줄로 묶는다(공동체 더보기와 같은 짜임) */
.more-h { font-size: .8em; font-weight: 600; color: var(--ink-2); margin: 24px 4px 8px; line-height: 1.2; letter-spacing: .02em; }
.mrows { padding-top: 4px; padding-bottom: 4px; gap: 0; }
.mrows > .mrow:first-of-type { padding-top: .8em; }
.mrows > .mrow:first-child { border-top: 0; }
/* 맨 위에 작은 제목(.label)이 있는 카드: 카드 위 4px에 12px를 더해 제목 자리를 1em으로 */
.mrows > .label:first-child { margin-top: 12px; }
/* 줄 아래에 붙는 안내글(.hint): gap을 없앴으니 띄우는 틈과 카드 아래 여백을 직접 */
.mrows > .hint { margin: 11px 0 12px; }
/* 창(.sheet)의 줄이 이어질 때: 창의 gap(12px)만큼 당겨서 줄 사이 틈을 없앤다 */
.sheet > .mrow + .mrow { margin-top: -12px; }
.mset { display: flex; flex-direction: column; gap: 10px; border-top: 1px solid var(--line); padding: .9em 0; }
/* 고르는 버튼 묶음: 공동체 앱과 같은 모양(디자인 스타일 new·classic·glass가 그대로 입혀진다) */
.seg { display: grid; grid-auto-flow: column; grid-auto-columns: 1fr; gap: 3px; padding: 3px; background: var(--surface-2); border-radius: 12px; }
.seg button { font: inherit; font-size: .86em; word-break: keep-all; padding: 0 4px; border: 0; border-radius: 9px; min-height: 44px; background: transparent; color: var(--ink-2); cursor: pointer; }
.seg button.on { background: var(--surface); color: var(--ink); font-weight: 600; box-shadow: 0 1px 3px rgba(0,0,0,.12); }
/* --n이 있는 단추 판은 그 칸 수만큼 여러 줄로 놓인다(공동체 앱과 같다) */
.seg[style*="--n"] { grid-auto-flow: row; grid-template-columns: repeat(var(--n), 1fr); }
.seg button svg { width: 1em; height: 1em; vertical-align: -.12em; }
.ps-topics { margin-top: 8px; padding: 8px 10px; border-radius: 12px; background: var(--surface-2); }
.ps-topics .seg { background: var(--surface); margin-top: 6px; }
.people li { display: flex; justify-content: space-between; align-items: center; padding: .4em 0; border-top: 1px solid var(--line); list-style: none; }
.people { margin: 0; padding: 0; }
.people li:first-child { border-top: 0; }
.swatches { display: flex; gap: .55em; flex-wrap: wrap; }
.swatch { width: 40px; height: 40px; border-radius: 50%; padding: 0; border: 2px solid transparent; background: none; cursor: pointer; display: grid; place-items: center; }
.swatch i { width: 28px; height: 28px; border-radius: 50%; display: block; box-shadow: inset 0 0 0 1px rgba(0, 0, 0, .12); }

<script>
(() => {
  // ── 저장: 이 기기에만. 서버로 보내지 않는다 ─────────────────────────────
  // 서버 주소가 없거나 ?demo로 열면 데모: 공동체 앱의 데모처럼 서버 코드를 브라우저 안에서 돌린다. 데모의 노트는 실제 노트와 따로 둔다
  const CFG = window.KOIDE_CONFIG || {};
  const DEMO_LINK = !!CFG.API_URL && new URLSearchParams(location.search).has('demo'), DEMO = !CFG.API_URL || DEMO_LINK, QS = DEMO_LINK ? '?demo' : '';
  // 장면 모드(?as=사람&at=오늘|note|pray|look|keep|more|start, 데모에서만): 화면 지도(demo/map.html)용. splash.js가 이 창의 localStorage를 메모리 판으로 바꿔 놓아서,
  //  예시 노트도 메모리에만 만들고 저장하지 않는다. 로그인·서버 확인·창·도움말도 없다
  const SC = DEMO && window.KOIDE_SCENE || null;
  // 따라 하기 페이지(?tutorial): 처음 쓰는 사람이 로그인한 뒤 먼저 거치는 연습 노트. splash.js가 저장소를 메모리 판으로 바꿔 놓아서 진짜 노트·로그인에 닿지 않고, 서버와도 이야기하지 않는다.
  //  끝나면 진짜 노트(?tutdone)로 돌아가 마침을 적는다. 화면 지도(SC)와 달리 따라 하기 안내는 돈다
  const TUT = new URLSearchParams(location.search).has('tutorial'), QUIET = !!SC || TUT;
  let TUTDONE = ''; // 연습 페이지에서 돌아왔다는 표시: 'done'(마침) 또는 'fail'(연습 페이지를 열지 못함)
  // 연습 페이지를 열지 못했거나 안내가 시작되지 않으면 진짜 노트로 돌려보낸다. 이 창에서는 다시 보내지 않게 표시를 남긴다(무한 반복 방지)
  function tutFail() {
    try { sessionStorage.setItem('koide-note-tut-off', '1'); } catch (e) { /* 표시를 못 남겨도 돌아간다 */ }
    location.replace('note.html?tutdone=fail' + (DEMO_LINK ? '&demo' : ''));
  }
  // 기도 노트는 카카오 계정마다 따로 둔다(한 기기를 여럿이 써도 다른 사람의 노트가 보이지 않게). 주인 표시는 서버가 주는 값(uid)이다.
  //  주인 표시가 생기기 전의 노트는 처음 확인된 계정의 것으로 옮긴다. 주인을 아직 모르면(예전 로그인, 예전 서버) 예전 자리를 그대로 쓴다
  function ownNoteKey(base, uid) {
    if (!uid) return base;
    const k = base + ':' + uid;
    try {
      if (localStorage.getItem(k) == null && localStorage.getItem(base) != null) {
        localStorage.setItem(k, localStorage.getItem(base)); const lk = localStorage.getItem(base + '-key'); if (lk != null) localStorage.setItem(k + '-key', lk);
        localStorage.removeItem(base); localStorage.removeItem(base + '-key');
      }
    } catch (e) { return base; }
    return k;
  }
  const BASE = DEMO_LINK ? 'koide-demo-note-v1' : 'koide-note-v1', TOKEN = DEMO_LINK ? 'koide-demo-token' : 'koide-token', UID = DEMO_LINK ? 'koide-demo-uid' : 'koide-uid';
  const getUid = () => { try { return localStorage.getItem(UID) || ''; } catch (e) { return ''; } };
  const KEY = ownNoteKey(BASE, getUid()), LOCK_KEY = KEY + '-key';
  // 기도제목·사람·감사·기도한 날마다 고친 시각(up)을 둔다. 다른 기기와 이어 둘 때 더 나중 것을 남기려고(지운 것도 지웠다는 표시로 남긴다)
  // 옛 판이 읽던 표시(지금은 읽지 않고 늘 true). 되돌려도 시작 화면이 뜨지 않게 남긴다
  const blank = () => ({ v: 2, started: true, name: '', nameUp: 0, people: [], items: [], prays: [], thanks: [], today: null, mode: '', vault: null, weaves: [], gone: [], survey: null, guide: '' });
  // 장면 모드의 예시 노트: 사람 둘, 기도제목 여럿, 최근 기도한 날과 감사(날짜는 오늘 기준).
  function sceneNote() {
    const day = n => { const d = new Date(Date.now() - n * 864e5); return d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0'); };
    const people = [{ id: 'sp1', name: '엄마', up: 1 }, { id: 'sp2', name: '친구 지훈', up: 1 }];
    const it = (id, target, text, ago, done) => ({ id, target, text, created: day(ago), done: done || null, up: 1 });
    const items = [it('si1', 'me', '회사 일이 바빠도 지치지 않도록', 20), it('si2', 'p:sp1', '다음 주 수술이 잘 끝나고 회복이 빠르도록', 12), it('si3', 'p:sp2', '새 직장에서 좋은 동료를 만나도록', 9),
      it('si4', 'church', '새로 온 가정들이 잘 정착하도록', 30), it('si5', 'world', '전쟁으로 힘든 지역에 평화가 오도록', 30),
      it('si6', 'p:sp2', '이사할 집을 잘 구하도록', 40, { date: day(5), how: 'answer' }),
      it('si7', 'me', '하루를 서두르지 않고 천천히 시작하도록', 16), it('si8', 'me', '만나는 사람마다 따뜻하게 말하도록', 8), it('si9', 'p:sp1', '병원을 오가는 길이 힘들지 않도록', 11)];
    const prays = []; [['si1', [1, 2, 3, 5, 6, 22, 26, 30]], ['si2', [1, 2, 4]], ['si3', [2, 3]], ['si4', [1, 4, 7]], ['si6', [8, 9, 10]], ['si7', [1, 3, 6]], ['si8', [2, 4]], ['si9', [1, 5]]].forEach(([id, ds]) => ds.forEach(n => prays.push({ d: day(n), item: id, up: 1 })));
    const thanks = [{ id: 'st1', date: day(5), text: '좋은 집을 만나게 해 주셨어요', item: 'si6', kind: 'answer', up: 1 }, { id: 'st2', date: day(1), text: '이번 주도 건강하게 지냈어요', kind: 'thanks', up: 1 }, { id: 'st3', date: day(3), text: '가족과 함께 저녁을 먹었어요', kind: 'thanks', up: 1 }];
    // at=weaves: 담아 둔 그물 네 개(말뚝 8·5·3·12명). 실은 말뚝 쌍마다 겉보기에 흩어진 값으로 만든다
    const wv = (id, name, from, to, n, keep) => { const pairs = []; for (let a = 0; a < n; a++) for (let b = a + 1; b < n; b++) { const h = Math.sin((a * 13 + b * 7 + n) * 4.37) * 9301.7, r = h - Math.floor(h); if (r < keep) pairs.push([a, b, 1 + Math.floor(r / keep * 2.99)]); } return { id, name, from, to, n, pairs, at: day(0), up: 1 }; };
    const weaves = SC.at === 'weaves' ? [wv('G-demo1', '청년 선교팀', '2026-09-01', '2026-12-31', 8, 0.8), wv('G-demo2', '직장인 기도 모임', '2026-03-02', '2026-06-30', 5, 0.9), wv('G-demo3', '단기선교 준비팀', '2026-07-01', '2026-08-31', 3, 1), wv('G-demo4', '새벽 기도 모임', '2025-10-05', '2026-02-28', 12, 0.45)] : [];
    return { v: 2, started: true, name: '', nameUp: 0, people, items, prays, thanks, today: null, mode: '', vault: null, weaves };
  }
  if (SC) { try { localStorage.setItem(KEY, JSON.stringify(sceneNote())); } catch (e) { /* 무시 */ } }
  if (TUT) { try { localStorage.setItem(KEY, JSON.stringify(blank())); } catch (e) { /* 무시 */ } }
  let D;
  try { D = migrate(Object.assign(blank(), JSON.parse(localStorage.getItem(KEY) || 'null') || {})); } catch (e) { D = blank(); }
  let canSave = true;
  function saveLocal() { try { localStorage.setItem(KEY, JSON.stringify(D)); } catch (e) { canSave = false; } syncFlag(); }
  // 공동체 더보기의 '나의 기도 노트' 설명이 읽는 켜짐/꺼짐 표시. 'on' 동기화 중 / 'off' 연결은 있고 잠시 끔 / '' 연결 없음. 기록 내용은 담지 않는다
  function syncFlag() {
    try { localStorage.setItem(DEMO_LINK ? 'koide-demo-note-sync' : 'koide-note-sync', D.vault && D.vault.on ? (D.vault.paused ? 'off' : 'on') : ''); } catch (e) { /* 표시만이라 무시 */ }
  }
  syncFlag();
  // 손으로 고친 것은 저장한 뒤 몇 초 있다가 이어 둔 곳에도 맡긴다
  let syncT;
  function save() { saveLocal(); if (D.vault && D.vault.on && !D.vault.paused) { clearTimeout(syncT); syncT = setTimeout(() => sync(), 3000); } }
  if (navigator.storage && navigator.storage.persist) navigator.storage.persist().catch(() => {});
  // 예전(고친 시각이 없던) 노트도 그대로 쓰게: 고친 시각이 없으면 0(가장 오래된 것)으로 본다

        ${P ? `<div class="preview"><p class="hint">${P.length}개로 정리했어요. 대상이 틀리면 바꾸고, 빼야 할 줄은 ×를 눌러요.</p>

          <div class="row" style="justify-content:flex-start"><button class="btn" data-a="addparts">추가하기</button><button class="btn ghost" data-a="unsplit">다시 쓰기</button></div></div>` : ''}</section>`;
    return `<header class="top"><div><p class="eyebrow">나만 보는 기도제목</p><h1>내 기도</h1></div><span class="hint">${open().length}개</span></header>
      <div class="n-two"><div class="n-side">${form}</div><div class="n-main">${filt}${list.length ? `<ul class="edit-list">${list.map(noteLi).join('')}</ul>` : '<p class="hint" style="text-align:center">첫 기도제목을 써 보세요.</p>'}</div></div>`;
  }
  // 지난 기록: 달마다 한 장. 위에서 달을 넘기고, 그 달의 기도한 날·감사와 응답·마친 기도만 보여서 쌓여도 길어지지 않는다
  function lookView() {

    const list = tab === 'thanks'
      ? (thanks.length ? `<ul class="thanks">${thanks.map(x => { const it = x.item && D.items.find(i => i.id === x.item); return `<li><small>${short(x.date)}${x.kind === 'answer' ? ' · 응답' : ''}</small>${esc(x.text)}${it ? `<q>기도제목: ${esc(it.text)}</q>` : ''}</li>`; }).join('')}</ul>` : '<p class="hint">이 달에는 남긴 감사가 없어요. 기도제목을 "응답받았어요"로 마치거나, 오늘 화면에서 감사한 것을 남기면 여기에 모여요.</p>')

        <button class="link quiet" data-a="undone" data-v="${i.id}" style="align-self:flex-start">다시 기도하기</button></div>`).join('') : '<p class="hint">이 달에 마친 기도는 없어요.</p>');
    const longest = M === cur ? open().slice().sort((p, q) => p.created.localeCompare(q.created)).slice(0, 3) : [];
    return `<header class="top"><div><p class="eyebrow">나만 보는 기록</p><h1>지난 기록</h1></div></header>
      <div class="n-two"><div class="n-main"><div class="month-nav"><button class="btn ghost small" data-a="lookm" data-v="${shift(-1)}"${M > first ? '' : ' disabled'} aria-label="이전 달">‹</button><b>${y}년 ${m}월</b><button class="btn ghost small" data-a="lookm" data-v="${shift(1)}"${M < cur ? '' : ' disabled'} aria-label="다음 달">›</button></div>
      <section class="card"><div class="stats"><div><b>${prayedDays.size}</b><span>기도한 날</span></div><div><b>${thanks.length}</b><span>감사·응답</span></div><div><b>${doneL.length}</b><span>마친 기도</span></div></div>
        <div class="weeks" aria-label="${m}월 중 기도한 날">${'일월화수목금토'.split('').map(w => `<i class="wd">${w}</i>`).join('')}${cells}</div>
        <p class="hint">남과 견주지 않는 나만의 기록이에요. 빈 날이 있어도 괜찮아요.</p></section></div>
      <div class="n-side"><section class="card"><div class="seg" role="tablist">${[['thanks', '감사와 응답 · ' + thanks.length], ['done', '마친 기도 · ' + doneL.length]].map(([k, l]) => `<button class="${tab === k ? 'on' : ''}" role="tab" aria-selected="${tab === k}" data-a="looktab" data-v="${k}">${l}</button>`).join('')}</div>${list}</section>
      ${longest.length ? `<section class="card"><p class="label">오래 이어 온 기도</p>${longest.map(i => `<p class="plain"><span class="tag">${esc(targetName(i.target))}</span>${esc(i.text)} <span class="days">· ${daysSince(i.created)}일째</span></p>`).join('')}</section>` : ''}
      <section class="card mrows"><button class="mrow" data-a="keep" data-v=""><span><b>기도 서랍</b><small>이달의 조각보 · 올해의 실타래 · 실타래 상자</small></span><span aria-hidden="true">›</span></button></section></div></div>`;
  }
  // 기도 서랍: 지난 기록 맨 아래 입구로 들어가는 화면. 입체 그림 셋 중 하나를 크게(이달의 조각보 · 올해의 실타래 · 실타래 상자) + 담아 둔 그물이 있으면 넷째 탭 '함께 짠 그물'
  const KEEPS = [['garden', '이달의 조각보'], ['cord', '올해의 실타래'], ['chest', '실타래 상자']];
  // 담아 둔 모임 그물이 있을 때만 넷째 탭 '함께 짠 그물'이 생긴다
  const keeps = () => KEEPS.concat(weaves().length ? [['weaves', '함께 짠 그물']] : []);
  const keepKind = () => keeps().some(k => k[0] === S.keep) ? S.keep : 'garden';
  function keepView() {
    const k = keepKind(), C = k === 'cord' ? cordData() : null;
    if (k !== 'garden') S.gbig = false;
    const head = k === 'cord' ? `<div class="card-head"><h2>나의 ${C.year}년 실타래</h2><span>기도한 날 ${C.days.reduce((a, b) => a + b, 0)}일 · 응답 ${C.answers.length} · 감사 ${C.thanks.length}</span></div>`
      : '';
    const hint = { cord: '매듭이나 금실을 누르면 그날의 기록이 보여요. 밀어서 돌려 볼 수 있어요.', garden: '기도한 날마다 그 달 그림의 소품이 하나씩 조각보에 놓여요.', chest: '한 해가 끝나면 그해의 실타래를 상자에 넣어요.', weaves: '수틀을 누르면 그 그물이 크게 보여요. 말뚝에는 이름이 없어서, 누가 어느 말뚝인지는 아무도 몰라요.' }[k];
    const hasG = k === 'garden' && monthRow(keepMonth()).count > 0, tapG = hasG ? ' role="button" tabindex="0" aria-label="조각보 크게 보기"' : '';

      <header class="top"><div><p class="eyebrow">나만 보는 기록</p><h1>기도 서랍</h1></div></header>
      <div class="seg" role="tablist" style="margin-bottom:12px">${keeps().map(([v, l]) => `<button class="${k === v ? 'on' : ''}" role="tab" aria-selected="${k === v}" data-a="keep" data-v="${v}">${l}</button>`).join('')}</div>
      <section class="card">${head}${k === 'garden' ? gardenNav() : k === 'chest' ? chestNav() : k === 'weaves' ? weaveNav() : ''}
        ${k === 'garden' ? `${stage}${pick}<div class="gtray" id="gtray" hidden></div>${gardenActs()}${monthStrip()}` : `${stage}
        ${k === 'cord' ? '<div class="legend3d"><span><i class="k"></i>매듭은 응답</span><span><i class="g"></i>금실은 감사</span><span>굵을수록 많이 기도한 달</span></div>' : ''}${pick}`}</section>
      ${k === 'garden' && S.gbig ? gardenBig() : ''}${k === 'weaves' && S.wopen != null && weaveAt(S.wopen) ? weaveBig() : ''}`;
  }
  // ── 함께 짠 그물: 모임 화면의 '함께 짜는 그물'을 담아 둔 것 ──
  //  담은 것은 { id, name, from, to, n, pairs, at, up } 뿐(이름·기도제목·누가 기도했는지는 없다). 같은 모임 그물은 하나만(다시 담으면 바뀐다). 한 쪽에 셋씩.
  //  지울 때는 gone 표시만 남겨(내용은 비움) 다른 기기에 연결해 둔 노트에서도 되살아나지 않게 한다
  const weaves = () => D.weaves.filter(w => !w.gone);

  const WPAGE = 3, weavePages = () => Math.max(1, Math.ceil(weaves().length / WPAGE)), weavePage = () => Math.max(0, Math.min(weavePages() - 1, S.wpage || 0));

  }
  // 그물 크게 보기: 조각보 크게 보기와 같은 모양. 오른쪽 위에 그림 저장(↓)과 닫기(×), 아래에 이름과 기간, 지우기
  function weaveBig() {
    const w = weaveAt(S.wopen), b = (a, ic, label, o = {}) => `<button class="gbig-x" data-a="${a}" aria-label="${label}" title="${label}"${o.off ? ' disabled' : ''}>${GI[ic]}</button>`;
    return `<div class="gbig" id="gbig" role="dialog" aria-modal="true" aria-label="${esc(w.name)} 그물 크게 보기"><div class="gbig-host" id="gbig-host"><span class="wait">불러오는 중…</span></div>

  // 모임 화면에서 '그물 담기'로 오면(?weave=모임ID) 모임 화면이 건네준 그물을 담고 '함께 짠 그물' 탭을 연다. 같은 모임이면 바뀐다

    const M = keepMonth(), R = monthRow(M), [y, m] = M.split('-').map(Number);

  // 열두 달 줄: 그 달 주인공 얼굴. 기도한 달은 또렷하게, 소품을 다 모은 달은 테두리를 채운다. 누르면 그 달로

  // 오늘 놓인 소품(오늘 처음 기도한 날이면 이달 조각보에 하나 놓인다). 다 모았으면 all
  // 받침에 맞춰 이/가
  const josaN = w => { const c = w.charCodeAt(w.length - 1) - 0xAC00; return c >= 0 && c < 11172 && c % 28 ? '이' : '가'; };
  function todayProp() {

  }

  const SYNC_LOCK = '<p class="sync-lock">' + ICON.lock + '<span>기록은 암호화하여 보관해요. 운영자·목사님·리더도 볼 수 없어요.</span></p>';

  // 내 모임(자율 모임): 서버의 내 정보에서 모임 목록과 교회 연결 여부를 받아 이 기기에 기억해 둔다(열 때마다 새로 받는다). 기도제목은 담지 않는다
  const ME_KEY = DEMO_LINK ? 'koide-demo-note-me' : 'koide-note-me', PLACES = koidePlaces.MAX;

  async function loadMe() {

  const groupUrl = (id, g) => `index.html${DEMO_LINK ? '?demo&' : '?'}grp=${encodeURIComponent(id)}` + (g && g.name ? '&gn=' + encodeURIComponent(g.name) : '') + (g && g.left != null ? '&gl=' + g.left : '');

  function places() {

  }
  // 교회 소그룹에 연결된 사람인지: 아니면 혼자 시작한 사람이라 교회 공동체 화면이 없다
  const inCommunity = () => { const P = places(), M = noteMe(); return !!((P && P.room) || (M && M.linked)); };
  // 날짜 글자(yyyy-MM-dd) 도구: k개월 뒤(그 달에 없는 날이면 마지막 날), 'M월 d일'
  function addMonthsStr(day, k) {
    const [y, m, d] = day.split('-').map(Number), t = y * 12 + m - 1 + k, yy = Math.floor(t / 12), mm = t % 12 + 1, last = new Date(yy, mm, 0).getDate();
    return yy + '-' + String(mm).padStart(2, '0') + '-' + String(Math.min(d, last)).padStart(2, '0');
  }
  const dayLabel = day => { const [y, m, d] = String(day).split('-').map(Number); return y === new Date().getFullYear() ? m + '월 ' + d + '일' : y + '년 ' + m + '월 ' + d + '일'; };

  function groupsCard() {

  function mvTarget(x, made) {

      case 'cutgo': {
        const del = !!S.cut.del; S.cut = null; clearTimeout(syncT);
        D.vault = null; saveLocal(); try { localStorage.removeItem(LOCK_KEY); } catch (e) { /* 무시 */ }
        if (del) api('noteDel').then(() => toast('맡긴 노트를 지웠어요'), () => toast('맡긴 노트를 지우지 못했어요. 다시 연결한 뒤 끊어 주세요'));
        else toast('이 기기에서 연결을 끊었어요');
        return render();
      }
      case 'backup': {
        // 공유 창(카카오톡·드라이브 등)을 쓸 수 있으면 파일로 공유하고, 안 되면 내려받는다
        const text = JSON.stringify(Object.assign({ app: 'koide-note', saved: new Date().toISOString() }, D, { vault: null }), null, 1), fname = `코이데-기도노트-${TODAY()}.json`;
        const download = () => {
          const u = URL.createObjectURL(new Blob([text], { type: 'application/json' })), l = document.createElement('a'); l.href = u; l.download = fname; document.body.appendChild(l); l.click(); l.remove(); setTimeout(() => URL.revokeObjectURL(u), 1000);
          toast('기록을 저장했어요');
        };
        let file = null; try { file = new File([text], fname, { type: 'application/json' }); } catch (err) { /* 파일을 만들 수 없는 브라우저 */ }
        if (file && navigator.canShare && navigator.canShare({ files: [file] })) {
          navigator.share({ files: [file], title: '코이데 기도 노트' }).then(() => toast('기록을 저장했어요'), err => { if (!err || err.name !== 'AbortError') download(); });
          return;
        }
        return download();
      }
      case 'restore': return $('#restore-file').click();
      case 'logout': {
        if (!confirm('로그아웃할까요? 기도 노트는 이 기기에 그대로 남고, 같은 카카오로 다시 로그인해야 보여요. 다른 사람이 이 기기에서 로그인해도 내 노트는 보이지 않아요.')) return;
        api('logout').catch(() => {}).then(() => { try { localStorage.removeItem(TOKEN); localStorage.removeItem(UID); localStorage.removeItem(ME_KEY); localStorage.removeItem(DEMO_LINK ? 'koide-demo-note-sync' : 'koide-note-sync'); localStorage.removeItem(DEMO_LINK ? 'koide-demo-cache' : 'koide-cache'); } catch (err) { /* 무시 */ } location.replace('index.html' + QS); });
        return;
      }
      case 'wipe': if (!confirm(`이 휴대폰의 기도 노트를 모두 지울까요?${D.vault && D.vault.on ? ' 다른 기기에 연결해 둔 것은 그대로 남고, 이 휴대폰만 연결이 끊겨요.' : ' 되돌릴 수 없어요. 먼저 기록을 저장해 두세요.'}`)) return;
        D = blank(); saveLocal(); try { localStorage.removeItem(LOCK_KEY); } catch (e) { /* 무시 */ } S.tab = 'today'; return render();
      case 'fbopen': S.fb = null; return go('fb');
      case 'fbkind': S.fb.kind = v; return render();
      case 'fbnamed': S.fb.named = !S.fb.named; return render();
      case 'fbsend': {
        const F = S.fb, text = (F.text || '').trim();
        if (!text) { toast('내용을 적어 주세요.'); return $('#fb-t').focus(); }
        S.fbBusy = true; render();
        api('sendFeedback', { kind: F.kind, text, named: F.named, ver: APP_VER, width: innerWidth < 640 ? 'phone' : innerWidth < 1024 ? 'tablet' : 'pc' })
          .then(() => { S.fbBusy = false; S.fb = null; S.tab = 'more'; toast('보냈어요. 고마워요.'); window.scrollTo(0, 0); KoidePilot.done('a-feedback'); },
            err => { S.fbBusy = false; render(); toast(err && err.code === 'login' ? '다시 로그인해 주세요.' : err && err.code === 'notLinked' ? '서버를 새 버전으로 배포하면 보낼 수 있어요.' : (err && err.message) || '보내지 못했어요. 잠시 뒤 다시 해 주세요.'); });
        return;
      }
    }
  });
  document.addEventListener('submit', e => {
    const f = e.target.closest('[data-f]'); if (!f) return; e.preventDefault();
    if (f.dataset.f === 'gcreate') {
      const n = $('#gc-n').value.trim(), pf = $('#gc-p'), p = pf ? pf.value.trim() : '';
      if (!n) return $('#gc-n').focus();
      if (pf && !p) return pf.focus();
      const months = Number(($('#gc-m') || {}).value) || 3; S.gMonths = months;
      S.gBusy = true; render();
      api('groupCreate', { name: n, person: p, months }).then(r => { S.gNew = false; location.href = groupUrl(r.id); },
        err => { S.gBusy = false; render(); toast(err.code === 'bad' && /모르는 요청/.test(err.message || '') ? '서버를 새 버전으로 배포하면 모임을 만들 수 있어요.' : (err.message || '모임을 만들지 못했어요')); });
      return;
    }
    if (f.dataset.f === 'vcreate' || f.dataset.f === 'vunlock' || f.dataset.f === 'vrecover') {
      const V = S.vsheet, kind = f.dataset.f, a = $('#vs-a').value, b = $('#vs-b') ? $('#vs-b').value : a;
      let ph = null;
      if (kind === 'vrecover') { V.w = $('#vs-w').value; ph = readWords(V.w); if (ph.err) { V.err = ph.err; return render(); } }
      if (a.length < 6) { V.err = '6글자 넘게 써 주세요.'; return render(); }
      if (a !== b) { V.err = kind === 'vrecover' ? '두 번 쓴 새 비밀 문구가 달라요.' : '두 번 쓴 비밀 문구가 달라요.'; return render(); }
      V.busy = true; V.err = ''; render();
      (async () => {
        try {
          let words = null;
          if (kind === 'vcreate') {
            // 새 서버가 아니면 잠긴 열쇠를 저장하지 못해 다른 기기에서 못 열 수 있다. 맡기기 전에 알아본다(새 서버는 '맡긴 노트가 없다'고 답한다)
            try { await api('noteKeys', {}); } catch (e) { if (e.code === 'bad' && /모르는 요청/.test(e.message || '')) { V.busy = false; V.err = '서버를 새 버전으로 배포해야 연결할 수 있어요.'; return render(); } }
            const salt = randB64(16), pk = await deriveKey(a, salt), raw = randB64(32);
            const wrap = await lockUp(pk, { k: raw }), rc = await lockWithWords(raw);
            rawKeep(raw); words = rc.words;
            D.vault = { on: true, salt, rev: 0, last: 0, rec: true, pend: { wrap, rsalt: rc.rsalt, rwrap: rc.rwrap } };
          } else if (kind === 'vunlock') {
            const pk = await deriveKey(a, V.remote.salt);
            let raw, data;
            try {
              raw = V.remote.wrap ? (await unlockUp(pk, V.remote.wrap)).k : await rawOf(pk);
              data = await unlockUp(await keyOfRaw(raw), V.remote.data);
            } catch (e) { V.busy = false; V.err = '비밀 문구가 달라요.'; return render(); }
            rawKeep(raw); mergeIn(data); D.vault = { on: true, salt: V.remote.salt, rev: V.remote.rev, last: 0, rec: !!V.remote.rwrap };
          } else {
            // 복구용 낱말로 진짜 열쇠를 풀고, 새 비밀 문구로 다시 잠가 서버의 잠긴 열쇠만 바꾼다(노트와 복구용 낱말은 그대로)
            let raw, data;
            try {
              raw = (await unlockUp(await deriveKey(ph.phrase, V.remote.rsalt), V.remote.rwrap)).k;
              data = await unlockUp(await keyOfRaw(raw), V.remote.data);
            } catch (e) { V.busy = false; V.err = '복구용 낱말이 맞지 않아요. 낱말을 다시 봐 주세요.'; return render(); }
            const salt = randB64(16), wrap = await lockUp(await deriveKey(a, salt), { k: raw });
            await api('noteKeys', { salt, wrap });
            rawKeep(raw); mergeIn(data); D.vault = { on: true, salt, rev: V.remote.rev, last: 0, rec: true };
          }
          saveLocal(); S.vsheet = null;
          KoidePilot.done('n-sync');
          if (words) S.recSheet = { words };
          render(); if (!words) toast(kind === 'vrecover' ? '새 비밀 문구로 바꾸고 노트를 합쳤어요' : '맡겨 둔 노트를 합쳤어요'); sync();
        } catch (e) { V.busy = false; V.err = e && e.code === 'net' ? e.message : '잠그지 못했어요. 다시 해 주세요.'; render(); }
      })();
      return;
    }
    if (f.dataset.f === 'kckeys') return kcSubmit();
    if (f.dataset.f === 'thanks') {
      const t = $('#th-in').value.trim(); if (!t) return;
      S.thDraft = ''; D.thanks.push({ id: uid(), date: TODAY(), text: t.slice(0, 200), kind: 'thanks', up: now() }); save(); KoidePilot.done('n-thanks'); return toast('감사를 남겼어요');
    }
  });
  // 내 기도 카드의 글: 칸을 벗어날 때 바뀌었으면 저장(입력 중에는 다시 그리지 않아 커서가 그대로). 빈 글이면 원래 글로 되돌려요
  document.addEventListener('change', e => {
    const ta = e.target.matches && e.target.matches('textarea[data-item]') ? e.target : null; if (!ta) return;
    const i = D.items.find(x => x.id === ta.dataset.item), t = ta.value.trim(); if (!i) return;
    if (!t) { ta.value = i.text; return autosize(ta); }
    if (t !== i.text) { i.text = t.slice(0, 1000); i.up = now(); save(); }
  });
  document.addEventListener('change', e => {
    if (e.target.id === 'gc-m') { S.gMonths = Number(e.target.value) || 3; return; }
    if (e.target.matches && e.target.matches('.prev-t') && S.preview) { const k = Number(e.target.dataset.k); if (S.preview[k]) S.preview[k].target = e.target.value; return; }
    if (e.target.id !== 'restore-file' || !e.target.files[0]) return;
    const r = new FileReader();
    r.onload = () => {
      try {
        const x = JSON.parse(r.result);
        if (x.app !== 'koide-note' || !Array.isArray(x.items)) throw new Error();
        if (!confirm(`백업(${x.saved ? short(dkey(new Date(x.saved))) : '날짜 모름'}, 기도제목 ${x.items.length}개)으로 바꿀까요? 지금 이 휴대폰의 기도 노트는 지워져요.`)) return;
        const vault = D.vault, sv = D.survey, gd = D.guide; D = migrate(Object.assign(blank(), x)); delete D.app; delete D.saved; D.vault = vault; D.survey = KOIDE_SURVEY.merge(sv, D.survey); if (gd && (!D.guide || gd < D.guide)) D.guide = gd; KOIDE_SURVEY.reload(); save(); S.tab = 'today'; toast('백업을 불러왔어요');
      } catch (err) { toast('코이데 기도 노트 백업 파일이 아니에요'); }
    };
    r.readAsText(e.target.files[0]);
  });
  document.addEventListener('change', e => {
    if (e.target.id === 'cut-del' && S.cut) { S.cut.del = e.target.checked; const h = $('#cut-hint'); if (h) h.hidden = !S.cut.del; }
  });
  document.addEventListener('keydown', e => {
    if ((e.key === 'Enter' || e.key === ' ') && e.target.id === 'keep3d' && e.target.getAttribute('role') === 'button') { e.preventDefault(); S.gbig = true; render(); return; }
    if (e.key !== 'Escape') return;
    if (S.wopen != null) { S.wopen = null; render(); } else if (S.gbig) { if (G3.garden) G3.garden.leave(); S.gbig = false; S.gEdit = false; render(); } else if (S.ps) { psStop(); render(); } else if (S.done) { S.done = null; render(); } else if (S.kc) { S.kc = null; render(); } else if (S.cut) { S.cut = null; render(); } else if (S.vsheet) { S.vsheet = null; render(); } else if (S.share) { S.share = null; render(); } else if (S.mv) { S.mv = null; render(); }
  });
  // 모임 화면의 '그물 담기'로 오면(?weave=모임ID) 모임 화면이 건네준 그물(sessionStorage)을 노트에 담고 '함께 짠 그물' 탭을 연다
  { const q = new URLSearchParams(location.search), wid = q.get('weave'); if (wid) {
    q.delete('weave'); history.replaceState(null, '', location.pathname + (q.toString() ? '?' + q.toString().replace(/=(&|$)/g, '$1') : ''));
    let pack = null; try { pack = JSON.parse(sessionStorage.getItem('koide-weave-pack') || 'null'); sessionStorage.removeItem('koide-weave-pack'); } catch (e) { /* 건네받지 못함 */ }
    if (pack && pack.id === wid && weaveAdd(pack)) setTimeout(() => toast('그물을 담았어요'), 300); else setTimeout(() => toast('그물을 담지 못했어요. 모임 화면에서 다시 해 주세요'), 300);
  } }
  // 따라 하기 페이지에서 돌아오면(?tutdone) 마침을 적고 주소에서 지운다
  { const q = new URLSearchParams(location.search); if (q.has('tutdone')) { TUTDONE = q.get('tutdone') || 'done'; q.delete('tutdone'); history.replaceState(null, '', location.pathname + (q.toString() ? '?' + q.toString().replace(/=(&|$)/g, '$1') : '')); if (TUTDONE === 'fail') setTimeout(() => toast('연습 페이지를 열지 못했어요. 더보기 › 사용법에서 다시 할 수 있어요.'), 300); else if (!QUIET && getToken()) NoteGuide.markDone(); } }
  // 카카오 로그인이 기본: 로그인하지 않았으면 로그인 화면으로(노트는 이 휴대폰에 그대로 남아 있다)
  if (!QUIET && !getToken()) { if (window.koideSpace) window.koideSpace.going('community'); location.replace('index.html' + QS); return; }
  // 공동체의 '함께하는 곳' 메뉴에서 '+ 모임 만들기'로 오면(?new) 더보기 › 내 모임의 만들기 창을 바로 연다
  { const q = new URLSearchParams(location.search); if (q.has('new')) { S.tab = 'more'; S.gNew = true; q.delete('new'); history.replaceState(null, '', location.pathname + (q.toString() ? '?' + q.toString().replace(/=(&|$)/g, '$1') : '')); } }
  // 모임 화면의 '내 기도 노트로 옮기기'로 오면(?move=모임ID) 옮길 기도제목 고르는 창을 바로 연다
  { const q = new URLSearchParams(location.search), mid = q.get('move'); if (mid) { q.delete('move'); history.replaceState(null, '', location.pathname + (q.toString() ? '?' + q.toString().replace(/=(&|$)/g, '$1') : '')); if (!SC) setTimeout(() => mvOpen(mid), 0); } }
  render();
  // 연습 페이지는 데모 띠가 없어 진짜 노트처럼 보인다. 6초 안에 안내가 시작되지 않으면 갇히지 않게 진짜 노트로 돌려보낸다
  if (TUT) setTimeout(() => { if (!NoteGuide.begun()) tutFail(); }, 6000);
  // 시작 화면(splash.js)을 닫고, 다시 켤 때 기도 노트로 시작하게 적어 둔다
  if (window.koideSplash) window.koideSplash.hide();
  if (window.koideSpace) window.koideSpace.used('note');
  if (SC && !window.KoideBeatitudes.scene(SC.at)) window.KoideSunrain.scene(SC.at, { n: people().length + 1 });
  // 노트 주인을 아직 모르면(예전 로그인) 서버에 한 번 묻고, 내 노트 자리가 달라지면 다시 연다. 서버가 답하지 않으면 이번에는 예전 자리 그대로
  if (!QUIET) (async () => {
    if (!getUid()) {
      try { const r = await api('me'); if (r && r.uid) { try { localStorage.setItem(UID, r.uid); } catch (e) { /* 무시 */ } if (ownNoteKey(BASE, r.uid) !== KEY) return location.reload(); } }
      catch (e) { if (e && e.code === 'login') { if (window.koideSpace) window.koideSpace.going('community'); return location.replace('index.html' + QS); } }
    }
    let resume = null; try { resume = localStorage.getItem('koide-note-resume'); localStorage.removeItem('koide-note-resume'); } catch (e) { /* 무시 */ }
    if (resume === 'vault' && getToken()) { S.tab = 'sync'; vaultStart(); }
    else if (D.vault && D.vault.on && !D.vault.paused) sync();
    loadMe();
  })();
  document.addEventListener('visibilitychange', () => { if (!document.hidden && D.vault && D.vault.on && !D.vault.paused) sync(); });
  if ('serviceWorker' in navigator && (location.protocol === 'https:' || location.hostname === 'localhost')) navigator.serviceWorker.register('sw.js').catch(() => {});
})();
</script>
